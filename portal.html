<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co https://raw.githubusercontent.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="logo32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="logo180x180.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0e2318">
  <title>Portal — SGH</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0e2318; --card: #1a3d26; --accent: #c9a84c;
      --text: #f5f0e8; --muted: #a0b8a0; --danger: #e05252;
      --success: #4caf82; --border: rgba(201,168,76,0.2); --input-bg: #0e2318;
    }
    body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }
    h1,h2,h3 { font-family: 'Playfair Display', serif; }

    /* LAYOUT */
    .layout { display: flex; min-height: 100vh; }
    .sidebar { width: 240px; background: rgba(0,0,0,0.3); border-right: 1px solid var(--border); display: flex; flex-direction: column; position: fixed; top: 0; left: 0; height: 100vh; overflow-y: auto; z-index: 100; }
    .sidebar-logo { padding: 20px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
    .logo-icon { width: 36px; height: 36px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .logo-text h2 { font-size: 16px; color: var(--accent); }
    .logo-text p { font-size: 11px; color: var(--muted); }
    .sidebar-section { padding: 8px 0; }
    .sidebar-section-title { font-size: 10px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; padding: 8px 20px 4px; }
    .nav-link { display: flex; align-items: center; gap: 10px; padding: 10px 20px; color: var(--text); text-decoration: none; font-size: 14px; font-weight: 500; border-left: 3px solid transparent; transition: all 0.2s; cursor: pointer; background: none; border-bottom: none; border-top: none; border-right: none; width: 100%; font-family: 'DM Sans', sans-serif; }
    .nav-link:hover, .nav-link.active { background: rgba(201,168,76,0.1); border-left-color: var(--accent); color: var(--accent); }
    .nav-icon { font-size: 16px; width: 20px; text-align: center; }
    .main { margin-left: 240px; flex: 1; }
    .topbar { background: rgba(0,0,0,0.2); border-bottom: 1px solid var(--border); padding: 14px 28px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
    .topbar h1 { font-size: 20px; color: var(--accent); }
    .user-bar { display: flex; align-items: center; gap: 10px; }
    .user-name { font-size: 13px; color: var(--muted); }
    .btn-logout { background: none; border: 1px solid var(--border); color: var(--muted); padding: 6px 14px; border-radius: 8px; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 13px; transition: all 0.2s; }
    .btn-logout:hover { border-color: var(--danger); color: var(--danger); }
    .content { padding: 28px; max-width: 1100px; }

    /* SECCIONES */
    .section { display: none; }
    .section.active { display: block; }
    .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
    .section-header h2 { font-size: 22px; color: var(--accent); }

    /* CARDS SPC */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; transition: border-color 0.2s; }
    .card:hover { border-color: rgba(201,168,76,0.4); }
    .card-name { font-family: 'Playfair Display', serif; font-size: 17px; color: var(--accent); margin-bottom: 6px; }
    .card-detail { font-size: 13px; color: var(--muted); line-height: 1.7; margin-bottom: 12px; }
    .card-detail span { color: var(--text); }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; text-transform: uppercase; }
    .badge-activo { background: rgba(76,175,130,0.15); color: var(--success); border: 1px solid rgba(76,175,130,0.3); }
    .badge-macho { background: rgba(74,144,226,0.1); color: #74b0f7; border: 1px solid rgba(74,144,226,0.3); }
    .badge-hembra { background: rgba(230,100,180,0.1); color: #f07cca; border: 1px solid rgba(230,100,180,0.3); }
    .badge-castrado { background: rgba(150,200,150,0.1); color: #90c890; border: 1px solid rgba(150,200,150,0.3); }
    .badge-inscripto  { background: rgba(76,175,130,0.15);  color: var(--success); border: 1px solid rgba(76,175,130,0.3); }
    .badge-ratificado { background: rgba(201,168,76,0.15);  color: var(--accent);  border: 1px solid rgba(201,168,76,0.3); }
    .badge-forfait    { background: rgba(224,82,82,0.1);    color: var(--danger);  border: 1px solid rgba(224,82,82,0.3); }
    .card-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn-sm { padding: 6px 14px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; font-family: 'DM Sans', sans-serif; border: none; transition: all 0.2s; white-space: nowrap; }
    .btn-edit { background: rgba(201,168,76,0.15); color: var(--accent); border: 1px solid rgba(201,168,76,0.3); }
    .btn-edit:hover { background: rgba(201,168,76,0.25); }
    .btn-delete { background: rgba(224,82,82,0.1); color: var(--danger); border: 1px solid rgba(224,82,82,0.3); }
    .btn-danger { background: rgba(224,82,82,0.1); color: var(--danger); border: 1px solid rgba(224,82,82,0.3); }
    .btn-success { background: rgba(76,175,130,0.15); color: var(--success); border: 1px solid rgba(76,175,130,0.3); }
    .btn-primary { background: var(--accent); color: #1a1a0a; border: none; padding: 10px 20px; border-radius: 10px; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; white-space: nowrap; }
    .btn-primary:hover { opacity: 0.9; }

    /* CARTA DE LLAMADOS */
    .reunion-block { background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; margin-bottom: 16px; }
    .reunion-header { background: rgba(0,0,0,0.2); padding: 14px 20px; display: flex; align-items: center; gap: 12px; }
    .reunion-header h3 { font-size: 16px; color: var(--accent); flex: 1; }
    .reunion-fecha { font-size: 13px; color: var(--muted); }
    .carrera-row { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .carrera-num { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 700; color: var(--accent); width: 36px; text-align: center; flex-shrink: 0; }
    .carrera-info { flex: 1; min-width: 180px; }
    .carrera-name { font-size: 14px; font-weight: 600; color: var(--text); }
    .carrera-chips { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 4px; }
    .chip { font-size: 11px; background: rgba(201,168,76,0.08); border: 1px solid rgba(201,168,76,0.2); color: var(--muted); padding: 2px 8px; border-radius: 4px; }
    .btn-inscribir { background: var(--accent); color: #1a1a0a; border: none; padding: 8px 16px; border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; white-space: nowrap; }
    .btn-inscribir:hover { opacity: 0.85; }

    /* INSCRIPCIONES TABLE */
    .table-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    thead th { background: rgba(0,0,0,0.2); padding: 11px 16px; text-align: left; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; }
    tbody tr { border-top: 1px solid var(--border); transition: background 0.15s; }
    tbody tr:hover { background: rgba(201,168,76,0.04); }
    tbody td { padding: 12px 16px; font-size: 14px; vertical-align: middle; }

    /* MODAL */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 1000; display: none; align-items: flex-start; justify-content: center; padding: 20px; overflow-y: auto; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--card); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 640px; margin: auto; }
    .modal-header { padding: 20px 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--card); z-index: 1; border-radius: 16px 16px 0 0; }
    .modal-header h2 { font-size: 18px; color: var(--accent); }
    .btn-close { background: none; border: none; color: var(--muted); font-size: 22px; cursor: pointer; }
    .modal-body { padding: 20px 24px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group.full { grid-column: 1 / -1; }
    .section-lbl { grid-column: 1/-1; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; padding-top: 4px; border-top: 1px solid var(--border); }
    label { font-size: 12px; font-weight: 500; color: var(--muted); }
    input, select, textarea { background: var(--input-bg); border: 1px solid var(--border); color: var(--text); padding: 9px 12px; border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 14px; outline: none; width: 100%; transition: border 0.2s; }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    textarea { resize: vertical; min-height: 70px; }
    select option { background: #1a3d26; }
    .modal-footer { padding: 14px 24px; display: flex; gap: 10px; justify-content: flex-end; border-top: 1px solid var(--border); }
    .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 9px 18px; border-radius: 9px; font-family: 'DM Sans', sans-serif; font-size: 14px; cursor: pointer; }

    /* MISC */
    .empty-state { text-align: center; padding: 50px 20px; }
    .empty-state .icon { font-size: 44px; margin-bottom: 14px; }
    .empty-state h3 { font-size: 18px; color: var(--muted); margin-bottom: 6px; }
    .empty-state p { font-size: 13px; color: var(--muted); opacity: 0.7; }
    .loading-state { display: flex; align-items: center; justify-content: center; padding: 50px; gap: 12px; color: var(--muted); }
    .spinner { width: 24px; height: 24px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
    .toast { padding: 12px 20px; border-radius: 10px; font-size: 14px; font-weight: 500; max-width: 320px; animation: slideIn 0.3s ease; }
    .toast-success { background: #1a4a30; border: 1px solid var(--success); color: var(--text); }
    .toast-error { background: #4a1a1a; border: 1px solid var(--danger); color: var(--text); }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    #auth-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; align-items: center; justify-content: center; }

    /* Modal inscripcion select-spc */
    .spc-search-wrap { position: relative; }
    .spc-dropdown { position: absolute; top: 100%; left: 0; right: 0; background: #1a3d26; border: 1px solid var(--border); border-radius: 8px; max-height: 180px; overflow-y: auto; z-index: 20; display: none; }
    .spc-option { padding: 9px 12px; cursor: pointer; font-size: 13px; border-bottom: 1px solid var(--border); }
    .spc-option:last-child { border-bottom: none; }
    .spc-option:hover { background: rgba(201,168,76,0.1); color: var(--accent); }

    .validation-msg { padding: 12px 16px; border-radius: 10px; font-size: 13px; margin-top: 12px; display: none; }
    .validation-ok { background: rgba(76,175,130,0.1); border: 1px solid rgba(76,175,130,0.3); color: var(--success); }
    .validation-err { background: rgba(224,82,82,0.1); border: 1px solid rgba(224,82,82,0.3); color: var(--danger); }

    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); transition: transform 0.3s; }
      .sidebar.open { transform: translateX(0); }
      .main { margin-left: 0; }
      .content { padding: 16px; }
    }
    .menu-toggle { display: none; background: none; border: none; color: var(--text); font-size: 22px; cursor: pointer; }
    @media (max-width: 768px) { .menu-toggle { display: block; } }
    @media (max-width: 500px) { .form-grid { grid-template-columns: 1fr; } .form-group.full { grid-column: 1; } }
  </style>
</head>
<body>
<div id="auth-overlay"><div class="spinner" style="width:32px;height:32px;border-width:3px;"></div></div>
<div id="toast-container"></div>

<div class="layout">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon"><img src="logo192x192.png" alt="SGH" style="width:28px;height:28px;object-fit:contain;"></div>
      <div class="logo-text"><h2>SGH</h2><p>Portal</p></div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-section-title">Mi portal</div>
      <button class="nav-link active" id="nav-spcs" onclick="showSection('spcs')"><span class="nav-icon">🐎</span>Mis caballos</button>
      <button class="nav-link" id="nav-carta" onclick="showSection('carta')"><span class="nav-icon">📋</span>Llamado abierto</button>
      <button class="nav-link" id="nav-inscripciones" onclick="showSection('inscripciones')"><span class="nav-icon">✅</span>Mis inscripciones</button>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
        <h1>Portal Hípico</h1>
      </div>
      <div class="user-bar">
        <span class="user-name" id="user-name"></span>
        <button class="btn-logout" onclick="logout()">Cerrar sesión</button>
      </div>
    </div>

    <div class="content">
      <!-- SECCIÓN MIS CABALLOS -->
      <!-- Sólo lectura. El alta de SPC es acto de secretaría: el Stud Book es
           global y darlo de alta desde acá afectaría a todos los hipódromos. -->
      <div class="section active" id="section-spcs">
        <div class="section-header">
          <h2>🐎 Mis caballos</h2>
        </div>
        <div id="spcs-container"><div class="loading-state"><div class="spinner"></div> Cargando…</div></div>
      </div>

      <!-- SECCIÓN LLAMADO ABIERTO -->
      <div class="section" id="section-carta">
        <div class="section-header">
          <h2>📋 Llamado abierto</h2>
        </div>
        <div id="carta-container"><div class="loading-state"><div class="spinner"></div> Cargando turnos…</div></div>
      </div>

      <!-- SECCIÓN MIS INSCRIPCIONES -->
      <div class="section" id="section-inscripciones">
        <div class="section-header">
          <h2>✅ Mis inscripciones</h2>
        </div>
        <div id="inscripciones-container"><div class="loading-state"><div class="spinner"></div> Cargando…</div></div>
      </div>
    </div>
  </main>
</div>

<!-- MODAL INSCRIBIR -->
<div class="modal-overlay" id="modal-inscribir">
  <div class="modal">
    <div class="modal-header">
      <h2 id="minsc-title">Anotar en el turno</h2>
      <button class="btn-close" onclick="closeModalInscribir()">✕</button>
    </div>
    <div class="modal-body">
      <div id="minsc-carrera-info" style="background:rgba(0,0,0,0.2);border-radius:8px;padding:12px;margin-bottom:16px;font-size:13px;color:var(--muted);"></div>
      <div style="font-size:12px;color:var(--muted);margin-bottom:8px;">Elegí cuál de tus caballos anotás en este turno:</div>
      <div id="minsc-lista"></div>
      <div id="validation-msg" class="validation-msg"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeModalInscribir()">Cerrar</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="activacion-pendiente.js"></script>
<script>
let sb, currentUser, miUsuarioId = null, esEntrenador = false;
let misCaballos = [], misInscripciones = [];
const SUPABASE_URL = 'https://unlhcuanfrtpatoipwve.supabase.co';
const SUPABASE_KEY = 'sb_publishable_gypetSX16kGMXHhG_xqLWA_7wrzWgAK';

const TEL = 'la secretaría del hipódromo';

// ISSUE-018: todo lo que viene de la DB pasa por acá antes de ir a innerHTML.
function esc(v) {
  if (v === null || v === undefined) return '';
  return String(v).replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

// Pantalla para una cuenta sin fila en `usuarios`. Sólo estado — ni programa,
// ni datos del club. Se dibuja sobre el overlay de auth, así que el portal
// nunca llega a montarse.
async function pantallaSolicitud(session) {
  const { data: sol } = await sb.from('solicitudes_acceso')
    .select('estado, motivo_rechazo, documento_nro, created_at')
    .eq('auth_user_id', session.user.id).maybeSingle();

  let titulo, cuerpo;

  if (!sol) {
    titulo = 'Falta completar tu solicitud';
    cuerpo = `Tu cuenta está creada pero todavía no enviaste los datos.
      <br><a href="solicitar-acceso.html" style="color:#e8d5a3;">Completar la solicitud</a>`;
  } else if (sol.estado === 'pendiente') {
    const f = new Date(sol.created_at).toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit' });
    titulo = 'Tu solicitud está en revisión';
    cuerpo = `Enviada el ${esc(f)} · DNI ${esc(sol.documento_nro)}<br><br>
      La secretaría valida los datos y te avisa cuando tu acceso esté habilitado.
      <br>Cualquier consulta, en ${TEL}.`;
  } else if (sol.estado === 'aprobada') {
    titulo = 'Tu acceso está habilitado';
    cuerpo = `Cerrá sesión y volvé a entrar para verlo.<br>Si sigue sin aparecer, consultá en ${TEL}.`;
  } else {
    // rechazada y descartada muestran lo mismo: mensaje neutro, sin detalle
    // de por qué el sistema las distingue.
    titulo = 'Tu solicitud no fue aprobada';
    cuerpo = (sol.motivo_rechazo ? `Motivo: ${esc(sol.motivo_rechazo)}<br><br>` : '')
      + `Si creés que es un error, consultá en ${TEL}.`;
  }

  document.getElementById('auth-overlay').innerHTML = `
    <div style="text-align:center;padding:40px 28px;max-width:430px;">
      <p style="color:#c9a84c;font-size:18px;font-family:'Playfair Display',serif;">${titulo}</p>
      <p style="color:#a0b8a0;margin-top:12px;font-size:13.5px;line-height:1.65;">${cuerpo}</p>
      <button onclick="sb.auth.signOut().then(()=>location.replace('login.html'))"
        style="margin-top:24px;background:#c9a84c;color:#1a1a0a;border:none;padding:10px 20px;
               border-radius:8px;cursor:pointer;font-family:'DM Sans',sans-serif;font-weight:600;">
        Cerrar sesión
      </button>
    </div>`;
  return false;
}

async function initAuth() {
  const { createClient } = supabase;
  sb = createClient(SUPABASE_URL, SUPABASE_KEY);
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { window.location.replace('login.html'); return false; }
  const { data: usr } = await sb.from('usuarios')
    .select('id,club_id,nombre_completo,rol,estado,activo').eq('email', session.user.email).maybeSingle();

  // Red de contención, igual que index.html: una cuenta con activo=false no ve
  // NADA por RLS. Para los roles de portal `esRescatable()` siempre dice que no
  // (su cola de aprobación la resuelve un humano en admin.html), así que en la
  // práctica esto rebota al login explicando el motivo en vez de mostrar un
  // portal vacío. Ver activacion-pendiente.js.
  if (usr && usr.activo === false) {
    const res = await window.ActivacionPendiente.rescatar(sb, usr);
    if (!res.rescatado) {
      const motivo = usr.estado === 'rechazado' ? 'rechazada'
                   : usr.estado === 'pendiente' ? 'inactiva' : 'desactivada';
      await sb.auth.signOut();
      window.location.replace('login.html?motivo=' + motivo);
      return false;
    }
  }

  // Sin fila en `usuarios` = auto-registrado todavía sin aprobar (Gate 2).
  // Se le muestra el estado de su solicitud y NADA del club: no tiene acceso a
  // ningún dato y tampoco debe ver estructura. Decisión 1 de AUTOREGISTRO_PLAN.
  if (!usr) { return await pantallaSolicitud(session); }
  if (usr.rol !== 'propietario' && usr.rol !== 'profesional') { window.location.replace('index.html'); return false; }
  if (usr.estado === 'pendiente') {
    document.getElementById('auth-overlay').innerHTML = '<div style="text-align:center;padding:40px;"><p style="color:#c9a84c;font-size:16px;font-family:\'Playfair Display\',serif;">Registro pendiente</p><p style="color:#a0b8a0;margin-top:8px;font-size:13px;">Tu cuenta está siendo revisada por un administrador.</p><button onclick="sb.auth.signOut().then(()=>location.replace(\'login.html\'))" style="margin-top:20px;background:#c9a84c;color:#1a1a0a;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;font-family:\'DM Sans\',sans-serif;font-weight:600;">Cerrar sesión</button></div>';
    return false;
  }
  currentUser = { ...session.user, nombre_completo: usr.nombre_completo, rol: usr.rol };
  miUsuarioId = usr.id;
  document.getElementById('user-name').textContent = usr.nombre_completo || session.user.email;
  document.getElementById('auth-overlay').style.display = 'none';

  // El vínculo usuario↔entidad sale de fn_mis_entidades(), la misma función
  // que usan las policies y los RPC. NO se busca por email: eso daba un
  // vínculo distinto del que la base considera válido.
  const { data: ents } = await sb.rpc('fn_mis_entidades');
  esEntrenador = (ents || []).some(e => e.entidad_tipo === 'profesional');
  return true;
}

function logout() { sb.auth.signOut().then(() => window.location.replace('login.html')); }

// Convención del repo: nunca toLocaleString/toFixed directo — el locale por
// defecto del browser suele ser en-US y da el formato de miles al revés.
function formatARS(num) {
  if (num === null || num === undefined || isNaN(num)) return '$0,00';
  const n = parseFloat(num);
  const signo = n < 0 ? '-' : '';
  const [entero, dec] = Math.abs(n).toFixed(2).split('.');
  return signo + '$' + entero.replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ',' + dec;
}
function fechaCorta(iso) {
  if (!iso) return '—';
  return new Date(iso + 'T12:00:00').toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit', year: 'numeric' });
}
function fechaHora(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('es-AR', { day: '2-digit', month: '2-digit' })
    + ' ' + d.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' }) + ' hs';
}
function toast(msg, type = 'success') {
  const t = document.createElement('div');
  t.className = `toast toast-${type}`; t.textContent = msg;
  document.getElementById('toast-container').appendChild(t);
  setTimeout(() => t.remove(), 4500);
}

/* ========== MIS CABALLOS — sólo lectura ========== */
// La tenencia sale de fn_mis_spc_ids(), que lee spcs.entrenador_id. Ese campo
// lo puebla el gate 4.1 y lo corrige la secretaría en el ABM. Acá no se
// deriva nada ni se busca por email.
async function loadCaballos() {
  const { data: ids, error: eIds } = await sb.rpc('fn_mis_spc_ids');
  if (eIds) { console.error('[fn_mis_spc_ids]', eIds); toast(eIds.message, 'error'); throw eIds; }
  const lista = (ids || []).map(r => r.spc_id);
  if (!lista.length) { misCaballos = []; return; }

    .select('id,nombre,registro_stud_book,studbook_id,fecha_nacimiento,sexo,color,padrillo_nombre,madre_nombre,estado')
    .in('id', lista).order('nombre');

  misCaballos = data || [];
}

/* ========== LLAMADO ABIERTO ========== */
// Ventana de inscripción, criterio único y fail-closed (AUTOREGISTRO_GATE_4 §B):
//   reunión publicada + carrera no anulada + apertura/cierre cargados y vigentes.
// Si falta cualquiera de las dos fechas, el turno NO está abierto.
//
// carreras.estado NO sirve como señal: carta-llamados.html escribe 'abierta'
// en toda carrera que guarda. Sólo se usa para excluir 'anulada'.
//
// El estado de la reunión se filtra con 'publicada' a secas. El código viejo
// pedía .in('estado', ['publicada','abierta']) y 'abierta' no existe en el
// ENUM estado_reunion → 22P02 y la sección no cargaba nunca.
let turnosAbiertos = [];

// `carreras` no tiene una columna `condicion_edad` — el portal viejo la pedía
// y por eso la query fallaba con 42703. El dato son dos enteros.
function textoEdad(c) {
  const min = c.edad_minima_anos, max = c.edad_maxima_anos;
  if (min == null && max == null) return '';
  if (min != null && max != null) return min === max ? `${min} años` : `${min} a ${max} años`;
  return min != null ? `desde ${min} años` : `hasta ${max} años`;
}

function ventanaAbierta(c, reunionEstado) {
  if (reunionEstado !== 'publicada') return false;
  if (c.estado === 'anulada') return false;
  if (!c.apertura_inscripcion || !c.cierre_inscripcion) return false;
  const ahora = Date.now();
  return ahora >= Date.parse(c.apertura_inscripcion) && ahora <= Date.parse(c.cierre_inscripcion);
}

async function loadLlamado() {
  const cont = document.getElementById('carta-container');
  cont.innerHTML = '<div class="loading-state"><div class="spinner"></div> Cargando turnos…</div>';

  // numero_publico: es el número que ve el hipódromo. `numero` es el interno y
  // los dos difieren (R8 interna = 7 pública). Aditivo, con fallback — ver el
  // gate de numero-publico en edb48cb.
  // gte(fecha, hoy): una reunión publicada con fecha pasada no se ofrece para
  // anotarse. Mejor no mostrarla que ofrecer algo imposible.
  const hoy = new Date().toISOString().slice(0, 10);
  const { data: reuns, error } = await sb.from('reuniones')
    .select('id,numero,numero_publico,fecha,estado,hipodromos(nombre),carreras(id,numero_turno,nombre,distancia_metros,condicion_sexo,edad_minima_anos,edad_maxima_anos,condicion_handicap,condicion_adicional,bolsa_total,cupo_maximo,tipo_pista,estado,apertura_inscripcion,cierre_inscripcion)')
    .eq('estado', 'publicada')
    .gte('fecha', hoy)
    .order('fecha', { ascending: true });
  if (error) {
    // El spinner se limpia SÍ o SÍ. Un `return` pelado dejaba "Cargando turnos…"
    // para siempre y el toast se autodestruía a los 3,5 s: el usuario se quedaba
    // sin ninguna pista. Ver fbdd988.
    console.error('[loadLlamado] error al traer reuniones', error);
    cont.innerHTML = `<div class="empty-state">
      <div class="icon">⚠️</div>
      <h3>No se pudieron cargar los turnos</h3>
      <p>${esc(error.message || 'Error desconocido')}</p>
      <p style="margin-top:14px;"><button class="btn-inscribir" onclick="loadLlamado()">Reintentar</button></p>
    </div>`;
    toast('No se pudieron cargar los turnos', 'error');
    return;
  }

  await cargarInscripcionesCrudas();

  turnosAbiertos = (reuns || []).map(r => ({
    ...r,
    carreras: (r.carreras || [])
      .filter(c => ventanaAbierta(c, r.estado))
      .sort((a, b) => a.numero_turno - b.numero_turno),
  })).filter(r => r.carreras.length);

  if (!turnosAbiertos.length) {
    cont.innerHTML = `<div class="empty-state">
      <div class="icon">📋</div>
      <h3>No hay inscripciones abiertas en este momento</h3>
      <p style="line-height:1.7;">
        Cuando la secretaría abra el llamado para la próxima reunión, los turnos
        aparecen acá con la fecha límite para anotarse.<br><br>
        Si sabés que el llamado ya salió y no lo ves, consultá en ${TEL}.
      </p>
    </div>`;
    return;
  }

  cont.innerHTML = turnosAbiertos.map(r => {
    const fecha = new Date(r.fecha + 'T12:00:00')
      .toLocaleDateString('es-AR', { weekday: 'long', day: 'numeric', month: 'long' });
    const filas = r.carreras.map(c => {
      const yaAnotados = misInscripciones.filter(i => i.carrera_id === c.id).length;
      return `
      <div class="carrera-row">
        <div class="carrera-num">${esc(c.numero_turno)}</div>
        <div class="carrera-info">
          <div class="carrera-name">${esc(c.nombre || 'Turno ' + c.numero_turno)}</div>
          <div class="carrera-chips">
            <span class="chip">${esc(c.distancia_metros)}m</span>
            ${c.tipo_pista ? `<span class="chip">${esc(c.tipo_pista)}</span>` : ''}
            ${c.condicion_sexo ? `<span class="chip">${esc(c.condicion_sexo)}</span>` : ''}
            ${textoEdad(c) ? `<span class="chip">${esc(textoEdad(c))}</span>` : ''}
            ${c.bolsa_total ? `<span class="chip">💰 ${esc(formatARS(c.bolsa_total))}</span>` : ''}
            ${c.cupo_maximo ? `<span class="chip">Cupo ${esc(c.cupo_maximo)}</span>` : ''}
            <span class="chip">⏳ cierra ${esc(fechaHora(c.cierre_inscripcion))}</span>
            ${yaAnotados ? `<span class="chip" style="color:var(--success);border-color:rgba(76,175,130,0.35);">✓ ${yaAnotados} anotado${yaAnotados > 1 ? 's' : ''}</span>` : ''}
          </div>
        </div>
        ${esEntrenador
          ? `<button class="btn-inscribir" onclick="abrirInscripcion('${esc(c.id)}','${esc(r.id)}')">Anotar</button>`
          : ''}
      </div>`;
    }).join('');
    return `<div class="reunion-block">
      <div class="reunion-header">
        <h3>Reunión ${esc(r.numero_publico ?? r.numero ?? '')} — ${esc(r.hipodromos?.nombre || '—')}</h3>
        <span class="reunion-fecha">${esc(fecha)}</span>
      </div>
      ${filas}
    </div>`;
  }).join('');

  if (!esEntrenador) {
    cont.insertAdjacentHTML('afterbegin', `
      <div style="background:rgba(201,168,76,0.08);border:1px solid var(--border);border-radius:10px;
                  padding:12px 14px;margin-bottom:16px;font-size:13px;color:var(--muted);line-height:1.6;">
        Podés ver el llamado, pero anotar caballos lo hace el entrenador.
        Si tenés que anotar uno, hablá con tu entrenador o con ${TEL}.
      </div>`);
  }
}

/* ========== ANOTAR ========== */
let carreraSeleccionada = null;

// Inscripciones crudas del usuario. La policy de SELECT ya las limita a los
// caballos propios, así que no hace falta filtrar por spc_id acá.
async function cargarInscripcionesCrudas() {
  const { data, error } = await sb.from('inscripciones')
    .select('id,estado,canal,inscripto_por,spc_id,carrera_id,created_at,'
          + 'carreras(numero_turno,nombre,estado,apertura_inscripcion,cierre_inscripcion,'
          + 'reuniones(id,numero,numero_publico,fecha,estado,hipodromos(nombre)))')
    .order('created_at', { ascending: false });
  if (error) { console.error('[inscripciones]', error); toast(error.message, 'error'); throw error; }
  misInscripciones = data || [];
}

function abrirInscripcion(carreraId, reunionId) {
  const reunion = turnosAbiertos.find(r => r.id === reunionId);
  const carrera = reunion?.carreras.find(c => c.id === carreraId);
  if (!carrera) return;
  carreraSeleccionada = { id: carreraId, reunionId, numero_turno: carrera.numero_turno };

  document.getElementById('minsc-title').textContent = `Anotar en el turno ${carrera.numero_turno}`;
  document.getElementById('minsc-carrera-info').innerHTML =
    `<strong style="color:var(--text)">${esc(carrera.nombre || 'Turno ' + carrera.numero_turno)}</strong>`
    + ` — Reunión ${esc(reunion.numero_publico ?? reunion.numero ?? '')}, ${esc(fechaCorta(reunion.fecha))}`
    + `<br>Cierra ${esc(fechaHora(carrera.cierre_inscripcion))}`;

  const vm = document.getElementById('validation-msg');
  vm.style.display = 'none'; vm.className = 'validation-msg';

  renderListaCaballosModal();
  document.getElementById('modal-inscribir').classList.add('open');
}

// Un caballo puede estar anotado en VARIOS turnos de la misma reunión: es el
// proceso real (GOTCHAS #69), la secretaría resuelve el lunes previo. Acá se
// avisa, nunca se bloquea. Lo único que se bloquea es repetir el MISMO turno.
function renderListaCaballosModal() {
  const cont = document.getElementById('minsc-lista');
  if (!misCaballos.length) {
    cont.innerHTML = `<div style="font-size:13px;color:var(--muted);line-height:1.7;padding:8px 0;">
      No tenés caballos asociados a tu ficha, así que no hay nada para anotar.<br>
      Pedile a ${TEL} que los vincule.
    </div>`;
    return;
  }
  const reunion = turnosAbiertos.find(r => r.id === carreraSeleccionada.reunionId);
  const idsDeLaReunion = new Set((reunion?.carreras || []).map(c => c.id));

  cont.innerHTML = misCaballos.map(c => {
    const enEsteTurno = misInscripciones.find(
      i => i.spc_id === c.id && i.carrera_id === carreraSeleccionada.id);
    const enOtrosTurnos = misInscripciones.filter(
      i => i.spc_id === c.id && i.carrera_id !== carreraSeleccionada.id
        && idsDeLaReunion.has(i.carrera_id));

    const aviso = enEsteTurno
      ? `<span class="chip" style="color:var(--success);border-color:rgba(76,175,130,0.35);">ya anotado en este turno</span>`
      : enOtrosTurnos.length
        ? `<span class="chip">también anotado en el turno ${enOtrosTurnos
            .map(i => i.carreras?.numero_turno)
            .sort((a, b) => (a ?? 9999) - (b ?? 9999))
            .map(esc).join(', ')} — está bien, la secretaría define después</span>`
        : '';

    return `<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);flex-wrap:wrap;">
      <div style="flex:1;min-width:150px;">
        <div style="font-family:'Playfair Display',serif;color:var(--accent);font-size:15px;">${esc(c.nombre)}</div>
        <div class="carrera-chips" style="margin-top:4px;">
          <span class="chip">${esc(c.sexo || '—')}</span>
          ${aviso}
        </div>
      </div>
      ${enEsteTurno
        ? `<button class="btn-sm" style="opacity:.45;cursor:not-allowed;background:none;border:1px solid var(--border);color:var(--muted);" disabled>Anotado</button>`
        : `<button class="btn-sm btn-success" onclick="anotar('${esc(c.id)}')">Anotar</button>`}
    </div>`;
  }).join('');
}

function closeModalInscribir() {
  document.getElementById('modal-inscribir').classList.remove('open');
  carreraSeleccionada = null;
}

// Toda la escritura pasa por rpc_inscribir. El portal NO tiene INSERT sobre
// `inscripciones` — la policy lo excluye explícitamente.
async function anotar(spcId) {
  if (!carreraSeleccionada) return;
  const vm = document.getElementById('validation-msg');
  vm.style.display = 'none';

  const { error } = await sb.rpc('rpc_inscribir', {
    p_spc_id: spcId, p_carrera_id: carreraSeleccionada.id,
  });

  if (error) {
    // Los mensajes del RPC están escritos para que los lea una persona.
    vm.textContent = '❌ ' + error.message.replace(/^.*?:\s*/, '');
    vm.className = 'validation-msg validation-err';
    vm.style.display = 'block';
    return;
  }

  toast('Caballo anotado');
  await cargarInscripcionesCrudas();
  renderListaCaballosModal();
  loadLlamado();
}

/* ========== MIS INSCRIPCIONES ========== */
// Se puede retirar SÓLO una fila propia, cargada desde el portal, sin
// ratificar y con la ventana todavía abierta. El RPC revalida las cuatro
// condiciones: acá se decide únicamente si se muestra el botón.
function puedeRetirar(i) {
  return i.canal === 'portal'
    && i.inscripto_por === miUsuarioId
    && i.estado === 'inscripto'
    && ventanaAbierta(i.carreras || {}, i.carreras?.reuniones?.estado);
}

async function loadMisInscripciones() {
  const cont = document.getElementById('inscripciones-container');
  cont.innerHTML = '<div class="loading-state"><div class="spinner"></div> Cargando…</div>';
  try { await cargarInscripcionesCrudas(); } catch { return; }

  if (!misInscripciones.length) {
    cont.innerHTML = `<div class="empty-state">
      <div class="icon">✅</div>
      <h3>No tenés inscripciones registradas</h3>
      <p style="line-height:1.7;">
        Acá vas a ver los caballos que anotes desde el portal
        <strong>y también los que cargue la secretaría por vos</strong>.<br><br>
        ${misCaballos.length
          ? 'Para anotar uno, entrá a <strong>Llamado abierto</strong>.'
          : `Todavía no tenés caballos asociados a tu ficha — pedile a ${TEL} que los vincule.`}
      </p>
    </div>`;
    return;
  }

  const nombrePorSpc = {};
  misCaballos.forEach(c => { nombrePorSpc[c.id] = c.nombre; });
  const estadoBadge = { inscripto: 'badge-inscripto', ratificado: 'badge-ratificado', forfait: 'badge-forfait' };

  const filas = misInscripciones.map(i => {
    const car = i.carreras, reun = car?.reuniones;
    const origen = i.canal === 'portal' ? 'Portal' : 'Secretaría';
    return `<tr>
      <td style="font-weight:600;color:var(--accent);font-family:'Playfair Display',serif;">${esc(nombrePorSpc[i.spc_id] || '—')}</td>
      <td>${esc(reun?.hipodromos?.nombre || '—')}</td>
      <td>Reunión ${esc(reun?.numero_publico ?? reun?.numero ?? '')} — ${esc(fechaCorta(reun?.fecha))}</td>
      <td>Turno ${esc(car?.numero_turno ?? '—')}</td>
      <td><span class="badge ${estadoBadge[i.estado] || ''}">${esc((i.estado || '—').replace('_', ' '))}</span></td>
      <td style="font-size:12px;color:var(--muted);">${esc(origen)}</td>
      <td>${puedeRetirar(i)
        ? `<button class="btn-sm btn-danger" onclick="retirar('${esc(i.id)}')">Retirar</button>`
        : '<span style="color:var(--muted);font-size:12px;">—</span>'}</td>
    </tr>`;
  }).join('');

  cont.innerHTML = `<div class="table-wrap"><table>
    <thead><tr><th>Caballo</th><th>Hipódromo</th><th>Reunión</th><th>Turno</th><th>Estado</th><th>Cargada por</th><th></th></tr></thead>
    <tbody>${filas}</tbody>
  </table></div>
  <p style="font-size:12px;color:var(--muted);margin-top:12px;line-height:1.6;">
    Sólo se pueden retirar las inscripciones que cargaste vos desde el portal y mientras
    el turno siga abierto. Las que cargó la secretaría, o las que ya cerraron, se dan de
    baja hablando con ${TEL}.
  </p>`;
}

async function retirar(inscId) {
  const i = misInscripciones.find(x => x.id === inscId);
  const nombre = misCaballos.find(c => c.id === i?.spc_id)?.nombre || 'este caballo';
  if (!confirm(`¿Retirar a ${nombre} del turno ${i?.carreras?.numero_turno ?? ''}?`)) return;

  const { error } = await sb.rpc('rpc_baja_inscripcion', { p_inscripcion_id: inscId });
  if (error) {
    console.error('[rpc_baja_inscripcion]', error);
    toast(error.message.replace(/^.*?:\s*/, ''), 'error');
    return;
  }
  toast('Inscripción retirada');
  loadMisInscripciones();
}

/* ========== INIT ========== */
document.getElementById('modal-inscribir').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModalInscribir();
});

(async () => {
