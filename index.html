<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="logo32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="logo180x180.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0e2318">
  <title>SGH — Sistema de Gestión Hípica</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0e2318; --card: #1a3d26; --accent: #c9a84c;
      --text: #f5f0e8; --muted: #a0b8a0; --danger: #e05252;
      --success: #4caf82; --border: rgba(201,168,76,0.2);
    }
    body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }
    h1,h2,h3 { font-family: 'Playfair Display', serif; }

    /* LAYOUT */
    .layout { display: flex; min-height: 100vh; }
    .sidebar {
      width: 260px; background: rgba(0,0,0,0.3); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; position: fixed; top: 0; left: 0; height: 100vh; overflow-y: auto; z-index: 100;
    }
    .sidebar-logo {
      padding: 24px 20px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 12px;
    }
    .logo-icon { width: 40px; height: 40px; background: var(--accent); border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
    .logo-text h2 { font-size: 18px; color: var(--accent); }
    .logo-text p { font-size: 11px; color: var(--muted); }
    .sidebar-section { padding: 12px 0; }
    .sidebar-section-title { font-size: 10px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; padding: 8px 20px 4px; }
    .nav-link {
      display: flex; align-items: center; gap: 10px; padding: 10px 20px;
      color: var(--text); text-decoration: none; font-size: 14px; font-weight: 500;
      border-left: 3px solid transparent; transition: all 0.2s;
    }
    .nav-link:hover, .nav-link.active { background: rgba(201,168,76,0.1); border-left-color: var(--accent); color: var(--accent); }
    .nav-icon { font-size: 16px; width: 20px; text-align: center; }

    .main { margin-left: 260px; flex: 1; }
    .topbar { background: rgba(0,0,0,0.2); border-bottom: 1px solid var(--border); padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; }
    .topbar h1 { font-size: 22px; color: var(--accent); }
    .club-badge { font-size: 12px; color: var(--muted); background: var(--card); padding: 4px 12px; border-radius: 20px; border: 1px solid var(--border); }
    .content { padding: 32px; }

    /* HERO */
    .hero { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 32px; margin-bottom: 32px; display: flex; align-items: center; gap: 24px; }
    .hero-icon { font-size: 48px; }
    .hero h2 { font-size: 28px; color: var(--accent); margin-bottom: 6px; }
    .hero p { color: var(--muted); font-size: 15px; }

    /* STATS */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; margin-bottom: 32px; }
    .stat-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; text-align: center; }
    .stat-value { font-size: 32px; font-weight: 700; color: var(--accent); font-family: 'Playfair Display', serif; }
    .stat-label { font-size: 12px; color: var(--muted); margin-top: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
    .stat-card-cal { cursor: pointer; transition: border-color 0.2s, transform 0.2s; }
    .stat-card-cal:hover { border-color: var(--accent); transform: translateY(-2px); }
    .stat-card-cal .stat-label { color: var(--accent); }
    /* MODAL CALENDARIO */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 20px; overflow-y: auto; }
    .modal-overlay.open { display: flex; }
    .modal-cal { background: var(--card); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 600px; max-height: 85vh; overflow-y: auto; margin: auto; }
    .modal-cal-header { padding: 18px 22px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--card); z-index: 1; }
    .modal-cal-header h2 { font-size: 18px; color: var(--accent); font-family: 'Playfair Display', serif; }
    .btn-close { background: none; border: none; color: var(--muted); font-size: 22px; cursor: pointer; line-height: 1; }
    .modal-cal-body { padding: 20px 22px; }

    /* MODULE GRID */
    .section-title { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
    .section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .module-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; margin-bottom: 32px; }
    .module-card {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 24px 20px;
      text-decoration: none; color: var(--text); transition: all 0.2s; display: flex; flex-direction: column; gap: 8px;
    }
    .module-card:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }
    .module-card-icon { font-size: 28px; margin-bottom: 4px; }
    .module-card-title { font-family: 'Playfair Display', serif; font-size: 16px; color: var(--accent); }
    .module-card-desc { font-size: 13px; color: var(--muted); line-height: 1.4; }

    /* CALENDARIO HÍPICO */
    .cal-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 22px 24px; margin-bottom: 32px; }
    .cal-card-head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 20px; gap: 12px; flex-wrap: wrap; }
    .cal-card-title { font-family: 'Playfair Display', serif; font-size: 18px; color: var(--accent); }
    .cal-card-sub { font-size: 12px; color: var(--muted); }
    .cal-months-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px 28px; }
    .cal-month { display: flex; flex-direction: column; gap: 8px; }
    .cal-month-name { font-size: 10px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 1.5px; }
    .cal-circles { display: flex; flex-wrap: wrap; gap: 6px; }
    .cal-circle { width: 34px; height: 34px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-weight: 700; font-size: 13px; text-decoration: none; transition: transform 0.15s, opacity 0.15s; cursor: pointer; }
    .cal-circle:hover { transform: scale(1.12); opacity: 0.88; }
    .cal-circle-verde  { background: #4caf82; color: #0e2318; }
    .cal-circle-dorado { background: #c9a84c; color: #1a1a0a; }
    .cal-circle-rojo   { background: #e05252; color: #fff; }
    .cal-leyenda { display: flex; gap: 18px; margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); flex-wrap: wrap; }
    .cal-leyenda-item { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--muted); }
    .cal-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .cal-dot-verde  { background: #4caf82; }
    .cal-dot-dorado { background: #c9a84c; }
    .cal-dot-rojo   { background: #e05252; }

    /* TOAST */
    #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
    .toast { padding: 12px 20px; border-radius: 10px; font-size: 14px; font-weight: 500; max-width: 320px; animation: slideIn 0.3s ease; }
    .toast-success { background: #1a4a30; border: 1px solid var(--success); color: var(--text); }
    .toast-error { background: #4a1a1a; border: 1px solid var(--danger); color: var(--text); }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    @media (max-width: 768px) {
      .sidebar { transform: translateX(-100%); transition: transform 0.3s; }
      .sidebar.open { transform: translateX(0); }
      .main { margin-left: 0; }
      .topbar { padding: 16px; }
      .content { padding: 16px; }
      .hero { flex-direction: column; text-align: center; }
    }
    .menu-toggle { display: none; background: none; border: none; color: var(--text); font-size: 22px; cursor: pointer; }
    @media (max-width: 768px) { .menu-toggle { display: block; } }
    /* AUTH */
    #auth-overlay { position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center; }
    .user-bar { display:flex;align-items:center;gap:10px; }
    .user-name { font-size:13px;color:var(--muted); }
    .btn-logout { background:none;border:1px solid var(--border);color:var(--muted);padding:6px 14px;border-radius:8px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;transition:all 0.2s; }
    .btn-logout:hover { border-color:var(--danger);color:var(--danger); }
  </style>
</head>
<body>
<div id="auth-overlay"><div class="spinner" style="width:32px;height:32px;border-width:3px;"></div></div>
<div id="toast-container"></div>

<div class="layout">
  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <div class="logo-icon"><img src="logo192x192.png" alt="SGH" style="width:36px; height:36px; object-fit:contain;"></div>
      <div class="logo-text"><h2>SGH</h2><p id="sidebar-club">Gestión Hípica</p></div>
    </div>

    <div id="sidebar-nav"></div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div class="topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="menu-toggle" onclick="document.getElementById('sidebar').classList.toggle('open')">☰</button>
        <h1>Sistema de Gestión Hípica</h1>
      </div>
      <div class="user-bar">
        <span class="club-badge" id="club-name">Cargando...</span>
        <span class="user-name" id="user-name"></span>
        <button class="btn-logout" onclick="logout()">Cerrar sesión</button>
      </div>
    </div>

    <div class="content">
      <div class="hero">
        <div class="hero-icon">🏇</div>
        <div>
          <h2 id="hero-club">Bienvenido al SGH</h2>
          <p id="hero-desc">Sistema de Gestión Hípica — Panel de control</p>
        </div>
      </div>

      <!-- STATS -->
      <div class="stats-grid" id="stats-grid"></div>

      <div id="content-modules"></div>
    </div>
  </main>
</div>

<!-- MODAL CALENDARIO -->
<div class="modal-overlay" id="modal-calendario" onclick="if(event.target===this)closeCalendario()">
  <div class="modal-cal">
    <div class="modal-cal-header">
      <h2 id="cal-modal-title">Calendario Hípico</h2>
      <button class="btn-close" onclick="closeCalendario()">✕</button>
    </div>
    <div class="modal-cal-body" id="cal-modal-body">
      <div style="text-align:center;padding:40px;color:var(--muted);">Cargando…</div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
let sb, CLUB_ID, currentUser;
async function initAuth(){const{createClient}=supabase;sb=createClient('https://unlhcuanfrtpatoipwve.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVubGhjdWFuZnJ0cGF0b2lwd3ZlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3MjQ0OTcsImV4cCI6MjA5MjMwMDQ5N30.rKb8BI7fBQcRdyyyxVfBOZbtCmGYKIMLUDLVmkn1SYM');const{data:{session}}=await sb.auth.getSession();if(!session){window.location.replace('login.html');return false;}const{data:usr}=await sb.from('usuarios').select('club_id,nombre_completo,rol').eq('email',session.user.email).single();if(usr.rol==='super_admin'){const urlClub=new URLSearchParams(window.location.search).get('club');CLUB_ID=urlClub||usr.club_id||null;}else{if(!usr.club_id){await sb.auth.signOut();window.location.replace('login.html');return false;}CLUB_ID=usr.club_id;}currentUser={...session.user,nombre_completo:usr.nombre_completo,rol:usr.rol};const uEl=document.getElementById('user-name');if(uEl)uEl.textContent=usr.nombre_completo||session.user.email;document.getElementById('auth-overlay').style.display='none';return true;}
function logout(){sb.auth.signOut().then(()=>window.location.replace('login.html'));}

function toast(msg, type = 'success') {
  const t = document.createElement('div');
  t.className = `toast toast-${type}`;
  t.textContent = msg;
  document.getElementById('toast-container').appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

function statCard(id, value, label) {
  return `<div class="stat-card"><div class="stat-value" id="${id}">${value}</div><div class="stat-label">${label}</div></div>`;
}

async function loadDashboard() {
  try {
    const rol = currentUser.rol;
    const currentYear = new Date().getFullYear();
    const { data: clubData } = await sb.from('clubs').select('nombre,sigla').eq('id', CLUB_ID).single();

    if (rol === 'super_admin') {
      document.getElementById('club-name').style.display = 'none';
      document.getElementById('sidebar-club').textContent = 'SGH';
      document.getElementById('hero-club').textContent = 'Panel Super Admin';
      document.getElementById('hero-desc').textContent = 'Sistema de Gestión Hípica — Administración global';
    } else if (clubData) {
      document.getElementById('club-name').textContent = clubData.sigla || clubData.nombre;
      document.getElementById('sidebar-club').textContent = clubData.sigla || clubData.nombre;
      document.getElementById('hero-club').textContent = clubData.nombre;
      document.getElementById('hero-desc').textContent = `Sistema de Gestión Hípica — ${clubData.sigla}`;
    }

    if (rol === 'super_admin') {
      const [spcs, props, profs, cabs, reuns, sancs] = await Promise.all([
        sb.from('spcs').select('id', { count: 'exact', head: true }).eq('club_id', CLUB_ID).eq('estado', 'activo'),
        sb.from('propietarios').select('id', { count: 'exact', head: true }).eq('club_id', CLUB_ID).eq('activo', true),
        sb.from('profesionales').select('id', { count: 'exact', head: true }).eq('club_id', CLUB_ID).eq('activo', true),
        sb.from('caballerizas').select('id', { count: 'exact', head: true }).eq('club_id', CLUB_ID).eq('activo', true),
        sb.from('reuniones').select('id', { count: 'exact', head: true }).eq('club_id', CLUB_ID),
        sb.from('sanciones').select('id', { count: 'exact', head: true }).eq('club_id', CLUB_ID).eq('estado', 'activa'),
      ]);
      document.getElementById('stats-grid').innerHTML =
        statCard('stat-spcs',          spcs.count  ?? '—', 'SPCs activos') +
        statCard('stat-propietarios',  props.count ?? '—', 'Propietarios') +
        statCard('stat-profesionales', profs.count ?? '—', 'Profesionales') +
        statCard('stat-caballerizas',  cabs.count  ?? '—', 'Caballerizas') +
        statCard('stat-reuniones',     reuns.count ?? '—', 'Reuniones') +
        statCard('stat-sanciones',     sancs.count ?? '—', 'Sanciones activas');
      loadCalendario();
    } else {
      // secretario_carreras y otros roles: estadísticas relevantes del hipódromo
      const [profs, cabs, reuns, sancs] = await Promise.all([
        sb.from('profesionales').select('id', { count: 'exact', head: true }).eq('activo', true),
        sb.from('caballerizas').select('id', { count: 'exact', head: true }).eq('club_id', CLUB_ID).eq('activo', true),
        sb.from('reuniones').select('id', { count: 'exact', head: true }).eq('club_id', CLUB_ID)
          .gte('fecha', `${currentYear}-01-01`).lte('fecha', `${currentYear}-12-31`),
        sb.from('sanciones').select('id', { count: 'exact', head: true }).eq('club_id', CLUB_ID).eq('estado', 'activa'),
      ]);
      document.getElementById('stats-grid').innerHTML =
        statCard('stat-profesionales', profs.count ?? '—', 'Profesionales') +
        statCard('stat-caballerizas',  cabs.count  ?? '—', 'Caballerizas') +
        statCard('stat-reuniones',     reuns.count ?? '—', `Reuniones ${currentYear}`) +
        statCard('stat-sanciones',     sancs.count ?? '—', 'Sanciones activas') +
        `<div class="stat-card stat-card-cal" onclick="openCalendario()">
          <div class="stat-value">${reuns.count ?? '—'}</div>
          <div class="stat-label">📅 Calendario ${currentYear}</div>
        </div>`;
      document.getElementById('cal-modal-title').textContent = `Calendario Hípico ${currentYear}`;
      loadCalendario();
    }
  } catch (e) {
    toast('Error al cargar datos del dashboard', 'error');
  }
}

async function loadCalendario() {
  if (!CLUB_ID) return;
  const currentYear = new Date().getFullYear();
  // Sin filtro de estado — muestra todas: borrador, publicada, en_curso, finalizada, cancelada
  // Usa lt(año+1) en lugar de lte(año-12-31) para evitar problemas con timestamps de fin de año
  const { data: reuns } = await sb.from('reuniones')
    .select('id, fecha, estado, numero, tipo')
    .eq('club_id', CLUB_ID)
    .gte('fecha', `${currentYear}-01-01`)
    .lt('fecha',  `${currentYear + 1}-01-01`)
    .order('fecha');

  if (!reuns?.length) return;

  const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio',
                 'Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

  // Agrupar por mes
  const porMes = {};
  reuns.forEach(r => {
    const m = new Date(r.fecha + 'T12:00:00').getMonth();
    if (!porMes[m]) porMes[m] = [];
    porMes[m].push(r);
  });

  const mesesHtml = Object.entries(porMes).map(([mes, reuniones]) => {
    const circulos = reuniones.map(r => {
      const dia = new Date(r.fecha + 'T12:00:00').getDate();
      let cls = 'cal-circle-dorado';
      if (['publicada','en_curso','finalizada'].includes(r.estado)) cls = 'cal-circle-verde';
      else if (['cancelada','suspendida'].includes(r.estado))        cls = 'cal-circle-rojo';
      const title = `${r.numero ? `Reunión N° ${r.numero}` : 'Reunión'} · ${r.estado}`;
      return `<a class="cal-circle ${cls}" href="carta-llamados.html?reunion_id=${r.id}" title="${title}">${dia}</a>`;
    }).join('');

    return `<div class="cal-month">
      <div class="cal-month-name">${MESES[parseInt(mes)]}</div>
      <div class="cal-circles">${circulos}</div>
    </div>`;
  }).join('');

  const leyenda = `<div class="cal-leyenda">
    <span class="cal-leyenda-item"><span class="cal-dot cal-dot-verde"></span>Con carta de llamados</span>
    <span class="cal-leyenda-item"><span class="cal-dot cal-dot-dorado"></span>Programada</span>
    <span class="cal-leyenda-item"><span class="cal-dot cal-dot-rojo"></span>Cancelada / Suspendida</span>
  </div>`;

  document.getElementById('cal-modal-body').innerHTML =
    `<div class="cal-months-grid">${mesesHtml}</div>${leyenda}`;

  // Sincronizar el contador del stat card con el resultado real de esta consulta
  const statCal = document.querySelector('.stat-card-cal .stat-value');
  if (statCal) statCal.textContent = reuns.length;
  if (document.getElementById('cal-modal-title'))
    document.getElementById('cal-modal-title').textContent = `Calendario Hípico ${currentYear} · ${reuns.length} reunión${reuns.length !== 1 ? 'es' : ''}`;
}

function openCalendario() {
  document.getElementById('modal-calendario').classList.add('open');
}
function closeCalendario() {
  document.getElementById('modal-calendario').classList.remove('open');
}

function navSection(title, links) {
  const items = links.map(([href, icon, label]) =>
    `<a href="${href}" class="nav-link"><span class="nav-icon">${icon}</span>${label}</a>`
  ).join('');
  return `<div class="sidebar-section">
    <div class="sidebar-section-title">${title}</div>
    ${items}
  </div>`;
}

function moduleCard(href, icon, title, desc) {
  return `<a href="${href}" class="module-card">
    <div class="module-card-icon">${icon}</div>
    <div class="module-card-title">${title}</div>
    <div class="module-card-desc">${desc}</div>
  </a>`;
}

function moduleSection(title, cards) {
  return `<div class="section-title">${title}</div>
  <div class="module-grid">${cards.join('')}</div>`;
}

function buildUI(rol) {
  const sidenav = document.getElementById('sidebar-nav');
  const content = document.getElementById('content-modules');

  // Propietarios y entrenadores van a su portal
  if (rol === 'propietario' || rol === 'profesional') {
    window.location.replace('portal.html');
    return;
  }

  const dashSection = navSection('Dashboard', [['index.html', '🏠', 'Inicio']]);

  if (rol === 'super_admin') {
    sidenav.innerHTML =
      dashSection +
      navSection('Operaciones del día', [
        ['reuniones.html',                '📅', 'Reuniones'],
        ['carta-llamados.html',           '📄', 'Carta de llamados'],
        ['inscripciones.html',            '📋', 'Inscripciones'],
        ['ratificacion.html',             '✅', 'Ratificación'],
        ['programa.html',                 '🖨️', 'Programa'],
        ['resultados.html',               '🏆', 'Resultados'],
        ['liquidaciones.html',            '💰', 'Liquidaciones'],
      ]) +
      navSection('Registros', [
        ['spcs.html',                     '🐎', 'Stud Book (SPCs)'],
        ['caballerizas-propietarios.html','🏠', 'Caballerizas/Propietarios'],
        ['jockeys.html',                  '🎽', 'Jockeys'],
        ['profesionales.html',            '🧢', 'Entrenadores'],
        ['sanciones.html',                '⚖️', 'Sanciones'],
        ['resoluciones.html',             '📜', 'Resoluciones'],
      ]) +
      navSection('Administración', [
        ['usuarios.html',                 '👥', 'Usuarios'],
        ['admin.html',                    '🔧', 'Configuración'],
      ]);
