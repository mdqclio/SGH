<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="logo32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="logo180x180.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0e2318">
  <title>Caballerizas y Propietarios — SGH</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0e2318; --card: #1a3d26; --accent: #c9a84c;
      --text: #f5f0e8; --muted: #a0b8a0; --danger: #e05252;
      --success: #4caf82; --border: rgba(201,168,76,0.2); --input-bg: #0e2318;
    }
    body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }
    h1,h2,h3 { font-family: 'Playfair Display', serif; }
    .topbar { background: rgba(0,0,0,0.3); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; gap: 16px; }
    .btn-back { background: none; border: 1px solid var(--border); color: var(--muted); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 14px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s; }
    .btn-back:hover { border-color: var(--accent); color: var(--accent); }
    .topbar h1 { font-size: 22px; color: var(--accent); flex: 1; }
    .btn-primary { background: var(--accent); color: #1a1a0a; border: none; padding: 10px 20px; border-radius: 10px; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: opacity 0.2s; white-space: nowrap; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 10px 20px; border-radius: 10px; font-family: 'DM Sans', sans-serif; font-size: 14px; cursor: pointer; transition: all 0.2s; }
    .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
    /* TABS */
    .tabs-bar { background: rgba(0,0,0,0.2); border-bottom: 1px solid var(--border); padding: 0 24px; display: flex; gap: 0; }
    .tab-btn { padding: 14px 22px; font-size: 14px; font-weight: 500; color: var(--muted); background: none; border: none; cursor: pointer; border-bottom: 3px solid transparent; transition: all 0.2s; font-family: 'DM Sans', sans-serif; }
    .tab-btn:hover { color: var(--text); }
    .tab-btn.active { color: var(--accent); border-bottom-color: var(--accent); }
    .content { max-width: 1200px; margin: 0 auto; padding: 28px 24px; }
    .toolbar { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; align-items: center; }
    .search-box { flex: 1; min-width: 240px; position: relative; }
    .search-box input { width: 100%; background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 10px 16px 10px 40px; border-radius: 10px; font-family: 'DM Sans', sans-serif; font-size: 14px; outline: none; transition: border 0.2s; }
    .search-box input:focus { border-color: var(--accent); }
    .search-box::before { content: '🔍'; position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 14px; }
    .filter-select { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 10px 16px; border-radius: 10px; font-family: 'DM Sans', sans-serif; font-size: 14px; cursor: pointer; outline: none; }
    .stats-row { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
    .stat-chip { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 20px; text-align: center; min-width: 120px; }
    .stat-chip-val { font-size: 22px; font-weight: 700; color: var(--accent); }
    .stat-chip-lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; transition: border-color 0.2s; }
    .card:hover { border-color: rgba(201,168,76,0.4); }
    .card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .card-info { flex: 1; min-width: 0; }
    .card-name { font-family: 'Playfair Display', serif; font-size: 17px; color: var(--accent); margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .card-sub { font-size: 13px; color: var(--muted); }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .badge-activo { background: rgba(76,175,130,0.15); color: var(--success); border: 1px solid rgba(76,175,130,0.3); }
    .badge-inactivo { background: rgba(224,82,82,0.1); color: var(--danger); border: 1px solid rgba(224,82,82,0.3); }
    .badge-persona { background: rgba(76,175,130,0.15); color: var(--success); border: 1px solid rgba(76,175,130,0.3); }
    .badge-sociedad { background: rgba(201,168,76,0.15); color: var(--accent); border: 1px solid rgba(201,168,76,0.3); }
    .card-detail { font-size: 13px; color: var(--muted); line-height: 1.7; margin-bottom: 12px; }
    .card-detail span { color: var(--text); }
    .card-actions { display: flex; gap: 8px; }
    .btn-sm { padding: 7px 14px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; font-family: 'DM Sans', sans-serif; border: none; transition: all 0.2s; }
    .btn-edit { background: rgba(201,168,76,0.15); color: var(--accent); border: 1px solid rgba(201,168,76,0.3); }
    .btn-edit:hover { background: rgba(201,168,76,0.25); }
    .btn-delete { background: rgba(224,82,82,0.1); color: var(--danger); border: 1px solid rgba(224,82,82,0.3); }
    .btn-delete:hover { background: rgba(224,82,82,0.2); }
    .empty-state { text-align: center; padding: 60px 20px; }
    .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
    .empty-state h3 { font-size: 18px; color: var(--muted); margin-bottom: 8px; }
    .loading-state { display: flex; align-items: center; justify-content: center; padding: 60px; gap: 12px; color: var(--muted); }
    .spinner { width: 24px; height: 24px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1000; display: none; align-items: flex-start; justify-content: center; padding: 20px; overflow-y: auto; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--card); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 640px; max-height: 90vh; overflow-y: auto; margin: auto; }
    .modal-header { padding: 24px 24px 0; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; background: var(--card); z-index: 1; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
    .modal-header h2 { font-size: 20px; color: var(--accent); }
    .btn-close { background: none; border: none; color: var(--muted); font-size: 22px; cursor: pointer; line-height: 1; padding: 4px; }
    .modal-body { padding: 20px 24px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group.full { grid-column: 1 / -1; }
    label { font-size: 13px; font-weight: 500; color: var(--muted); }
    input, select, textarea { background: var(--input-bg); border: 1px solid var(--border); color: var(--text); padding: 10px 14px; border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 14px; outline: none; width: 100%; transition: border 0.2s; }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    textarea { resize: vertical; min-height: 80px; }
    select option { background: #1a3d26; }
    .modal-footer { padding: 0 24px 24px; display: flex; gap: 10px; justify-content: flex-end; }
    #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
    .toast { padding: 12px 20px; border-radius: 10px; font-size: 14px; font-weight: 500; max-width: 320px; animation: slideIn 0.3s ease; }
    .toast-success { background: #1a4a30; border: 1px solid var(--success); color: var(--text); }
    .toast-error { background: #4a1a1a; border: 1px solid var(--danger); color: var(--text); }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    #auth-overlay { position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center; }
    .btn-logout { background:none;border:1px solid var(--border);color:var(--muted);padding:6px 14px;border-radius:8px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;transition:all 0.2s;margin-left:auto; }
    .btn-logout:hover { border-color:var(--danger);color:var(--danger); }
    .user-name { font-size:13px;color:var(--muted); }
    @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } .form-group.full { grid-column: 1; } }
  </style>
</head>
<body>
<div id="auth-overlay"><div class="spinner" style="width:32px;height:32px;border-width:3px;"></div></div>
<div id="toast-container"></div>

<div class="topbar">
  <a href="index.html" class="btn-back">← Volver</a>
  <h1>Caballerizas / Propietarios</h1>
  <span class="user-name" id="user-name"></span>
  <button class="btn-logout" onclick="logout()">Cerrar sesión</button>
</div>

<div class="tabs-bar">
  <button class="tab-btn active" id="tab-cabs" onclick="switchTab('cabs')">🏠 Caballerizas / Studs</button>
  <button class="tab-btn" id="tab-props" onclick="switchTab('props')">👔 Propietarios</button>
</div>

<div class="content">
  <!-- ESTADÍSTICAS -->
  <div class="stats-row" id="stats-row"></div>

  <!-- TOOLBAR -->
  <div class="toolbar">
    <div class="search-box">
      <input type="text" id="search" placeholder="Buscar…" oninput="filterRender()">
    </div>
    <select class="filter-select" id="filter-activo" onchange="filterRender()">
      <option value="">Todos</option>
      <option value="true">Activos</option>
      <option value="false">Inactivos</option>
    </select>
    <button class="btn-primary" id="btn-nuevo" onclick="openModal()">+ Nuevo</button>
  </div>

  <div id="list-container"></div>
</div>

<!-- MODAL CABALLERIZA -->
<div class="modal-overlay" id="modal-cab">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-cab-title">Nueva Caballeriza</h2>
      <button class="btn-close" onclick="closeModal('modal-cab')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <input type="hidden" id="cab-id">
        <div class="form-group full">
          <label>Nombre de la caballeriza / stud *</label>
          <input type="text" id="cab-nombre" required placeholder="Ej: Stud El Porvenir">
        </div>
        <div class="form-group">
          <label>Responsable</label>
          <input type="text" id="cab-responsable" placeholder="Nombre del responsable">
        </div>
        <div class="form-group">
          <label>Teléfono</label>
          <input type="tel" id="cab-telefono">
        </div>
        <div class="form-group full">
          <label>Dirección</label>
          <input type="text" id="cab-direccion" placeholder="Dirección física">
        </div>
        <div class="form-group">
          <label>Activo</label>
          <select id="cab-activo">
            <option value="true">Sí</option>
            <option value="false">No</option>
          </select>
        </div>
        <div class="form-group full">
          <label>Notas</label>
          <textarea id="cab-notas" placeholder="Observaciones…"></textarea>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeModal('modal-cab')">Cancelar</button>
      <button class="btn-primary" onclick="saveCab()" id="btn-save-cab">Guardar</button>
    </div>
  </div>
</div>

<!-- MODAL PROPIETARIO -->
<div class="modal-overlay" id="modal-prop">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-prop-title">Nuevo Propietario</h2>
      <button class="btn-close" onclick="closeModal('modal-prop')">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <input type="hidden" id="prop-id">
        <div class="form-group">
          <label>Tipo *</label>
          <select id="prop-tipo">
            <option value="persona">Persona física</option>
            <option value="sociedad">Sociedad / Stud</option>
          </select>
        </div>
        <div class="form-group">
          <label>Activo</label>
          <select id="prop-activo">
            <option value="true">Sí</option>
            <option value="false">No</option>
          </select>
        </div>
        <div class="form-group full">
          <label>Nombre completo / Razón social *</label>
          <input type="text" id="prop-nombre" required placeholder="Apellido y nombre o razón social">
        </div>
        <div class="form-group full">
          <label>Nombre del Stud</label>
          <input type="text" id="prop-stud" placeholder="Ej: Stud La Pampa">
        </div>
        <div class="form-group">
          <label>Tipo documento</label>
          <select id="prop-doc-tipo">
            <option value="DNI">DNI</option>
            <option value="CUIT">CUIT</option>
            <option value="CUIL">CUIL</option>
            <option value="Pasaporte">Pasaporte</option>
            <option value="Otro">Otro</option>
          </select>
        </div>
        <div class="form-group">
          <label>N° documento</label>
          <input type="text" id="prop-doc-nro" placeholder="XX-XXXXXXXX-X">
        </div>
        <div class="form-group">
          <label>Teléfono</label>
          <input type="tel" id="prop-telefono">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="prop-email">
        </div>
        <div class="form-group full">
          <label>Colores registrados</label>
          <input type="text" id="prop-colores" placeholder="Ej: Rojo y blanco, mangas azules">
        </div>
        <div class="form-group full">
          <label>Notas</label>
          <textarea id="prop-notas" placeholder="Observaciones adicionales…"></textarea>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeModal('modal-prop')">Cancelar</button>
      <button class="btn-primary" onclick="saveProp()" id="btn-save-prop">Guardar</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
let sb, CLUB_ID, currentUser;
async function initAuth(){const{createClient}=supabase;sb=createClient('https://unlhcuanfrtpatoipwve.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVubGhjdWFuZnJ0cGF0b2lwd3ZlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3MjQ0OTcsImV4cCI6MjA5MjMwMDQ5N30.rKb8BI7fBQcRdyyyxVfBOZbtCmGYKIMLUDLVmkn1SYM');const{data:{session}}=await sb.auth.getSession();if(!session){window.location.replace('login.html');return false;}const{data:usr}=await sb.from('usuarios').select('club_id,nombre_completo,rol').eq('email',session.user.email).single();if(usr.rol==='super_admin'){const urlClub=new URLSearchParams(window.location.search).get('club');CLUB_ID=urlClub||usr.club_id||null;}else{if(!usr.club_id){await sb.auth.signOut();window.location.replace('login.html');return false;}CLUB_ID=usr.club_id;}currentUser={...session.user,nombre_completo:usr.nombre_completo,rol:usr.rol};const uEl=document.getElementById('user-name');if(uEl)uEl.textContent=usr.nombre_completo||session.user.email;document.getElementById('auth-overlay').style.display='none';return true;}
function logout(){sb.auth.signOut().then(()=>window.location.replace('login.html'));}

let activeTab = 'cabs';
let allCabs=[], allProps=[];

function toast(msg, type='success') {
  const t=document.createElement('div'); t.className=`toast toast-${type}`; t.textContent=msg;
  document.getElementById('toast-container').appendChild(t); setTimeout(()=>t.remove(),3500);
}

async function load() {
  document.getElementById('list-container').innerHTML='<div class="loading-state"><div class="spinner"></div> Cargando…</div>';
  const [{ data: cabs }, { data: props }] = await Promise.all([
    sb.from('caballerizas').select('*').eq('club_id', CLUB_ID).order('nombre'),
    sb.from('propietarios').select('*').order('nombre'),
  ]);
  allCabs = cabs||[];
  allProps = props||[];
  updateStats();
  filterRender();
}

function switchTab(tab) {
  activeTab = tab;
  document.getElementById('tab-cabs').classList.toggle('active', tab==='cabs');
  document.getElementById('tab-props').classList.toggle('active', tab==='props');
  document.getElementById('search').value='';
  document.getElementById('filter-activo').value='';
  document.getElementById('btn-nuevo').textContent = tab==='cabs' ? '+ Nueva Caballeriza' : '+ Nuevo Propietario';
  updateStats();
  filterRender();
}

function updateStats() {
  if (activeTab==='cabs') {
    document.getElementById('stats-row').innerHTML=`
      <div class="stat-chip"><div class="stat-chip-val">${allCabs.length}</div><div class="stat-chip-lbl">Total</div></div>
      <div class="stat-chip"><div class="stat-chip-val">${allCabs.filter(c=>c.activo).length}</div><div class="stat-chip-lbl">Activas</div></div>
    `;
  } else {
    document.getElementById('stats-row').innerHTML=`
      <div class="stat-chip"><div class="stat-chip-val">${allProps.length}</div><div class="stat-chip-lbl">Total</div></div>
      <div class="stat-chip"><div class="stat-chip-val">${allProps.filter(p=>p.tipo==='persona').length}</div><div class="stat-chip-lbl">Personas</div></div>
      <div class="stat-chip"><div class="stat-chip-val">${allProps.filter(p=>p.tipo==='sociedad').length}</div><div class="stat-chip-lbl">Sociedades</div></div>
      <div class="stat-chip"><div class="stat-chip-val">${allProps.filter(p=>p.activo).length}</div><div class="stat-chip-lbl">Activos</div></div>
    `;
  }
}

function filterRender() {
  const q = document.getElementById('search').value.toLowerCase();
  const activo = document.getElementById('filter-activo').value;
  if (activeTab==='cabs') {
    let data = allCabs.filter(r => {
      const matchQ = !q || r.nombre?.toLowerCase().includes(q) || r.responsable?.toLowerCase().includes(q);
      const matchA = activo==='' || String(r.activo)===activo;
      return matchQ && matchA;
    });
    renderCabs(data);
  } else {
    let data = allProps.filter(r => {
      const matchQ = !q || r.nombre?.toLowerCase().includes(q) || r.nombre_stud?.toLowerCase().includes(q) || r.documento_nro?.toLowerCase().includes(q);
      const matchA = activo==='' || String(r.activo)===activo;
      return matchQ && matchA;
    });
    renderProps(data);
  }
}

function renderCabs(data) {
  if (!data.length) {
    document.getElementById('list-container').innerHTML=`<div class="empty-state"><div class="icon">🏠</div><h3>Sin caballerizas</h3><p>No se encontraron caballerizas con los filtros aplicados.</p></div>`;
    return;
  }
  document.getElementById('list-container').innerHTML=`<div class="grid">${data.map(r=>`
    <div class="card">
      <div class="card-header">
        <div class="card-info">
          <div class="card-name" title="${r.nombre}">${r.nombre}</div>
          <div class="card-sub">${r.responsable||'—'}</div>
        </div>
        <span class="badge badge-${r.activo?'activo':'inactivo'}">${r.activo?'Activa':'Inactiva'}</span>
      </div>
      <div class="card-detail">
        ${r.telefono?`<div>📞 <span>${r.telefono}</span></div>`:''}
        ${r.direccion?`<div>📍 <span>${r.direccion}</span></div>`:''}
        ${r.notas?`<div>📝 <span>${r.notas}</span></div>`:''}
      </div>
      <div class="card-actions">
        <button class="btn-sm btn-edit" onclick='openModalCab(${JSON.stringify(r).replace(/"/g,"&quot;")})'>✏️ Editar</button>
        <button class="btn-sm btn-delete" onclick="deleteCab('${r.id}','${r.nombre.replace(/'/g,"\\'")}')">🗑️ Eliminar</button>
      </div>
    </div>
  `).join('')}</div>`;
}

function renderProps(data) {
  if (!data.length) {
    document.getElementById('list-container').innerHTML=`<div class="empty-state"><div class="icon">👔</div><h3>Sin propietarios</h3><p>No se encontraron propietarios con los filtros aplicados.</p></div>`;
    return;
  }
  document.getElementById('list-container').innerHTML=`<div class="grid">${data.map(r=>`
    <div class="card">
      <div class="card-header">
        <div class="card-info">
          <div class="card-name" title="${r.nombre}">${r.nombre}</div>
          <div class="card-sub">${r.documento_tipo?`${r.documento_tipo} ${r.documento_nro||''}`:''}</div>
        </div>
        <div style="display:flex;gap:4px;flex-direction:column;align-items:flex-end;">
          <span class="badge badge-${r.tipo}">${r.tipo==='persona'?'Persona':'Sociedad'}</span>
          ${!r.activo?'<span class="badge badge-inactivo">Inactivo</span>':''}
        </div>
      </div>
      <div class="card-detail">
        ${r.nombre_stud?`<div>🏠 Stud: <span>${r.nombre_stud}</span></div>`:''}
        ${r.telefono?`<div>📞 <span>${r.telefono}</span></div>`:''}
        ${r.email?`<div>✉️ <span>${r.email}</span></div>`:''}
        ${r.colores_desc?`<div>🎨 <span>${r.colores_desc}</span></div>`:''}
      </div>
      <div class="card-actions">
        <button class="btn-sm btn-edit" onclick='openModalProp(${JSON.stringify(r).replace(/"/g,"&quot;")})'>✏️ Editar</button>
        <button class="btn-sm btn-delete" onclick="deleteProp('${r.id}','${r.nombre.replace(/'/g,"\\'")}')">🗑️ Eliminar</button>
      </div>
    </div>
  `).join('')}</div>`;
}

function openModal() {
  if (activeTab==='cabs') openModalCab(null);
  else openModalProp(null);
}

function openModalCab(rec=null) {
  document.getElementById('modal-cab-title').textContent = rec ? 'Editar Caballeriza' : 'Nueva Caballeriza';
  document.getElementById('cab-id').value = rec?.id||'';
  document.getElementById('cab-nombre').value = rec?.nombre||'';
  document.getElementById('cab-responsable').value = rec?.responsable||'';
  document.getElementById('cab-telefono').value = rec?.telefono||'';
  document.getElementById('cab-direccion').value = rec?.direccion||'';
  document.getElementById('cab-activo').value = rec ? String(rec.activo) : 'true';
  document.getElementById('cab-notas').value = rec?.notas||'';
  document.getElementById('modal-cab').classList.add('open');
}

function openModalProp(rec=null) {
  document.getElementById('modal-prop-title').textContent = rec ? 'Editar Propietario' : 'Nuevo Propietario';
  document.getElementById('prop-id').value = rec?.id||'';
  document.getElementById('prop-tipo').value = rec?.tipo||'persona';
  document.getElementById('prop-activo').value = rec ? String(rec.activo) : 'true';
  document.getElementById('prop-nombre').value = rec?.nombre||'';
  document.getElementById('prop-stud').value = rec?.nombre_stud||'';
  document.getElementById('prop-doc-tipo').value = rec?.documento_tipo||'DNI';
  document.getElementById('prop-doc-nro').value = rec?.documento_nro||'';
  document.getElementById('prop-telefono').value = rec?.telefono||'';
  document.getElementById('prop-email').value = rec?.email||'';
  document.getElementById('prop-colores').value = rec?.colores_desc||'';
  document.getElementById('prop-notas').value = rec?.notas||'';
  document.getElementById('modal-prop').classList.add('open');
}

function closeModal(id) { document.getElementById(id).classList.remove('open'); }

async function saveCab() {
  const nombre = document.getElementById('cab-nombre').value.trim();
  if (!nombre) { toast('El nombre es requerido','error'); return; }
  const id = document.getElementById('cab-id').value;
  const btn = document.getElementById('btn-save-cab');
  btn.disabled=true; btn.textContent='Guardando…';
  const payload = {
    club_id: CLUB_ID,
    nombre,
    responsable: document.getElementById('cab-responsable').value.trim()||null,
    telefono: document.getElementById('cab-telefono').value.trim()||null,
    direccion: document.getElementById('cab-direccion').value.trim()||null,
    activo: document.getElementById('cab-activo').value==='true',
    notas: document.getElementById('cab-notas').value.trim()||null,
  };
  const { error } = id
    ? await sb.from('caballerizas').update(payload).eq('id',id)
    : await sb.from('caballerizas').insert(payload);
  btn.disabled=false; btn.textContent='Guardar';
  if (error) { toast(error.message,'error'); return; }
  toast(id ? 'Caballeriza actualizada' : 'Caballeriza creada');
  closeModal('modal-cab');
  await load();
}

async function saveProp() {
  const nombre = document.getElementById('prop-nombre').value.trim();
  if (!nombre) { toast('El nombre es requerido','error'); return; }
  const id = document.getElementById('prop-id').value;
  const btn = document.getElementById('btn-save-prop');
  btn.disabled=true; btn.textContent='Guardando…';
  const payload = {
    tipo: document.getElementById('prop-tipo').value,
    activo: document.getElementById('prop-activo').value==='true',
    nombre,
    nombre_stud: document.getElementById('prop-stud').value.trim()||null,
    documento_tipo: document.getElementById('prop-doc-tipo').value,
    documento_nro: document.getElementById('prop-doc-nro').value.trim()||null,
    telefono: document.getElementById('prop-telefono').value.trim()||null,
    email: document.getElementById('prop-email').value.trim()||null,
    colores_desc: document.getElementById('prop-colores').value.trim()||null,
    notas: document.getElementById('prop-notas').value.trim()||null,
  };
  const { error } = id
    ? await sb.from('propietarios').update(payload).eq('id',id)
    : await sb.from('propietarios').insert(payload);
  btn.disabled=false; btn.textContent='Guardar';
  if (error) { toast(error.message,'error'); return; }
  toast(id ? 'Propietario actualizado' : 'Propietario creado');
  closeModal('modal-prop');
  await load();
}

async function deleteCab(id, nombre) {
  if (!confirm(`¿Eliminar caballeriza "${nombre}"?`)) return;
  const { error } = await sb.from('caballerizas').delete().eq('id',id);
  if (error) { toast(error.message,'error'); return; }
  toast('Caballeriza eliminada');
  await load();
}

async function deleteProp(id, nombre) {
  if (!confirm(`¿Eliminar propietario "${nombre}"?`)) return;
  const { error } = await sb.from('propietarios').delete().eq('id',id);
  if (error) { toast(error.message,'error'); return; }
  toast('Propietario eliminado');
  await load();
}

document.getElementById('modal-cab').addEventListener('click', e=>{ if(e.target===e.currentTarget) closeModal('modal-cab'); });
document.getElementById('modal-prop').addEventListener('click', e=>{ if(e.target===e.currentTarget) closeModal('modal-prop'); });
(async()=>{ if(await initAuth()) { switchTab('cabs'); load(); } })();
</script>
</body>
</html>
