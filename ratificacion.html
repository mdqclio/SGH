<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co https://raw.githubusercontent.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="logo32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="logo180x180.png">

  <meta name="theme-color" content="#0e2318">
  <title>Ratificados y forfait — SGH</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0e2318; --card: #1a3d26; --accent: #c9a84c;
      --text: #f5f0e8; --muted: #a0b8a0; --danger: #e05252;
      --success: #4caf82; --border: rgba(201,168,76,0.2); --input-bg: #0e2318;
      --info: #74b0f7;
    }
    body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }
    h1,h2,h3 { font-family: 'Playfair Display', serif; }
    .topbar { background: rgba(0,0,0,0.3); border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .btn-back { background: none; border: 1px solid var(--border); color: var(--muted); padding: 7px 14px; border-radius: 8px; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 13px; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; transition: all 0.2s; }
    .btn-back:hover { border-color: var(--accent); color: var(--accent); }
    .topbar h1 { font-size: 18px; color: var(--accent); flex: 1; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 9px 18px; border-radius: 9px; font-family: 'DM Sans', sans-serif; font-size: 13px; cursor: pointer; transition: all 0.2s; }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
    .selector-bar { background: var(--card); border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .selector-bar label { font-size: 12px; color: var(--muted); }
    select { background: var(--input-bg); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 13px; outline: none; }
    select:focus { border-color: var(--accent); }
    select option { background: #1a3d26; }
    .content { max-width: 1600px; margin: 0 auto; padding: 24px; }
    .carrera-section { background: var(--card); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 16px; overflow: hidden; }
    .carrera-header { padding: 14px 18px; display: flex; align-items: center; gap: 14px; cursor: pointer; background: rgba(0,0,0,0.15); }
    .carrera-header:hover { background: rgba(0,0,0,0.25); }
    .carrera-num { font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 700; color: var(--accent); min-width: 36px; }
    .carrera-title { font-size: 15px; font-weight: 600; flex: 1; }
    .carrera-stats { display: flex; gap: 8px; }
    .cstat { font-size: 12px; padding: 3px 9px; border-radius: 6px; font-weight: 600; }
    .cstat-rat { background: rgba(201,168,76,0.15); color: var(--accent); }
    .cstat-conf { background: rgba(76,175,130,0.15); color: var(--success); }
    .cstat-fort { background: rgba(224,82,82,0.1); color: var(--danger); }
    .cstat-pre { background: rgba(116,176,247,0.1); color: var(--info); }
    .insc-counter { font-size: 14px; font-weight: 600; color: var(--text); white-space: nowrap; }
    .insc-counter-sub { font-size: 12px; color: var(--muted); font-weight: 400; }
    .col-peso-display { display: none; }
    .expand-icon { color: var(--muted); font-size: 12px; transition: transform 0.2s; }
    .carrera-section.open .expand-icon { transform: rotate(180deg); }
    .inscr-table { width: 100%; border-collapse: collapse; }
    .inscr-table thead th { background: rgba(0,0,0,0.1); padding: 10px 14px; text-align: left; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; }
    .inscr-table tbody tr { border-top: 1px solid var(--border); }
    .inscr-table tbody tr:hover { background: rgba(201,168,76,0.03); }
    .inscr-table tbody td { padding: 10px 14px; font-size: 13px; vertical-align: middle; }
    .num-part { font-family: 'Playfair Display', serif; font-size: 18px; color: var(--accent); font-weight: 700; min-width: 32px; text-align: center; }
    .spc-name { font-weight: 600; color: var(--accent); }
    .spc-sub { font-size: 11px; color: var(--muted); }
    .badge { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; text-transform: uppercase; }
    .badge-inscripto  { background: rgba(76,175,130,0.15);  color: var(--success); border: 1px solid rgba(76,175,130,0.3); }
    .badge-ratificado { background: rgba(201,168,76,0.15);  color: var(--accent);  border: 1px solid rgba(201,168,76,0.3); }
    .badge-forfait    { background: rgba(224,82,82,0.1);    color: var(--danger);  border: 1px solid rgba(224,82,82,0.3); }
    .peso-input { width: 80px; background: var(--input-bg); border: 1px solid var(--border); color: var(--text); padding: 6px 10px; border-radius: 7px; font-family: 'DM Sans', sans-serif; font-size: 13px; outline: none; text-align: center; }
    .peso-input:focus { border-color: var(--accent); }
    .action-btns { display: flex; gap: 5px; flex-wrap: wrap; }
    .btn-sm { padding: 5px 11px; border-radius: 7px; font-size: 12px; font-weight: 500; cursor: pointer; font-family: 'DM Sans', sans-serif; border: none; white-space: nowrap; transition: all 0.15s; }
    .btn-rat { background: rgba(201,168,76,0.15); color: var(--accent); border: 1px solid rgba(201,168,76,0.3); }
    .btn-rat:hover { background: rgba(201,168,76,0.3); }
    .btn-volver { background: rgba(116,176,247,0.1); color: var(--info); border: 1px solid rgba(116,176,247,0.3); }
    .btn-volver:hover { background: rgba(116,176,247,0.2); }
    .btn-fort { background: rgba(224,82,82,0.1); color: var(--danger); border: 1px solid rgba(224,82,82,0.3); }
    .btn-fort:hover { background: rgba(224,82,82,0.2); }
    .btn-malinsc { background: rgba(245,158,11,0.1); color: #f59e0b; border: 1px solid rgba(245,158,11,0.3); }
    .btn-malinsc:hover { background: rgba(245,158,11,0.2); }
    .btn-anular { background: rgba(224,82,82,0.1); color: var(--danger); border: 1px solid rgba(224,82,82,0.3); }
    .btn-anular:hover { background: rgba(224,82,82,0.2); }
    .btn-confirmar { background: rgba(76,175,130,0.15); color: var(--success); border: 1px solid rgba(76,175,130,0.3); }
    .btn-confirmar:hover { background: rgba(76,175,130,0.3); }
    .btn-reabrir { background: rgba(160,160,160,0.15); color: var(--muted); border: 1px solid rgba(160,160,160,0.3); }
    .btn-reabrir:hover { background: rgba(160,160,160,0.3); }
    .badge-confirmada { background: rgba(76,175,130,0.15); color: var(--success); border: 1px solid rgba(76,175,130,0.3); }
    .estado-carrera-actions { display: flex; gap: 6px; align-items: center; margin-left: 12px; }
    .sel-estado-car-inline { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 4px 10px; border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 600; cursor: pointer; outline: none; letter-spacing: 0.5px; }
    .sel-estado-car-inline[data-est=""]           { background: rgba(76,175,130,0.15); color: var(--success); border-color: rgba(76,175,130,0.3); }
    .sel-estado-car-inline[data-est="confirmada"] { background: rgba(201,168,76,0.15); color: var(--accent);  border-color: rgba(201,168,76,0.3); }
    .sel-estado-car-inline[data-est="anulada"]    { background: rgba(160,160,160,0.15); color: var(--muted);  border-color: rgba(160,160,160,0.3); }
    .sel-categoria-inline { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 3px 8px; border-radius: 6px; font-family: 'DM Sans', sans-serif; font-size: 11px; font-weight: 700; cursor: pointer; outline: none; letter-spacing: 0.5px; margin-left: 8px; vertical-align: middle; }
    .sel-categoria-inline[data-cat="OC"]  { background: rgba(37,99,235,0.15);  color: #2563EB; border-color: rgba(37,99,235,0.3); }
    .sel-categoria-inline[data-cat="ONC"] { background: rgba(124,58,237,0.15); color: #7C3AED; border-color: rgba(124,58,237,0.3); }
    .sel-categoria-inline[data-cat="NO"]  { background: rgba(217,119,6,0.15);  color: #D97706; border-color: rgba(217,119,6,0.3); }
    .sel-categoria-inline[data-cat="CC"]  { background: rgba(5,150,105,0.15);  color: #059669; border-color: rgba(5,150,105,0.3); }
    .cat-badge { display: inline-block; margin-left: 10px; padding: 3px 10px; border-radius: 6px; font-size: 12px; font-weight: 600; vertical-align: middle; border: 1px solid; letter-spacing: 0.3px; }
    .cat-badge[data-cat="OC"]  { background: rgba(37,99,235,0.15);  color: #2563EB; border-color: rgba(37,99,235,0.3); }
    .cat-badge[data-cat="ONC"] { background: rgba(124,58,237,0.15); color: #7C3AED; border-color: rgba(124,58,237,0.3); }
    .cat-badge[data-cat="NO"]  { background: rgba(217,119,6,0.15);  color: #D97706; border-color: rgba(217,119,6,0.3); }
    .cat-badge[data-cat="CC"]  { background: rgba(5,150,105,0.15);  color: #059669; border-color: rgba(5,150,105,0.3); }
    .badge-mal_inscrito { background: rgba(245,158,11,0.15); color: #f59e0b; border: 1px solid rgba(245,158,11,0.3); }
    .jockey-select { background: var(--input-bg); border: 1px solid var(--border); color: var(--text); padding: 4px 8px; border-radius: 6px; font-family: 'DM Sans', sans-serif; font-size: 12px; outline: none; width: 100%; max-width: 190px; cursor: pointer; }
    .jockey-select:focus { border-color: var(--accent); }
    .jockey-select.jockey-missing { border-color: var(--danger); color: var(--danger); font-weight: 700; }
    .empty-state { text-align: center; padding: 40px 20px; }
    .empty-state .icon { font-size: 40px; margin-bottom: 12px; }
    .empty-state h3 { font-size: 16px; color: var(--muted); }
    .loading-state { display: flex; align-items: center; justify-content: center; padding: 50px; gap: 12px; color: var(--muted); }
    .spinner { width: 22px; height: 22px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .mini-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 16px; }
    .mini-modal.open { display: flex; }
    .mini-box { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 24px; width: 100%; max-width: 420px; }
    .mini-box h3 { font-size: 17px; color: var(--accent); margin-bottom: 16px; }
    .mini-form { display: flex; flex-direction: column; gap: 12px; }
    .mini-form label { font-size: 12px; color: var(--muted); }
    input { background: var(--input-bg); border: 1px solid var(--border); color: var(--text); padding: 9px 13px; border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 14px; outline: none; width: 100%; transition: border 0.2s; }
    input:focus { border-color: var(--accent); }
    .mini-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
    .btn-primary { background: var(--accent); color: #1a1a0a; border: none; padding: 9px 18px; border-radius: 9px; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; }
    .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 9px 18px; border-radius: 9px; font-family: 'DM Sans', sans-serif; font-size: 13px; cursor: pointer; }
    #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
    .toast { padding: 12px 20px; border-radius: 10px; font-size: 14px; font-weight: 500; max-width: 320px; animation: slideIn 0.3s ease; }
    .toast-success { background: #1a4a30; border: 1px solid var(--success); color: var(--text); }
    .toast-error { background: #4a1a1a; border: 1px solid var(--danger); color: var(--text); }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    /* PRINT — estilo Palermo */

      .pi-sub { font-size: 9pt; font-weight: 700; margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px; }

      .pi-especial { font-weight: 900; letter-spacing: 0.5px; text-transform: uppercase; }

      .pi-h-sfx { font-size: 7pt; font-weight: 400; }
      .pi-nocert { font-size: 8pt; font-weight: 900; margin-left: 3px; flex-shrink: 0; }

    tr.jockey-duplicado td { background: rgba(245,158,11,0.06) !important; }
    .badge-jockey-dup { display: inline-block; margin-left: 4px; font-size: 10px; font-weight: 700; color: #f59e0b; vertical-align: middle; }
    .cierre-status { font-size: 13px; font-weight: 600; margin-left: auto; white-space: nowrap; }
    .cierre-abierta { color: var(--success); }
    .cierre-cerrada { color: var(--danger); }
    .peso-input:disabled { opacity: 0.5; cursor: not-allowed; }
    .input-prog, .input-hora { padding: 4px 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text); font-family: 'DM Sans', sans-serif; font-size: 12px; outline: none; }

    .input-hora { width: 92px; }
    .input-prog:focus, .input-hora:focus { border-color: var(--accent); }
    @media print { .carrera-programa { display: none !important; } }

<body>
<div id="auth-overlay"><div class="spinner" style="width:32px;height:32px;border-width:3px;"></div></div>
<div id="toast-container"></div>

<div class="sticky-header">
<div class="topbar">
  <a href="index.html" class="btn-back">← Inicio</a>
  <h1>Ratificados y forfait</h1>
  <span class="user-name" id="user-name"></span>
  <button class="btn-logout" onclick="logout()">Cerrar sesión</button>
  <button class="btn-outline" onclick="printRatificados()">🖨️ Imprimir PDF</button>
</div>

<div class="selector-bar">
  <label>Reunión:</label>
  <select id="sel-reunion" onchange="loadReunion()">
    <option value="">Cargando…</option>
  </select>
  <span class="cierre-status" id="cierre-status"></span>
</div>

<div class="turno-nav" id="turno-nav"></div>
</div>

<div class="content" id="content">
  <div class="empty-state"><div class="icon">✅</div><h3>Seleccionar una reunión para comenzar la ratificación</h3></div>
</div>

<!-- MINI MODAL FORFAIT / MAL INSCRIPTO (compartido) -->
<div class="mini-modal" id="modal-motivo">
  <div class="mini-box">
    <h3 id="modal-motivo-title">Dar Forfait</h3>

async function printRatificados() {
  const reunionId = document.getElementById('sel-reunion').value;
  if (!reunionId) { toast('Seleccionar una reunión para imprimir', 'error'); return; }
  const reunion = reuniones.find(r => r.id === reunionId);
  const f = reunion?.fecha ? new Date(reunion.fecha + 'T12:00:00') : new Date();
  const DIAS  = ['DOMINGO','LUNES','MARTES','MIÉRCOLES','JUEVES','VIERNES','SÁBADO'];
  const MESES = ['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'];
  const fechaStr = `${DIAS[f.getDay()]} ${f.getDate()} DE ${MESES[f.getMonth()]} DE ${f.getFullYear()}`;
  const hipRaw = (reunion?.hipodromos?.nombre || '').toUpperCase();
  const hipNombre = hipRaw.replace(/^HIP[ÓO]DROMO DE /i, '').trim() || 'SGH';

  const [{ data: carsData }, { data: clubData }] = await Promise.all([
    sb.from('carreras')
      .select('id,numero_turno,numero_carrera_programa,hora_estimada,nombre,bolsa_total,distribucion_premios,distancia_metros,tipo_pista,edad_minima_anos,edad_maxima_anos,condicion_sexo,condicion_handicap,estado,categoria_id,categorias_carrera(nombre,es_oficial,es_computable)')
      .eq('reunion_id', reunionId),
    sb.from('clubs').select('logo_url, localidad').eq('id', CLUB_ID).single(),
  ]);
  const allCars = (carsData || []).sort((a, b) => {
    const aNum = a.numero_carrera_programa != null ? a.numero_carrera_programa : (a.numero_turno + 10000);
    const bNum = b.numero_carrera_programa != null ? b.numero_carrera_programa : (b.numero_turno + 10000);
    return aNum - bNum;
  });
  if (!allCars.length) { toast('No hay turnos en esta reunión', 'error'); return; }

  const { data: inscsData } = await sb.from('inscripciones')
    .select('id, carrera_id, spc_id, numero_partidor, estado, certificado_correr, peso_declarado, peso_final, spcs(nombre, sexo)')
    .in('carrera_id', allCars.map(c => c.id))
    .in('estado', ['inscripto', 'ratificado', 'mal_inscrito', 'forfait']);
  const inscs = inscsData || [];

  const inscsByCarrera = new Map();
  allCars.forEach(car => {
    inscsByCarrera.set(car.id, inscs
      .filter(i => i.carrera_id === car.id)
      .sort((a, b) => {
        const pa = a.numero_partidor, pb = b.numero_partidor;
        if (pa != null && pb != null) return pa - pb;
        if (pa != null) return -1;
        if (pb != null) return 1;
        return (a.spcs?.nombre || '').localeCompare(b.spcs?.nombre || '', 'es');
      }));
  });

  // Mismo criterio que printInscriptos en inscripciones.html (fix f1afd9b):
  // el texto de condición se imprime completo, sin abreviar ni truncar.
  const SEXO_TXT = { machos: 'Cab', hembras: 'Yeg', machos_castrados: 'Cas', ambos: 'Todo caballo' };
  // El texto libre suele abrir nombrando el sexo, y puede no coincidir con
  // condicion_sexo (R8 T12 es 'ambos' pero dice "Yeguas..."). Si ya lo trae,
  // no se antepone el prefijo derivado.
  const SEXO_EN_TEXTO_RE = /^(todos?\s+(los\s+)?caballos?|caballos?|yeguas?|castrados?|machos?|hembras?|potr[oa]s?|productos?)\b/i;

  function buildCond(car) {
    const sexoTxt = SEXO_TXT[car.condicion_sexo] || '';
    let hc = (car.condicion_handicap || '').trim().replace(/\s*\.\s*$/, '');

    // "Especial" se saca al frente como etiqueta; el resto queda como condición
    let especial = false;
    const mEsp = hc.match(/^especial(?:es)?\s*[:,-]?\s*/i);
    if (mEsp) { especial = true; hc = hc.slice(mEsp[0].length).trim(); }

    const parts = [];
    if (sexoTxt && !(hc && SEXO_EN_TEXTO_RE.test(hc))) parts.push(sexoTxt);
    // Edad estructurada: sólo si el texto libre no la trae ya. En R8
    // edad_minima_anos/edad_maxima_anos están todas en NULL, así que la edad
    // sale del texto libre — por eso no se puede stripear.
    const emin = car.edad_minima_anos, emax = car.edad_maxima_anos;
    if (!/\d\s*(a\b|años?\b)/i.test(hc)) {
      if (emin && emax) parts.push(emin === emax ? `${emin} años` : `${emin} - ${emax} años`);
      else if (emin) parts.push(`${emin} años y más`);
    }
    if (hc) parts.push(hc); // texto completo: sin abreviar ni truncar

    const distancia = car.distancia_metros ? `${car.distancia_metros} mts` : '';
    let texto = parts.join(' ');
    if (distancia) texto += (texto ? ' ' : '') + distancia;
    return { texto, cond: parts.join(' '), distancia, especial };
  }

  function formatBolsa(num) {
    if (!num) return '';
    const n = Math.round(parseFloat(num));
    return '$' + String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.') + '.-';
  }

  function renderBloqueCarrera(car, items, isAnulada, forfaits = []) {
    if (!items.length && !forfaits.length) return '';
    const chapaMap = renumerarChapas(items);
    const esMixta = car.condicion_sexo === 'ambos';
    const { total: bolsaNominal } = repartoDisplay(car.bolsa_total, car.distribucion_premios);
    const bolsaStr = formatBolsa(bolsaNominal);
    const { texto: condStr, especial } = buildCond(car);
    const especialHtml = especial ? '<span class="pi-especial">ESPECIAL</span> ' : '';
    const esCesped = (car.tipo_pista || '').toLowerCase() === 'cesped';
    const numCarrera = car.numero_carrera_programa != null ? car.numero_carrera_programa : car.numero_turno;
    const horaHHMM = (car.hora_estimada || '').slice(0, 5);
    const condContent = (condStr || especial || esCesped)
      ? `${especialHtml}${condStr || ''}${esCesped ? `${condStr ? ' · ' : ''}<span class="pi-cesped-inline">CESPED</span>` : ''}`
      : '';
    const listaHtml = items.map(i => {
      const nombre = (i.spcs?.nombre || '—').toUpperCase();
      const esH = esMixta && (i.spcs?.sexo || '').toLowerCase() === 'hembra';
      const noCert = !i.certificado_correr;
      const prefix = isAnulada ? '• ' : '';
      const pesoVal = i.peso_final || i.peso_declarado;
      const pesoHtml = pesoVal ? `<span class="pi-peso">${parseFloat(pesoVal)}</span>` : '';
      const chapa = chapaMap[i.id];
      const chapaHtml = chapa ? `<span class="pi-chapa">${chapa}</span>` : '';
      return `<div class="pi-row">${chapaHtml}<span class="pi-spc-name">${prefix}${nombre}${esH ? '<span class="pi-h-sfx"> (H)</span>' : ''}</span>${noCert ? '<span class="pi-nocert">●</span>' : ''}${pesoHtml}</div>`;
    }).join('');
    const cat = car.categorias_carrera;
    const oficialLabel = cat
      ? (cat.es_oficial
          ? (cat.es_computable ? 'OFICIAL COMPUTABLE' : 'OFICIAL NO COMPUTABLE')
          : (cat.nombre || '').toUpperCase())
      : '';
    const tituloHtml = isAnulada
      ? ''
      : `<div class="pi-titulo">
          <div class="pi-titulo-row"><span>Carrera ${numCarrera}</span>${horaHHMM ? `<span>${horaHHMM}</span>` : ''}</div>
          ${bolsaStr ? `<div class="pi-titulo-bolsa">Bolsa : ${bolsaStr}</div>` : ''}
          ${condContent ? `<div class="pi-titulo-cond">${condContent}</div>` : ''}
          ${oficialLabel ? `<div class="pi-titulo-oficial">${oficialLabel}</div>` : ''}
        </div>`;
    const condHtml = isAnulada && condContent
      ? `<div class="pi-condiciones">${condContent}</div>`
      : '';
    const bandaHtml = isAnulada ? '<div class="pi-banda-anulada">Anulada</div>' : '';
    const footHtml = isAnulada
      ? ''
      : `<div class="pi-car-foot">${items.length}</div>`;
    // Borrados = forfaits + mal inscriptos. Antes sólo se listaban los forfaits
    // y los mal_inscrito desaparecían del PDF; ahora figuran en la misma
    // sección, cada uno con su etiqueta.
    const BORRADO_TAG = { forfait: 'FORFAIT', mal_inscrito: 'MAL INSCRIPTO' };
    const forfaitsHtml = (forfaits.length)
      ? `<div class="pi-forfaits"><div class="pi-forfaits-h">BORRADOS</div>${forfaits.map(i => {
          const nombre = (i.spcs?.nombre || '—').toUpperCase();
          const tag = BORRADO_TAG[i.estado] || (i.estado || '').toUpperCase().replace(/_/g, ' ');
          return `<div class="pi-forfait-row">${nombre}<span class="pi-borrado-tag">${tag}</span></div>`;
        }).join('')}</div>`
      : '';
    return `<div class="pi-wrapper">
      <div class="pi-bloque">
        <div class="pi-car-head">${tituloHtml}${condHtml}</div>
        ${bandaHtml}
        <div class="pi-lista">${listaHtml}</div>
        ${footHtml}
        ${forfaitsHtml}
      </div>
    </div>`;
  }

  let totalRatificados = 0;
  const bloquesHtml = allCars.map(car => {
    const inscsCar = inscsByCarrera.get(car.id) || [];
    const esAnulada = car.estado === 'anulada' || car.estado === 'reabierta';
    const ratificados = inscsCar.filter(i => i.estado === 'ratificado');
    // Borrados: forfait + mal_inscrito. El select ya los traía a ambos, pero
    // el render sólo usaba los forfait — los mal inscriptos no salían en el PDF.
    const ORDEN_BORRADO = { forfait: 0, mal_inscrito: 1 };
    const forfaits    = inscsCar
      .filter(i => i.estado === 'forfait' || i.estado === 'mal_inscrito')
      .sort((a, b) => (ORDEN_BORRADO[a.estado] - ORDEN_BORRADO[b.estado])
        || (a.spcs?.nombre || '').localeCompare(b.spcs?.nombre || '', 'es'));
    if (esAnulada) {
      const anotados = inscsCar.filter(i => i.estado === 'ratificado' || i.estado === 'inscripto');
      if (!anotados.length && !forfaits.length) return '';
      return renderBloqueCarrera(car, anotados, true, forfaits);
    }
    if (!ratificados.length && !forfaits.length) return '';
    totalRatificados += ratificados.length;
    return renderBloqueCarrera(car, ratificados, false, forfaits);
  }).join('');

  const logoHtml = clubData?.logo_url
    ? `<img src="${clubData.logo_url}" class="pi-footer-logo" alt="">` : '';

  const _origTitle = document.title;
  document.title = ' ';
  window.addEventListener('afterprint', () => { document.title = _origTitle; }, { once: true });
  document.getElementById('print-only').innerHTML = `
    <div class="pi-header">
      <div class="pi-title">RATIFICADOS</div>
      <div class="pi-sub">HIPÓDROMO DE ${hipNombre} — REUNIÓN N° ${reunion?.numero || '—'} DEL DÍA ${fechaStr}</div>
    </div>
    <div class="pi-cols">${bloquesHtml}</div>
    ${reunion?.observaciones ? `<div class="pi-observaciones">${(reunion.observaciones+'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>` : ''}
    <div class="pi-footer">
      <div class="pi-footer-left">
        <span><strong>H</strong> = Hembra (en carrera mixta)</span>
        <span><strong>●</strong> = Falta certificado para correr</span>
        <span style="font-weight:900;margin-top:2px;">TOTAL DE RATIFICADOS: ${totalRatificados} SPC</span>
      </div>
      <div class="pi-footer-right">
        ${logoHtml}
        <span>${fechaStr}</span>
      </div>
    </div>`;

  window.print();
}

async function updateNumeroCarreraPrograma(carreraId, value) {
  const numero = value !== '' ? parseInt(value, 10) : null;
  if (value !== '' && (isNaN(numero) || numero < 1)) {
    toast('Número de carrera inválido', 'error');
    return;
  }
  const { error } = await sb.from('carreras').update({ numero_carrera_programa: numero }).eq('id', carreraId);
  if (error) { toast('Error guardando N° carrera: ' + error.message, 'error'); return; }
  toast(numero ? `N° carrera ${numero} guardado` : 'N° carrera limpiado', 'success');
}

async function updateHoraEstimada(carreraId, value) {
  const hora = value || null;
  const { error } = await sb.from('carreras').update({ hora_estimada: hora }).eq('id', carreraId);
  if (error) { toast('Error guardando hora: ' + error.message, 'error'); return; }
  toast(hora ? `Hora ${hora} guardada` : 'Hora limpiada', 'success');
}

async function updatePeso(inscId, value) {
  const raw = (value || '').trim().replace(',', '.');
  let peso = null;
  if (raw !== '') {
    peso = parseFloat(raw);
    if (isNaN(peso) || peso <= 0) { toast('Peso inválido', 'error'); return; }
  }
  const { error } = await sb.from('inscripciones').update({ peso_declarado: peso }).eq('id', inscId);
  if (error) { toast('Error guardando peso: ' + error.message, 'error'); return; }
  toast(peso !== null ? `Peso ${peso} kg guardado` : 'Peso limpiado', 'success');
}


async function init() {
  const [{ data: reuns }, { data: profs }, { data: sprcs }, { data: cabs }, { data: cats }] = await Promise.all([
    sb.from('reuniones').select('id,numero,fecha,estado,hora_cierre_ratificacion,observaciones,hipodromos(nombre)').eq('club_id', CLUB_ID).order('fecha', {ascending:false}),
    sb.from('profesionales').select('id,nombre,apellido,tipo').eq('club_id', CLUB_ID).eq('activo', true).order('apellido'),
    sb.from('spcs').select('id,nombre').order('nombre'),
    sb.from('caballerizas').select('id,nombre').eq('club_id', CLUB_ID).eq('activo', true).order('nombre'),
    sb.from('categorias_carrera').select('id,nombre,codigo,es_oficial,es_computable').eq('club_id', CLUB_ID).eq('activo', true).order('orden_display'),
  ]);
  reuniones = reuns||[];
  profesionales = profs||[];
  spcs = sprcs||[];
  caballerizas = cabs||[];
  categoriasCarrera = cats||[];

  const sel = document.getElementById('sel-reunion');
  sel.innerHTML = '<option value="">— Seleccionar —</option>' + reuniones.map(r=>`<option value="${r.id}">Reunión ${r.numero||''} — ${new Date(r.fecha+'T12:00:00').toLocaleDateString('es-AR')} — ${r.hipodromos?.nombre||''}</option>`).join('');

  const rid = ActiveReunion.resolve(reuniones);
  if (rid) {
    sel.value = rid;
    try { history.replaceState(null, '', `?reunion_id=${rid}`); } catch(_) {}

async function congelarPesos(inscripciones) {
  const pendientes = inscripciones.filter(i => i.estado==='ratificado' && i.peso_final===null && i.peso_declarado!==null);
  if (!pendientes.length) return;
  await Promise.all(pendientes.map(i =>
    sb.from('inscripciones').update({ peso_final: i.peso_declarado }).eq('id', i.id)
  ));
  pendientes.forEach(i => {
    const input = document.getElementById(`peso-${i.id}`);
    if (input) input.value = i.peso_declarado;
  });
}

function calcCierreStatus(reunion) {
  if (!reunion?.fecha) return false;
  const hoy = new Date();
  const [anio, mes, dia] = reunion.fecha.split('-').map(Number);
  const hoyY = hoy.getFullYear(), hoyM = hoy.getMonth()+1, hoyD = hoy.getDate();
  if (anio > hoyY || (anio===hoyY && mes > hoyM) || (anio===hoyY && mes===hoyM && dia > hoyD)) return false;
  if (anio < hoyY || (anio===hoyY && mes < hoyM) || (anio===hoyY && mes===hoyM && dia < hoyD)) return true;
  const [hh, mm] = (reunion.hora_cierre_ratificacion || '12:00:00').split(':').map(Number);
  return hoy.getHours() * 60 + hoy.getMinutes() >= hh * 60 + mm;
}

function renderCierreStatus(reunion) {
  const el = document.getElementById('cierre-status');
  if (!el) return;
  if (!reunion) { el.textContent = ''; return; }
  const hora = (reunion.hora_cierre_ratificacion || '12:00:00').slice(0, 5);
  el.innerHTML = isCerrada
    ? `<span class="cierre-cerrada">Cierre ${hora} hs — CERRADA</span>`
    : `<span class="cierre-abierta">Cierre ${hora} hs — ABIERTA</span>`;
}

async function loadReunion() {
  const rid = document.getElementById('sel-reunion').value;
  if (rid) { ActiveReunion.set(rid); }
  if (!rid) {
    document.getElementById('content').innerHTML='<div class="empty-state"><div class="icon">✅</div><h3>Seleccionar una reunión</h3></div>';
    document.getElementById('turno-nav').classList.remove('visible');
    document.getElementById('cierre-status').textContent='';
    isCerrada=false; currentReunion=null;
    return;
  }
  document.getElementById('content').innerHTML='<div class="loading-state"><div class="spinner"></div> Cargando datos de ratificación…</div>';
  currentReunion = reuniones.find(r => r.id === rid) || null;
  isCerrada = calcCierreStatus(currentReunion);
  renderCierreStatus(currentReunion);
  const { data: carIds } = await sb.from('carreras').select('id').eq('reunion_id', rid);
  const ids = (carIds||[]).map(c=>c.id);
  const [{ data: cars }, inscResult] = await Promise.all([
    sb.from('carreras').select('*').eq('reunion_id', rid).order('numero_turno'),
    ids.length ? sb.from('inscripciones').select('*').in('carrera_id', ids).order('created_at') : Promise.resolve({data:[]}),
  ]);
  const inscData = inscResult.data||[];
  renderAll(cars||[], inscData);
  if (isCerrada) await congelarPesos(inscData);
}

function getSpc(id) { return spcs.find(s=>s.id===id); }
function getProf(id) { return profesionales.find(p=>p.id===id); }
function getCab(id) { return caballerizas.find(c=>c.id===id); }

function renderAll(carreras, inscripciones) {
  if (!carreras.length) {
    document.getElementById('content').innerHTML='<div class="empty-state"><div class="icon">📋</div><h3>Esta reunión no tiene carreras</h3></div>';
    document.getElementById('turno-nav').classList.remove('visible');
    return;
  }
  const html = carreras.map((car, idx) => {
    const insc = inscripciones.filter(i=>i.carrera_id===car.id)
      .sort((a,b) => {
        const pa = a.numero_partidor, pb = b.numero_partidor;
        if (pa != null && pb != null) return pa - pb;
        if (pa != null) return -1;
        if (pb != null) return 1;
        return (getSpc(a.spc_id)?.nombre||'').localeCompare(getSpc(b.spc_id)?.nombre||'', 'es');
      });
    const rat = insc.filter(i=>i.estado==='ratificado').length;
    const fort = insc.filter(i=>i.estado==='forfait').length;
    const pre = insc.filter(i=>i.estado==='inscripto').length;
    const mal = insc.filter(i=>i.estado==='mal_inscrito').length;
    const activos = rat + pre;
    const carCerrada = isCerrada || car.estado === 'confirmada' || car.estado === 'anulada';
    const jockeyCount = {};
    insc.forEach(i => { if (i.jockey_titular_id) jockeyCount[i.jockey_titular_id] = (jockeyCount[i.jockey_titular_id]||0)+1; });
    const chapaMap = renumerarChapas(insc);
    const rows = insc.map((i, idx) => {
      const spc = getSpc(i.spc_id);
      const cab = getCab(i.caballeriza_id);
      const isRat = i.estado==='ratificado';
      const isForf = i.estado==='forfait';
      const isMalInsc = i.estado==='mal_inscrito';
      const hasColision = !carCerrada && !!i.jockey_titular_id && jockeyCount[i.jockey_titular_id] >= 2;
      const dc = `disabled title="${car.estado === 'confirmada' ? 'Carrera cerrada' : car.estado === 'anulada' ? 'Carrera anulada' : 'Ratificación cerrada'}" style="opacity:0.4;cursor:not-allowed;"`;
      return `<tr id="row-${i.id}" data-carrera="${car.id}" data-jockey="${i.jockey_titular_id||''}" data-caballeriza="${i.caballeriza_id||''}" class="${isRat?'':'no-ratificado'}${hasColision?' jockey-duplicado':''}">
        <td class="num-part print-hide">${chapaMap[i.id] || ''}</td>
        <td><div class="spc-name">${spc?.nombre||i.spc_id}</div></td>
        <td style="font-size:12px;color:var(--muted)">${cab?.nombre||'—'}</td>
        <td class="jockey-cell">${buildJockeySelect(i, carCerrada)}${hasColision?'<span class="badge-jockey-dup">⚠ dup.</span>':''}</td>
        <td class="col-peso-display">${i.peso_final?`<strong>${i.peso_final} kg</strong>`:i.peso_declarado?`${i.peso_declarado} kg`:'—'}</td>
        <td><input class="peso-input print-hide" type="number" id="peso-${i.id}" value="${i.peso_final||i.peso_declarado||''}" min="40" max="80" step="0.1" placeholder="kg" onblur="updatePeso('${i.id}', this.value)"${carCerrada?' disabled':''}></td>
        <td><span class="badge badge-${i.estado}" id="badge-${i.id}">${i.estado?.replace('_',' ')||'—'}</span></td>
        <td class="action-btns print-hide">
          ${!isRat&&!isForf&&!isMalInsc?(
            carCerrada
              ?`<button class="btn-sm btn-rat" ${dc}>✅ Ratificar</button>`
              :`<button class="btn-sm btn-rat" onclick="ratificar('${i.id}')">✅ Ratificar</button>`)
          :''}
          ${isRat||isMalInsc?`<button class="btn-sm btn-volver" ${carCerrada?dc:`onclick="volverInscripto('${i.id}')"`}>↩ Volver</button>`:''}
          ${!isForf&&!isMalInsc?`<button class="btn-sm btn-fort" ${carCerrada?dc:`onclick="openForfait('${i.id}')"`}>❌ Forfait</button>`:''}
          ${!isRat&&!isForf&&!isMalInsc?`<button class="btn-sm btn-malinsc" ${carCerrada?dc:`onclick="openMalInscrito('${i.id}')"`}>⚠ Mal inscripto</button>`:''}
        </td>
      </tr>`;
    }).join('');
    return `<div class="carrera-section open" id="csec-${car.id}">
      <div class="carrera-header" onclick="toggleSection('${car.id}')">
        <div class="carrera-num">${car.numero_turno}</div>
        <div class="carrera-title">Turno ${car.numero_turno} — ${buildCondCompleta(car)}${renderCategoriaBadge(car)}</div>
        <div class="insc-counter" id="counter-${car.id}">${buildCounterHtml(insc.length, rat, pre, fort, mal)}</div>
        <div class="estado-carrera-actions" onclick="event.stopPropagation()">${renderEstadoCarreraActions(car)}</div>
        <span class="expand-icon">▼</span>
      </div>
      <table class="inscr-table">
        <thead><tr>
          <th class="print-hide" style="width:38px">#</th>
          <th>SPC</th>
          <th>Caballeriza</th>
          <th>Jockey</th>
          <th class="col-peso-display">Peso (impreso)</th>
          <th class="print-hide" style="width:90px">Peso</th>
          <th>Estado</th>
          <th class="print-hide">Acciones</th>
        </tr></thead>
        <tbody>${rows||`<tr><td colspan="8" style="text-align:center;padding:20px;color:var(--muted)">Sin inscriptos</td></tr>`}</tbody>
      </table>
    </div>`;
  }).join('');
  document.getElementById('content').innerHTML = html;
  const nav = document.getElementById('turno-nav');
  nav.innerHTML = '<div class="nav-labels"><span>Turno:</span><span>N° carrera:</span><span>Hora:</span></div>' +
    carreras.map((car, idx) =>
      `<div class="turno-col">
        <button class="btn-turno${idx===0?' active':''}" onclick="goToTurno('${car.id}',this)">${car.numero_turno}</button>
        <input type="number" min="1" max="99" value="${car.numero_carrera_programa||''}" class="input-prog" onblur="updateNumeroCarreraPrograma('${car.id}', this.value)"${isCerrada?' disabled':''}>
        <input type="time" value="${car.hora_estimada||''}" class="input-hora" onblur="updateHoraEstimada('${car.id}', this.value)"${isCerrada?' disabled':''}>
      </div>`
    ).join('');
  nav.classList.add('visible');
  if (carreras.length > 0) currentCarreraId = carreras[0].id;
}

function goToTurno(carreraId, btnEl) {
  document.querySelectorAll('.btn-turno').forEach(b => b.classList.remove('active'));
  if (btnEl) btnEl.classList.add('active');
  currentCarreraId = carreraId;
  const target = document.getElementById(`csec-${carreraId}`);
  if (!target) return;
  const stickyHeader = document.querySelector('.sticky-header');
  const headerHeight = stickyHeader ? stickyHeader.offsetHeight : 0;
  const targetTop = target.getBoundingClientRect().top + window.scrollY;
  window.scrollTo({ top: targetTop - headerHeight - 12, behavior: 'smooth' });
}

function toggleSection(id) {
  document.getElementById(`csec-${id}`).classList.toggle('open');
}

function buildCondAbr(car) {
  const sexoMap = { machos: 'Cab', hembras: 'Yeg', machos_castrados: 'Cas', ambos: 'Todo caballo' };
  const sexoAbr = sexoMap[car.condicion_sexo] || '';
  const usaEspacios = sexoAbr.includes(' ');
  const sep = usaEspacios ? ' ' : '.';
  const parts = [];
  if (sexoAbr) parts.push(sexoAbr);
  const emin = car.edad_minima_anos, emax = car.edad_maxima_anos;
  if (emin && emax) {
    parts.push(emin === emax
      ? (usaEspacios ? `${emin} a` : `${emin}a`)
      : (usaEspacios ? `${emin} - ${emax} a` : `${emin}-${emax}a`));
  } else if (emin) {
    parts.push(`${emin} y más a`);
  }
  let hc = (car.condicion_handicap || '').trim();
  if (usaEspacios && hc) {
    hc = hc.replace(/^todo\s+caballo\s+(de\s+)?/i, '').trim();
    hc = hc.replace(/^\d+\s*(a|años?)\s*(y\s*\d+\s*(a|años?)?)?\s*/i, '').trim();
  }
  if (hc) {
    const hcLow = hc.toLowerCase();
    const condAbr = /\bperdedor(es)?\b/.test(hcLow) ? 'perd'
      : /\bganadores? de 1 carrera\b/.test(hcLow) ? 'g.1c'
      : /\bganadores? de 2 carreras\b/.test(hcLow) ? 'g.2c'
      : hc.length > 18 ? hc.slice(0, 18) + '…' : hc;
    parts.push(condAbr);
  }
  let result = parts.join(sep);
  if (car.distancia_metros) result += (result ? ' ' : '') + `${car.distancia_metros} mts`;
  return result;
}

function buildCondCompleta(car) {
  const hc = (car.condicion_handicap || '').trim();
  if (hc) {
    return car.distancia_metros ? `${hc} ${car.distancia_metros} mts` : hc;
  }
  return buildCondAbr(car) || (car.distancia_metros ? `${car.distancia_metros} m` : '');
}

function renderCategoriaBadge(car) {
  const cat = categoriasCarrera.find(c => c.id === car.categoria_id);
  if (!cat) return '';
  return `<span class="cat-badge" data-cat="${cat.codigo}">${cat.nombre}</span>`;
}

function renderCategoriaSelect(car) {
  const cat = categoriasCarrera.find(c => c.id === car.categoria_id);
  const codigoActual = cat?.codigo || '';
  const opts = categoriasCarrera.map(c =>
    `<option value="${c.id}"${car.categoria_id === c.id ? ' selected' : ''}>${c.codigo} — ${c.nombre}</option>`
  ).join('');
  return `<select class="sel-categoria-inline" data-cat="${codigoActual}" onclick="event.stopPropagation()" onchange="updateCategoria('${car.id}', this.value)" title="Categoría de carrera">
    <option value=""${!car.categoria_id ? ' selected' : ''}>— CAT —</option>
    ${opts}
  </select>`;
}

async function updateCategoria(carreraId, categoriaId) {
  const valor = categoriaId === '' ? null : categoriaId;
  const { error } = await sb.from('carreras').update({ categoria_id: valor }).eq('id', carreraId);
  if (error) { toast('Error: ' + error.message, 'error'); return; }
  const cat = categoriasCarrera.find(c => c.id === valor);
  toast(cat ? `Categoría: ${cat.nombre}` : 'Categoría removida', 'success');
  await loadReunion();
}

function renderEstadoCarreraActions(car) {
  const est = (car.estado === 'confirmada' || car.estado === 'anulada') ? car.estado : '';
  return `<select class="sel-estado-car-inline" data-est="${est}" onclick="event.stopPropagation()" onchange="updateEstadoCarrera('${car.id}', this.value)">
    <option value=""${est === '' ? ' selected' : ''}>ABIERTA</option>
    <option value="confirmada"${est === 'confirmada' ? ' selected' : ''}>CERRADA</option>
    <option value="anulada"${est === 'anulada' ? ' selected' : ''}>ANULADA</option>
  </select>`;
}

async function updateEstadoCarrera(carreraId, nuevoEstado) {
  const valor = nuevoEstado === '' ? null : nuevoEstado;
  const { error } = await sb.from('carreras').update({ estado: valor }).eq('id', carreraId);
  if (error) { toast('Error: ' + error.message, 'error'); return; }
  const label = valor === 'confirmada' ? 'cerrada' : (valor === 'anulada' ? 'anulada' : 'abierta');
  toast(`Carrera ${label}`, 'success');
  await loadReunion();
}

function buildCounterHtml(total, rat, pre, fort, mal) {
  const subs = [];
  if (rat > 0) subs.push(`${rat} ratificados`);
  if (pre > 0) subs.push(`${pre} inscriptos`);
  if (fort > 0) subs.push(`${fort} forfait`);
  if (mal > 0) subs.push(`${mal} mal inscritos`);
  const subText = subs.length ? ` · ${subs.join(' · ')}` : '';
  return `${total} caballos<span class="insc-counter-sub">${subText}</span>`;
}

function updateCounter(inscId) {
  const carreraId = document.getElementById(`row-${inscId}`)?.dataset.carrera;
  if (!carreraId) return;
  let total = 0, rat = 0, pre = 0, fort = 0, mal = 0;
  document.querySelectorAll(`#csec-${carreraId} tbody .badge`).forEach(b => {
    total++;
    if (b.classList.contains('badge-ratificado')) rat++;
    else if (b.classList.contains('badge-inscripto')) pre++;
    else if (b.classList.contains('badge-forfait')) fort++;
    else if (b.classList.contains('badge-mal_inscrito')) mal++;
  });
  const counter = document.getElementById(`counter-${carreraId}`);
  if (counter) counter.innerHTML = buildCounterHtml(total, rat, pre, fort, mal);
}

function recalcJockeyColisiones(carreraId) {
  const sec = document.getElementById(`csec-${carreraId}`);
  if (!sec) return;
  const conteo = {};
  sec.querySelectorAll('.jockey-select').forEach(sel => {
    if (sel.value) conteo[sel.value] = (conteo[sel.value]||0)+1;
  });
  sec.querySelectorAll('.jockey-select').forEach(sel => {
    const row = sel.closest('tr');
    const cell = sel.closest('.jockey-cell');
    if (!row || !cell) return;
    const hasColision = !!sel.value && conteo[sel.value] >= 2;
    row.classList.toggle('jockey-duplicado', hasColision);
    let badge = cell.querySelector('.badge-jockey-dup');
    if (hasColision && !badge) {
      badge = document.createElement('span');
      badge.className = 'badge-jockey-dup';
      badge.textContent = '⚠ dup.';
      cell.appendChild(badge);
    } else if (!hasColision && badge) {
      badge.remove();
    }
  });
}

function buildJockeySelect(i, carCerrada) {
  const jockeys = profesionales.filter(p => p.tipo === 'jockey' || p.tipo === 'ambos');
  const supl = i.jockey_suplente_id ? profesionales.find(p => p.id === i.jockey_suplente_id) : null;
  let opts = '';
  if (supl) {
    const sel = i.jockey_titular_id === supl.id ? ' selected' : '';
    opts += `<option value="${supl.id}"${sel}>${supl.apellido}, ${supl.nombre} (suplente)</option>`;
  }
  jockeys.filter(p => !supl || p.id !== supl.id).forEach(p => {
    const sel = i.jockey_titular_id === p.id ? ' selected' : '';
    opts += `<option value="${p.id}"${sel}>${p.apellido}, ${p.nombre}</option>`;
  });
  const selVacio = !i.jockey_titular_id ? ' selected' : '';
  opts += `<option value=""${selVacio}>XX — Sin asignar</option>`;
  const missing = !i.jockey_titular_id;
  return `<select class="jockey-select${missing?' jockey-missing':''}" data-insc="${i.id}"${carCerrada?' disabled':' onchange="onJockeyChange(this)"'}>${opts}</select>`;
}

async function onJockeyChange(sel) {
  const inscId = sel.dataset.insc;
  const jockeyId = sel.value || null;
  const { error } = await sb.from('inscripciones').update({ jockey_titular_id: jockeyId }).eq('id', inscId);
  if (error) { toast(error.message, 'error'); return; }
  if (jockeyId) {
    const prof = profesionales.find(p => p.id === jockeyId);
    toast(`Jockey asignado: ${prof ? prof.apellido + ', ' + prof.nombre : ''}`);
  } else {
    toast('Jockey removido');
  }
  sel.classList.toggle('jockey-missing', !jockeyId);
  const carreraId = document.getElementById(`row-${inscId}`)?.dataset.carrera;
  if (carreraId) recalcJockeyColisiones(carreraId);
  const row = document.getElementById(`row-${inscId}`);
  if (row) {
    row.dataset.jockey = jockeyId || '';
    const badge = row.querySelector('.badge');
    const isRat = badge?.classList.contains('badge-ratificado');
    const isForf = badge?.classList.contains('badge-forfait');
    const isMalInsc = badge?.classList.contains('badge-mal_inscrito');
    if (!isRat && !isForf && !isMalInsc) {
      const btnRat = row.querySelector('.btn-rat');
      if (btnRat) {
        if (jockeyId) {
          btnRat.disabled = false;
          btnRat.removeAttribute('title');
          btnRat.style.opacity = '';
          btnRat.style.cursor = '';
          btnRat.onclick = () => ratificar(inscId);
        } else {
          btnRat.disabled = true;
          btnRat.title = 'Sin jockey asignado — asignarlo primero en Inscripciones';
          btnRat.style.opacity = '0.4';
          btnRat.style.cursor = 'not-allowed';
          btnRat.onclick = null;
        }
      }
    }
  }
}

async function ratificar(inscId) {
  const row = document.getElementById(`row-${inscId}`);
  const pesoEl = document.getElementById(`peso-${inscId}`);
  const peso = parseFloat(pesoEl?.value) || null;
  const { error } = await sb.from('inscripciones').update({ estado:'ratificado', peso_final: peso }).eq('id', inscId);
  if (error) { toast(error.message,'error'); return; }
  toast('Ratificado ✅');
  const badge = document.getElementById(`badge-${inscId}`);
  if (badge) { badge.className='badge badge-ratificado'; badge.textContent='ratificado'; }
  if (row) {
    row.classList.remove('no-ratificado');
    const btnRat = row.querySelector('.btn-rat');
    if (btnRat) btnRat.remove();
    const actionCell = row.querySelector('.action-btns');
    if (actionCell && !actionCell.querySelector('.btn-volver')) {
      const volverBtn = document.createElement('button');
      volverBtn.className='btn-sm btn-volver';
      volverBtn.onclick=()=>volverInscripto(inscId);
      volverBtn.textContent='↩ Volver';
      actionCell.prepend(volverBtn);
    }
  }
  updateCounter(inscId);
}

async function volverInscripto(inscId) {
  if (!confirm('¿Volver el estado a Inscripto? Use solo si hubo un error.')) return;
  const { error } = await sb.from('inscripciones').update({ estado:'inscripto', peso_final: null }).eq('id', inscId);
  if (error) { toast(error.message,'error'); return; }
  toast('Vuelto a inscripto');
  const badge = document.getElementById(`badge-${inscId}`);
  if (badge) { badge.className='badge badge-inscripto'; badge.textContent='inscripto'; }
  const row = document.getElementById(`row-${inscId}`);
  if (row) {
    row.classList.add('no-ratificado');
    const actionCell = row.querySelector('.action-btns');
    if (actionCell) {
      const tieneJockey = !!row.dataset.jockey;
      const btnRat = tieneJockey
        ? `<button class="btn-sm btn-rat" onclick="ratificar('${inscId}')">✅ Ratificar</button>`
        : `<button class="btn-sm btn-rat" disabled title="Sin jockey asignado — asignarlo primero en Inscripciones" style="opacity:0.4;cursor:not-allowed;">✅ Ratificar</button>`;
      actionCell.innerHTML = `${btnRat}<button class="btn-sm btn-fort" onclick="openForfait('${inscId}')">❌ Forfait</button><button class="btn-sm btn-malinsc" onclick="openMalInscrito('${inscId}')">⚠ Mal inscripto</button>`;
    }
  }
  updateCounter(inscId);
}

function openForfait(inscId) {
  pendingInscId = inscId;
  pendingAction = 'forfait';
  document.getElementById('modal-motivo-title').textContent = 'Dar Forfait';
  document.getElementById('motivo-input').value = '';
  document.getElementById('motivo-input').placeholder = 'Motivo (opcional) — ej: lesión, decisión del propietario…';
  document.getElementById('modal-motivo').classList.add('open');
}

function openMalInscrito(inscId) {
  pendingInscId = inscId;
  pendingAction = 'mal_inscrito';
  document.getElementById('modal-motivo-title').textContent = 'Mal inscripto';
  document.getElementById('motivo-input').value = '';
  document.getElementById('motivo-input').placeholder = 'Motivo (condición incumplida, error de carga…)';
  document.getElementById('modal-motivo').classList.add('open');
}

async function confirmMotivo() {
  const motivo = document.getElementById('motivo-input').value.trim();
  if (pendingAction === 'mal_inscrito' && !motivo) { toast('Ingresar motivo','error'); return; }
  const nuevoEstado = pendingAction;
  const { error } = await sb.from('inscripciones').update({ estado: nuevoEstado, motivo_estado: motivo }).eq('id', pendingInscId);
  if (error) { toast(error.message,'error'); return; }
  toast(nuevoEstado === 'forfait' ? 'Forfait registrado' : 'Mal inscripto registrado');
  const badge = document.getElementById(`badge-${pendingInscId}`);
  if (badge) { badge.className=`badge badge-${nuevoEstado}`; badge.textContent=nuevoEstado.replace('_',' '); }
  const savedId = pendingInscId;
  const row = document.getElementById(`row-${savedId}`);
  if (row) {
    row.classList.add('no-ratificado');
    const actionCell = row.querySelector('.action-btns');
    if (actionCell) {
      actionCell.innerHTML = nuevoEstado === 'forfait'
        ? ''
        : `<button class="btn-sm btn-volver" onclick="volverInscripto('${savedId}')">↩ Volver</button>`;
    }
  }
  updateCounter(savedId);
  closeMini('modal-motivo');
}

document.getElementById('modal-motivo').addEventListener('click', e=>{ if(e.target===e.currentTarget) closeMini('modal-motivo'); });
(async()=>{if(await initAuth())init();})();
</script>
<div id="print-only"></div>
<script src="club-switcher.js"></script>
</body>
