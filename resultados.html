<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="logo32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="logo180x180.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0e2318">
  <title>Resultados — SGH</title>
  <!--
  SQL REQUERIDO EN SUPABASE:
  ALTER TABLE resultados
    ADD COLUMN IF NOT EXISTS estado_pista VARCHAR(20)
      CHECK (estado_pista IN ('seca','humeda','fangosa','pesada')),
    ADD COLUMN IF NOT EXISTS tiempo_ganador VARCHAR(20),
    ADD COLUMN IF NOT EXISTS apuestas JSONB;

  CREATE TABLE IF NOT EXISTS resultado_log (
    id UUID PRIMARY KEY DEFAULT uuid_generate_v4(),
    resultado_id UUID REFERENCES resultados(id),
    usuario_id UUID REFERENCES usuarios(id),
    accion VARCHAR(100),
    datos_antes JSONB,
    datos_despues JSONB,
    created_at TIMESTAMPTZ DEFAULT NOW()
  );
  ALTER TABLE resultado_log ENABLE ROW LEVEL SECURITY;
  CREATE POLICY "allow_all_log" ON resultado_log FOR ALL TO anon, authenticated USING (true) WITH CHECK (true);
  -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0e2318; --card: #1a3d26; --accent: #c9a84c;
      --text: #f5f0e8; --muted: #a0b8a0; --danger: #e05252;
      --success: #4caf82; --border: rgba(201,168,76,0.2); --input-bg: #0e2318;
      --info: #74b0f7;
    }
    body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }
    h1,h2,h3 { font-family: 'Playfair Display', serif; }
    .topbar { background: rgba(0,0,0,0.3); border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .btn-back { background: none; border: 1px solid var(--border); color: var(--muted); padding: 7px 14px; border-radius: 8px; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 13px; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; transition: all 0.2s; }
    .btn-back:hover { border-color: var(--accent); color: var(--accent); }
    .topbar h1 { font-size: 18px; color: var(--accent); flex: 1; }
    .selector-bar { background: var(--card); border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .selector-bar label { font-size: 12px; color: var(--muted); }
    select, input[type=text], input[type=number] { background: var(--input-bg); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 13px; outline: none; }
    select:focus, input:focus { border-color: var(--accent); }
    select option { background: #1a3d26; }
    .content { max-width: 1100px; margin: 0 auto; padding: 24px; }

    /* LISTA DE CARRERAS */
    .carreras-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; margin-bottom: 24px; }
    .carrera-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; transition: border-color 0.2s; }
    .carrera-card:hover { border-color: rgba(201,168,76,0.4); }
    .carrera-card.oficial { border-left: 4px solid var(--success); }
    .carrera-card.provisional { border-left: 4px solid var(--info); }
    .cc-num { font-family: 'Playfair Display', serif; font-size: 26px; color: var(--accent); font-weight: 700; margin-bottom: 4px; }
    .cc-name { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
    .cc-meta { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
    .cc-status { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .badge { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; text-transform: uppercase; }
    .badge-sin_resultado { background: rgba(160,184,160,0.1); color: var(--muted); border: 1px solid var(--border); }
    .badge-provisional { background: rgba(116,176,247,0.1); color: var(--info); border: 1px solid rgba(116,176,247,0.3); }
    .badge-oficial { background: rgba(76,175,130,0.15); color: var(--success); border: 1px solid rgba(76,175,130,0.3); }
    .badge-en_protesta { background: rgba(201,168,76,0.15); color: var(--accent); border: 1px solid rgba(201,168,76,0.3); }
    .btn-primary { background: var(--accent); color: #1a1a0a; border: none; padding: 9px 18px; border-radius: 9px; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: opacity 0.2s; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 9px 18px; border-radius: 9px; font-family: 'DM Sans', sans-serif; font-size: 13px; cursor: pointer; }
    .btn-success { background: var(--success); color: #0e2318; border: none; padding: 9px 18px; border-radius: 9px; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 9px 18px; border-radius: 9px; font-family: 'DM Sans', sans-serif; font-size: 13px; cursor: pointer; transition: all 0.2s; }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
    .btn-danger { background: rgba(224,82,82,0.15); color: var(--danger); border: 1px solid rgba(224,82,82,0.3); padding: 9px 18px; border-radius: 9px; font-family: 'DM Sans', sans-serif; font-size: 13px; cursor: pointer; }

    /* FORMULARIO RESULTADO */
    .res-panel { background: var(--card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
    .res-panel-header { padding: 16px 20px; background: rgba(201,168,76,0.07); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
    .res-panel-title { font-family: 'Playfair Display', serif; font-size: 20px; color: var(--accent); }
    .res-meta { font-size: 13px; color: var(--muted); }
    .res-section { padding: 16px 20px; border-bottom: 1px solid var(--border); }
    .res-section-title { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .res-section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .form-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    label { font-size: 12px; font-weight: 500; color: var(--muted); }

    /* TABLA POSICIONES */
    .pos-table { width: 100%; border-collapse: collapse; }
    .pos-table thead th { background: rgba(0,0,0,0.15); padding: 10px 12px; text-align: left; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; }
    .pos-table tbody tr { border-top: 1px solid var(--border); transition: background 0.15s; }
    .pos-table tbody tr.forfait-row { opacity: 0.5; }
    .pos-table tbody td { padding: 10px 12px; font-size: 13px; vertical-align: middle; }
    .pos-input { width: 60px; background: var(--input-bg); border: 1px solid var(--border); color: var(--text); padding: 5px 8px; border-radius: 6px; font-family: 'DM Sans', sans-serif; font-size: 13px; outline: none; text-align: center; }
    .pos-input:focus { border-color: var(--accent); }
    .cuerpos-input { width: 80px; background: var(--input-bg); border: 1px solid var(--border); color: var(--text); padding: 5px 8px; border-radius: 6px; font-family: 'DM Sans', sans-serif; font-size: 13px; outline: none; }
    .cuerpos-input:focus { border-color: var(--accent); }
    .check-small { display: flex; align-items: center; gap: 4px; font-size: 11px; color: var(--muted); }
    .check-small input[type=checkbox] { width: 14px; height: 14px; accent-color: var(--danger); }
    .spc-name { font-weight: 600; color: var(--accent); }
    .spc-sub { font-size: 11px; color: var(--muted); }
    .puesto-num { font-family: 'Playfair Display', serif; font-size: 18px; color: var(--accent); font-weight: 700; min-width: 28px; }
    .mandil-select { background: var(--input-bg); border: 1px solid var(--border); color: var(--text); padding: 5px 8px; border-radius: 6px; font-family: 'DM Sans', sans-serif; font-size: 12px; outline: none; max-width: 200px; }
    .mandil-select:focus { border-color: var(--accent); }
    .auto-cell { font-size: 12px; color: var(--text); }
    .auto-cell-muted { font-size: 11px; color: var(--muted); }
    .div-input { width: 76px; background: var(--input-bg); border: 1px solid var(--border); color: var(--text); padding: 5px 8px; border-radius: 6px; font-family: 'DM Sans', sans-serif; font-size: 12px; outline: none; text-align: right; }
    .div-input:focus { border-color: var(--accent); }

    /* APUESTAS */
    .apuestas-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
    .apuesta-item { background: rgba(0,0,0,0.15); border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
    .apuesta-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; }
    .apuesta-fields { display: flex; gap: 6px; }
    .apuesta-fields input { flex: 1; min-width: 60px; padding: 6px 8px; font-size: 12px; border-radius: 6px; }

    /* RESUMEN OFICIAL */
    .oficial-summary { padding: 20px; }
    .oficial-summary h3 { color: var(--success); margin-bottom: 16px; font-size: 18px; }
    .pos-result-list { list-style: none; }
    .pos-result-list li { display: flex; gap: 14px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); }
    .pos-num { font-family: 'Playfair Display', serif; font-size: 22px; color: var(--accent); min-width: 36px; }
    .pos-spc { font-weight: 600; }
    .pos-cuerpos { font-size: 12px; color: var(--muted); }

    .warning-box { background: rgba(224,82,82,0.1); border: 1px solid rgba(224,82,82,0.3); border-radius: 10px; padding: 14px 16px; font-size: 13px; color: var(--danger); margin-bottom: 12px; }
    .loading-state { display: flex; align-items: center; justify-content: center; padding: 50px; gap: 12px; color: var(--muted); }
    .spinner { width: 22px; height: 22px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty-state { text-align: center; padding: 50px 20px; }
    .empty-state .icon { font-size: 44px; margin-bottom: 14px; }
    .empty-state h3 { font-size: 17px; color: var(--muted); }
    #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
    .toast { padding: 12px 20px; border-radius: 10px; font-size: 14px; font-weight: 500; max-width: 320px; animation: slideIn 0.3s ease; }
    .toast-success { background: #1a4a30; border: 1px solid var(--success); color: var(--text); }
    .toast-error { background: #4a1a1a; border: 1px solid var(--danger); color: var(--text); }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    #auth-overlay { position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center; }
    .btn-logout { background:none;border:1px solid var(--border);color:var(--muted);padding:6px 14px;border-radius:8px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;transition:all 0.2s; }
    .btn-logout:hover { border-color:var(--danger);color:var(--danger); }
    .user-name { font-size:13px;color:var(--muted); }

    @media print {
      body { background:#fff!important; color:#000!important; }
      .topbar, .selector-bar, #toast-container, .no-print { display:none!important; }
      .res-panel { border:1px solid #ccc!important; background:#fff!important; }
      .pos-table td, .pos-table th { color:#000!important; border-color:#ddd!important; }
      .spc-name { color:#000!important; }
      @page { size: A4 portrait; margin: 15mm; }
    }
  </style>
  <script src="active-reunion.js"></script>
</head>
<body>
<div id="auth-overlay"><div class="spinner" style="width:32px;height:32px;border-width:3px;"></div></div>
<div id="toast-container"></div>

<div class="topbar">
  <a href="index.html" class="btn-back">← Inicio</a>
  <h1>Resultados</h1>
  <span class="user-name" id="user-name"></span>
  <button class="btn-logout" onclick="logout()">Cerrar sesión</button>
</div>

<div class="selector-bar">
  <label>Reunión:</label>
  <select id="sel-reunion" onchange="loadReunion()">
    <option value="">Cargando…</option>
  </select>
</div>

<div class="content">
  <div id="main-container">
    <div class="empty-state"><div class="icon">🏁</div><h3>Seleccionar una reunión para ver resultados</h3></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
let sb, CLUB_ID, currentUser;
async function initAuth(){const{createClient}=supabase;sb=createClient('https://unlhcuanfrtpatoipwve.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVubGhjdWFuZnJ0cGF0b2lwd3ZlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3MjQ0OTcsImV4cCI6MjA5MjMwMDQ5N30.rKb8BI7fBQcRdyyyxVfBOZbtCmGYKIMLUDLVmkn1SYM');const{data:{session}}=await sb.auth.getSession();if(!session){window.location.replace('login.html');return false;}const{data:usr}=await sb.from('usuarios').select('club_id,nombre_completo,rol').eq('email',session.user.email).single();if(usr.rol==='super_admin'){const urlClub=new URLSearchParams(window.location.search).get('club');CLUB_ID=urlClub||localStorage.getItem('sgh_selected_club_id')||usr.club_id||null;}else{if(!usr.club_id){await sb.auth.signOut();window.location.replace('login.html');return false;}CLUB_ID=usr.club_id;}currentUser={...session.user,nombre_completo:usr.nombre_completo,rol:usr.rol};const uEl=document.getElementById('user-name');if(uEl)uEl.textContent=usr.nombre_completo||session.user.email;document.getElementById('auth-overlay').style.display='none';return true;}
function logout(){sb.auth.signOut().then(()=>window.location.replace('login.html'));}

let reuniones=[], carreras=[], inscripciones=[], resultados={}, posicionesMap={};
let spcsMap={}, profsMap={}, cabsMap={};
let currentCarreraId=null;

const TIPOS_APUESTA = [
  {key:'imperfecta',    label:'Imperfecta'},
  {key:'exacta',        label:'Exacta'},
  {key:'doble',         label:'Doble'},
  {key:'doble_a_place', label:'Doble a Place'},
  {key:'trifecta',      label:'Trifecta'},
  {key:'cuatrifecta',   label:'Cuatrifecta'},
  {key:'triplo',        label:'Triplo'},
  {key:'cuaterna',      label:'Cuaterna'},
  {key:'quintuplo',     label:'Quíntuplo'},
  {key:'cadena',        label:'Cadena'},
];

const CUERPOS_OPCIONES = [
  'empate', 'hocico', 'cabeza', 'pescuezo', 'cuello',
  '1/4 cp', '1/2 cp', '3/4 cp',
  '1 cp', '1 1/2 cps', '2 cps', '2 1/2 cps',
  '3 cps', '3 1/2 cps', '4 cps', '4 1/2 cps',
  '5 cps', '6 cps', '7 cps', '8 cps', '10 cps',
  '15 cps', '20 cps', '25 cps', '30 cps',
  'lejos', 'S.A.',
];

function formatMonto(num) {
  if (num === null || num === undefined || isNaN(num)) return '$0,00';
  const n = parseFloat(num);
  const signo = n < 0 ? '-' : '';
  const [entero, dec] = Math.abs(n).toFixed(2).split('.');
  const enteroFmt = entero.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return signo + '$' + enteroFmt + ',' + dec;
}
function onMandilChange(puesto) {
  const inscId = document.getElementById(`mandil-${puesto}`)?.value;
  const spcEl  = document.getElementById(`spc-${puesto}`);
  const jockEl = document.getElementById(`jock-${puesto}`);
  const pesoEl = document.getElementById(`peso-${puesto}`);
  if (!inscId) {
    if (spcEl)  spcEl.textContent = '';
    if (jockEl) jockEl.textContent = '';
    if (pesoEl) pesoEl.textContent = '';
    if (puesto === 1 || puesto === 2) {
      const jockDisplayEl = document.getElementById(`jockey-${puesto}`);
      if (jockDisplayEl) jockDisplayEl.textContent = '—';
    }
    return;
  }
  const insc = inscripciones.find(i => i.id === inscId);
  const spc  = insc ? spcsMap[insc.spc_id]            : null;
  const jock = insc ? profsMap[insc.jockey_titular_id] : null;
  if (spcEl)  spcEl.textContent  = spc?.nombre || '';
  if (jockEl) jockEl.textContent = jock ? (jock.apellido || '') : '';
  if (pesoEl) pesoEl.textContent = insc?.peso_final || insc?.peso_declarado || '';
  // Actualizar display Jockey 1°/2° en la sección Datos de la carrera
  if (puesto === 1 || puesto === 2) {
    const jockDisplayEl = document.getElementById(`jockey-${puesto}`);
    if (jockDisplayEl) {
      jockDisplayEl.textContent = jock
        ? `${jock.apellido || ''} ${jock.nombre || ''}`.trim().toUpperCase()
        : '—';
    }
  }
}

function toast(msg,type='success') {
  const t=document.createElement('div'); t.className=`toast toast-${type}`; t.textContent=msg;
  document.getElementById('toast-container').appendChild(t); setTimeout(()=>t.remove(),3500);
}

async function init() {
  const [{ data: reuns }, { data: profs }, { data: sprcs }, { data: cabs }] = await Promise.all([
    sb.from('reuniones').select('id,numero,fecha,estado,hipodromos(nombre)').eq('club_id', CLUB_ID).order('fecha', {ascending:false}),
    sb.from('profesionales').select('id,nombre,apellido').eq('club_id', CLUB_ID),
    sb.from('spcs').select('id,nombre').order('nombre'),
    sb.from('caballerizas').select('id,nombre').eq('club_id', CLUB_ID),
  ]);
  reuniones = reuns||[];
  (profs||[]).forEach(p=>{ profsMap[p.id]=p; });
  (sprcs||[]).forEach(s=>{ spcsMap[s.id]=s; });
  (cabs||[]).forEach(c=>{ cabsMap[c.id]=c; });

  const sel = document.getElementById('sel-reunion');
  sel.innerHTML = '<option value="">— Seleccionar —</option>' + reuniones.map(r=>`<option value="${r.id}">Reunión ${r.numero||''} — ${new Date(r.fecha+'T12:00:00').toLocaleDateString('es-AR')} — ${r.hipodromos?.nombre||''}</option>`).join('');

  const rid = ActiveReunion.resolve(reuniones);
  if (rid) {
    sel.value = rid;
    try { history.replaceState(null, '', `?reunion_id=${rid}`); } catch(_) {}
    await loadReunion();
  }
}

async function loadReunion() {
  const rid = document.getElementById('sel-reunion').value;
  if (rid) { ActiveReunion.set(rid); }
  if (!rid) { document.getElementById('main-container').innerHTML='<div class="empty-state"><div class="icon">🏁</div><h3>Seleccionar una reunión</h3></div>'; return; }
  document.getElementById('main-container').innerHTML='<div class="loading-state"><div class="spinner"></div> Cargando carreras…</div>';
  const { data: cars } = await sb.from('carreras').select('*').eq('reunion_id', rid).order('numero_turno');
  carreras = cars||[];
  if (!carreras.length) {
    document.getElementById('main-container').innerHTML='<div class="empty-state"><div class="icon">📋</div><h3>Esta reunión no tiene carreras</h3></div>';
    return;
  }
  const carIds = carreras.map(c=>c.id);
  const [{ data: inscData }, { data: resData }] = await Promise.all([
    sb.from('inscripciones').select('*').in('carrera_id', carIds).order('created_at'),
    sb.from('resultados').select('*').in('carrera_id', carIds),
  ]);
  inscripciones = inscData||[];
  resultados = {};
  (resData||[]).forEach(r=>{ resultados[r.carrera_id]=r; });
  const resIds = (resData||[]).map(r=>r.id);
  posicionesMap = {};
  if (resIds.length) {
    const { data: posData } = await sb.from('resultado_posiciones').select('*').in('resultado_id', resIds);
    (posData||[]).forEach(p=>{ if(!posicionesMap[p.resultado_id]) posicionesMap[p.resultado_id]=[]; posicionesMap[p.resultado_id].push(p); });
  }
  renderCarrerasList();
}

function renderCarrerasList() {
  const html = `<div class="carreras-grid">
    ${carreras.map(c => {
      const res = resultados[c.carrera_id] || resultados[c.id];
      const estado = res?.estado || 'sin_resultado';
      return `<div class="carrera-card ${estado==='oficial'?'oficial':estado!=='sin_resultado'?'provisional':''}">
        <div class="cc-num">${c.numero_turno}</div>
        <div class="cc-name">${c.nombre||`Carrera ${c.numero_turno}`}</div>
        <div class="cc-meta">${c.distancia_metros}m | ${c.tipo_pista||'—'}</div>
        <div class="cc-status">
          <span class="badge badge-${estado}">${estado.replace('_',' ')}</span>
        </div>
        <button class="btn-primary" style="width:100%" onclick="abrirResultado('${c.id}')">
          ${estado==='oficial'?'👁 Ver resultado':'📝 Cargar resultado'}
        </button>
      </div>`;
    }).join('')}
  </div>`;
  document.getElementById('main-container').innerHTML = html;
  currentCarreraId = null;
}

function abrirResultado(carreraId) {
  currentCarreraId = carreraId;
  const carrera = carreras.find(c=>c.id===carreraId);
  const res = resultados[carreraId];
  const pos = res ? (posicionesMap[res.id]||[]) : [];
  const insc = inscripciones.filter(i=>i.carrera_id===carreraId);
  const bloqueado = res?.estado==='oficial';

  if (bloqueado) {
    renderResumenOficial(carrera, res, pos, insc);
  } else {
    renderFormulario(carrera, res, pos, insc);
  }
}

function renderResumenOficial(carrera, res, posiciones, insc) {
  const posOrdenadas = [...posiciones].sort((a,b)=>(a.posicion||99)-(b.posicion||99));
  const apuestas = res.dividendos || {};

  // Borrados
  const inscBorradas = insc
    .filter(i => ['forfait', 'mal_inscrito'].includes(i.estado))
    .sort((a, b) => (a.numero_partidor || 999) - (b.numero_partidor || 999));
  const totalInscriptos = insc.length;
  const borradosTxt = inscBorradas.length
    ? `${inscBorradas.map(i => i.numero_partidor).filter(Boolean).join('-')} (${totalInscriptos})`
    : `Ninguno (${totalInscriptos})`;

  // Jockeys 1°/2° derivados de posiciones
  const getJockeyStr = (puestoNum) => {
    const pos = posOrdenadas.find(p => p.posicion === puestoNum);
    if (!pos) return '—';
    const inscr = insc.find(i => i.id === pos.inscripcion_id);
    const jock  = inscr ? profsMap[inscr.jockey_titular_id] : null;
    return jock ? `${jock.apellido || ''} ${jock.nombre || ''}`.trim().toUpperCase() : '—';
  };

  document.getElementById('main-container').innerHTML = `
    <button class="btn-outline no-print" onclick="renderCarrerasList()" style="margin-bottom:16px;">← Volver a carreras</button>
    <div class="res-panel">
      <div class="res-panel-header">
        <div>
          <div class="res-panel-title">Turno ${carrera.numero_turno} — ${carrera.nombre||''}</div>
          <div class="res-meta">${carrera.distancia_metros}m | ${carrera.tipo_pista||'—'} | Pista: ${res.estado_pista||'—'} | Tiempo: ${res.tiempo_ganador||'—'}</div>
        </div>
        <div style="display:flex;gap:8px;align-items:center;">
          <span class="badge badge-oficial">✅ Oficial</span>
          <button class="btn-outline no-print" onclick="window.print()">🖨️ Imprimir</button>
          <button class="btn-danger no-print" onclick="modificarOficial('${res.id}','${carrera.id}')">⚠️ Modificar</button>
        </div>
      </div>
      <div class="res-section">
        <div class="res-section-title">Datos de la carrera</div>
        <div style="display:flex;flex-wrap:wrap;gap:20px;font-size:13px;">
          <div><div style="font-size:11px;color:var(--muted);margin-bottom:3px;text-transform:uppercase;">Borrados</div><div>${borradosTxt}</div></div>
          ${res.favorito_mandil != null ? `<div><div style="font-size:11px;color:var(--muted);margin-bottom:3px;text-transform:uppercase;">Favorito</div><div style="color:var(--accent);font-weight:700;">${res.favorito_mandil}</div></div>` : ''}
          <div><div style="font-size:11px;color:var(--muted);margin-bottom:3px;text-transform:uppercase;">Jockey 1°</div><div>${getJockeyStr(1)}</div></div>
          <div><div style="font-size:11px;color:var(--muted);margin-bottom:3px;text-transform:uppercase;">Jockey 2°</div><div>${getJockeyStr(2)}</div></div>
        </div>
      </div>
      <div class="res-section">
        <div class="res-section-title">Posiciones finales</div>
        <ul class="pos-result-list">
          ${posOrdenadas.map(p=>{
            const i = insc.find(x=>x.id===p.inscripcion_id);
            const spc = i ? spcsMap[i.spc_id] : null;
            const jock = i ? profsMap[i.jockey_titular_id] : null;
            const mandil = i?.numero_partidor ? `[${i.numero_partidor}] ` : '';
            return `<li>
              <div class="pos-num">${p.posicion||'—'}°</div>
              <div style="flex:1;">
                <div class="pos-spc">${mandil}${spc?.nombre||'—'}${p.descalificado?' <span style="color:var(--danger);font-size:11px">(DESC)</span>':''}</div>
                <div class="pos-cuerpos">${jock?jock.apellido+' — ':''}</div>
                ${p.diferencia?`<div class="pos-cuerpos">Dif: ${p.diferencia}</div>`:''}
              </div>
              ${p.dividendo!=null?`<div style="font-family:'Playfair Display',serif;color:var(--success);font-weight:600;font-size:15px;">${formatMonto(p.dividendo)}</div>`:''}
            </li>`;
          }).join('')}
        </ul>
      </div>
      ${Object.keys(apuestas).length ? `
      <div class="res-section">
        <div class="res-section-title">Apuestas</div>
        <div style="display:flex;flex-wrap:wrap;gap:10px;">
          ${Object.entries(apuestas).map(([tipo,dat])=>`
            <div style="background:rgba(0,0,0,0.15);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:13px;">
              <div style="font-size:11px;color:var(--muted);text-transform:uppercase;margin-bottom:4px;">${tipo}</div>
              ${dat.combinacion?`<div style="color:var(--accent);font-weight:600;">${dat.combinacion}</div>`:''}
              ${dat.dividendo?`<div>${formatMonto(dat.dividendo)}</div>`:''}
            </div>
          `).join('')}
        </div>
      </div>` : ''}
    </div>`;
}

function renderFormulario(carrera, res, posiciones, insc) {
  const apuestas = res?.dividendos || {};

  // Borrados: forfait o mal_inscrito
  const inscBorradas = insc
    .filter(i => ['forfait', 'mal_inscrito'].includes(i.estado))
    .sort((a, b) => (a.numero_partidor || 999) - (b.numero_partidor || 999));
  const totalInscriptos = insc.length;
  const borradosTxt = inscBorradas.length
    ? `${inscBorradas.map(i => i.numero_partidor).filter(Boolean).join('-')} (${totalInscriptos})`
    : `Ninguno (${totalInscriptos})`;

  // Inscriptos disponibles ordenados por mandil; forfaits excluidos
  const inscOpciones = insc
    .filter(i => i.estado !== 'forfait')
    .sort((a, b) => (a.numero_partidor || 999) - (b.numero_partidor || 999));

  // Posiciones existentes indexadas por puesto
  const posByPuesto = {};
  posiciones.forEach(p => { if (p.posicion) posByPuesto[p.posicion] = p; });

  // datalist de cuerpos (compartido por todas las filas)
  const cuerposList = `<datalist id="dl-cuerpos">${CUERPOS_OPCIONES.map(o=>`<option value="${o}">`).join('')}</datalist>`;

  // Una fila por puesto (N = total de inscriptos no-forfait)
  const puestosFilas = inscOpciones.map((_, idx) => {
    const puesto   = idx + 1;
    const posData  = posByPuesto[puesto] || {};
    const inscSel  = posData.inscripcion_id
      ? inscOpciones.find(i => i.id === posData.inscripcion_id)
      : null;

    const opciones = `<option value="">— Mandil —</option>` + inscOpciones.map(i => {
      const spc = spcsMap[i.spc_id];
      return `<option value="${i.id}" ${inscSel?.id === i.id ? 'selected' : ''}>${i.numero_partidor || '?'} — ${spc?.nombre || ''}</option>`;
    }).join('');

    const spc  = inscSel ? spcsMap[inscSel.spc_id]              : null;
    const jock = inscSel ? profsMap[inscSel.jockey_titular_id]  : null;
    const peso = inscSel ? (inscSel.peso_final || inscSel.peso_declarado || '') : '';

    return `<tr>
      <td><span class="puesto-num">${puesto}°</span></td>
      <td><select class="mandil-select" id="mandil-${puesto}" onchange="onMandilChange(${puesto})">${opciones}</select></td>
      <td><span class="auto-cell" id="spc-${puesto}">${spc?.nombre || ''}</span></td>
      <td><span class="auto-cell-muted" id="jock-${puesto}">${jock?.apellido || ''}</span></td>
      <td><span class="auto-cell-muted" id="peso-${puesto}">${peso}</span></td>
      <td><input class="cuerpos-input" list="dl-cuerpos" id="cuerpos-${puesto}" value="${posData.diferencia || ''}" placeholder="1/2 cp" style="width:90px;"></td>
      <td><input class="div-input" type="number" id="div-${puesto}" value="${posData.dividendo != null ? posData.dividendo : ''}" placeholder="0.00" step="0.01" min="0"></td>
      <td><div class="check-small"><input type="checkbox" id="desc-${puesto}" ${posData.descalificado ? 'checked' : ''}><label for="desc-${puesto}" style="color:var(--danger)">DESC</label></div></td>
    </tr>`;
  }).join('');

  const apuestasHtml = TIPOS_APUESTA.map(a => {
    const dat = apuestas[a.key] || {};
    return `<div class="apuesta-item">
      <div class="apuesta-label">${a.label}</div>
      <div class="apuesta-fields">
        <input type="text" id="ap-comb-${a.key}" value="${dat.combinacion || ''}" placeholder="ej: 5-2" style="flex:1;">
        <input type="number" id="ap-div-${a.key}" value="${dat.dividendo || ''}" placeholder="$" style="width:80px;" step="0.01">
      </div>
    </div>`;
  }).join('');

  document.getElementById('main-container').innerHTML = `
    ${cuerposList}
    <button class="btn-outline" onclick="renderCarrerasList()" style="margin-bottom:16px;">← Volver a carreras</button>
    <div class="res-panel">
      <div class="res-panel-header">
        <div>
          <div class="res-panel-title">Turno ${carrera.numero_turno} — ${carrera.nombre || ''}</div>
          <div class="res-meta">${carrera.distancia_metros}m | ${carrera.tipo_pista || '—'}</div>
        </div>
        <span class="badge badge-${res?.estado || 'sin_resultado'}">${(res?.estado || 'sin resultado').replace('_', ' ')}</span>
      </div>

      <div class="res-section">
        <div class="res-section-title">Condiciones de carrera</div>
        <div class="form-row">
          <div class="form-group">
            <label>Estado de pista</label>
            <select id="estado-pista" style="min-width:140px;">
              <option value="">— Seleccionar —</option>
              <option value="seca"    ${res?.estado_pista === 'seca'    ? 'selected' : ''}>Seca</option>
              <option value="humeda"  ${res?.estado_pista === 'humeda'  ? 'selected' : ''}>Húmeda</option>
              <option value="fangosa" ${res?.estado_pista === 'fangosa' ? 'selected' : ''}>Fangosa</option>
              <option value="pesada"  ${res?.estado_pista === 'pesada'  ? 'selected' : ''}>Pesada</option>
            </select>
          </div>
          <div class="form-group">
            <label>Tiempo del ganador</label>
            <input type="text" id="tiempo-ganador" value="${res?.tiempo_ganador || ''}" placeholder="1:02.3" style="width:120px;">
          </div>
          <div class="form-group" style="flex:1;">
            <label>Incidentes / Observaciones</label>
            <input type="text" id="incidentes" value="${res?.incidentes || ''}" placeholder="Notas sobre la carrera…">
          </div>
        </div>
      </div>

      <div class="res-section">
        <div class="res-section-title">Datos de la carrera</div>
        <div class="form-row" style="gap:24px;align-items:flex-end;flex-wrap:wrap;">
          <div class="form-group" style="flex:1;min-width:240px;">
            <label>Borrados</label>
            <div style="padding:8px 12px;background:rgba(255,255,255,0.05);border-radius:6px;font-size:13px;">${borradosTxt}</div>
          </div>
          <div class="form-group">
            <label>Favorito (mandil)</label>
            <input type="number" id="favorito-mandil" min="1" value="${res?.favorito_mandil || ''}" placeholder="—" style="width:80px;">
          </div>
          <div class="form-group" style="flex:1;min-width:200px;">
            <label>Jockey 1°</label>
            <div id="jockey-1" style="padding:8px 12px;background:rgba(255,255,255,0.05);border-radius:6px;font-size:13px;">—</div>
          </div>
          <div class="form-group" style="flex:1;min-width:200px;">
            <label>Jockey 2°</label>
            <div id="jockey-2" style="padding:8px 12px;background:rgba(255,255,255,0.05);border-radius:6px;font-size:13px;">—</div>
          </div>
        </div>
      </div>

      <div class="res-section">
        <div class="res-section-title">Posiciones</div>
        <table class="pos-table">
          <thead><tr><th>Puesto</th><th>Mandil</th><th>S.P.C.</th><th>Jockey</th><th>Peso</th><th>Cuerpos</th><th>Dividendo</th><th>DESC</th></tr></thead>
          <tbody>${puestosFilas || '<tr><td colspan="8" style="padding:20px;text-align:center;color:var(--muted)">Sin inscriptos</td></tr>'}</tbody>
        </table>
      </div>

      <div class="res-section">
        <div class="res-section-title">Dividendos compuestos</div>
        <div class="apuestas-grid">${apuestasHtml}</div>
      </div>

      <div class="res-section" style="border:none;">
        <div class="warning-box">⚠️ <strong>Hacer oficial</strong> bloqueará el resultado permanentemente. Los cambios posteriores quedarán registrados en el log.</div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          <button class="btn-primary" onclick="guardarResultado('${carrera.id}','provisional')">💾 Guardar provisional</button>
          <button class="btn-success" onclick="oficializar('${carrera.id}')">✅ Hacer oficial</button>
        </div>
      </div>
    </div>`;
  // Pre-poblar Jockey 1°/2° con datos ya cargados (si los hay)
  setTimeout(() => { onMandilChange(1); onMandilChange(2); }, 0);
}

async function guardarResultado(carreraId, estado) {
  const tiempo = document.getElementById('tiempo-ganador')?.value.trim();
  const incidentes = document.getElementById('incidentes')?.value.trim();
  const estadoPista = document.getElementById('estado-pista')?.value;
  const insc = inscripciones.filter(i=>i.carrera_id===carreraId&&i.estado!=='forfait');
  const res = resultados[carreraId];

  // Recopilar apuestas
  const apuestas = {};
  TIPOS_APUESTA.forEach(a => {
    const comb = document.getElementById(`ap-comb-${a.key}`)?.value.trim();
    const div = document.getElementById(`ap-div-${a.key}`)?.value;
    if (comb || div) apuestas[a.key] = { combinacion: comb||null, dividendo: div?parseFloat(div):null };
  });

  const favoritoInput = document.getElementById('favorito-mandil')?.value;
  const favorito_mandil = favoritoInput ? parseInt(favoritoInput, 10) : null;

  let resId = res?.id;
  const resPayload = { carrera_id: carreraId, estado, tiempo_ganador: tiempo||null, incidentes: incidentes||null, estado_pista: estadoPista||null, favorito_mandil, dividendos: Object.keys(apuestas).length?apuestas:null };

  if (!resId) {
    const { data, error } = await sb.from('resultados').insert(resPayload).select().single();
    if (error) { toast(error.message,'error'); return null; }
    resId = data.id;
    resultados[carreraId] = data;
  } else {
    const { error } = await sb.from('resultados').update(resPayload).eq('id', resId);
    if (error) { toast(error.message,'error'); return null; }
    resultados[carreraId] = { ...resultados[carreraId], ...resPayload };
  }

  // Recolectar posiciones por puesto (una fila por puesto en el formulario)
  const inscOpciones = insc
    .filter(i => i.estado !== 'forfait')
    .sort((a, b) => (a.numero_partidor || 999) - (b.numero_partidor || 999));
  const posData = [];
  for (let puesto = 1; puesto <= inscOpciones.length; puesto++) {
    const inscId = document.getElementById(`mandil-${puesto}`)?.value;
    if (!inscId) continue;
    const cuerpos   = document.getElementById(`cuerpos-${puesto}`)?.value?.trim();
    const dividendo = document.getElementById(`div-${puesto}`)?.value;
    const desc      = document.getElementById(`desc-${puesto}`)?.checked || false;
    const motDesc   = desc ? (prompt(`Motivo de descalificación para ${puesto}°:`) || null) : null;
    posData.push({
      resultado_id: resId,
      inscripcion_id: inscId,
      posicion: puesto,
      diferencia: cuerpos || null,
      dividendo: dividendo ? parseFloat(dividendo) : null,
      descalificado: desc,
      motivo_desc: motDesc,
      empate: false,
    });
  }

  if (posData.length) {
    await sb.from('resultado_posiciones').delete().eq('resultado_id', resId);
    const { error } = await sb.from('resultado_posiciones').insert(posData);
    if (error) { toast(error.message,'error'); return null; }
    posicionesMap[resId] = posData;
  }
  toast(estado==='provisional'?'Resultado provisional guardado':'Guardado');
  return resId;
}

async function oficializar(carreraId) {
  if (!confirm('⚠️ Esta acción es irreversible. Los datos quedarán bloqueados y cualquier cambio posterior quedará registrado en el log.\n\n¿Confirmar resultado oficial?')) return;
  const resId = await guardarResultado(carreraId, 'oficial');
  if (!resId) return;
  // Actualizar performances
  const res = resultados[carreraId];
  const posiciones = posicionesMap[resId]||[];
  const inscs = inscripciones.filter(i=>i.carrera_id===carreraId);
  const carrera = carreras.find(c=>c.id===carreraId);
  const { data: reunionData } = await sb.from('reuniones').select('fecha,hipodromos(nombre,sigla)').eq('id', document.getElementById('sel-reunion').value).single();
  const perfInserts = posiciones.map(pos => {
    const insc = inscs.find(i=>i.id===pos.inscripcion_id);
    if (!insc) return null;
    return { spc_id: insc.spc_id, carrera_id: carreraId, fecha_carrera: reunionData?.fecha, hipodromo_sigla: reunionData?.hipodromos?.sigla||'', hipodromo_nombre: reunionData?.hipodromos?.nombre||'', numero_carrera: carrera?.numero_turno, distancia_metros: carrera?.distancia_metros, tipo_pista: carrera?.tipo_pista, posicion: pos.posicion, tiempo_ganador: res?.tiempo_ganador, diferencia: pos.diferencia, peso_llevado: insc.peso_final||insc.peso_declarado, jockey_id: insc.jockey_titular_id, descalificado: pos.descalificado, fuente: 'local' };
  }).filter(Boolean);

  if (perfInserts.length) {
    await sb.from('performances').delete().eq('carrera_id', carreraId);
    await sb.from('performances').insert(perfInserts);
  }

  // Log
  await sb.from('resultado_log').insert({ resultado_id: resId, usuario_id: currentUser?.id, accion: 'oficializar', datos_despues: { estado: 'oficial', fecha: new Date().toISOString() } }).catch(err => console.error('Error al registrar log de oficialización:', err));

  toast('✅ Resultado oficializado');
  abrirResultado(carreraId);
}

async function modificarOficial(resId, carreraId) {
  const motivo = prompt('Ingrese el motivo de la modificación (quedará registrado en el log):');
  if (!motivo) return;
  const resBefore = resultados[carreraId];
  await sb.from('resultado_log').insert({ resultado_id: resId, usuario_id: currentUser?.id, accion: 'modificar_despues_oficial', datos_antes: resBefore, datos_despues: { motivo, fecha: new Date().toISOString() } }).catch(err => console.error('Error al registrar log de modificación:', err));
  const { error } = await sb.from('resultados').update({ estado: 'provisional' }).eq('id', resId);
  if (error) { toast(error.message,'error'); return; }
  resultados[carreraId].estado = 'provisional';
  toast('Resultado desbloqueado para edición');
  abrirResultado(carreraId);
}
