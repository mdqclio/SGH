<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="logo32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="logo180x180.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0e2318">
  <title>Resultados — SGH</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    input[type=number] { -moz-appearance: textfield; appearance: textfield; }
    :root {
      --bg:      #0e2318; --card:   #1a3d26; --accent: #c9a84c;
      --text:    #f5f0e8; --muted:  #a0b8a0; --danger: #e05252;
      --success: #4caf82; --border: rgba(201,168,76,0.2); --input-bg: #0e2318;
      --info:    #74b0f7;
    }
    body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }
    h1,h2,h3 { font-family: 'Playfair Display', serif; }

    /* ── Topbar ── */
    .topbar { background: rgba(0,0,0,0.3); border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .topbar h1 { font-size: 18px; color: var(--accent); flex: 1; }
    .btn-back { background: none; border: 1px solid var(--border); color: var(--muted); padding: 7px 14px; border-radius: 8px; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 13px; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; transition: all 0.2s; }
    .btn-back:hover { border-color: var(--accent); color: var(--accent); }
    .selector-bar { background: var(--card); border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; gap: 12px; align-items: center; }
    .selector-bar label { font-size: 12px; color: var(--muted); }
    .content { max-width: 1400px; margin: 0 auto; padding: 24px; }

    /* ── Inputs / selects base ── */
    select, input[type=text], input[type=number] {
      background: var(--input-bg); border: 1px solid var(--border); color: var(--text);
      padding: 8px 12px; border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 13px; outline: none;
    }
    select:focus, input:focus { border-color: var(--accent); }
    select option { background: #1a3d26; }

    /* ── Botones ── */
    .btn-primary { background: var(--accent); color: #1a1a0a; border: none; padding: 9px 18px; border-radius: 9px; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; transition: opacity 0.2s; white-space: nowrap; }
    .btn-primary:hover { opacity: 0.88; }
    .btn-outline  { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 9px 18px; border-radius: 9px; font-family: 'DM Sans', sans-serif; font-size: 13px; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
    .btn-success  { background: var(--success); color: #0e2318; border: none; padding: 9px 18px; border-radius: 9px; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .btn-danger   { background: rgba(224,82,82,0.12); color: var(--danger); border: 1px solid rgba(224,82,82,0.3); padding: 9px 18px; border-radius: 9px; font-family: 'DM Sans', sans-serif; font-size: 13px; cursor: pointer; white-space: nowrap; }
    .btn-danger:hover { background: rgba(224,82,82,0.2); }
    kbd { display: inline-block; background: rgba(0,0,0,0.35); border: 1px solid rgba(255,255,255,0.12); border-radius: 4px; padding: 1px 5px; font-size: 10px; font-family: monospace; color: var(--muted); margin-left: 4px; vertical-align: middle; }

    /* ── Badges ── */
    .badge { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; text-transform: uppercase; }
    .badge-sin_resultado { background: rgba(160,184,160,0.1); color: var(--muted); border: 1px solid var(--border); }
    .badge-provisional   { background: rgba(116,176,247,0.1); color: var(--info);    border: 1px solid rgba(116,176,247,0.3); }
    .badge-oficial       { background: rgba(76,175,130,0.15); color: var(--success); border: 1px solid rgba(76,175,130,0.3); }

    /* ── Toast ── */
    #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
    .toast { padding: 12px 20px; border-radius: 10px; font-size: 14px; font-weight: 500; max-width: 340px; animation: slideIn 0.3s ease; }
    .toast-success { background: #1a4a30; border: 1px solid var(--success); color: var(--text); }
    .toast-error   { background: #4a1a1a; border: 1px solid var(--danger);  color: var(--text); }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    /* ── Estados vacíos / loading ── */
    .loading-state { display: flex; align-items: center; justify-content: center; padding: 60px; gap: 12px; color: var(--muted); }
    .spinner { width: 22px; height: 22px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty-state { text-align: center; padding: 60px 20px; }
    .empty-state .icon { font-size: 48px; margin-bottom: 14px; }
    .empty-state h3 { font-size: 17px; color: var(--muted); }
    .warning-box { background: rgba(224,82,82,0.1); border: 1px solid rgba(224,82,82,0.3); border-radius: 10px; padding: 12px 16px; font-size: 12px; color: var(--danger); }

    /* ── Lista de carreras ── */
    .carreras-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px,1fr)); gap: 14px; }
    .carrera-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; transition: border-color 0.2s; cursor: pointer; }
    .carrera-card:hover { border-color: rgba(201,168,76,0.4); }
    .carrera-card.oficial     { border-left: 4px solid var(--success); }
    .carrera-card.provisional { border-left: 4px solid var(--info); }
    .cc-num  { font-family: 'Playfair Display', serif; font-size: 26px; color: var(--accent); font-weight: 700; margin-bottom: 4px; }
    .cc-name { font-size: 14px; font-weight: 600; margin-bottom: 6px; }
    .cc-meta { font-size: 12px; color: var(--muted); margin-bottom: 12px; }
    .cc-status { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }

    /* ══════════════════════════════════════
       PANEL DE RESULTADO
    ══════════════════════════════════════ */
    .res-panel { background: var(--card); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; }
    .res-panel-header { padding: 16px 22px; background: rgba(201,168,76,0.07); border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .res-panel-title { font-family: 'Playfair Display', serif; font-size: 20px; color: var(--accent); }
    .res-meta { font-size: 12px; color: var(--muted); }
    .tp-label { cursor: pointer; border-bottom: 1px dashed rgba(160,184,160,0.35); transition: border-color 0.15s, color 0.15s; }
    .tp-label:hover { border-bottom-color: var(--accent); color: var(--accent); }
    .tp-select { background: var(--input-bg); border: 1px solid rgba(201,168,76,0.35); color: var(--text); border-radius: 4px; font-family: 'DM Sans', sans-serif; font-size: 12px; padding: 0 3px; cursor: pointer; outline: none; height: 19px; vertical-align: middle; }
    .tp-select:focus { border-color: var(--accent); }
    .tp-select option { background: #1a3d26; }
    .res-section { padding: 14px 22px; border-bottom: 1px solid var(--border); }
    .res-section-title { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .res-section-title::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .form-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group label { font-size: 12px; font-weight: 500; color: var(--muted); }
    .tg-single { height: 34px; width: 110px; background: var(--input-bg); border: 1px solid var(--border); color: var(--text); border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600; text-align: center; padding: 0 8px; outline: none; transition: border-color 0.15s; }
    .tg-single:focus { border-color: var(--accent); }
    .tg-single.tg-invalid { border-color: var(--danger); }

    /* ── 2 columnas: marcador + right ── */
    .det-cols { display: grid; grid-template-columns: 340px 1fr; gap: 0; }
    .det-col-left { border-right: 1px solid var(--border); padding: 14px 18px; }
    .det-col-right { padding: 0; min-width: 0; }

    /* ── Marcador ── */
    .marc-grid { display: grid; grid-template-columns: 54px 1fr; row-gap: 6px; column-gap: 8px; align-items: center; }
    .marc-input {
      height: 34px; background: rgba(255,255,255,0.04); border: 1px solid rgba(201,168,76,0.35); color: var(--text);
      border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 15px; font-weight: 700;
      text-align: center; padding: 0; width: 100%; outline: none; transition: border-color 0.15s;
    }
    .marc-input:focus { border-color: var(--accent); }

    /* ── Chapa picker ── */
    .chapa-wrap { display: flex; align-items: center; }
    .chapa-btn  { display: flex; align-items: center; gap: 5px; height: 34px; padding: 0 7px 0 5px; background: rgba(255,255,255,0.04); border: 1px solid rgba(201,168,76,0.35); border-radius: 8px; cursor: pointer; min-width: 88px; font-family: 'DM Sans', sans-serif; color: var(--text); transition: border-color 0.15s; }
    .chapa-btn:hover { border-color: rgba(201,168,76,0.4); }
    .chapa-btn:focus { outline: none; border-color: var(--accent); }
    .chapa-btn-icon { width: 22px; height: 22px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
    .chapa-btn-icon svg { width: 22px; height: 22px; }
    .chapa-btn-code { font-size: 11px; color: var(--text); font-family: monospace; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .chapa-caret { font-size: 9px; color: var(--muted); flex-shrink: 0; }

    /* Shared dropdown */
    .chapa-shared-dd { position: fixed; z-index: 1000; background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 4px 0; min-width: 210px; max-height: 300px; overflow-y: auto; display: none; box-shadow: 0 8px 24px rgba(0,0,0,0.45); }
    .chapa-shared-dd.open { display: block; }
    .chapa-opt { display: flex; align-items: center; gap: 8px; padding: 5px 12px; cursor: pointer; font-size: 12px; }
    .chapa-opt:hover, .chapa-opt.sel { background: rgba(201,168,76,0.12); }
    .chapa-opt-icon { width: 24px; height: 24px; flex-shrink: 0; display: flex; align-items: center; }
    .chapa-opt-icon svg { width: 24px; height: 24px; }
    .chapa-opt-nombre { flex: 1; color: var(--text); }
    .chapa-opt-code { color: var(--muted); font-family: monospace; font-size: 11px; flex-shrink: 0; }
    .chapa-varios-row { display: flex; align-items: center; gap: 6px; padding: 2px 12px 7px; }
    .chapa-varios-inp { width: 64px; height: 28px; background: var(--input-bg); border: 1px solid var(--border); color: var(--text); border-radius: 6px; text-align: center; font-size: 13px; font-family: 'DM Sans', sans-serif; padding: 0; -moz-appearance: textfield; }
    .chapa-varios-inp::-webkit-outer-spin-button, .chapa-varios-inp::-webkit-inner-spin-button { -webkit-appearance: none; }
    .chapa-varios-inp:focus { outline: none; border-color: var(--accent); }

    /* ── M.(F) ── */
    .mf-block { display: flex; align-items: flex-end; gap: 12px; }
    .mf-lbl { font-family: 'Playfair Display', serif; font-size: 15px; font-weight: 700; color: var(--accent); white-space: nowrap; padding-bottom: 2px; }
    .mf-headers { display: grid; grid-template-columns: repeat(7, 32px); gap: 3px; margin-bottom: 3px; }
    .mf-headers div { text-align: center; font-size: 11px; color: var(--muted); }
    .mf-cells { display: grid; grid-template-columns: repeat(7, 32px); gap: 3px; }
    .mf-cell { height: 32px; border: 1px solid #B5B5B5; background: #F4EFE6; text-align: center; font-weight: 700; font-size: 14px; line-height: 30px; border-radius: 2px; color: #111; transition: background 0.2s; }
    /* Colores estándar internacionales de fotofinish — no adaptar al palette del SGH */
    .mf-2 { background: #F5DC1F; border-color: #C8B018; color: #111; }
    .mf-3 { background: #52A86A; border-color: #3D8050; color: #fff; }
    .mf-4 { background: #E1452F; border-color: #B5321F; color: #fff; }

    /* ── M.(F) + Sport — edit layout ── */
    .datos-layout { display: flex; gap: 20px; align-items: center; }
    .mf-rows-scroll { overflow-x: auto; min-width: 0; padding-bottom: 4px; }
    .mf-rows-scroll::-webkit-scrollbar { height: 4px; }
    .mf-rows-scroll::-webkit-scrollbar-track { background: rgba(0,0,0,0.1); }
    .mf-rows-scroll::-webkit-scrollbar-thumb { background: rgba(201,168,76,0.3); border-radius: 2px; }
    .favorito-block { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
    .favorito-block label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .mf-edit-row { display: flex; gap: 12px; align-items: center; }
    .mf-edit-lbl { width: 80px; flex-shrink: 0; font-family: 'Playfair Display', serif; font-size: 14px; font-weight: 700; color: var(--accent); white-space: nowrap; overflow: hidden; }
    .sport-cells { display: grid; grid-template-columns: repeat(7, 68px); gap: 3px; }
    .sport-cell-wrap { position: relative; width: 68px; height: 32px; }
    .sport-cell-wrap::before {
      content: "$"; position: absolute; left: 3px; top: 50%; transform: translateY(-50%);
      pointer-events: none; color: var(--muted); font-size: 10px;
      font-family: 'DM Sans', sans-serif; font-weight: 600; line-height: 1; z-index: 1;
    }
    .sport-cell-wrap:has(input:disabled)::before { opacity: 0.3; }
    .sport-cell {
      height: 32px; width: 68px; border: 1px solid rgba(201,168,76,0.35); background: rgba(255,255,255,0.04);
      color: var(--text); text-align: right; font-size: 11px; font-weight: 600; font-family: 'DM Sans', sans-serif;
      border-radius: 2px; padding: 0 4px 0 13px; outline: none; transition: border-color 0.15s;
      -moz-appearance: textfield; appearance: textfield;
    }
    .sport-cell::-webkit-inner-spin-button,
    .sport-cell::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    .sport-cell:focus { border-color: var(--accent); }
    .sport-cell:disabled { opacity: 0.3; cursor: default; }

    /* ── Tabs ── */
    .tabs { display: flex; gap: 2px; padding: 14px 22px 0; }
    .tab { padding: 6px 16px; border: 1px solid var(--border); border-bottom: none; font-size: 12px; font-weight: 500; cursor: pointer; color: var(--muted); border-radius: 8px 8px 0 0; background: rgba(0,0,0,0.1); transition: all 0.15s; }
    .tab.active { background: rgba(201,168,76,0.1); color: var(--accent); border-color: rgba(201,168,76,0.35); font-weight: 600; }
    .tab:hover:not(.active) { color: var(--text); }

    /* ═══ TABLA DENSA DE DIVIDENDOS ═══ */
    .divs-outer { margin: 0 22px; border: 1px solid var(--border); border-radius: 0 8px 8px 8px; overflow: hidden; }
    .divs-scroll { max-height: 360px; overflow-y: auto; }
    .divs-scroll::-webkit-scrollbar { width: 6px; }
    .divs-scroll::-webkit-scrollbar-track { background: rgba(0,0,0,0.15); }
    .divs-scroll::-webkit-scrollbar-thumb { background: rgba(201,168,76,0.3); border-radius: 3px; }
    table.divs { width: 100%; border-collapse: collapse; font-size: 12px; }
    table.divs thead { position: sticky; top: 0; z-index: 1; }
    table.divs thead th {
      background: rgba(0,0,0,0.4); padding: 7px 8px; font-weight: 600;
      color: var(--muted); font-size: 11px; text-transform: uppercase;
      letter-spacing: 0.5px; border-bottom: 1px solid var(--border); white-space: nowrap;
    }
    table.divs thead th.th-l { text-align: left; padding-left: 12px; }
    table.divs thead th.th-r { text-align: right; padding-right: 10px; }
    table.divs tbody td {
      padding: 3px 8px; border-bottom: 1px solid rgba(201,168,76,0.06);
      height: 26px; white-space: nowrap; vertical-align: middle;
    }
    table.divs tbody td.td-apu  { text-align: left; padding-left: 12px; font-weight: 700; color: var(--accent); font-size: 12px; }
    table.divs tbody td.td-r    { text-align: right; padding-right: 10px; font-variant-numeric: tabular-nums; color: var(--text); }
    table.divs tbody td.td-comp { text-align: left; font-family: 'DM Sans', sans-serif; color: var(--text); }
    table.divs tbody tr { cursor: pointer; transition: background 0.08s; }
    table.divs tbody tr:hover:not(.sel-row) { background: rgba(201,168,76,0.05); }
    table.divs tbody tr.sel-row { background: rgba(201,168,76,0.18); }
    table.divs tbody tr.sel-row td { color: var(--text); }
    .badge-vac { display: inline-block; background: rgba(224,82,82,0.15); color: #e09090; border: 1px solid rgba(224,82,82,0.25); border-radius: 5px; padding: 1px 7px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }

    /* ── Navegador ── */
    .nav-bar { display: flex; align-items: center; gap: 6px; background: rgba(0,0,0,0.2); border-top: 1px solid var(--border); padding: 6px 12px; }
    .nav-btn { width: 28px; height: 24px; background: rgba(255,255,255,0.04); border: 1px solid var(--border); color: var(--accent); font-size: 15px; cursor: pointer; border-radius: 6px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; line-height: 1; }
    .nav-btn:hover { background: rgba(201,168,76,0.15); border-color: rgba(201,168,76,0.5); }
    .nav-info { font-size: 12px; color: var(--muted); min-width: 64px; text-align: center; font-variant-numeric: tabular-nums; }

    /* ── Barra de acciones ── */
    .actions-bar { padding: 12px 22px; border-top: 1px solid var(--border); display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
    .actions-grp { display: flex; gap: 8px; align-items: center; }

    /* ── Status bar ── */
    .status-bar { padding: 8px 22px 14px; font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
    .status-ok { color: var(--success); }

    /* ── Resumen oficial — lista posiciones ── */
    .pos-list { list-style: none; }
    .pos-list li { display: flex; gap: 14px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--border); }
    .pos-num { font-family: 'Playfair Display', serif; font-size: 22px; color: var(--accent); min-width: 36px; }
    .pos-spc { font-weight: 600; font-size: 14px; }
    .pos-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .pos-div-badge { font-family: 'Playfair Display', serif; color: var(--success); font-weight: 600; font-size: 15px; margin-left: auto; }

    /* ── Modal CRUD ── */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 1000; display: none; align-items: flex-start; justify-content: center; padding: 40px 20px; overflow-y: auto; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--card); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 520px; margin: auto; }
    .modal-header { padding: 16px 22px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .modal-header h3 { font-family: 'Playfair Display', serif; font-size: 17px; color: var(--accent); }
    .btn-close { background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; padding: 0 4px; }
    .modal-body { padding: 18px 22px; }
    .modal-footer { padding: 14px 22px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-end; }
    .mg { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
    .mg label { font-size: 12px; font-weight: 500; color: var(--muted); }
    .mg input, .mg select { padding: 8px 12px; font-size: 13px; border-radius: 8px; }
    .mg-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .chk-row { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); margin-top: 4px; }
    .chk-row input[type=checkbox] { width: 15px; height: 15px; accent-color: var(--danger); }

    /* ── Pesos Balanza modal ── */
    .pb-th { text-align:left; padding:8px 14px; font-size:12px; color:var(--muted); font-weight:500; border-bottom:1px solid var(--border); }
    .pb-td { padding:8px 14px; font-size:13px; border-bottom:1px solid rgba(201,168,76,0.1); }
    .pb-input { width:80px; padding:6px 8px; font-size:13px; border-radius:8px; background:var(--input-bg); border:1px solid var(--border); color:var(--text); text-align:right; font-family:'DM Sans',sans-serif; }

    /* ── Div modal money input ── */

<script>
/* ═══════════════════════════════════════════════
   AUTH
═══════════════════════════════════════════════ */
let sb, CLUB_ID, currentUser;
async function initAuth(){const{createClient}=supabase;sb=createClient('https://unlhcuanfrtpatoipwve.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVubGhjdWFuZnJ0cGF0b2lwd3ZlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3MjQ0OTcsImV4cCI6MjA5MjMwMDQ5N30.rKb8BI7fBQcRdyyyxVfBOZbtCmGYKIMLUDLVmkn1SYM');const{data:{session}}=await sb.auth.getSession();if(!session){window.location.replace('login.html');return false;}const{data:usr}=await sb.from('usuarios').select('club_id,nombre_completo,rol').eq('email',session.user.email).single();if(usr.rol==='super_admin'){const urlClub=new URLSearchParams(window.location.search).get('club');CLUB_ID=urlClub||localStorage.getItem('sgh_selected_club_id')||usr.club_id||null;}else{if(!usr.club_id){await sb.auth.signOut();window.location.replace('login.html');return false;}CLUB_ID=usr.club_id;}currentUser={...session.user,nombre_completo:usr.nombre_completo,rol:usr.rol};const uEl=document.getElementById('user-name');if(uEl)uEl.textContent=usr.nombre_completo||session.user.email;document.getElementById('auth-overlay').style.display='none';return true;}
function logout(){ sb.auth.signOut().then(()=>window.location.replace('login.html')); }

/* ═══════════════════════════════════════════════
   ESTADO GLOBAL
═══════════════════════════════════════════════ */
let reuniones=[], carreras=[], inscripciones=[], resultados={}, posicionesMap={}, apuestasMap={}, carreraApuestasMap={};
let spcsMap={}, profsMap={};
let currentCarreraId = null;
let pendingApuestas  = [];     // copia local de resultado_apuestas (la edición)
let editIdx          = null;   // null=agregar, N=índice en pendingApuestas
let selIdx           = -1;     // fila seleccionada en la tabla
let loadedUpdatedAt  = null;   // updated_at del resultado al momento de cargarlo (optimistic lock)
let isDirty          = false;  // hay cambios sin aplicar
let chapaValues      = {};     // {posicion: {id, n}} — distancias entre puestos
let chapaOpenPos     = null;   // posición cuyo dropdown está abierto

/* ── Guard de cambios pendientes ── */
function guardDirty(fn) {
  if (!isDirty) { fn(); return; }
  if (confirm('Hay cambios sin aplicar. ¿Descartar y salir?')) { isDirty = false; fn(); }
}
function navigateToLista()     { guardDirty(() => renderLista()); }
function navigateToCarrera(id) { guardDirty(() => abrirResultado(id)); }
function navigateToReunion() {
  const sel  = document.getElementById('sel-reunion');
  const prev = sel?._prevValue ?? sel?.value;
  if (!isDirty) {
    if (sel) sel._prevValue = sel.value;
    loadReunion();
    return;
  }
  if (confirm('Hay cambios sin aplicar. ¿Descartar y salir?')) {
    isDirty = false;
    if (sel) sel._prevValue = sel.value;
    loadReunion();
  } else {
    if (sel && prev != null) { sel.value = prev; sel._prevValue = prev; }
  }
}
function navCarrera(delta) {
  if (!currentCarreraId) return;
  const idx     = carreras.findIndex(c => c.id === currentCarreraId);
  if (idx === -1) return;
  const newIdx  = Math.max(0, Math.min(carreras.length - 1, idx + delta));
  if (newIdx === idx) return;
  navigateToCarrera(carreras[newIdx].id);
}

/* ═══════════════════════════════════════════════
   FORMATTERS
═══════════════════════════════════════════════ */
function fNum(n) {
  if (n == null || n === '' || isNaN(n)) return '';
  return parseFloat(n).toLocaleString('es-AR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function toast(msg, type='success') {
  const t = document.createElement('div');
  t.className = `toast toast-${type}`;
  t.textContent = msg;
  document.getElementById('toast-container').appendChild(t);
  setTimeout(()=>t.remove(), 3500);
}

/* ═══════════════════════════════════════════════
   CARGA DE DATOS
═══════════════════════════════════════════════ */
async function init() {
  const [{ data: reuns }, { data: profs }, { data: spcs }] = await Promise.all([
    sb.from('reuniones').select('id,numero,fecha,estado,hipodromos(nombre)').eq('club_id', CLUB_ID).order('fecha', {ascending:false}),
    sb.from('profesionales').select('id,nombre,apellido').eq('club_id', CLUB_ID),
    sb.from('spcs').select('id,nombre').order('nombre'),
  ]);
  reuniones = reuns || [];
  (profs||[]).forEach(p => { profsMap[p.id] = p; });
  (spcs ||[]).forEach(s => { spcsMap[s.id]  = s; });

  const sel = document.getElementById('sel-reunion');
  sel.innerHTML = '<option value="">— Seleccionar —</option>' +
    reuniones.map(r => `<option value="${r.id}">Reunión ${r.numero||''} — ${new Date(r.fecha+'T12:00:00').toLocaleDateString('es-AR')} — ${r.hipodromos?.nombre||''}</option>`).join('');

  const rid = ActiveReunion.resolve(reuniones);
  if (rid) { sel.value = rid; sel._prevValue = rid; try { history.replaceState(null,'',`?reunion_id=${rid}`); } catch(_){} await loadReunion(); }
}

async function loadReunion() {
  const rid = document.getElementById('sel-reunion').value;
  if (rid) ActiveReunion.set(rid);
  const mc = document.getElementById('main-container');
  if (!rid) { mc.innerHTML='<div class="empty-state"><div class="icon">🏁</div><h3>Seleccionar una reunión</h3></div>'; return; }
  mc.innerHTML='<div class="loading-state"><div class="spinner"></div> Cargando…</div>';

  const { data: cars } = await sb.from('carreras').select('*').eq('reunion_id', rid).order('numero_turno');
  carreras = cars || [];
  if (!carreras.length) { mc.innerHTML='<div class="empty-state"><div class="icon">📋</div><h3>Sin carreras en esta reunión</h3></div>'; return; }

  const carIds = carreras.map(c=>c.id);
  const [{ data: inscs }, { data: resData }, { data: carApuData }] = await Promise.all([
    sb.from('inscripciones').select('*').in('carrera_id', carIds),
    sb.from('resultados').select('*').in('carrera_id', carIds),
    carIds.length ? sb.from('carrera_apuestas').select('*').in('carrera_id', carIds).order('orden') : Promise.resolve({ data: [] }),
  ]);
  inscripciones = inscs || [];
  resultados = {};
  carreraApuestasMap = {};
  (resData||[]).forEach(r => { resultados[r.carrera_id] = r; });
  (carApuData||[]).forEach(a => { (carreraApuestasMap[a.carrera_id] ??= []).push(a); });

  const resIds = (resData||[]).map(r=>r.id);
  const [{ data: posData }, { data: apuData }] = await Promise.all([
    resIds.length ? sb.from('resultado_posiciones').select('*').in('resultado_id', resIds) : { data: [] },
    resIds.length ? sb.from('resultado_apuestas').select('*').in('resultado_id', resIds).order('orden') : { data: [] },
  ]);
  posicionesMap = {};
  apuestasMap   = {};
  (posData||[]).forEach(p => { (posicionesMap[p.resultado_id] ??= []).push(p); });
  (apuData||[]).forEach(a => { (apuestasMap[a.resultado_id]   ??= []).push(a); });

  renderLista();
}

/* ═══════════════════════════════════════════════
   LISTA DE CARRERAS
═══════════════════════════════════════════════ */
function renderLista() {
  currentCarreraId = null;
  document.getElementById('main-container').innerHTML =
    `<div class="carreras-grid">${carreras.map(c => {
      const res   = resultados[c.id];
      const estado = res?.estado || 'sin_resultado';
      return `<div class="carrera-card ${estado}" onclick="abrirResultado('${c.id}')">
        <div class="cc-num">${c.numero_carrera_programa || c.numero_turno}</div>
        <div class="cc-name">${c.nombre || `Turno ${c.numero_turno}`}</div>
        <div class="cc-meta">${c.distancia_metros}m · ${c.tipo_pista||'—'}</div>
        <div class="cc-status"><span class="badge badge-${estado}">${estado.replace('_',' ')}</span></div>
        <button class="btn-outline" style="width:100%;font-size:12px;margin-top:2px;">
          ${estado==='sin_resultado'?'✏️ Cargar resultado':'🔍 Ver / editar'}
        </button>
      </div>`;
    }).join('')}</div>`;
}

/* ═══════════════════════════════════════════════
   ABRIR CARRERA
═══════════════════════════════════════════════ */
function abrirResultado(carreraId) {
  currentCarreraId = carreraId;
  const carrera = carreras.find(c=>c.id===carreraId);
  const res     = resultados[carreraId];
  const pos     = res ? (posicionesMap[res.id]||[]) : [];
  const apus    = res ? (apuestasMap[res.id]  ||[]) : [];
  const insc    = inscripciones.filter(i=>i.carrera_id===carreraId);
  if (res?.estado==='oficial') renderOficial(carrera, res, pos, apus, insc);
  else                          renderFormulario(carrera, res, pos, apus, insc);
}

/* ═══════════════════════════════════════════════
   FORMULARIO DE CARGA
═══════════════════════════════════════════════ */
function renderFormulario(carrera, res, pos, apus, insc) {
  isDirty          = false;
  pendingApuestas  = apus.map(a=>({...a}));
  selIdx           = -1;
  editIdx          = null;
  loadedUpdatedAt  = res?.updated_at || null;

  // Borrados
  const borradas = insc.filter(i=>['forfait','mal_inscrito'].includes(i.estado))
                       .sort((a,b)=>(a.numero_partidor||999)-(b.numero_partidor||999));
  const borradosTxt = borradas.length
    ? `${borradas.map(i=>i.numero_partidor).filter(Boolean).join('-')} (${insc.length})`
    : `Ninguno (${insc.length})`;

  // Mandil por puesto (desde posiciones guardadas)
  const mbp = {};
  pos.forEach(p => {
    const i = insc.find(x=>x.id===p.inscripcion_id);
    if (i?.numero_partidor) mbp[p.posicion] = i.numero_partidor;
  });
  // Puesto por mandil (inverso de mbp) — para M.(F) y Sport ordenados por mandil
  const pxm = {};
  Object.entries(mbp).forEach(([puesto, mandil]) => { pxm[mandil] = parseInt(puesto); });

  // Marcador HTML con chapa picker por puesto 2+
  chapaValues = {};
  const difMap = {};
  const divMap = {};
  (pos||[]).forEach(px => {
    if (px.diferencia) difMap[px.posicion] = px.diferencia;
    if (px.dividendo != null) divMap[px.posicion] = px.dividendo;
  });

  const activeInsc = insc.filter(i => !['forfait','mal_inscrito'].includes(i.estado));
  const rowCount   = Math.max(1, activeInsc.length);

  const marcRows = Array.from({length: rowCount}, (_, i) => {
    const p   = i + 1;
    const val = mbp[p] || '';
    let chapaCell = '<div></div>';
    if (p > 1) {
      const st = parseDif(difMap[p] || null);
      if (st) chapaValues[p] = st;
      const svg = chapaGetSvg(chapaValues[p]);
      const cod = chapaGetCodigo(chapaValues[p]) || '—';
      chapaCell = `<div class="chapa-wrap" id="chapa-wrap-${p}">
        <button type="button" class="chapa-btn" id="chapa-btn-${p}" onclick="openChapaDropdown(${p})">
          <span class="chapa-btn-icon" id="chapa-icon-${p}">${svg}</span>
          <span class="chapa-btn-code" id="chapa-code-${p}">${cod}</span>
          <span class="chapa-caret">▾</span>
        </button>
      </div>`;
    }
    return `<input class="marc-input" id="marc-${p}" type="number" min="1" max="30" value="${val}" oninput="onMarcInput()">
      ${chapaCell}`;
  }).join('');

  // Normalizar tiempo_ganador — formato viejo "M:SS:CC" → nuevo "M:SS.CC"
  const _tgRaw = res?.tiempo_ganador || '';
  const _tgOld = _tgRaw.match(/^(\d{1,2}):(\d{2}):(\d{2})$/);
  const _tgVal = _tgOld ? `${_tgOld[1]}:${_tgOld[2]}.${_tgOld[3]}` : _tgRaw;

  // Estado de pista options
  const pistaOpts = '<option value="">—</option>' +
    ['seca','humeda','fangosa','pesada'].map(v=>
      `<option value="${v}" ${res?.estado_pista===v?'selected':''}>${v.charAt(0).toUpperCase()+v.slice(1)}</option>`
    ).join('');

  // M.(F) — ordenado por MANDIL (1..N). Color = color SBARG del propio mandil.
  const mfColStyle = `grid-template-columns:repeat(${rowCount},68px)`;
  const mfCells = Array.from({length: rowCount}, (_, i) => {
    const m = i + 1;
    const { bg, fg } = partidorColor(m);
    const bdr = bg.toUpperCase() === '#FFFFFF' ? '#ccc' : bg;
    return `<div class="mf-cell" data-mandil="${m}" id="mf-${m}" style="background:${bg};color:${fg};border-color:${bdr}">${m}</div>`;
  }).join('');

  // Sport — ordenado por MANDIL (1..N). Dividendo = resultado_posiciones.dividendo del mandil M.
  const sportColStyle = `grid-template-columns:repeat(${rowCount},68px)`;
  const sportCells = Array.from({length: rowCount}, (_, i) => {
    const m = i + 1;
    const puesto = pxm[m] || null;
    const val = puesto != null && divMap[puesto] != null ? Number(divMap[puesto]).toFixed(2) : '';
    return `<div class="sport-cell-wrap"><input class="sport-cell" id="sport-${m}" type="number" step="0.01" min="0" value="${val}" placeholder="—"></div>`;
  }).join('');

  const _cIdx    = carreras.findIndex(c => c.id === carrera.id);
  const _isFirst = _cIdx <= 0;
  const _isLast  = _cIdx >= carreras.length - 1;

  document.getElementById('main-container').innerHTML = `
    <div class="res-panel">
      <!-- Header del panel -->
      <div class="res-panel-header">
        <div>
          <div class="res-panel-title">Carrera ${carrera.numero_turno}${carrera.nombre?' — '+carrera.nombre:''}</div>
          <div class="res-meta">${carrera.distancia_metros}m</div>
        </div>
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
          <span class="badge badge-${res?.estado||'sin_resultado'}">${(res?.estado||'sin resultado').replace('_',' ')}</span>
          <button class="btn-outline no-print" onclick="navCarrera(-1)" ${_isFirst?'disabled':''}>← Anterior</button>
          <span style="font-size:13px;color:var(--muted);min-width:60px;text-align:center;">Carrera ${_cIdx+1} / ${carreras.length}</span>
          <button class="btn-outline no-print" onclick="navCarrera(1)"  ${_isLast?'disabled':''}>Siguiente →</button>
          <button class="btn-outline no-print" onclick="navigateToLista()">← Carreras</button>
        </div>
      </div>

      <!-- Condiciones generales -->
      <div class="res-section">
        <div class="res-section-title">Condiciones de la carrera</div>
        <div class="form-row">
          <div class="form-group">
            <label>Estado de pista</label>
            <select id="estado-pista" style="min-width:120px;">${pistaOpts}</select>
          </div>
          <div class="form-group">
            <label>Tiempo del ganador</label>
            <input type="text" id="tg" class="tg-single" value="${_tgVal}" placeholder="MM:SS.CC" maxlength="8" autocomplete="off" oninput="tgAutoFormat(this)" onblur="tgOnBlur(this)">
          </div>
          <div class="form-group">
            <label>Incidentes</label>
            <input type="text" id="incidentes" value="${res?.incidentes||''}" placeholder="Notas…" style="min-width:240px;flex:1">

/* ─────────────────────────────────────────────
   CHAPA PICKER
───────────────────────────────────────────── */
function parseDif(str) {
  if (!str) return null;
  const vm = str.match(/^(\d+)\s*cpos$/i);
  if (vm) { const n = parseInt(vm[1],10); if (n >= 5) return {id:17, n}; }
  const ch = getChapaByCodigo(str);
  return ch ? {id:ch.id, n:null} : null;
}

function chapaGetCodigo(st) {
  if (!st) return null;
  if (st.id === 17) return st.n ? getVariosCodigo(st.n) : null;
  return getChapa(st.id)?.codigo || null;
}

function chapaGetSvg(st) {
  if (!st) return '';
  if (st.id === 17) return st.n ? renderVariosChapa(st.n) : '';
  return getChapa(st.id)?.svg || '';
}

function updateChapaBtn(p) {
  const st   = chapaValues[p];
  const icon = document.getElementById(`chapa-icon-${p}`);
  const code = document.getElementById(`chapa-code-${p}`);
  if (icon) icon.innerHTML  = chapaGetSvg(st);
  if (code) code.textContent = chapaGetCodigo(st) || '—';
}

function openChapaDropdown(p) {
  const dd  = document.getElementById('chapa-shared-dd');
  const btn = document.getElementById(`chapa-btn-${p}`);
  if (!dd || !btn) return;
  if (chapaOpenPos === p) { closeChapaDropdown(); return; }
  chapaOpenPos = p;
  const curId = chapaValues[p]?.id  || null;
  const curN  = chapaValues[p]?.n   || null;
  dd.innerHTML = CHAPAS_CATALOG.map(ch => {
    const sel = curId === ch.id ? 'sel' : '';
    if (ch.id === 17) {
      return `<div class="chapa-opt ${sel}" onclick="selectChapa(${p},17)">
        <span class="chapa-opt-icon">${renderVariosChapa(5)}</span>
        <span class="chapa-opt-nombre">${ch.nombre}</span>
        <span class="chapa-opt-code">N cpos</span>
      </div>
      <div class="chapa-varios-row">
        <input type="number" class="chapa-varios-inp" id="chapa-varios-input-${p}"
               min="5" placeholder="N≥5" value="${curN||''}"
               oninput="onVariosInput(${p})" onclick="event.stopPropagation()">
        <span style="font-size:11px;color:var(--muted)">cuerpos</span>
      </div>`;
    }
    return `<div class="chapa-opt ${sel}" onclick="selectChapa(${p},${ch.id})">
      <span class="chapa-opt-icon">${ch.svg||''}</span>
      <span class="chapa-opt-nombre">${ch.nombre}</span>
      <span class="chapa-opt-code">${ch.codigo||''}</span>
    </div>`;
  }).join('');
  const rect      = btn.getBoundingClientRect();
  const DD_MAX_H  = 300;
  const spaceBelow = window.innerHeight - rect.bottom - 4;
  dd.style.top  = (spaceBelow >= DD_MAX_H ? rect.bottom + 4 : Math.max(4, rect.top - DD_MAX_H - 4)) + 'px';
  dd.style.left = rect.left + 'px';
  dd.classList.add('open');
  if (curId === 17) setTimeout(() => document.getElementById(`chapa-varios-input-${p}`)?.focus(), 40);
}

function closeChapaDropdown() {
  document.getElementById('chapa-shared-dd')?.classList.remove('open');
  chapaOpenPos = null;
}

function selectChapa(p, id) {
  if (id === 17) {
    const inp = document.getElementById(`chapa-varios-input-${p}`);
    if (inp) { inp.focus(); inp.select(); }
    return;
  }
  chapaValues[p] = {id, n:null};
  updateChapaBtn(p);
  closeChapaDropdown();
  isDirty = true;
}

function onVariosInput(p) {
  const n = parseInt(document.getElementById(`chapa-varios-input-${p}`)?.value, 10);
  if (Number.isInteger(n) && n >= 5) {
    chapaValues[p] = {id:17, n};
    updateChapaBtn(p);
    isDirty = true;
  }
}



/* ═══════════════════════════════════════════════
   TIPO PISTA — INLINE EDIT
═══════════════════════════════════════════════ */
const TIPO_PISTA_DISPLAY = { cesped: 'césped' };
const TIPO_PISTA_VISIBLE = ['arena', 'cesped', 'tierra'];

function tipoPistaLabel(v) {
  return v ? (TIPO_PISTA_DISPLAY[v] || v) : '—';
}

function tipoPistaClick(carreraId) {
  const carrera = carreras.find(c => c.id === carreraId);
  if (!carrera) return;
  const labelEl = document.getElementById(`tp-label-${carreraId}`);
  if (!labelEl) return;

  const curVal = carrera.tipo_pista || '';
  const sel = document.createElement('select');
  sel.className = 'tp-select';
  sel.id = `tp-sel-${carreraId}`;

  // If current value is a legacy one not in the visible list, prepend it
  if (curVal && !TIPO_PISTA_VISIBLE.includes(curVal)) {
    const opt = document.createElement('option');
    opt.value = curVal; opt.textContent = curVal; opt.selected = true;
    sel.appendChild(opt);
  }
  TIPO_PISTA_VISIBLE.forEach(v => {
    const opt = document.createElement('option');
    opt.value = v; opt.textContent = TIPO_PISTA_DISPLAY[v] || v;
    if (v === curVal) opt.selected = true;
    sel.appendChild(opt);
  });

  let saving = false;

  sel.onchange = async () => {
    saving = true;
    const newVal = sel.value;
    const { error } = await sb.from('carreras').update({ tipo_pista: newVal }).eq('id', carreraId);
    if (error) {
      toast('Error al guardar tipo de pista: ' + error.message, 'error');
      saving = false;
      tipoPistaCollapse(carreraId, curVal);
      return;
    }
    carrera.tipo_pista = newVal;
    tipoPistaCollapse(carreraId, newVal);
    toast('✓ Tipo de pista guardado');
  };

  sel.onblur = () => { if (!saving) tipoPistaCollapse(carreraId, curVal); };

  labelEl.replaceWith(sel);
  sel.focus();
}

function tipoPistaCollapse(carreraId, val) {
  const selEl = document.getElementById(`tp-sel-${carreraId}`);
  if (!selEl) return;
  const span = document.createElement('span');
  span.className = 'tp-label';
  span.id = `tp-label-${carreraId}`;
  span.title = 'Clic para cambiar';
  span.textContent = tipoPistaLabel(val);
  span.onclick = () => tipoPistaClick(carreraId);
  selEl.replaceWith(span);
}

/* ── Tabla de dividendos ── */
function autoComp(a) {
  if (a.composicion) return a.composicion;
  const res = resultados[currentCarreraId];
  if (!res) return '';
  const posiciones = posicionesMap[res.id] || [];
  if (!posiciones.length) return '';
  const carreraInsc = inscripciones.filter(i => i.carrera_id === currentCarreraId)
    .sort((x, y) => (x.numero_partidor||999) - (y.numero_partidor||999));
  const mandilToChapa = {};
  carreraInsc.forEach((x, i) => { if (x.numero_partidor) mandilToChapa[x.numero_partidor] = i + 1; });
  const chapaAt = pos => {
    const p = posiciones.find(x => x.posicion === pos);
    if (!p) return null;
    const insc = carreraInsc.find(x => x.id === p.inscripcion_id);
    return insc ? (mandilToChapa[insc.numero_partidor] ?? null) : null;
  };
  const orden = a.orden || 1;
  switch (a.tipo) {
    case 'GAN': { const c=chapaAt(1);     return c!=null?String(c):''; }
    case 'SEG': { const c=chapaAt(orden); return c!=null?String(c):''; }
    case 'TER': { const c=chapaAt(orden); return c!=null?String(c):''; }
    case 'EX':  { const [c1,c2]=[chapaAt(1),chapaAt(2)]; return c1!=null&&c2!=null?`${c1}-${c2}`:''; }
    case 'IM':  { const [c1,c2]=[chapaAt(1),chapaAt(2)]; return c1!=null&&c2!=null?`${c1}/${c2}`:''; }
    case 'TR':  { const [c1,c2,c3]=[chapaAt(1),chapaAt(2),chapaAt(3)]; return c1!=null&&c2!=null&&c3!=null?`${c1}-${c2}-${c3}`:''; }
    case 'CUAT':{ const [c1,c2,c3,c4]=[chapaAt(1),chapaAt(2),chapaAt(3),chapaAt(4)]; return c1!=null&&c2!=null&&c3!=null&&c4!=null?`${c1}-${c2}-${c3}-${c4}`:''; }
    default: return '—';
  }
}

function renderTabla() {
  const tbody = document.getElementById('apu-tbody');
  if (!tbody) return;

  const filas = isReducida()
    ? pendingApuestas.filter(a => !a.vacante)
    : pendingApuestas;

  if (!filas.length) {
    tbody.innerHTML = '<tr><td colspan="6" style="padding:18px;text-align:center;color:var(--muted);">Sin apuestas cargadas. Usá Agregar.</td></tr>';
    document.getElementById('nav-info').textContent = '0 / 0';
    return;
  }

  const pendingIdxForFila = (filaIdx) => {
    if (!isReducida()) return filaIdx;
    const fila = filas[filaIdx];
    return pendingApuestas.indexOf(fila);
  };

  tbody.innerHTML = filas.map((a, fi) => {
    const pidx = pendingIdxForFila(fi);
    const sel  = pidx === selIdx ? 'sel-row' : '';
    const comp = autoComp(a);
    return `<tr class="${sel}" onclick="selectRow(${pidx})">
      <td class="td-apu">${DIV_NOMBRE[a.tipo] || a.tipo || ''}</td>
      <td class="td-r">${a.val_apu!=null ? '$ '+fNum(a.val_apu) : ''}</td>
      <td class="td-comp">${comp}</td>
      <td class="td-r">${a.div_orig!=null ? '$ '+fNum(a.div_orig) : ''}</td>
      <td class="td-r">${a.div_inc!=null  ? '$ '+fNum(a.div_inc)  : ''}</td>
      <td style="text-align:left;padding-left:6px;">${a.vacante ? '<span class="badge-vac">VACANTE</span>' : ''}</td>
    </tr>`;
  }).join('');

  document.getElementById('nav-info').textContent =
    `${selIdx >= 0 ? selIdx+1 : '—'} / ${pendingApuestas.length}`;

  if (selIdx >= 0 && selIdx < pendingApuestas.length) {
    const pidx = pendingApuestas.indexOf(filas.find((_,fi)=>pendingIdxForFila(fi)===selIdx));
    tbody.children[Math.max(0,pidx)]?.scrollIntoView({ block:'nearest' });
  }
}

function selectRow(pidx) { selIdx = pidx; renderTabla(); }

// Navegador — opera sobre pendingApuestas (no sobre la vista filtrada)
function navFirst() { if (pendingApuestas.length) selectRow(0); }
function navLast()  { if (pendingApuestas.length) selectRow(pendingApuestas.length-1); }
function navPrev()  { selectRow(Math.max(0, selIdx-1)); }
function navNext()  { selectRow(Math.min(pendingApuestas.length-1, selIdx+1)); }

/* ── Modal CRUD ── */
function openModal(idx) {
  editIdx = (typeof idx === 'number' && idx >= 0 && idx < pendingApuestas.length) ? idx : null;
  const a = editIdx !== null ? pendingApuestas[editIdx] : null;
  document.getElementById('modal-title').textContent = a ? 'Cambiar apuesta' : 'Agregar apuesta';
  document.getElementById('m-tipo').value   = a?.tipo       || 'EX';
  document.getElementById('m-val-apu').value = a?.val_apu   ?? 100;
  document.getElementById('m-comp').value   = a?.composicion || '';
  document.getElementById('m-pozo').value   = a?.pozo        ?? '';
  document.getElementById('m-vales').value  = a?.vales       ?? '';
  document.getElementById('m-dorig').value  = a?.div_orig    ?? '';
  document.getElementById('m-dinc').value   = a?.div_inc     ?? '';
  document.getElementById('m-vac').checked  = a?.vacante     || false;
  document.getElementById('modal-apuesta').classList.add('open');
  document.getElementById('m-comp').focus();
}
function closeModal() { document.getElementById('modal-apuesta').classList.remove('open'); }

function confirmApuesta() {
  const tipo = document.getElementById('m-tipo').value.trim();
  if (!tipo) { toast('Seleccioná un tipo', 'error'); return; }
  // GAN/SEG/TER: solo 1 por carrera (el caballo se deriva por JOIN con resultado_posiciones)
  if (['GAN','SEG','TER'].includes(tipo)) {
    const dup = pendingApuestas.some((a, i) => a.tipo === tipo && i !== editIdx);
    if (dup) { toast(`Ya existe un dividendo ${tipo} en esta carrera`, 'error'); return; }
  }
  const row = {
    tipo,
    val_apu:     parseFloat(document.getElementById('m-val-apu').value) || 0,
    composicion: document.getElementById('m-comp').value.trim() || null,
    pozo:        parseFloat(document.getElementById('m-pozo').value)  || null,
    vales:       parseInt(document.getElementById('m-vales').value)   || null,
    div_orig:    parseFloat(document.getElementById('m-dorig').value) || null,
    div_inc:     parseFloat(document.getElementById('m-dinc').value)  || null,
    vacante:     document.getElementById('m-vac').checked,
  };
  if (editIdx !== null) {
    pendingApuestas[editIdx] = { ...pendingApuestas[editIdx], ...row };
    selIdx = editIdx;
  } else {
    pendingApuestas.push(row);
    selIdx = pendingApuestas.length - 1;
  }
  closeModal();
  isDirty = true;
  renderTabla();
  setStatus(`${editIdx!==null?'Apuesta modificada':'Apuesta agregada'} — pendiente Aplicar`);
}

function deleteApuesta() {
  if (selIdx < 0 || selIdx >= pendingApuestas.length) { toast('Seleccioná una fila primero','error'); return; }
  const a = pendingApuestas[selIdx];
  if (!confirm(`¿Eliminar fila "${a.tipo} ${a.composicion||''}"?`)) return;
  pendingApuestas.splice(selIdx, 1);
  selIdx = Math.min(selIdx, pendingApuestas.length - 1);
  isDirty = true;
  renderTabla();
  setStatus('Apuesta eliminada — pendiente Aplicar');
}

let divModalDirty = false;

const DIV_NOMBRE = {
  GAN:'Ganador', SEG:'Segundo', TER:'Tercero',
  EX:'Exacta', IM:'Imperfecta', TR:'Trifecta', CUAT:'Cuatrifecta',
  X2:'Doble', X2P:'Doble a Place', X3:'Triplo', X4:'Cuaterna', X5:'Quíntuplo', CAD:'Cadena',
};
const DIV_ORDER = ['GAN','SEG','TER','EX','IM','TR','CUAT','X2','X2P','X3','X4','X5','CAD'];
const DIV_SLOTS = { SEG:2, TER:3 }; // resto: 1

function openDivModal() {
  const res = resultados[currentCarreraId];
  if (!res) { toast('Guardá el resultado primero', 'error'); return; }

  const carrera = carreras.find(c => c.id === currentCarreraId);
  const num = carrera?.numero_carrera_programa || carrera?.numero_turno || '?';
  document.getElementById('div-modal-title').textContent = `Dividendos — C° N° ${num}`;

  const habilitadas = (carreraApuestasMap[currentCarreraId] || [])
    .filter(a => a.precio > 0)
    .sort((a, b) => DIV_ORDER.indexOf(a.tipo) - DIV_ORDER.indexOf(b.tipo));

  const body = document.getElementById('div-modal-body');
  if (!habilitadas.length) {
    body.innerHTML = '<p style="color:var(--muted);font-size:13px;padding:8px 0;">No hay apuestas habilitadas para esta carrera. Cargalas primero en programa.</p>';
  } else {
    const byTipo = {};
    for (const a of pendingApuestas) (byTipo[a.tipo] ??= []).push(a);

    const POS   = ['GAN','SEG','TER'];
    const COMBI = ['EX','IM','TR','CUAT'];
    const MULTI = ['X2','X2P','X3','X4','X5','CAD'];
    const habPOS   = habilitadas.filter(a => POS.includes(a.tipo));
    const habCOMBI = habilitadas.filter(a => COMBI.includes(a.tipo));
    const habMULTI = habilitadas.filter(a => MULTI.includes(a.tipo));

    const SEP = '<div style="border-top:1px solid var(--border);margin:16px 0 12px;"></div>';
    const secTitle = t => `<div style="font-size:10px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.7px;margin-bottom:8px;">${t}</div>`;

    const parts = [];

    // Chapa lookup para posicionales
    const posiciones = posicionesMap[res.id] || [];
    const carreraInsc = inscripciones.filter(i => i.carrera_id === currentCarreraId)
      .sort((x, y) => (x.numero_partidor||999) - (y.numero_partidor||999));
    const mandilToChapa = {};
    carreraInsc.forEach((x, idx) => { if (x.numero_partidor) mandilToChapa[x.numero_partidor] = idx + 1; });
    const chapaForPos = pos => {
      const p = posiciones.find(x => x.posicion === pos);
      if (!p) return null;
      const insc = carreraInsc.find(x => x.id === p.inscripcion_id);
      return insc ? (mandilToChapa[insc.numero_partidor] ?? null) : null;
    };
    const chapaChip = chapa => {
      if (chapa == null) return `<div style="width:28px;height:28px;border-radius:4px;background:var(--border);flex-shrink:0;"></div>`;
      const { bg, fg } = partidorColor(chapa);
      const bdr = bg.toUpperCase() === '#FFFFFF' ? '1px solid #000' : '1px solid transparent';
      return `<div style="width:28px;height:28px;border-radius:4px;background:${bg};color:${fg};border:${bdr};display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;">${chapa}</div>`;
    };
    const moneyInput = (id, val) =>
      `<div class="div-money"><span style="font-size:11px;color:var(--muted);">$</span><input type="number" id="${id}" value="${val}" placeholder="0" min="0" step="0.01"></div>`;

    if (habPOS.length) {
      const cols = habPOS.map(a => {
        const slots = DIV_SLOTS[a.tipo] || 1;
        const existing = byTipo[a.tipo] || [];
        const inputs = Array.from({ length: slots }, (_, i) => {
          const val = existing[i]?.div_orig ?? '';
          const chip = chapaChip(chapaForPos(i + 1));
          return `<div style="display:flex;align-items:center;gap:6px;margin-bottom:${i < slots-1 ? '8px' : '0'};">
            ${chip}${moneyInput(`div-${a.tipo}-${i+1}`, val)}
          </div>`;
        }).join('');
        return `<div style="display:flex;flex-direction:column;gap:2px;">
          <div style="font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:0.6px;margin-bottom:6px;">${DIV_NOMBRE[a.tipo]}</div>
          ${inputs}
        </div>`;
      }).join('');
      parts.push(`<div style="display:flex;gap:20px;">${cols}</div>`);
    }

    const rowSection = (list) => list.map(a => {
      const val = (byTipo[a.tipo] || [])[0]?.div_orig ?? '';
      return `<div style="display:flex;align-items:center;gap:12px;padding:5px 0;">
        <div style="width:130px;font-size:13px;color:var(--text);">${DIV_NOMBRE[a.tipo]}</div>
        ${moneyInput(`div-${a.tipo}-1`, val)}
      </div>`;
    }).join('');

    if (habCOMBI.length) parts.push(secTitle('Combinatoriales') + rowSection(habCOMBI));
    if (habMULTI.length) parts.push(secTitle('Multi-carrera')   + rowSection(habMULTI));

    body.innerHTML = parts.join(SEP);
  }

  divModalDirty = false;
  document.getElementById('div-modal-body').addEventListener('input', () => { divModalDirty = true; }, { once: false, capture: false });
  document.getElementById('modal-div').classList.add('open');
}

function closeDivModal() {
  if (divModalDirty && !confirm('Hay dividendos sin guardar. ¿Cerrar de todas formas?')) return;
  divModalDirty = false;
  document.getElementById('modal-div').classList.remove('open');
}

async function saveDivModal() {
  const res = resultados[currentCarreraId];
  if (!res) return;

  const habilitadas = (carreraApuestasMap[currentCarreraId] || [])
    .filter(a => a.precio > 0)
    .sort((a, b) => DIV_ORDER.indexOf(a.tipo) - DIV_ORDER.indexOf(b.tipo));
  if (!habilitadas.length) { closeDivModal(); return; }

  const newRows = [];
  for (const a of habilitadas) {
    const slots = DIV_SLOTS[a.tipo] || 1;
    for (let i = 0; i < slots; i++) {
      const raw = document.getElementById(`div-${a.tipo}-${i+1}`)?.value?.trim();
      if (!raw) continue;
      const val = parseFloat(raw);
      if (val <= 0) { toast('El dividendo debe ser mayor a $0', 'error'); return; }
      newRows.push({ resultado_id: res.id, tipo: a.tipo, div_orig: val, orden: i + 1,
                     val_apu: a.precio || 100, vacante: false });
    }
  }
  if (!newRows.length) { toast('Cargá al menos un dividendo', 'error'); return; }

  const btn = document.getElementById('btn-save-div');
  btn.disabled = true; btn.textContent = 'Guardando…';

  const tipos = [...new Set(newRows.map(r => r.tipo))];
  const { error: delErr } = await sb.from('resultado_apuestas')
    .delete().eq('resultado_id', res.id).in('tipo', tipos);
  if (delErr) {
    toast('Error al borrar: ' + delErr.message, 'error');
    btn.disabled = false; btn.textContent = 'Guardar'; return;
  }

  const { error: insErr } = await sb.from('resultado_apuestas')
    .insert(newRows.map(({ resultado_id, tipo, div_orig, orden, val_apu, vacante }) =>
      ({ resultado_id, tipo, div_orig, orden, val_apu, vacante })));
  if (insErr) {
    toast('Error al guardar: ' + insErr.message, 'error');
    btn.disabled = false; btn.textContent = 'Guardar'; return;
  }

  // Merge quirúrgico en pendingApuestas: actualiza div_orig por tipo/slot,
  // preserva composicion/pozo/vales/etc. de filas existentes
  const byTipo = {};
  for (const a of pendingApuestas) (byTipo[a.tipo] ??= []).push(a);
  for (const row of newRows) {
    const existingList = byTipo[row.tipo] || [];
    const existing = existingList[row.orden - 1];
    if (existing) {
      existing.div_orig = row.div_orig;
      existing.orden = row.orden;
    } else {
      pendingApuestas.push({ ...row });
      (byTipo[row.tipo] ??= []).push(row);
    }
  }

  // Sincronizar apuestasMap
  if (!apuestasMap[res.id]) apuestasMap[res.id] = [];
  for (const row of newRows) {
    const idx = apuestasMap[res.id].findIndex(a => a.tipo === row.tipo && a.orden === row.orden);
    if (idx >= 0) apuestasMap[res.id][idx].div_orig = row.div_orig;
    else apuestasMap[res.id].push({ ...row });
  }

  btn.disabled = false; btn.textContent = 'Guardar';
  divModalDirty = false;
  renderTabla();
  toast('Dividendos guardados');
  closeDivModal();
}

/* ── Tiempo del ganador — input único ── */
function tgAutoFormat(el) {
  let v = el.value.replace(/[^\d:.]/g, '');
  // Rebuild from digits while the dot hasn't been inserted yet
  // (once the dot is present the user may be editing; just strip invalid chars)
  if (!v.includes('.')) {
    const d = v.replace(/\D/g, '').slice(0, 6);
    if      (d.length >= 5) v = d.slice(0,2) + ':' + d.slice(2,4) + '.' + d.slice(4);
    else if (d.length >= 3) v = d.slice(0,2) + ':' + d.slice(2);
    else                    v = d;
  }
  if (el.value !== v) el.value = v;
  el.classList.remove('tg-invalid');
}

function tgOnBlur(el) {
  const v = el.value.trim();
  if (!v) { el.classList.remove('tg-invalid'); return; }
  const m = v.match(/^(\d{1,2}):(\d{1,2})\.(\d{1,2})$/);
  if (m) {
    const sec = parseInt(m[2], 10), cent = parseInt(m[3], 10);
    if (sec <= 59 && cent <= 99) {
      el.value = `${String(parseInt(m[1],10)).padStart(2,'0')}:${String(sec).padStart(2,'0')}.${String(cent).padStart(2,'0')}`;
      el.classList.remove('tg-invalid');
      return;
    }
  }
  el.classList.add('tg-invalid');
}

function getTiempoGanador() {
  const el = document.getElementById('tg');
  if (!el) return null;
  const v = el.value.trim();
  if (!v) return null;
  if (!v.match(/^(\d{1,2}):([0-5]\d)\.(\d{2})$/)) return false;
  return v;
}

async function aplicar(carreraId, estado) {
  const estadoPista = document.getElementById('estado-pista')?.value || null;
  const tiempoGan   = getTiempoGanador();
  if (tiempoGan === false) {
    toast('Tiempo inválido — formato esperado MM:SS.CC (ej: 01:32.45)', 'error');
    const tgEl = document.getElementById('tg');
    if (tgEl) { tgEl.classList.add('tg-invalid'); tgEl.focus(); }
    return;
  }
  const incidentes   = document.getElementById('incidentes')?.value.trim()     || null;
  const favVal       = document.getElementById('favorito-mandil')?.value;
  const favorito_mandil = favVal ? parseInt(favVal,10) : null;

  const redistribucion_legs = resultados[carreraId]?.redistribucion_legs || {};

  const res  = resultados[carreraId];
  const insc = inscripciones.filter(i=>i.carrera_id===carreraId);

  // Posiciones: marcador → inscripcion_id (validación local antes de llamar la RPC)
  const posData = [];
  const usados  = new Set();
  for (let p=1; p<=20; p++) {
    const raw = document.getElementById(`marc-${p}`)?.value?.trim();
    if (!raw) continue;
    const mandil = parseInt(raw);
    if (isNaN(mandil)) continue;
    if (usados.has(mandil)) { toast(`Mandil ${mandil} duplicado en el marcador`,'error'); return; }
    usados.add(mandil);
    const inscr = insc.find(i=>i.numero_partidor===mandil);
    if (!inscr) { toast(`Mandil ${mandil} no encontrado entre los inscriptos`,'error'); return; }
    const divRaw = document.getElementById(`sport-${mandil}`)?.value?.trim();
    const dividendo = divRaw ? parseFloat(divRaw) : null;
    posData.push({ inscripcion_id:inscr.id, posicion:p, descalificado:false, empate:false,
                   diferencia: p === 1 ? null : (chapaGetCodigo(chapaValues[p]) || null),
                   dividendo });
  }

  const apuestasArr = pendingApuestas.map((a,i) => ({
    tipo:a.tipo, val_apu:a.val_apu, composicion:a.composicion||null,
    pozo:a.pozo||null, vales:a.vales||null,
    div_orig:a.div_orig||null, div_inc:a.div_inc||null,
    vacante:a.vacante||false, orden:i+1,
  }));

  const { data: rpcData, error: rpcErr } = await sb.rpc('aplicar_resultado', {
    p_resultado_id:        res?.id || null,
    p_expected_updated_at: loadedUpdatedAt,
    p_carrera_id:          carreraId,
    p_estado:              estado,
    p_estado_pista:        estadoPista,
    p_tiempo_ganador:      tiempoGan,
    p_incidentes:          incidentes,
    p_favorito_mandil:     favorito_mandil,
    p_redistribucion_legs: Object.keys(redistribucion_legs).length ? redistribucion_legs : null,
    p_posiciones:          posData,
    p_apuestas:            apuestasArr,
  });

  if (rpcErr) {
    if (rpcErr.message?.includes('CONCURRENT_MODIFICATION')) {
      toast('Otro operador modificó este resultado. Recargá antes de guardar.', 'error');
    } else {
      toast('Error al guardar: ' + rpcErr.message, 'error');
    }
    return;
  }

  const resId = rpcData.resultado_id;
  loadedUpdatedAt = rpcData.updated_at;
  resultados[carreraId] = { ...(resultados[carreraId] || {}), id: resId, updated_at: rpcData.updated_at, carrera_id: carreraId, estado };
  posicionesMap[resId] = posData;
  const rows = apuestasArr.map(a => ({ ...a, resultado_id: resId }));
  apuestasMap[resId] = rows;
  pendingApuestas = rows.map(r=>({...r}));

  isDirty = false;
  const msg = estado==='provisional' ? 'Resultado provisional guardado' : 'Guardado';
  toast(msg);
  setStatus(`✓ ${msg} — ${new Date().toLocaleTimeString('es-AR')}`);
  renderTabla();
}

async function cancelar(carreraId) {
  isDirty = false;
  await loadReunion();
  if (carreraId) abrirResultado(carreraId);
}

═══════════════════════════════════════════════ */
async function oficializar(carreraId) {
  if (!confirm('⚠️ Esta acción es irreversible. ¿Hacer oficial el resultado?')) return;
  await aplicar(carreraId, 'oficial');
  const res = resultados[carreraId];
  if (res?.estado !== 'oficial') return;

  const posiciones = posicionesMap[res.id] || [];
  const inscs = inscripciones.filter(i=>i.carrera_id===carreraId);
  const carrera = carreras.find(c=>c.id===carreraId);
  const { data: reun } = await sb.from('reuniones').select('fecha,hipodromos(nombre,sigla)').eq('id', document.getElementById('sel-reunion').value).single();
  const perfInserts = posiciones.map(pos => {
    const insc = inscs.find(i=>i.id===pos.inscripcion_id);
    if (!insc) return null;
    return { spc_id:insc.spc_id, carrera_id:carreraId, fecha_carrera:reun?.fecha,
      hipodromo_sigla:reun?.hipodromos?.sigla||'', hipodromo_nombre:reun?.hipodromos?.nombre||'',
      numero_carrera:carrera?.numero_turno, distancia_metros:carrera?.distancia_metros,
      tipo_pista:carrera?.tipo_pista, posicion:pos.posicion, tiempo_ganador:res?.tiempo_ganador,
      diferencia:pos.diferencia, peso_llevado:insc.peso_final||insc.peso_declarado,
      jockey_id:insc.jockey_titular_id, descalificado:pos.descalificado, fuente:'local' };
  }).filter(Boolean);
  if (perfInserts.length) {
    await sb.from('performances').delete().eq('carrera_id', carreraId);
    await sb.from('performances').insert(perfInserts);
  }
  toast('✅ Resultado oficial');
  abrirResultado(carreraId);
}

async function modificarOficial(resId, carreraId) {
  if (!confirm('⚠️ Modificar un resultado oficial queda registrado en auditoría. ¿Continuar?')) return;
  const { error } = await sb.from('resultados').update({ estado:'provisional' }).eq('id', resId);
  if (error) { toast(error.message,'error'); return; }
  resultados[carreraId] = {...resultados[carreraId], estado:'provisional'};
  abrirResultado(carreraId);
}

/* ─── Pesos Balanza ──────────────────────────────────────────────────────── */
let pbOriginal = {};

function openPesoBalanza() {
  if (!currentCarreraId) return;
  const carrera = carreras.find(c => c.id === currentCarreraId);
  const insc = inscripciones
    .filter(i => i.carrera_id === currentCarreraId && !['forfait','mal_inscrito'].includes(i.estado))
    .sort((a,b) => (a.numero_partidor||999) - (b.numero_partidor||999));

  document.getElementById('pb-title').textContent =
    `Pesos balanza — Carrera N° ${carrera?.numero_turno ?? '?'}`;

  pbOriginal = {};
  document.getElementById('pb-tbody').innerHTML = insc.map((i, idx) => {
    const spc  = spcsMap[i.spc_id];
    const val  = i.peso_balanza != null ? i.peso_balanza : '';
    pbOriginal[i.id] = val === '' ? null : Number(val);
    return `<tr>
      <td class="pb-td">${idx + 1}</td>
      <td class="pb-td" style="font-weight:600;">${spc?.nombre || '—'}</td>
      <td class="pb-td" style="text-align:right;">
        <input class="pb-input" type="number" id="pb-${i.id}"
               value="${val}" step="0.5" min="300" max="600" placeholder="—" autocomplete="off">
      </td>
    </tr>`;
  }).join('');

  document.getElementById('modal-peso-balanza').classList.add('open');
}

function _pbHasChanges() {
  return Object.keys(pbOriginal).some(id => {
    const raw = document.getElementById(`pb-${id}`)?.value.trim() ?? '';
    const cur = raw === '' ? null : Number(raw);
    return cur !== pbOriginal[id];
  });
}

function closePesoBalanza() {
  if (_pbHasChanges() && !confirm('Hay cambios sin guardar. ¿Cerrar de todas formas?')) return;
  document.getElementById('modal-peso-balanza').classList.remove('open');
}

async function savePesoBalanza() {
  const insc = inscripciones.filter(i =>
    i.carrera_id === currentCarreraId && !['forfait','mal_inscrito'].includes(i.estado)
  );
  const updates = [];
  for (const i of insc) {
    const raw = document.getElementById(`pb-${i.id}`)?.value.trim() ?? '';
    const val = raw === '' ? null : parseFloat(raw);
    if (val !== pbOriginal[i.id]) updates.push({ id: i.id, peso_balanza: val });
  }
  if (!updates.length) {
    document.getElementById('modal-peso-balanza').classList.remove('open');
    return;
  }
  const errors = [];
  for (const u of updates) {
    const { error } = await sb.from('inscripciones').update({ peso_balanza: u.peso_balanza }).eq('id', u.id);
    if (error) errors.push(error);
    else {
      const local = inscripciones.find(i => i.id === u.id);
      if (local) local.peso_balanza = u.peso_balanza;
    }
  }
  if (errors.length) { toast(`Error al guardar ${errors.length} peso(s)`, 'error'); return; }
  toast('Pesos guardados', 'success');
  document.getElementById('modal-peso-balanza').classList.remove('open');
}

   ARRANQUE
═══════════════════════════════════════════════ */
(async()=>{ if(await initAuth()) init(); })();
</script>
