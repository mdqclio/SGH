<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="logo32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="logo180x180.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0e2318">
  <title>Calendario Hípico — SGH</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0e2318; --card: #1a3d26; --accent: #c9a84c;
      --text: #f5f0e8; --muted: #a0b8a0; --danger: #e05252;
      --success: #4caf82; --border: rgba(201,168,76,0.2); --input-bg: #0e2318;
    }
    body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }
    h1,h2,h3 { font-family: 'Playfair Display', serif; }

    /* TOPBAR */
    .topbar { background: rgba(0,0,0,0.3); border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .btn-back { background: none; border: 1px solid var(--border); color: var(--muted); padding: 7px 14px; border-radius: 8px; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 13px; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; transition: all 0.2s; }
    .btn-back:hover { border-color: var(--accent); color: var(--accent); }
    .topbar-title { font-family: 'Playfair Display', serif; font-size: 20px; color: var(--accent); flex: 1; }
    .user-name { font-size: 13px; color: var(--muted); }
    .btn-logout { background: none; border: 1px solid var(--border); color: var(--muted); padding: 6px 14px; border-radius: 8px; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 13px; transition: all 0.2s; }
    .btn-logout:hover { border-color: var(--danger); color: var(--danger); }

    /* CONTENT */
    .content { max-width: 1200px; margin: 0 auto; padding: 28px 24px; }

    /* HEADER STATS */
    .cal-hero { display: flex; align-items: center; gap: 20px; margin-bottom: 28px; flex-wrap: wrap; }
    .cal-hero-num { font-family: 'Playfair Display', serif; font-size: 52px; font-weight: 700; color: var(--accent); line-height: 1; }
    .cal-hero-info { display: flex; flex-direction: column; gap: 3px; }
    .cal-hero-title { font-family: 'Playfair Display', serif; font-size: 22px; color: var(--text); }
    .cal-hero-sub { font-size: 13px; color: var(--muted); }

    /* GRILLA DE MESES */
    .cal-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
    @media (max-width: 900px) { .cal-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 500px) { .cal-grid { grid-template-columns: 1fr; } }

    .mes-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    .mes-header { padding: 10px 14px 8px; border-bottom: 1px solid var(--border); background: rgba(201,168,76,0.06); }
    .mes-nombre { font-family: 'Playfair Display', serif; font-size: 14px; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: 0.5px; }

    .mes-reuniones { padding: 8px 0; }
    .reunion-row { display: flex; align-items: center; gap: 10px; padding: 6px 14px; text-decoration: none; color: var(--text); transition: background 0.15s; }
    .reunion-row:hover { background: rgba(201,168,76,0.07); }

    /* CÍRCULOS */
    .cal-circle { width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: 'Playfair Display', serif; font-size: 14px; font-weight: 700; flex-shrink: 0; transition: transform 0.15s; }
    .reunion-row:hover .cal-circle { transform: scale(1.08); }
    .cal-circle-borrador   { background: #6b7280; color: #fff; }
    .cal-circle-programada { background: #c9a84c; color: #1a1a0a; }
    .cal-circle-publicada  { background: #4ade80; color: #0e2318; }
    .cal-circle-en_curso   { background: #60a5fa; color: #0e2318; }
    .cal-circle-finalizada { background: #059669; color: #fff; }
    .cal-circle-cancelada  { background: #e74c3c; color: #fff; }
    .cal-circle-suspendida { background: #f97316; color: #fff; }

    .reunion-label { display: flex; flex-direction: column; gap: 1px; }
    .reunion-label-main { font-size: 13px; font-weight: 500; }
    .reunion-label-tipo { font-size: 11px; color: var(--muted); text-transform: capitalize; }

    /* LEYENDA */
    .cal-leyenda { display: flex; gap: 24px; margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border); flex-wrap: wrap; }
    .leyenda-item { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
    .leyenda-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
    .leyenda-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }

    /* ESTADOS */
    .empty-state { text-align: center; padding: 60px 20px; }
    .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
    .empty-state h3 { font-size: 18px; color: var(--muted); }
    .loading-state { display: flex; align-items: center; justify-content: center; padding: 80px; gap: 12px; color: var(--muted); }
    .spinner { width: 26px; height: 26px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
    .toast { padding: 12px 20px; border-radius: 10px; font-size: 14px; font-weight: 500; max-width: 320px; animation: slideIn 0.3s ease; }
    .toast-success { background: #1a4a30; border: 1px solid var(--success); color: var(--text); }
    .toast-error { background: #4a1a1a; border: 1px solid var(--danger); color: var(--text); }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    #auth-overlay { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>
<div id="auth-overlay"><div class="spinner" style="width:32px;height:32px;border-width:3px;"></div></div>
<div id="toast-container"></div>

<div class="topbar">
  <a href="index.html" class="btn-back">← Volver</a>
  <h1 class="topbar-title" id="page-title">Calendario Hípico</h1>
  <span class="user-name" id="user-name"></span>
  <button class="btn-logout" onclick="logout()">Cerrar sesión</button>
</div>

<div class="content">
  <div id="cal-container">
    <div class="loading-state"><div class="spinner"></div> Cargando calendario…</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
let sb, CLUB_ID, currentUser;
async function initAuth(){const{createClient}=supabase;sb=createClient('https://unlhcuanfrtpatoipwve.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVubGhjdWFuZnJ0cGF0b2lwd3ZlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3MjQ0OTcsImV4cCI6MjA5MjMwMDQ5N30.rKb8BI7fBQcRdyyyxVfBOZbtCmGYKIMLUDLVmkn1SYM');const{data:{session}}=await sb.auth.getSession();if(!session){window.location.replace('login.html');return false;}const{data:usr}=await sb.from('usuarios').select('club_id,nombre_completo,rol').eq('email',session.user.email).single();if(usr.rol==='super_admin'){const urlClub=new URLSearchParams(window.location.search).get('club');CLUB_ID=urlClub||usr.club_id||null;}else{if(!usr.club_id){await sb.auth.signOut();window.location.replace('login.html');return false;}CLUB_ID=usr.club_id;}currentUser={...session.user,nombre_completo:usr.nombre_completo,rol:usr.rol};const uEl=document.getElementById('user-name');if(uEl)uEl.textContent=usr.nombre_completo||session.user.email;document.getElementById('auth-overlay').style.display='none';return true;}
function logout(){sb.auth.signOut().then(()=>window.location.replace('login.html'));}

function toast(msg, type='success') {
  const t=document.createElement('div'); t.className=`toast toast-${type}`; t.textContent=msg;
  document.getElementById('toast-container').appendChild(t); setTimeout(()=>t.remove(),3500);
}

async function load() {
  if (!CLUB_ID) {
    document.getElementById('cal-container').innerHTML = '<div class="empty-state"><div class="icon">📅</div><h3>Sin hipódromo asignado</h3></div>';
    return;
  }

  const currentYear = new Date().getFullYear();
  document.getElementById('page-title').textContent = `Calendario Hípico ${currentYear}`;

  // Traer todas las reuniones del club y filtrar por año en JS
  // Evita problemas de timezone o formato de fecha en el servidor
  const { data: todasReuns, error } = await sb.from('reuniones')
    .select('id, fecha, estado, numero, tipo')
    .eq('club_id', CLUB_ID)
    .order('fecha');

  if (error) { toast(error.message, 'error'); return; }

  // Filtrar por año actual: leer los primeros 4 caracteres del string
  // Evita cualquier conversión de timezone (new Date() convierte a UTC
  // y puede cambiar el año para fechas en enero en UTC-3)
  const reuns = (todasReuns || []).filter(r => {
    if (!r.fecha) return false;
    return parseInt(r.fecha.substring(0, 4)) === currentYear;
  });

  if (!reuns.length) {
    document.getElementById('cal-container').innerHTML = `
      <div class="empty-state">
        <div class="icon">📅</div>
        <h3>Sin reuniones en ${currentYear}</h3>
        <p style="color:var(--muted);margin-top:8px;">No hay reuniones programadas para este año.</p>
      </div>`;
    return;
  }

  const MESES = ['Enero','Febrero','Marzo','Abril','Mayo','Junio',
                 'Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];

  // Ordenar: programada primero, luego borrador, luego el resto por fecha ASC
  const PRIORIDAD = { programada: 0, borrador: 1 };
  reuns.sort((a, b) => {
    const pa = PRIORIDAD[a.estado] ?? 2;
    const pb = PRIORIDAD[b.estado] ?? 2;
    if (pa !== pb) return pa - pb;
    return (a.fecha || '').localeCompare(b.fecha || '');
  });

  // Agrupar por mes
  const porMes = {};
  reuns.forEach(r => {
    const m = new Date(r.fecha + 'T12:00:00').getMonth();
    if (!porMes[m]) porMes[m] = [];
    porMes[m].push(r);
  });

  const mesesHtml = Object.entries(porMes).map(([mes, reuniones]) => {
    const filasHtml = reuniones.map(r => {
      const dia = new Date(r.fecha + 'T12:00:00').getDate();
      const CLS_MAP = {
        borrador: 'cal-circle-borrador', programada: 'cal-circle-programada',
        publicada: 'cal-circle-publicada', en_curso: 'cal-circle-en_curso',
        finalizada: 'cal-circle-finalizada', cancelada: 'cal-circle-cancelada',
        suspendida: 'cal-circle-suspendida',
      };
      const cls = CLS_MAP[r.estado] || 'cal-circle-borrador';
      const label = r.numero ? `Reunión N° ${r.numero}` : 'Reunión';
      return `<a class="reunion-row" href="carta-llamados.html?reunion_id=${r.id}">
        <div class="cal-circle ${cls}">${dia}</div>
        <div class="reunion-label">
          <span class="reunion-label-main">${label}</span>
          <span class="reunion-label-tipo">${r.tipo}</span>
        </div>
      </a>`;
    }).join('');

    return `<div class="mes-card">
      <div class="mes-header"><div class="mes-nombre">${MESES[parseInt(mes)]}</div></div>
      <div class="mes-reuniones">${filasHtml}</div>
    </div>`;
  }).join('');

  const leyenda = `<div class="cal-leyenda">
    <span class="leyenda-item"><span class="leyenda-dot" style="background:#c9a84c"></span>Programada</span>
    <span class="leyenda-item"><span class="leyenda-dot" style="background:#6b7280"></span>Borrador</span>
    <span class="leyenda-item"><span class="leyenda-dot" style="background:#4ade80"></span>Publicada</span>
    <span class="leyenda-item"><span class="leyenda-dot" style="background:#60a5fa"></span>En curso</span>
    <span class="leyenda-item"><span class="leyenda-dot" style="background:#059669"></span>Finalizada</span>
    <span class="leyenda-item"><span class="leyenda-dot" style="background:#e74c3c"></span>Cancelada</span>
    <span class="leyenda-item"><span class="leyenda-dot" style="background:#f97316"></span>Suspendida</span>
  </div>`;

  document.getElementById('cal-container').innerHTML = `
    <div class="cal-hero">
      <div class="cal-hero-num">${reuns.length}</div>
      <div class="cal-hero-info">
        <div class="cal-hero-title">Calendario Hípico ${currentYear}</div>
        <div class="cal-hero-sub">${reuns.length} reunión${reuns.length !== 1 ? 'es' : ''} programada${reuns.length !== 1 ? 's' : ''}</div>
      </div>
    </div>
    <div class="cal-grid">${mesesHtml}</div>
    ${leyenda}`;
}

(async()=>{if(await initAuth())load();})();
</script>
</body>
</html>
