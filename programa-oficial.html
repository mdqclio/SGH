<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8">

<link rel="stylesheet" href="styles.css">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;600;700&family=Inter:wght@600;700&display=swap" rel="stylesheet">
<style>
  /* Reset al estilo newsprint B&N */
  body { background:#fff; color:#000; font-family:'EB Garamond',Georgia,serif; font-size:11px; line-height:1.35; margin:0; padding:20px; }
  .programa-header h3, .carrera-left .nro, .bono, .programa-reunion-titulo, table.inscriptos thead th, .banner-proxima, .sponsors-titulo { font-family:'Inter','Helvetica Neue',Arial,sans-serif; letter-spacing:0.5px; }

  .programa-page { max-width: 21cm; margin: 0 auto; }

  .programa-header { display: grid; grid-template-columns: 1fr 1fr auto; gap: 20px; align-items: flex-start; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 8px; }
  .programa-header h3 { font-size: 11px; font-weight: 700; text-transform: uppercase; margin-bottom: 4px; letter-spacing: 0.3px; }
  .programa-header .lista { font-size: 10px; line-height: 1.4; }
  .programa-header .logo { text-align: right; }

  .carrera-block { margin-bottom: 16px; page-break-inside: avoid; }

  .bono { display: inline-block; background: #000; color: #fff; padding: 2px 5px; font-size: 8px; font-weight: 700; text-align: center; line-height: 1.15; }
  .bono-float { float: right; margin: 0 0 2px 8px; }
  .carrera-right { text-align: right; font-weight: 700; }
  .carrera-right .metros { font-size: 11.5px; }
  .carrera-right .categoria { font-size: 8.5px; margin-top: 2px; line-height: 1.2; }
  .carrera-center { font-size: 9.5px; line-height: 1.25; overflow: hidden; }
  .carrera-center .premio { font-weight: 700; text-transform: uppercase; }

  table.inscriptos { width: 100%; border-collapse: collapse; font-size: 9.5px; margin-top: 4px; }
  table.inscriptos thead th { border-bottom: 1px solid #000; padding: 2px 4px; text-align: left; font-weight: 700; text-transform: uppercase; letter-spacing: 0.3px; }
  table.inscriptos tbody td { padding: 2px 4px; vertical-align: top; }
  table.inscriptos tbody tr { border-bottom: none; }
  table.inscriptos .col-numero { text-align: center; font-weight: 700; width: 24px; }

  .pagina-final { padding-top: 20px; page-break-inside: avoid; }

  .secretaria-info { font-size: 11px; line-height: 1.5; margin-bottom: 30px; }
  .secretaria-info strong { font-weight: 700; }
  .redes-info { display: flex; justify-content: space-between; align-items: center; border-top: 2px solid #000; padding-top: 10px; font-size: 10px; }
  .redes-info .redes-list { display: flex; gap: 12px; }

  @media print {
    body { padding: 0; }
    .programa-page { max-width: none; }
    .no-print { display: none !important; }
    @page { size: A4; margin: 1.5cm 1.5cm 2cm 1.5cm; @bottom-center { content: "Página " counter(page) " de " counter(pages); font-family: 'Inter', sans-serif; font-size: 9px; color: #666; } }

  .banner-proxima { background:#000; color:#fff; text-align:center; padding:14px; font-size:18px; font-weight:700; margin:24px 0 16px; letter-spacing:1px; page-break-inside:avoid; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
  .sponsors-band { border-top:2px solid #000; border-bottom:2px solid #000; padding:14px 0; margin:20px 0; page-break-inside:avoid; }
  .sponsors-titulo { text-align:center; font-size:11px; font-weight:700; letter-spacing:1.5px; margin-bottom:10px; }
  .sponsors-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(140px, 1fr)); gap:14px; align-items:center; }

<script>
const sb = supabase.createClient('https://unlhcuanfrtpatoipwve.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVubGhjdWFuZnJ0cGF0b2lwd3ZlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3MjQ0OTcsImV4cCI6MjA5MjMwMDQ5N30.rKb8BI7fBQcRdyyyxVfBOZbtCmGYKIMLUDLVmkn1SYM');

const params = new URLSearchParams(location.search);
const reunionId = params.get('reunion_id');

function formatMonto(n) {
  if (n == null || isNaN(n)) return '$0';
  return '$' + Math.round(parseFloat(n)).toLocaleString('es-AR').replace(/,/g, '.');
}
function calcEdad(fecha) {
  if (!fecha) return '';
  const hoy = new Date(), f = new Date(fecha);
  let edad = hoy.getFullYear() - f.getFullYear();
  if (hoy.getMonth() < f.getMonth() || (hoy.getMonth() === f.getMonth() && hoy.getDate() < f.getDate())) edad--;
  return edad;
}
function pelajeCodigo(color) {
  if (!color) return '';
  const c = color.toLowerCase();
  if (c.startsWith('zaino')) return 'Z';
  if (c.startsWith('tordillo')) return 'T';
  if (c.startsWith('alazán') || c.startsWith('alazan')) return 'A';
  if (c.startsWith('colorado')) return 'C';
  if (c.startsWith('negro')) return 'N';
  if (c.startsWith('moro') || c.startsWith('mulato')) return 'M';
  return color.charAt(0).toUpperCase();
}
function sexoCodigo(sexo) {
  if (!sexo) return '';
  const s = sexo.toLowerCase();
  if (s.startsWith('castrado')) return 'C';
  if (s.startsWith('macho')) return 'M';
  if (s.startsWith('hembra')) return 'H';
  return sexo.charAt(0).toUpperCase();
}

async function load() {
  if (!reunionId) {
    document.getElementById('programa-page').innerHTML = '<div style="padding:40px;text-align:center;">No hay reunión seleccionada.</div>';
    return;
  }

  // 1) Reunión + hipódromo + club
  const { data: reunion } = await sb.from('reuniones')
    .select('*,hipodromos(nombre,sigla,localidad,provincia,club_id)')
    .eq('id', reunionId).single();
  if (!reunion) {
    document.getElementById('programa-page').innerHTML = '<div style="padding:40px;text-align:center;">Reunión no encontrada.</div>';
    return;
  }
  const clubId = reunion.hipodromos?.club_id || reunion.club_id;
  const { data: club } = await sb.from('clubs').select('*').eq('id', clubId).single();

  // 2) Carreras
  const { data: carreras } = await sb.from('carreras').select('*').eq('reunion_id', reunionId).neq('estado', 'anulada');
  const carIds = (carreras || []).map(c => c.id);

  // 3) Inscripciones y entidades relacionadas
  const { data: ins } = carIds.length
    ? await sb.from('inscripciones').select('*').in('carrera_id', carIds)
    : { data: [] };

  const spcIds   = [...new Set((ins || []).map(i => i.spc_id).filter(Boolean))];
  const jockIds  = [...new Set((ins || []).flatMap(i => [i.jockey_titular_id, i.jockey_suplente_id]).filter(Boolean))];
  const propIds  = [...new Set((ins || []).map(i => i.propietario_id).filter(Boolean))];
  const entrIds  = [...new Set((ins || []).map(i => i.entrenador_id).filter(Boolean))];
  const cabaIds  = [...new Set((ins || []).map(i => i.caballeriza_id).filter(Boolean))];
  const profIds  = [...new Set([...jockIds, ...entrIds])];

  const EMPTY = ['00000000-0000-0000-0000-000000000000'];
  const [{ data: spcs }, { data: profs }, { data: props }, { data: cabs }, { data: cats }] = await Promise.all([
    sb.from('spcs').select('id,nombre,sexo,color,fecha_nacimiento,padrillo_nombre,madre_nombre,ult_performances').in('id', spcIds.length ? spcIds : EMPTY),
    sb.from('profesionales').select('id,nombre,apellido').in('id', profIds.length ? profIds : EMPTY),
    sb.from('propietarios').select('id,nombre').in('id', propIds.length ? propIds : EMPTY),
    sb.from('caballerizas').select('id,nombre').in('id', cabaIds.length ? cabaIds : EMPTY),
    sb.from('categorias_carrera').select('id,nombre,codigo').eq('club_id', clubId),
  ]);

  const spcMap  = Object.fromEntries((spcs  || []).map(s => [s.id, s]));
  const profMap = Object.fromEntries((profs || []).map(p => [p.id, p]));
  const propMap = Object.fromEntries((props || []).map(p => [p.id, p]));
  const cabMap  = Object.fromEntries((cabs  || []).map(c => [c.id, c]));
  const catMap  = Object.fromEntries((cats  || []).map(c => [c.id, c]));

  const insByCarrera = {};
  (ins || []).forEach(i => { (insByCarrera[i.carrera_id] ??= []).push(i); });

  const { data: proxRe } = await sb.from('reuniones')
    .select('id,fecha,numero')
    .eq('club_id', clubId)
    .gt('fecha', reunion.fecha)
    .neq('estado', 'anulada')
    .order('fecha', { ascending: true })
    .limit(1);
  const proximaReunion = proxRe?.[0] || null;

  render(reunion, club, carreras || [], insByCarrera, { spcMap, profMap, propMap, cabMap, catMap }, proximaReunion);
}

function render(reunion, club, carreras, insByCarrera, maps, proximaReunion) {
  const { spcMap, profMap, propMap, cabMap, catMap } = maps;
  const fechaStr = new Date(reunion.fecha + 'T12:00:00').toLocaleDateString('es-AR', { day: 'numeric', month: 'long', year: 'numeric' });
  const comision    = Array.isArray(club?.comision_carreras) ? club.comision_carreras : [];
  const comisariato = Array.isArray(club?.comisariato)       ? club.comisariato       : [];
  const sponsors    = Array.isArray(club?.sponsors)          ? club.sponsors          : [];

  carreras.sort((a, b) => {
    const aN = a.numero_carrera_programa ?? a.numero_turno ?? 999;
    const bN = b.numero_carrera_programa ?? b.numero_turno ?? 999;
    return aN - bN;
  });

  const html = `
    <div class="programa-header">
      <div>
        <h3>Comisión de Carreras</h3>
        <div class="lista">${comision.map(m => `<div><strong>${m.cargo}:</strong> ${m.nombre}</div>`).join('') || '<em>—</em>'}</div>
      </div>
      <div>
        <h3>Comisariato</h3>
        <div class="lista">${comisariato.map(m => `<div><strong>${m.cargo}:</strong> ${m.nombre}</div>`).join('') || '<em>—</em>'}</div>
      </div>
      <div class="logo">
        ${club?.logo_url ? `<img src="${club.logo_url}" alt="logo">` : ''}
        <div class="nombre-hipodromo">${reunion.hipodromos?.nombre || club?.nombre || ''}</div>
      </div>
    </div>
    <div class="programa-reunion-titulo">Reunión N° ${reunion.numero || ''} — ${fechaStr}</div>

    ${carreras.map(c => renderCarrera(c, insByCarrera[c.id] || [], spcMap, profMap, propMap, cabMap, catMap)).join('')}

    ${proximaReunion ? `
      <div class="banner-proxima">
        PRÓXIMA REUNIÓN — ${new Date(proximaReunion.fecha+'T12:00:00').toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long',year:'numeric'}).toUpperCase()}
      </div>
    ` : ''}

    ${sponsors.length ? `
      <div class="sponsors-band">

            <div class="sponsor-item">
              ${s.logo_url ? `<img src="${s.logo_url}" alt="${(s.nombre||'').replace(/"/g,'&quot;')}">` : ''}
              <div class="sponsor-nombre">${s.nombre || ''}</div>

    ${club?.sponsor_destacado && club.sponsor_destacado.nombre ? `

            ${club.sponsor_destacado.subtitulo ? `<div class="sd-subtitulo">${club.sponsor_destacado.subtitulo}</div>` : ''}
          </div>
          <div>
            ${club.sponsor_destacado.direccion ? `<div class="sd-direccion">${club.sponsor_destacado.direccion}</div>` : ''}
            ${club.sponsor_destacado.contacto ? `<div class="sd-contacto">${club.sponsor_destacado.contacto}</div>` : ''}
          </div>
        </div>
        <div class="sd-foto ${club.sponsor_destacado.foto_url ? '' : 'sin-foto'}" ${club.sponsor_destacado.foto_url ? `style="background-image:url('${club.sponsor_destacado.foto_url}');"` : ''}></div>
      </div>
    ` : ''}

    <div class="pagina-final">
      ${club?.disclaimer_importante ? `<div class="disclaimer">${club.disclaimer_importante.replace(/\n/g, '<br>')}</div>` : ''}
      ${club?.disclaimer_nota ? `<div class="disclaimer"><strong>Nota:</strong> ${club.disclaimer_nota.replace(/\n/g, '<br>')}</div>` : ''}
      ${(club?.secretaria_carreras_nombre || club?.inscripciones_telefono) ? `
        <div class="secretaria-bloque">
          ${club.secretaria_carreras_nombre ? `<div><strong>Secretaría:</strong> ${club.secretaria_carreras_nombre}</div>` : ''}
          ${club.inscripciones_telefono ? `<div><strong>INSCRIPCIONES:</strong> Secretaría de Carreras — Teléfonos: ${club.inscripciones_telefono}</div>` : ''}
        </div>
      ` : ''}

        ${reunion.fechas_forfaits           ? `<div><strong>Forfaits:</strong> ${reunion.fechas_forfaits}</div>`                     : ''}
        ${reunion.fechas_compromiso_montas  ? `<div><strong>Compromiso de montas:</strong> ${reunion.fechas_compromiso_montas}</div>` : ''}
      </div>
      <div class="redes-info">

          ${club?.facebook  ? `<span>FB: ${club.facebook}</span>`        : ''}

  document.title = `Programa-Oficial-Reunion-${reunion.numero || ''}-${reunion.fecha || ''}`;
}

const APU_NOMBRE_LARGO = {
  GAN:'Ganador', SEG:'Segundo', TER:'Tercero',
  EX:'Exacta', IM:'Imperfecta', TR:'Trifecta', TE:'Tómbola Exacta', CUAT:'Cuatrifecta',
  X2:'Doble', X2P:'Doble a Place', X3:'Triplo', X4:'Cuaterna', X5:'Quíntuplo', CAD:'Cadena'
};
const APU_ORDEN = ['GAN','SEG','TER','EX','IM','TR','TE','CUAT','X2','X2P','X3','X4','X5','CAD'];
function formatApuestasText(c) {
  const hab = c.apuestas_habilitadas;
  if (hab && typeof hab === 'object' && Object.keys(hab).length > 0) {
    const tipos = APU_ORDEN.filter(t => t in hab);
    if (!tipos.length) return '';
    const grupos = [];
    for (const t of tipos) {
      const last = grupos[grupos.length - 1];
      if (last && last.precio === hab[t]) last.tipos.push(t);
      else grupos.push({ precio: hab[t], tipos: [t] });
    }
    const partes = grupos.map((g, gi) => {
      const noms = g.tipos.map(t => APU_NOMBRE_LARGO[t] || t);
      const lista = noms.length < 2 ? noms[0] : noms.slice(0,-1).join(', ') + ' y ' + noms[noms.length-1];
      const pref = g.tipos[0] === 'GAN' ? 'A ' : '';
      return (gi === 0 ? 'Apuestas: ' : '') + pref + lista + ' $' + g.precio + '.';
    });
    let txt = partes.join(' ');
    const notas = (c.apuestas_notas || '').trim();
    if (notas) txt += ' ' + notas;
    return txt;
  }
  if (Array.isArray(c.apuestas) && c.apuestas.length > 0)
    return c.apuestas.map(a => String(a).replace(/^\s*apuestas\s*:\s*/i, '').trim()).filter(Boolean).join(', ');
  return '';
}

function renderCarrera(c, ins, spcMap, profMap, propMap, cabMap, catMap) {
  const num  = c.numero_carrera_programa || c.numero_turno;
  const hora = c.hora_estimada ? String(c.hora_estimada).slice(0, 5) : '';
  const cat  = catMap[c.categoria_id];
  const dist = c.distribucion_premios || {};
  const bonoGanador  = dist.bono_ganador || 0;
  const apuestasText = formatApuestasText(c);
  const bolsa = parseFloat(c.bolsa_total) || 0;
  const { puestos: puestosEfectivos, bolsaEfectiva } = calcPremiosConPiso(bolsa, dist);
  const desglose = [1, 2, 3, 4, 5, 6].map(p => {
    const monto = puestosEfectivos[String(p)];
    return monto > 0 ? `${p}° ${formatMonto(monto)}` : null;
  }).filter(Boolean).join(' — ');

  const filas = (ins || [])
    .sort((a, b) => (a.numero_partidor || 999) - (b.numero_partidor || 999))
    .map((i, idx) => {
      const spc  = spcMap[i.spc_id]            || {};
      const jock = profMap[i.jockey_titular_id];
      const entr = profMap[i.entrenador_id];
      const prop = propMap[i.propietario_id];
      const cab  = cabMap[i.caballeriza_id];
      const edad = calcEdad(spc.fecha_nacimiento);
      const kesp = `${i.peso_declarado || ''} ${edad}${sexoCodigo(spc.sexo)} ${pelajeCodigo(spc.color)}`.trim();
      const padreMadre = `${(spc.padrillo_nombre || '').toUpperCase()}${spc.madre_nombre ? ` — ${spc.madre_nombre.toUpperCase()}` : ''}`;
      const caballeriza = (cab?.nombre || prop?.nombre || '').toUpperCase();
      return `<tr>
        <td>${caballeriza}</td>
        <td>${spc.ult_performances || ''}</td>
        <td class="col-numero">${idx + 1}</td>
        <td><strong>${(spc.nombre || '').toUpperCase()}</strong></td>
        <td>${jock ? `${jock.apellido || ''} ${jock.nombre || ''}`.trim().toUpperCase() : 'XX'}</td>
        <td class="col-kesp">${kesp}</td>
        <td>${padreMadre}</td>
        <td>${entr ? `${entr.apellido || ''} ${entr.nombre || ''}`.trim().toUpperCase() : ''}</td>
      </tr>`;
    }).join('');

  return `<div class="carrera-block">
    <div class="carrera-meta">
      <div class="carrera-left">
        <div class="nro">${num}° Carrera</div>
        ${hora ? `<div class="hora">${hora} HS</div>` : ''}
      </div>
      <div class="carrera-center">
        ${bonoGanador ? `<div class="bono-float"><div class="bono">BONO ${formatMonto(bonoGanador)}<br>AL GANADOR</div></div>` : ''}
        ${c.nombre ? `<div class="premio">PREMIO: ${c.nombre}</div>` : ''}
        ${(c.condicion_adicional || c.condicion_handicap) ? `<div>${[c.condicion_handicap, c.condicion_adicional].filter(Boolean).join(' — ')}</div>` : ''}
        <div class="bolsa">BOLSA: ${formatMonto(Math.round(bolsaEfectiva))}${desglose ? ` — ${desglose}` : ''}</div>
        ${apuestasText ? `<div><strong>APUESTAS:</strong> ${apuestasText}</div>` : ''}
      </div>
      <div class="carrera-right">
        <div class="metros">${c.distancia_metros || ''} Metros</div>
        <div class="categoria">${cat?.nombre || ''}</div>
      </div>
    </div>
    <table class="inscriptos">
      <thead><tr>
        <th>CABALLERIZA</th><th>4 ULT. PERF.</th><th>N°</th><th>S.P.C.</th><th>JOCKEY</th><th>K E S P</th><th>PADRE — MADRE</th><th>ENTRENADOR</th>
      </tr></thead>
      <tbody>${filas || '<tr><td colspan="8" style="text-align:center;font-style:italic;">Sin inscriptos</td></tr>'}</tbody>
    </table>
  </div>`;
}

load();
</script>
</body></html>
