<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co https://raw.githubusercontent.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="logo32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="logo180x180.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0e2318">
  <title>Liquidaciones — SGH</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0e2318; --card: #1a3d26; --accent: #c9a84c;
      --text: #f5f0e8; --muted: #a0b8a0; --danger: #e05252;
      --success: #4caf82; --border: rgba(201,168,76,0.2); --input-bg: #0e2318;
      --info: #74b0f7;
    }
    body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }
    h1,h2,h3 { font-family: 'Playfair Display', serif; }
    .topbar { background: rgba(0,0,0,0.3); border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .btn-back { background: none; border: 1px solid var(--border); color: var(--muted); padding: 7px 14px; border-radius: 8px; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 13px; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; transition: all 0.2s; }
    .btn-back:hover { border-color: var(--accent); color: var(--accent); }
    .topbar h1 { font-size: 18px; color: var(--accent); flex: 1; }
    .btn-primary { background: var(--accent); color: #1a1a0a; border: none; padding: 9px 18px; border-radius: 9px; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: opacity 0.2s; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 9px 18px; border-radius: 9px; font-family: 'DM Sans', sans-serif; font-size: 13px; cursor: pointer; transition: all 0.2s; white-space: nowrap; }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
    /* TABS */
    .tabs { background: rgba(0,0,0,0.2); border-bottom: 1px solid var(--border); display: flex; }
    .tab { padding: 13px 20px; font-family: 'DM Sans', sans-serif; font-size: 14px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; transition: all 0.2s; background: none; border-top: none; border-left: none; border-right: none; }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab-panel { display: none; }
    .tab-panel.active { display: block; }
    /* SELECTOR BAR */
    .selector-bar { background: var(--card); border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .selector-bar label { font-size: 12px; color: var(--muted); }
    select, input, textarea { background: var(--input-bg); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 13px; outline: none; }
    select:focus, input:focus, textarea:focus { border-color: var(--accent); }
    select option { background: #1a3d26; }
    .content { max-width: 1100px; margin: 0 auto; padding: 24px; }
    /* LIQUIDACIONES LIST */
    .liq-grid { display: flex; flex-direction: column; gap: 14px; }
    .liq-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
    .liq-card.borrador { border-left: 4px solid var(--muted); }
    .liq-card.aprobada { border-left: 4px solid var(--accent); }
    .liq-card.pagada { border-left: 4px solid var(--success); }
    .liq-card.anulada { border-left: 4px solid var(--danger); }
    .liq-header { padding: 14px 18px; display: flex; gap: 14px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
    .liq-prof { font-family: 'Playfair Display', serif; font-size: 16px; color: var(--accent); }
    .liq-recibo { font-size: 12px; color: var(--muted); }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; text-transform: uppercase; }
    .badge-borrador { background: rgba(160,184,160,0.1); color: var(--muted); border: 1px solid rgba(160,184,160,0.3); }
    .badge-aprobada { background: rgba(201,168,76,0.15); color: var(--accent); border: 1px solid rgba(201,168,76,0.3); }
    .badge-pagada { background: rgba(76,175,130,0.15); color: var(--success); border: 1px solid rgba(76,175,130,0.3); }
    .badge-anulada { background: rgba(224,82,82,0.1); color: var(--danger); border: 1px solid rgba(224,82,82,0.3); }
    .liq-montos { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; }
    .monto-item { text-align: center; }
    .monto-lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; }
    .monto-val { font-size: 16px; font-weight: 700; color: var(--text); }
    .monto-val.neto { color: var(--accent); }
    .liq-acciones { display: flex; gap: 6px; flex-wrap: wrap; }
    .btn-sm { padding: 5px 12px; border-radius: 7px; font-size: 12px; font-weight: 500; cursor: pointer; font-family: 'DM Sans', sans-serif; border: none; white-space: nowrap; }
    .btn-det { background: rgba(116,176,247,0.1); color: var(--info); border: 1px solid rgba(116,176,247,0.3); }
    .btn-aprobar { background: rgba(201,168,76,0.15); color: var(--accent); border: 1px solid rgba(201,168,76,0.3); }
    .btn-pagar { background: rgba(76,175,130,0.15); color: var(--success); border: 1px solid rgba(76,175,130,0.3); }
    .btn-impr { background: rgba(180,180,180,0.1); color: var(--muted); border: 1px solid rgba(180,180,180,0.3); }
    .btn-delete { background: rgba(224,82,82,0.1); color: var(--danger); border: 1px solid rgba(224,82,82,0.3); }
    /* DETALLE */
    .detalle-table { width: 100%; border-collapse: collapse; }
    .detalle-table thead th { background: rgba(0,0,0,0.15); padding: 8px 14px; text-align: left; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; }
    .detalle-table tbody tr { border-top: 1px solid var(--border); }
    .detalle-table tbody td { padding: 9px 14px; font-size: 13px; }
    .detalle-table tfoot td { padding: 10px 14px; font-size: 13px; font-weight: 600; border-top: 2px solid var(--border); }
    .text-right { text-align: right; }
    .text-accent { color: var(--accent); }
    .text-danger { color: var(--danger); }
    .text-success { color: var(--success); }
    /* COMISIONES TAB */
    .config-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
    .config-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
    .config-card-title { font-size: 14px; font-weight: 600; color: var(--accent); margin-bottom: 8px; }
    .config-row { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); padding: 3px 0; }
    .config-row span { color: var(--text); }
    /* LOADING / EMPTY */
    .loading-state { display: flex; align-items: center; justify-content: center; padding: 50px; gap: 12px; color: var(--muted); }
    .spinner { width: 22px; height: 22px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty-state { text-align: center; padding: 50px 20px; }
    .empty-state .icon { font-size: 44px; margin-bottom: 14px; }
    .empty-state h3 { font-size: 16px; color: var(--muted); }
    /* MODAL */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 1000; display: none; align-items: flex-start; justify-content: center; padding: 20px; overflow-y: auto; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--card); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 700px; margin: auto; }
    .modal-header { padding: 18px 22px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
    .modal-header h2 { font-size: 18px; color: var(--accent); }
    .btn-close { background: none; border: none; color: var(--muted); font-size: 22px; cursor: pointer; }
    .modal-body { padding: 20px 22px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group.full { grid-column: 1/-1; }
    label { font-size: 12px; font-weight: 500; color: var(--muted); }
    input, select, textarea { width: 100%; }
    textarea { min-height: 60px; resize: vertical; }
    .modal-footer { padding: 14px 22px; display: flex; gap: 10px; justify-content: flex-end; border-top: 1px solid var(--border); }
    .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 9px 18px; border-radius: 9px; font-family: 'DM Sans', sans-serif; font-size: 13px; cursor: pointer; }
    /* RECIBO PRINT */
    .recibo-print { display: none; }
    @media print {
      body { background: #fff !important; color: #000 !important; font-family: Arial, sans-serif; }
      .topbar, .tabs, .selector-bar, .liq-acciones, #toast-container { display: none !important; }
      .recibo-print { display: block; }
      .content { display: none; }
      .recibo-container { max-width: 700px; margin: 0 auto; padding: 20px; }
      .recibo-header { text-align: center; border-bottom: 2px solid #000; padding-bottom: 12px; margin-bottom: 16px; }
      .recibo-header h2 { font-size: 20px; }
      .recibo-table { width: 100%; border-collapse: collapse; margin-top: 12px; }
      .recibo-table th, .recibo-table td { border: 1px solid #ccc; padding: 7px 10px; font-size: 12px; }
      .recibo-table th { background: #f0f0f0; }
      .recibo-total { font-weight: 700; font-size: 14px; text-align: right; margin-top: 12px; }
      @page { size: A4; margin: 15mm; }
    }
    #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
    .toast { padding: 12px 20px; border-radius: 10px; font-size: 14px; font-weight: 500; max-width: 320px; animation: slideIn 0.3s ease; }
    .toast-success { background: #1a4a30; border: 1px solid var(--success); color: var(--text); }
    .toast-error { background: #4a1a1a; border: 1px solid var(--danger); color: var(--text); }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } .form-group.full { grid-column: 1; } }
    #auth-overlay { position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center; }
    .btn-logout { background:none;border:1px solid var(--border);color:var(--muted);padding:6px 14px;border-radius:8px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;transition:all 0.2s;margin-left:auto; }
    .btn-logout:hover { border-color:var(--danger);color:var(--danger); }
    .user-name { font-size:13px;color:var(--muted); }
    @media print { #auth-overlay, .btn-logout, .user-name { display:none !important; } }
  </style>
  <script src="active-reunion.js"></script>
</head>
<body>
<div id="auth-overlay"><div class="spinner" style="width:32px;height:32px;border-width:3px;"></div></div>
<div id="toast-container"></div>

<!-- RECIBO PARA IMPRIMIR -->
<div class="recibo-print" id="recibo-print"></div>

<div class="topbar">
  <a href="index.html" class="btn-back">← Volver</a>
  <h1>Liquidaciones</h1>
  <span class="user-name" id="user-name"></span>
  <button class="btn-logout" onclick="logout()">Cerrar sesión</button>
</div>

<div class="tabs">
  <button class="tab active" onclick="switchTab('liquidaciones')">💰 Liquidaciones</button>
  <button class="tab" onclick="switchTab('comisiones')">⚙️ Config. Comisiones</button>
</div>

<!-- LIQUIDACIONES PANEL -->
<div class="tab-panel active" id="panel-liquidaciones">
  <div class="selector-bar">
    <label>Reunión:</label>
    <select id="sel-reunion" onchange="loadLiquidaciones()">
      <option value="">— Todas las reuniones —</option>
    </select>
    <select id="f-estado-f" onchange="loadLiquidaciones()" style="width:160px;">
      <option value="">Todos los estados</option>
      <option value="borrador">Borrador</option>
      <option value="aprobada">Aprobada</option>
      <option value="pagada">Pagada</option>
      <option value="anulada">Anulada</option>
    </select>
    <button class="btn-primary" onclick="generarLiquidaciones()">⚡ Generar liquidaciones</button>
  </div>
  <div class="content">
    <div id="liq-container">
      <div class="empty-state"><div class="icon">💰</div><h3>Seleccionar una reunión o generar liquidaciones automáticamente</h3></div>
    </div>
  </div>
</div>

<!-- COMISIONES PANEL -->
<div class="tab-panel" id="panel-comisiones">
  <div class="content">
    <!-- Reparto de premios (liquidacion_config) -->
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px;">
      <h2 style="font-size:18px;color:var(--accent);">Reparto de premios</h2>
      <button class="btn-sm btn-aprobar" onclick="openRepartoModal()">✏️ Editar reparto</button>
    </div>
    <div id="reparto-container" style="margin-bottom:28px;"></div>
    <hr style="border:none;border-top:1px solid var(--verde-borde);margin-bottom:24px;">
    <!-- Comisiones granulares (comision_config) -->
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:10px;">
      <h2 style="font-size:18px;color:var(--accent);">Configuración de Comisiones</h2>
      <button class="btn-primary" onclick="openComisionModal()">+ Nueva configuración</button>
    </div>
    <div id="comision-container"><div class="loading-state"><div class="spinner"></div> Cargando…</div></div>
  </div>
</div>

<!-- MODAL DETALLE LIQUIDACIÓN -->
<div class="modal-overlay" id="modal-detalle">
  <div class="modal" style="max-width:800px;">
    <div class="modal-header">
      <h2 id="det-title">Detalle de liquidación</h2>
      <button class="btn-close" onclick="closeModal('modal-detalle')">✕</button>
    </div>
    <div class="modal-body" id="det-body"></div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeModal('modal-detalle')">Cerrar</button>
      <button class="btn-outline" onclick="imprimirRecibo()">🖨️ Imprimir recibo</button>
    </div>
  </div>
</div>

<!-- MODAL REPARTO -->
<div class="modal-overlay" id="modal-reparto">
  <div class="modal" style="max-width:520px;">
    <div class="modal-header">
      <h2>Reparto de premios</h2>
      <button class="btn-close" onclick="closeModal('modal-reparto')">✕</button>
    </div>
    <div class="modal-body">
      <p style="font-size:12px;color:var(--muted);margin-bottom:16px;">La suma de los 7 porcentajes debe ser exactamente 100.</p>
      <div class="form-grid">
        <div class="form-group"><label>Propietario (%)</label><input type="number" id="rp-propietario" min="0" max="100" step="0.001"></div>
        <div class="form-group"><label>Entrenador (%)</label><input type="number" id="rp-entrenador" min="0" max="100" step="0.001"></div>
        <div class="form-group"><label>Jockey (%)</label><input type="number" id="rp-jockey" min="0" max="100" step="0.001"></div>
        <div class="form-group"><label>Peón (%)</label><input type="number" id="rp-peon" min="0" max="100" step="0.001"></div>
        <div class="form-group"><label>Capataz (%)</label><input type="number" id="rp-capataz" min="0" max="100" step="0.001"></div>
        <div class="form-group"><label>Sereno (%)</label><input type="number" id="rp-sereno" min="0" max="100" step="0.001"></div>
        <div class="form-group"><label>Fondo solidario (%)</label><input type="number" id="rp-fondo" min="0" max="100" step="0.001"></div>
        <div class="form-group"><label>Incentivo jockey ($)</label><input type="text" id="rp-inc-jockey" placeholder="0" oninput="fmtInput(this)"></div>
        <div class="form-group"><label>Incentivo entrenador ($)</label><input type="text" id="rp-inc-entrenador" placeholder="0" oninput="fmtInput(this)"></div>
        <div class="form-group"><label>Días antidoping</label><input type="number" id="rp-antidoping" min="0" max="365"></div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeModal('modal-reparto')">Cancelar</button>
      <button class="btn-primary" id="btn-save-reparto" onclick="saveReparto()">Guardar</button>
    </div>
  </div>
</div>

<!-- MODAL COMISIÓN -->
<div class="modal-overlay" id="modal-comision">
  <div class="modal">
    <div class="modal-header">
      <h2 id="com-title">Nueva configuración</h2>
      <button class="btn-close" onclick="closeModal('modal-comision')">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="cf-id">
      <div class="form-grid">
        <div class="form-group">
          <label>Tipo de profesional</label>
          <select id="cf-tipo-prof">
            <option value="jockey">Jockey</option>
            <option value="entrenador">Entrenador</option>
            <option value="ambos">Ambos</option>
          </select>
        </div>
        <div class="form-group">
          <label>Tipo de cobro</label>
          <select id="cf-tipo-cobro">
            <option value="porcentaje_bolsa">% de bolsa</option>
            <option value="monto_fijo">Monto fijo</option>
            <option value="bono_actuacion">Bono por actuación</option>
            <option value="combinado">Combinado</option>
          </select>
        </div>
        <div class="form-group">
          <label>Porcentaje (%)</label>
          <input type="number" id="cf-pct" min="0" max="100" step="0.01" placeholder="0.00">
        </div>
        <div class="form-group">
          <label>Monto fijo ($)</label>
          <input type="text" id="cf-monto" placeholder="0" oninput="fmtInput(this)">
        </div>
        <div class="form-group">
          <label>Posición bono</label>
          <input type="number" id="cf-pos-bono" min="1" max="10" placeholder="1">
        </div>
        <div class="form-group">
          <label>Monto bono ($)</label>
          <input type="text" id="cf-monto-bono" placeholder="0" oninput="fmtInput(this)">
        </div>
        <div class="form-group">
          <label>Desc. fondo solidario (%)</label>
          <input type="number" id="cf-fondo" min="0" max="100" step="0.01" placeholder="0.00">
        </div>
        <div class="form-group">
          <label>Desc. incentivo (%)</label>
          <input type="number" id="cf-incentivo" min="0" max="100" step="0.01" placeholder="0.00">
        </div>
        <div class="form-group">
          <label>Vigente desde</label>
          <input type="date" id="cf-desde">
        </div>
        <div class="form-group">
          <label>Vigente hasta</label>
          <input type="date" id="cf-hasta">
        </div>
        <div class="form-group">
          <label>Activo</label>
          <select id="cf-activo">
            <option value="true">Sí</option>
            <option value="false">No</option>
          </select>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeModal('modal-comision')">Cancelar</button>
      <button class="btn-primary" onclick="saveComision()" id="btn-save-com">Guardar</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
let sb, CLUB_ID, currentUser;
async function initAuth(){const{createClient}=supabase;sb=createClient('https://unlhcuanfrtpatoipwve.supabase.co','sb_publishable_gypetSX16kGMXHhG_xqLWA_7wrzWgAK');const{data:{session}}=await sb.auth.getSession();if(!session){window.location.replace('login.html');return false;}const{data:usr}=await sb.from('usuarios').select('club_id,nombre_completo,rol').eq('email',session.user.email).single();if(usr.rol==='super_admin'){const urlClub=new URLSearchParams(window.location.search).get('club');CLUB_ID=urlClub||localStorage.getItem('sgh_selected_club_id')||usr.club_id||null;}else{if(!usr.club_id){await sb.auth.signOut();window.location.replace('login.html');return false;}CLUB_ID=usr.club_id;}currentUser={...session.user,nombre_completo:usr.nombre_completo,rol:usr.rol};const uEl=document.getElementById('user-name');if(uEl)uEl.textContent=usr.nombre_completo||session.user.email;document.getElementById('auth-overlay').style.display='none';return true;}
function logout(){sb.auth.signOut().then(()=>window.location.replace('login.html'));}

let profesionales={}, propietariosMap={}, liquidaciones=[], detalles={}, club=null;
let currentLiqId=null, liqConfig=null;

function toast(msg,type='success') {
  const t=document.createElement('div'); t.className=`toast toast-${type}`; t.textContent=msg;
  document.getElementById('toast-container').appendChild(t); setTimeout(()=>t.remove(),3500);
}
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function formatMonto(num) {
  if (num === null || num === undefined || isNaN(num)) return '$0,00';
  const n = parseFloat(num);
  const signo = n < 0 ? '-' : '';
  const [entero, dec] = Math.abs(n).toFixed(2).split('.');
  const enteroFmt = entero.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return signo + '$' + enteroFmt + ',' + dec;
}
function parseMonto(str) {
  if (str === null || str === undefined) return 0;
  const s = String(str).replace(/\$/g, '').replace(/\s/g, '').replace(/\./g, '').replace(',', '.');
  return parseFloat(s) || 0;
}
const fmt = formatMonto;
function fmtInput(el) {
  if (el.value.match(/,\d{0,1}$/)) return;
  const v = parseMonto(el.value);
  el.value = v ? formatMonto(v) : '';
}

               get('rp-peon') + get('rp-capataz') + get('rp-sereno') + get('rp-fondo');

  const btn = document.getElementById('btn-save-reparto');
  btn.disabled = true; btn.textContent = 'Guardando…';
  const payload = {
    club_id: CLUB_ID,
    pct_propietario: get('rp-propietario'), pct_entrenador: get('rp-entrenador'),

    incentivo_entrenador_monto: parseMonto(document.getElementById('rp-inc-entrenador').value) || 0,

  btn.disabled = false; btn.textContent = 'Guardar';

async function generarLiquidaciones() {
  const rid = document.getElementById('sel-reunion').value;
  if (!rid) { toast('Seleccionar una reunión para generar liquidaciones', 'error'); return; }

  // Verificar liquidaciones bloqueadas (aprobada/pagada)
  const { data: existentes } = await sb.from('liquidaciones').select('id,estado').eq('reunion_id', rid).eq('club_id', CLUB_ID);
  const bloqueadas = (existentes||[]).filter(l => ['aprobada','pagada'].includes(l.estado));
  if (bloqueadas.length) {
    toast(`No se puede regenerar: hay ${bloqueadas.length} liquidación(es) aprobada/pagada. Anulalas manualmente antes de regenerar.`, 'error');
    return;
  }

  // Fase C/D: proteger líneas ya comprometidas (cobradas o con recibo asignado). El guard de
  // header de arriba NO las cubre: con recibos cruzando reuniones una línea puede quedar
  // pagado/recibo_id con el header todavía en borrador. retenido SIN recibo NO se protege
  // (es premio en ventana de doping, se puede recalcular).
  const { data: comprometidas } = await sb.from('liquidacion_detalle')
    .select('id').eq('reunion_id', rid)
    .or('estado_linea.eq.pagado,recibo_id.not.is.null')
    .limit(1);
  if (comprometidas?.length) {
    toast('No se puede regenerar: hay líneas ya pagadas o con recibo asignado en esta reunión.', 'error');
    return;
  }

  if (!confirm('¿Generar liquidaciones automáticas? Se eliminarán los borradores previos y se recalculará todo desde los resultados oficiales.')) return;

  // Idempotencia: eliminar borradores previos
  const borradoresIds = (existentes||[]).filter(l => l.estado === 'borrador').map(l => l.id);
  for (const id of borradoresIds) {
    await sb.from('liquidacion_detalle').delete().eq('liquidacion_id', id);
    await sb.from('liquidaciones').delete().eq('id', id);
  }

  // Cargar datos
  const [{ data: cars }, { data: comCfg }, { data: reunionRow }] = await Promise.all([
    sb.from('carreras').select('id,numero_turno,bolsa_total,distribucion_premios').eq('reunion_id', rid),
    sb.from('comision_config').select('*').eq('club_id', CLUB_ID).eq('activo', true),
    sb.from('reuniones').select('fecha').eq('id', rid).single(),
  ]);
  const carIds = (cars||[]).map(c => c.id);
  if (!carIds.length) { toast('La reunión no tiene carreras', 'error'); return; }

  const [{ data: results }, { data: inscs }] = await Promise.all([
    sb.from('resultados').select('id,carrera_id').in('carrera_id', carIds).eq('estado', 'oficial'),
    sb.from('inscripciones').select('*').in('carrera_id', carIds).neq('estado', 'forfait'),
  ]);
  const resIds = (results||[]).map(r => r.id);
  if (!resIds.length) { toast('No hay resultados oficiales en esta reunión', 'error'); return; }

  const { data: poss } = await sb.from('resultado_posiciones')
    .select('*').in('resultado_id', resIds).not('posicion', 'is', null).eq('descalificado', false);

  // Distribuciones base nacionales
  const DIST_FALLBACK = {'1':60,'2':19,'3':12,'4':6,'5':3};
  if (!liqConfig) { toast('No hay configuración de reparto para este club. Configurala en la pestaña Comisiones.', 'error'); return; }
  // Fase C: retención anti-doping. Premios 1°/2° quedan retenidos N días desde la fecha de
  // la reunión (liquidacion_config.dias_antidoping, default 30). Cálculo TZ-safe (UTC) para
  // no caer en el corrimiento N-1 de timezone (ISSUE-007).
  const diasAntidoping = parseInt(liqConfig.dias_antidoping) || 30;
  let fechaLiberacion = null;
  if (reunionRow?.fecha) {
    const d = new Date(reunionRow.fecha + 'T00:00:00Z');
    d.setUTCDate(d.getUTCDate() + diasAntidoping);
    fechaLiberacion = d.toISOString().slice(0, 10);
  } else {
    console.warn('[generarLiquidaciones] reunión sin fecha: retenidos quedarán sin fecha_liberacion');
  }
  const PCTS = {
    propietario: parseFloat(liqConfig.pct_propietario) / 100,
    entrenador:  parseFloat(liqConfig.pct_entrenador)  / 100,
    jockey:      parseFloat(liqConfig.pct_jockey)      / 100,
    peon:        parseFloat(liqConfig.pct_peon)        / 100,
    capataz:     parseFloat(liqConfig.pct_capataz)     / 100,
    sereno:      parseFloat(liqConfig.pct_sereno)      / 100,
  };
  // Tajada del reparto que va al club (98% roles + este 2% = 100%) e incentivos por reunión.
  const fondoPct  = parseFloat(liqConfig.pct_fondo_solidario)        || 0;
  const incJockey = parseFloat(liqConfig.incentivo_jockey_monto)     || 0;
  const incEntr   = parseFloat(liqConfig.incentivo_entrenador_monto) || 0;

  // Premio base por puesto: bolsa*pct + bono al ganador (1°) + piso ganancia_minima.
  // El bono al ganador (bono_ganador) queda FUNDIDO en el premio del 1° y se reparte
  // por roles (Fase 2 P3: tratamiento distinto al bono 6-8, a propósito).
  const calcPremio = (car, posicion) => {
    const dist = car.distribucion_premios || DIST_FALLBACK;
    const pct = dist[String(posicion)];
    if (!pct) return 0;
    let p = parseFloat(car.bolsa_total) * pct / 100;
    if (posicion === 1 && dist.bono_ganador) p += parseFloat(dist.bono_ganador);
    const minimo = parseFloat(dist.ganancia_minima) || 0;
    return minimo > 0 && p < minimo ? minimo : p;
  };

  // Bono 6°-8° (carreras.distribucion_premios.bono_posicion_monto): NO es premio
  // repartible. Va 100% al propietario, neto, concepto_tipo='bono' (Fase 2 P2).
  // Antes vivía dentro de calcPremio pero era código muerto: para posiciones 6-8
  // no hay pct en distribucion_premios, así que calcPremio retornaba 0 antes de llegar.
  const calcBono68 = (car, posicion) => {
    const dist = car.distribucion_premios || DIST_FALLBACK;
    if (dist.bono_posicion_desde && dist.bono_posicion_hasta && dist.bono_posicion_monto &&
        posicion >= dist.bono_posicion_desde && posicion <= dist.bono_posicion_hasta) {
      return parseFloat(dist.bono_posicion_monto);
    }
    return 0;
  };

  // actorMap: id → { tipo, items[] }
  const actorMap = {};
  const addActor = (id, tipo, item) => {
    if (!id) return;
    if (!actorMap[id]) actorMap[id] = { tipo, items: [] };
    actorMap[id].items.push(item);
  };

  // Agrupar posiciones por resultado para detectar empates
  const possByRes = {};
  for (const pos of (poss||[])) {
    if (!possByRes[pos.resultado_id]) possByRes[pos.resultado_id] = [];
    possByRes[pos.resultado_id].push(pos);
  }

  for (const res of (results||[])) {
    const car = cars.find(c => c.id === res.carrera_id);
    if (!car) continue;
    const carPoss = possByRes[res.id] || [];
    // Empate (dead-heat): el schema lo modela como filas en posiciones DISTINTAS y
    // consecutivas, cada una con `empate=true` — la constraint UNIQUE (resultado_id, posicion)
    // prohíbe dos filas en el mismo puesto. Un grupo de empate = corrida de filas consecutivas
    // con empate=true. NO agrupamos por `posicion` duplicado (eso nunca ocurre en datos reales
    // y dejaba el reparto empate-aware como código muerto — ver GOTCHA #45).
    // LIMITACIÓN TÉCNICA conocida (GOTCHA #45, del modelo `empate=true`, NO decisión de
    // producto): con un solo booleano no se pueden separar dos dead-heats adyacentes sin un
    // caballo "limpio" en medio (ej. empate 2°-3°-4° pegado a empate 5°-6°): se fusionarían en
    // un único grupo. Es rarísimo; si alguna vez hace falta, requeriría un `grupo_empate_id`.
    const ordered = [...carPoss].filter(p => p.posicion != null).sort((a, b) => a.posicion - b.posicion);
    const groups = [];
    for (let i = 0; i < ordered.length; i++) {
      const grp = [ordered[i]];
      while (i + 1 < ordered.length && ordered[i].empate && ordered[i + 1].empate &&
             ordered[i + 1].posicion === ordered[i].posicion + 1) {
        grp.push(ordered[++i]);
      }
      groups.push(grp);
    }
    for (const poses of groups) {
      const posNum = poses[0].posicion;   // puesto líder del grupo (p.ej. 6 en un empate 6°-7°)
      let premioEfectivo;
      if (poses.length > 1) {
        // Empate: promedio de los premios de las posiciones N a N+k-1 (convención dead-heat).
        // calcPremio(1) incluye bono_ganador fundido, así que en un empate de 1° el bono al
        // ganador también se reparte vía este promedio (mitad a cada empatado) — mismo principio
        // Fede "50% c/u". CONFIRMADO.
        let sum = 0;
        for (let i = 0; i < poses.length; i++) sum += calcPremio(car, posNum + i);
        premioEfectivo = sum / poses.length;
      } else {
        premioEfectivo = calcPremio(car, posNum);
      }
      // Bono del PUESTO LÍDER del grupo (posNum). El grupo comparte UN solo bono, no uno por
      // posición ocupada: 2 empatados en 6° (filas 6 y 7) NO cobran bono(6)+bono(7), cobran
      // bono(6) dividido. El slot 7° "desaparece" como bono propio (CONFIRMADO Fede: empate
      // dentro del rango → monto/N; 50% c/u, no bono entero a cada uno).
      // CRUCE DE BORDE (CONFIRMADO, convención dead-heat): si el grupo arranca FUERA del rango
      // de bono (ej. empate 5°-6° con rango 6-8), el líder es 5° → calcBono68(5)=0 → 0 para
      // todo el grupo. El grupo toma la posición del líder (es "5°", y 5° no está en rango), no
      // es ambigüedad. Para empates enteramente dentro de 6-8 el monto es plano.
      const bono68 = calcBono68(car, posNum);
      if (!premioEfectivo && !bono68) continue;
      // Empate: el bono del puesto se DIVIDE en partes iguales entre los empatados
      // (regla Fede: 2 → 50% c/u; en general monto/N). Mismo criterio que el premio.
      const bono68Efectivo = poses.length > 1 ? bono68 / poses.length : bono68;
      const turno = car.numero_turno || '';
      const conceptoBase = `Turno ${turno} — ${posNum}° puesto`;
      const bolsaFmt = fmt(premioEfectivo);
      for (const pos of poses) {
        const insc = (inscs||[]).find(i => i.id === pos.inscripcion_id);
        if (!insc) continue;
        // Premio repartible: solo para ubicados con premio > 0 (puestos 1-5).
        if (premioEfectivo > 0) {
          const subs = [
            {nombre: insc.peon,    rol: 'Peón',   pct: PCTS.peon},
            {nombre: insc.capataz, rol: 'Capataz', pct: PCTS.capataz},
            {nombre: insc.sereno,  rol: 'Sereno',  pct: PCTS.sereno},
          ].filter(s => s.nombre && s.nombre.trim());
          addActor(insc.propietario_id, 'propietario', {
            premio: premioEfectivo, pct: PCTS.propietario, subs: [], conceptoTipo: 'premio',
            concepto: conceptoBase, descripcion: `${conceptoBase} — Propietario (bolsa: ${bolsaFmt})`,
            posicion: posNum, inscripcion_id: insc.id,
          });
          addActor(insc.entrenador_id, 'entrenador', {
            premio: premioEfectivo, pct: PCTS.entrenador, subs, conceptoTipo: 'premio',
            concepto: conceptoBase, descripcion: `${conceptoBase} — Entrenador (bolsa: ${bolsaFmt})`,
            posicion: posNum, inscripcion_id: insc.id,
          });
          addActor(insc.jockey_titular_id, 'jockey', {
            premio: premioEfectivo, pct: PCTS.jockey, subs: [], conceptoTipo: 'premio',
            concepto: conceptoBase, descripcion: `${conceptoBase} — Jockey (bolsa: ${bolsaFmt})`,
            posicion: posNum, inscripcion_id: insc.id,
          });
          // Fondo solidario: 2% del premio efectivo (incluye bono ganador y piso),
          // ruteado al CLUB como tajada del reparto. NO incluye el bono 6-8.
          if (fondoPct > 0) {
            addActor(CLUB_ID, 'club', {
              premio: premioEfectivo, pct: fondoPct / 100, subs: [], conceptoTipo: 'fondo_solidario',
              concepto: `${conceptoBase} — Fondo solidario`,
              descripcion: `Fondo solidario ${fondoPct}% (premio: ${bolsaFmt})`,
              posicion: posNum, inscripcion_id: insc.id,
            });
          }
        }
        // Bono 6°-8°: 100% al propietario de cada caballo, neto, sin reparto entre roles.
        // En empate el bono del puesto se divide en partes iguales (bono68Efectivo).
        if (bono68Efectivo > 0) {
          const empateNota = poses.length > 1 ? `, empate ${poses.length} (${fmt(bono68)}/${poses.length})` : '';
          addActor(insc.propietario_id, 'propietario', {
            premio: bono68Efectivo, pct: 1, subs: [], conceptoTipo: 'bono',
            concepto: `Turno ${turno} — Bono ${posNum}° puesto`,
            descripcion: `Bono ${posNum}° puesto (100% propietario${empateNota}): ${fmt(bono68Efectivo)}`,
            posicion: posNum, inscripcion_id: insc.id,
          });
        }
      }
    }
  }

  // INCENTIVOS (Bloque C): montos desde liquidacion_config (confirmado Fede 2026-06-08).
  // GRANULARIDAD DISTINTA por rol:
  //  - Jockey: UNA línea por jockey que corrió al menos una (no_largo=false, ratificado),
  //    aunque corra varias. Incentivo POR REUNIÓN → dedup por jockey, inscripcion_id=null.
  //  - Entrenador: UNA línea POR CABALLO corrido (no_largo=false, ratificado). Incentivo
  //    POR MONTA del caballo → sin dedup, inscripcion_id=la inscripción.
  // Neto (sin descuentos). Guard: monto 0/null → no se genera.
  if (incJockey > 0 || incEntr > 0) {
    const { data: largaron } = await sb.from('resultado_posiciones')
      .select('inscripcion_id').in('resultado_id', resIds).eq('no_largo', false);
    const jockeysSet = new Set();   // jockey: una sola línea por reunión
    for (const lp of (largaron||[])) {
      const insc = (inscs||[]).find(i => i.id === lp.inscripcion_id);
      if (!insc || insc.estado !== 'ratificado') continue;   // blindaje: solo ratificados
      if (incJockey > 0 && insc.jockey_titular_id) jockeysSet.add(insc.jockey_titular_id);
      // Entrenador: una línea por CADA caballo corrido (no se deduplica).
      if (incEntr > 0 && insc.entrenador_id) {
        addActor(insc.entrenador_id, 'entrenador', {
          premio: incEntr, pct: 1, subs: [], conceptoTipo: 'incentivo_entrenador',
          concepto: 'Incentivo entrenador',
          descripcion: `Incentivo entrenador por caballo corrido: ${fmt(incEntr)}`,
          posicion: null, inscripcion_id: insc.id,
        });
      }
    }
    if (incJockey > 0) for (const jid of jockeysSet) {
      addActor(jid, 'jockey', {
        premio: incJockey, pct: 1, subs: [], conceptoTipo: 'incentivo_jockey',
        concepto: 'Incentivo jockey',
        descripcion: `Incentivo jockey por actuación en la reunión: ${fmt(incJockey)}`,
        posicion: null, inscripcion_id: null,
      });
    }
  }

  // Insertar liquidaciones
  let created = 0;
  for (const [actorId, actorData] of Object.entries(actorMap)) {
    const cfg = (comCfg||[]).find(c => c.tipo_profesional === actorData.tipo || c.tipo_profesional === 'ambos');
    const descPct = ((cfg?.descuento_fondo_solidario_pct||0) + (cfg?.descuento_incentivo_pct||0));
    const detalleRows = [];
    let totalBruto = 0, totalDesc = 0;
    const bTipo = actorData.tipo === 'propietario' ? 'propietario'
                : actorData.tipo === 'club'        ? 'club'
                : 'profesional';
    for (const item of actorData.items) {
      const bruto = item.premio * item.pct;
      // descPct (comision_config) solo sobre premios; bono/incentivo/fondo van netos.
      const aplicaDesc = item.conceptoTipo === 'premio';
      const desc = aplicaDesc ? bruto * descPct / 100 : 0;
      totalBruto += bruto; totalDesc += desc;
      // Fase C: retención anti-doping automática a premio de 1° y 2° (incluye empates: todas
      // las líneas del grupo llevan posicion=posNum, ver GOTCHA #45). El resto queda impago.
      const retenido = item.conceptoTipo === 'premio' && (item.posicion === 1 || item.posicion === 2);
      // monto_neto es columna generada en DB — no incluir en el insert
      detalleRows.push({ concepto: item.concepto, descripcion: item.descripcion,
        monto_bruto: bruto, porcentaje_desc: aplicaDesc ? (descPct||null) : null, monto_descuento: desc,
        concepto_tipo: item.conceptoTipo, posicion: item.posicion, inscripcion_id: item.inscripcion_id,
        beneficiario_tipo: bTipo, beneficiario_id: actorId, reunion_id: rid,
        estado_linea: retenido ? 'retenido' : 'impago',
        fecha_liberacion: retenido ? fechaLiberacion : null });
      // Peón/capataz/sereno como sub-líneas en la liquidación del entrenador (ADR-025).
      // NOTA-A: las subs ACOMPAÑAN la retención del premio del que derivan (heredan `retenido`).
      for (const sub of (item.subs||[])) {
        const sb2 = item.premio * sub.pct;
        const sd2 = sb2 * descPct / 100;
        totalBruto += sb2; totalDesc += sd2;
        detalleRows.push({ concepto: `${sub.rol} — ${sub.nombre}`,
          descripcion: `${item.concepto} — A redistribuir (${Math.round(sub.pct*100)}%)`,
          monto_bruto: sb2, porcentaje_desc: descPct||null, monto_descuento: sd2,
          concepto_tipo: 'actuacion', posicion: item.posicion, inscripcion_id: item.inscripcion_id,
          beneficiario_tipo: 'profesional', beneficiario_id: actorId, reunion_id: rid,
          estado_linea: retenido ? 'retenido' : 'impago',
          fecha_liberacion: retenido ? fechaLiberacion : null });
      }
    }
    if (!detalleRows.length) continue;
    const liqPayload = {
      club_id: CLUB_ID, reunion_id: rid, estado: 'borrador',
      total_bruto: Math.round(totalBruto*100)/100,
      total_descuentos: Math.round(totalDesc*100)/100,
      // total_neto es columna generada — Postgres la calcula automáticamente
    };
    if (actorData.tipo === 'propietario') liqPayload.propietario_id = actorId;
    else if (actorData.tipo !== 'club')   liqPayload.profesional_id = actorId;
    // club (fondo solidario): liquidación sin persona (propietario_id/profesional_id null)
    const { data: liqData, error } = await sb.from('liquidaciones').insert(liqPayload).select().single();
    if (error) { console.error('Error al crear liquidación:', error); continue; }
    const dRows = detalleRows.map((d, i) => ({...d, liquidacion_id: liqData.id, orden_display: i+1}));
    const { error: detErr } = await sb.from('liquidacion_detalle').insert(dRows);
    if (detErr) console.error('Error al insertar detalle:', detErr);
    created++;
  }
  toast(`${created} liquidación(es) generada(s) en borrador`);
  loadLiquidaciones();
}

// COMISIONES
async function loadComisiones() {
  document.getElementById('comision-container').innerHTML='<div class="loading-state"><div class="spinner"></div></div>';
  const { data, error } = await sb.from('comision_config').select('*').eq('club_id', CLUB_ID).order('tipo_profesional');
  if (error) { toast(error.message,'error'); return; }
  if (!data?.length) {
    document.getElementById('comision-container').innerHTML='<div class="empty-state"><div class="icon">⚙️</div><h3>Sin configuraciones. Creá la primera.</h3></div>';
    return;
  }
  document.getElementById('comision-container').innerHTML = `<div class="config-grid">${data.map(c=>`<div class="config-card">
    <div class="config-card-title">${c.tipo_profesional?.toUpperCase()} — ${c.tipo_cobro?.replace('_',' ')}</div>
    ${c.porcentaje?`<div class="config-row">Porcentaje <span>${c.porcentaje}%</span></div>`:''}
    ${c.monto_fijo?`<div class="config-row">Monto fijo <span>${fmt(c.monto_fijo)}</span></div>`:''}
    ${c.posicion_bono?`<div class="config-row">Bono posición ${c.posicion_bono}° <span>${fmt(c.monto_bono)}</span></div>`:''}
    ${c.descuento_fondo_solidario_pct?`<div class="config-row">Fondo solidario <span>-${c.descuento_fondo_solidario_pct}%</span></div>`:''}
    ${c.descuento_incentivo_pct?`<div class="config-row">Incentivo <span>-${c.descuento_incentivo_pct}%</span></div>`:''}
    <div class="config-row">Estado <span>${c.activo?'✅ Activo':'❌ Inactivo'}</span></div>
    <div style="display:flex;gap:6px;margin-top:10px;">
      <button class="btn-sm btn-aprobar" onclick='openComisionModal(${JSON.stringify(c)})'>✏️ Editar</button>
      <button class="btn-sm btn-delete" onclick="deleteComision('${c.id}')">🗑️</button>
    </div>
  </div>`).join('')}</div>`;
}

function openComisionModal(rec=null) {
  document.getElementById('com-title').textContent = rec ? 'Editar configuración' : 'Nueva configuración';
  document.getElementById('cf-id').value = rec?.id||'';
  document.getElementById('cf-tipo-prof').value = rec?.tipo_profesional||'jockey';
  document.getElementById('cf-tipo-cobro').value = rec?.tipo_cobro||'porcentaje_bolsa';
  document.getElementById('cf-pct').value = rec?.porcentaje||'';
  document.getElementById('cf-monto').value = rec?.monto_fijo ? formatMonto(rec.monto_fijo) : '';
  document.getElementById('cf-pos-bono').value = rec?.posicion_bono||'';
  document.getElementById('cf-monto-bono').value = rec?.monto_bono ? formatMonto(rec.monto_bono) : '';
  document.getElementById('cf-fondo').value = rec?.descuento_fondo_solidario_pct||'';
  document.getElementById('cf-incentivo').value = rec?.descuento_incentivo_pct||'';
  document.getElementById('cf-desde').value = rec?.vigente_desde||'';
  document.getElementById('cf-hasta').value = rec?.vigente_hasta||'';
  document.getElementById('cf-activo').value = rec ? String(rec.activo) : 'true';
  document.getElementById('modal-comision').classList.add('open');
}

async function saveComision() {
  const id = document.getElementById('cf-id').value;
  const btn = document.getElementById('btn-save-com');
  btn.disabled=true; btn.textContent='Guardando…';
  const payload = {
    club_id: CLUB_ID,
    tipo_profesional: document.getElementById('cf-tipo-prof').value,
    tipo_cobro: document.getElementById('cf-tipo-cobro').value,
    porcentaje: document.getElementById('cf-pct').value ? parseFloat(document.getElementById('cf-pct').value) : null,
    monto_fijo: document.getElementById('cf-monto').value ? parseMonto(document.getElementById('cf-monto').value) : null,
    posicion_bono: document.getElementById('cf-pos-bono').value ? parseInt(document.getElementById('cf-pos-bono').value) : null,
    monto_bono: document.getElementById('cf-monto-bono').value ? parseMonto(document.getElementById('cf-monto-bono').value) : null,
    descuento_fondo_solidario_pct: document.getElementById('cf-fondo').value ? parseFloat(document.getElementById('cf-fondo').value) : null,
    descuento_incentivo_pct: document.getElementById('cf-incentivo').value ? parseFloat(document.getElementById('cf-incentivo').value) : null,
    vigente_desde: document.getElementById('cf-desde').value || null,
    vigente_hasta: document.getElementById('cf-hasta').value || null,
    activo: document.getElementById('cf-activo').value==='true',
  };
  const { error } = id
    ? await sb.from('comision_config').update(payload).eq('id',id)
    : await sb.from('comision_config').insert(payload);
  btn.disabled=false; btn.textContent='Guardar';
  if (error) { toast(error.message,'error'); return; }
  toast('Configuración guardada');
  closeModal('modal-comision');
  loadComisiones();
}

async function deleteComision(id) {
  if (!confirm('¿Eliminar esta configuración?')) return;
  const { error } = await sb.from('comision_config').delete().eq('id',id);
  if (error) { toast(error.message,'error'); return; }
  toast('Configuración eliminada');
  loadComisiones();
}

document.querySelectorAll('.modal-overlay').forEach(m=>m.addEventListener('click',e=>{if(e.target===e.currentTarget)m.classList.remove('open');}));
(async()=>{if(await initAuth())init();})();
