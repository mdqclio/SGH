<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="logo32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="logo180x180.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0e2318">
  <title>Carta de Llamados — SGH</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0e2318; --card: #1a3d26; --accent: #c9a84c;
      --text: #f5f0e8; --muted: #a0b8a0; --danger: #e05252;
      --success: #4caf82; --border: rgba(201,168,76,0.2); --input-bg: #0e2318;
    }
    body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }
    h1,h2,h3 { font-family: 'Playfair Display', serif; }
    .topbar { background: rgba(0,0,0,0.3); border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .btn-back { background: none; border: 1px solid var(--border); color: var(--muted); padding: 7px 14px; border-radius: 8px; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 13px; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; transition: all 0.2s; }
    .btn-back:hover { border-color: var(--accent); color: var(--accent); }
    .topbar h1 { font-size: 18px; color: var(--accent); flex: 1; min-width: 200px; }
    .btn-primary { background: var(--accent); color: #1a1a0a; border: none; padding: 9px 18px; border-radius: 9px; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: opacity 0.2s; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 9px 18px; border-radius: 9px; font-family: 'DM Sans', sans-serif; font-size: 13px; cursor: pointer; white-space: nowrap; transition: all 0.2s; }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
    /* REUNION HEADER */
    .reunion-header { background: var(--card); border-bottom: 1px solid var(--border); padding: 16px 24px; }
    .reunion-info-grid { display: flex; gap: 24px; flex-wrap: wrap; font-size: 14px; }
    .info-item { display: flex; flex-direction: column; gap: 2px; }
    .info-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; }
    .info-val { color: var(--text); font-weight: 500; }
    .badge { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; text-transform: uppercase; }
    .badge-en_curso { background: rgba(76,175,130,0.15); color: var(--success); border: 1px solid rgba(76,175,130,0.3); }
    .badge-publicada { background: rgba(116,176,247,0.1); color: #74b0f7; border: 1px solid rgba(116,176,247,0.3); }
    .badge-borrador { background: rgba(160,184,160,0.1); color: var(--muted); border: 1px solid rgba(160,184,160,0.3); }
    .badge-finalizada { background: rgba(201,168,76,0.1); color: var(--accent); border: 1px solid rgba(201,168,76,0.3); }
    /* CONTENT */
    .content { max-width: 1100px; margin: 0 auto; padding: 24px; }
    .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .section-header h2 { font-size: 18px; color: var(--accent); }
    /* CARRERAS */
    .carrera-list { display: flex; flex-direction: column; gap: 12px; }
    .carrera-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
    .carrera-card-header { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; background: rgba(0,0,0,0.15); border-bottom: 1px solid var(--border); gap: 12px; }
    .carrera-num { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 700; color: var(--accent); min-width: 36px; }
    .carrera-title { font-size: 15px; font-weight: 600; flex: 1; }
    .carrera-chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .chip { font-size: 11px; background: rgba(201,168,76,0.1); border: 1px solid rgba(201,168,76,0.2); color: var(--muted); padding: 2px 8px; border-radius: 5px; }
    .chip-big { font-size: 13px; font-weight: 700; color: var(--text); background: rgba(201,168,76,0.12); border: 1px solid rgba(201,168,76,0.3); padding: 3px 10px; border-radius: 6px; }
    .carrera-actions { display: flex; gap: 6px; }
    .btn-sm { padding: 5px 11px; border-radius: 7px; font-size: 12px; font-weight: 500; cursor: pointer; font-family: 'DM Sans', sans-serif; border: none; white-space: nowrap; }
    .btn-edit { background: rgba(201,168,76,0.15); color: var(--accent); border: 1px solid rgba(201,168,76,0.3); }
    .btn-delete { background: rgba(224,82,82,0.1); color: var(--danger); border: 1px solid rgba(224,82,82,0.3); }
    .carrera-body { padding: 10px 18px; display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
    .carrera-body span { color: var(--text); font-weight: 500; }
    .carrera-condicion { font-size: 11px; color: var(--muted); opacity: 0.75; }
    .premios-list { padding: 0 18px 14px; display: flex; gap: 8px; flex-wrap: wrap; }
    .premio-chip { background: rgba(201,168,76,0.08); border: 1px solid rgba(201,168,76,0.2); border-radius: 8px; padding: 6px 12px; font-size: 12px; text-align: center; min-width: 70px; }
    .premio-pos { color: var(--muted); font-size: 11px; }
    .premio-pct { color: var(--accent); font-weight: 600; }
    .premio-monto { font-size: 11px; color: var(--text); }
    .empty-state { text-align: center; padding: 60px 20px; }
    .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
    .empty-state h3 { font-size: 18px; color: var(--muted); }
    .loading-state { display: flex; align-items: center; justify-content: center; padding: 60px; gap: 12px; color: var(--muted); }
    .spinner { width: 24px; height: 24px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* MODAL */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 1000; display: none; align-items: flex-start; justify-content: center; padding: 20px; overflow-y: auto; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--card); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 720px; margin: auto; }
    .modal-header { padding: 20px 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
    .modal-header h2 { font-size: 19px; color: var(--accent); }
    .btn-close { background: none; border: none; color: var(--muted); font-size: 22px; cursor: pointer; }
    .modal-body { padding: 20px 24px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group.half { grid-column: span 1; }
    .form-group.full { grid-column: 1 / -1; }
    .form-group.two { grid-column: span 2; }
    .section-lbl { grid-column: 1/-1; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; padding-top: 8px; border-top: 1px solid var(--border); }
    label { font-size: 12px; font-weight: 500; color: var(--muted); }
    input, select, textarea { background: var(--input-bg); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 13px; outline: none; width: 100%; transition: border 0.2s; }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    select option { background: #1a3d26; }
    /* DISTRIBUCIÓN PREMIOS */
    .premios-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
    .premio-input { display: flex; flex-direction: column; gap: 4px; }
    .premio-input label { font-size: 11px; color: var(--muted); text-align: center; }
    .premio-input input { text-align: center; }
    .total-premios { font-size: 12px; color: var(--muted); text-align: right; margin-top: 4px; }
    .total-premios.ok { color: var(--success); }
    .total-premios.bad { color: var(--danger); }
    .pr-auto { background: rgba(201,168,76,0.08) !important; border-color: rgba(201,168,76,0.3) !important; color: var(--accent) !important; }
    .premio-sublabel { font-size: 10px; color: var(--muted); text-align: center; margin-top: 2px; }
    .bono-block { background: rgba(201,168,76,0.05); border: 1px solid rgba(201,168,76,0.15); border-radius: 8px; padding: 10px 12px; margin-top: 10px; }
    .bono-block-title { font-size: 11px; font-weight: 600; color: var(--accent); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
    .bono-pos-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .premio-desglose { padding: 10px 18px 14px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 5px; }
    .premio-row { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; }
    .premio-row-lbl { color: var(--muted); }
    .premio-row-val { font-weight: 600; color: var(--text); white-space: nowrap; padding-left: 12px; }
    .premio-row-sub .premio-row-lbl { font-size: 12px; padding-left: 14px; }
    .premio-row-sub .premio-row-val { font-size: 12px; color: var(--muted); font-weight: 400; }
    .premio-row-subtotal .premio-row-lbl { font-size: 12px; padding-left: 14px; font-weight: 600; color: var(--text); }
    .premio-row-subtotal .premio-row-val { font-size: 12px; font-weight: 600; color: var(--text); }
    .premio-row-puestos { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .premio-total { margin-top: 6px; padding-top: 7px; border-top: 1px solid var(--border); }
    .premio-total .premio-row-lbl { font-size: 13px; font-weight: 700; color: var(--text); text-transform: uppercase; letter-spacing: 0.4px; }
    .premio-total .premio-row-val { font-size: 16px; font-weight: 700; color: var(--accent); }
    .modal-footer { padding: 16px 24px; display: flex; gap: 10px; justify-content: flex-end; border-top: 1px solid var(--border); }
    .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 9px 18px; border-radius: 9px; font-family: 'DM Sans', sans-serif; font-size: 13px; cursor: pointer; }
    #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
    .toast { padding: 12px 20px; border-radius: 10px; font-size: 14px; font-weight: 500; max-width: 320px; animation: slideIn 0.3s ease; }
    .toast-success { background: #1a4a30; border: 1px solid var(--success); color: var(--text); }
    .toast-error { background: #4a1a1a; border: 1px solid var(--danger); color: var(--text); }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

    /* PRINT — documento separado generado por renderPrint() */
    #print-only { display: none; }
    @media print {
      body > *:not(#print-only) { display: none !important; }
      #print-only {
        display: block !important;
        font-family: Arial, Helvetica, sans-serif;
        color: #000;
        font-size: 11px;
      }
      /* ── Encabezado del documento ── */
      .p-doc-header {
        display: flex; align-items: flex-start; justify-content: space-between;
        padding-bottom: 10px; margin-bottom: 12px;
        border-bottom: 3px solid #245033;
      }
      .p-doc-logo { width: 56px; height: 56px; object-fit: contain; flex-shrink: 0; }
      .p-doc-logo-fallback { width: 56px; flex-shrink: 0; font-size: 9px; font-weight: 700; color: #245033; text-align: center; border: 1px solid #245033; padding: 4px; line-height: 1.3; display: flex; align-items: center; justify-content: center; }
      .p-doc-title { flex: 1; text-align: center; padding: 0 12px; }
      .p-doc-title h1 { font-size: 20px; font-weight: 900; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 4px; }
      .p-doc-title p { font-size: 10px; color: #333; margin: 1px 0; }
      .p-doc-fecha { text-align: right; line-height: 1.2; }
      .p-fecha-dow { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; color: #555; }
      .p-fecha-dia { font-size: 30px; font-weight: 900; color: #000; line-height: 1; }
      .p-fecha-mes { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
      /* ── Cada carrera ── */
      .p-carrera { border: 2px solid #245033; margin-bottom: 7px; page-break-inside: avoid; }
      .p-carrera-head {
        background: #245033 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact;
        color: #c9a84c; padding: 6px 10px;
        display: flex; align-items: baseline; justify-content: space-between; gap: 14px;
      }
      .p-head-text { font-size: 11px; font-weight: 700; flex: 1; line-height: 1.35; }
      .p-head-hora { font-size: 10px; font-weight: 600; white-space: nowrap; color: rgba(201,168,76,0.8); }
      .p-head-dist { font-size: 19px; font-weight: 900; color: #c9a84c; white-space: nowrap; flex-shrink: 0; }
      .p-carrera-body { padding: 5px 10px 7px; }
      /* Condición adicional */
      .p-linea2 { font-size: 10px; color: #444; margin-bottom: 3px; }
      /* Bolsa y distribución */
      .p-linea3 { font-size: 11px; font-weight: 700; border-top: 1px solid #ccc; padding-top: 4px; margin-top: 2px; }
      @page { size: A4 portrait; margin: 12mm; }
    }
    #auth-overlay { position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center; }
    .btn-logout { background:none;border:1px solid var(--border);color:var(--muted);padding:6px 14px;border-radius:8px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;transition:all 0.2s; }
    .btn-logout:hover { border-color:var(--danger);color:var(--danger); }
    .user-name { font-size:13px;color:var(--muted); }
    @media print { #auth-overlay, .btn-logout, .user-name { display:none !important; } }
  </style>
</head>
<body>
<div id="auth-overlay"><div class="spinner" style="width:32px;height:32px;border-width:3px;"></div></div>
<div id="toast-container"></div>

<div class="topbar">
  <a href="reuniones.html" class="btn-back">← Reuniones</a>
  <h1 id="topbar-title">Carta de Llamados</h1>
  <button class="btn-outline" onclick="window.print()">🖨️ Imprimir PDF</button>
  <button class="btn-primary" onclick="openModal()">+ Nueva Carrera</button>
</div>

<div class="reunion-header" id="reunion-header">
  <div class="reunion-info-grid" id="reunion-info">
    <div class="loading-state"><div class="spinner"></div></div>
  </div>
</div>

<div class="content">
  <div class="section-header">
    <h2>Turnos de carrera</h2>
    <span id="carreras-count" style="font-size:13px;color:var(--muted);">—</span>
  </div>
  <div id="list-container"></div>
</div>

<!-- SOLO IMPRESIÓN -->
<div id="print-only"></div>

<!-- MODAL CARRERA -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-title">Nueva Carrera</h2>
      <button class="btn-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="f-id">
      <div class="form-grid">
        <div class="form-group half">
          <label>N° Turno *</label>
          <input type="number" id="f-turno" min="1" required>
        </div>
        <div class="form-group two">
          <label>Nombre de la carrera</label>
          <input type="text" id="f-nombre" placeholder="Ej: Gran Premio Nacional">
        </div>
        <div class="form-group full">
          <label>Categoría *</label>
          <select id="f-categoria" required></select>
        </div>
        <div class="section-lbl">Condiciones</div>
        <div class="form-group">
          <label>Distancia (m) *</label>
          <input type="number" id="f-distancia" min="400" max="5000" step="50" required placeholder="1000">
        </div>
        <div class="form-group">
          <label>Tipo pista</label>
          <select id="f-tipo-pista">
            <option value="cesped">Césped</option>
            <option value="arena">Arena</option>
            <option value="tierra">Tierra</option>
          </select>
        </div>
        <div class="form-group">
          <label>Hora estimada</label>
          <input type="time" id="f-hora">
        </div>
        <div class="form-group">
          <label>Edad mínima (años)</label>
          <input type="number" id="f-edad-min" min="1" max="20" placeholder="2">
        </div>
        <div class="form-group">
          <label>Edad máxima (años)</label>
          <input type="number" id="f-edad-max" min="1" max="20" placeholder="5">
        </div>
        <div class="form-group">
          <label>Condición sexo</label>
          <select id="f-cond-sexo">
            <option value="ambos">Ambos</option>
            <option value="machos">Solo machos</option>
            <option value="hembras">Solo hembras</option>
            <option value="machos_castrados">Machos y castrados</option>
          </select>
        </div>
        <div class="form-group two">
          <label>Condición</label>
          <input type="text" id="f-handicap" placeholder="Ej: Para SPC no ganadores de 3 carreras">
        </div>
        <div class="form-group full">
          <label>Condición adicional</label>
          <input type="text" id="f-cond-adicional" placeholder="Condiciones especiales…">
        </div>
        <div class="section-lbl">Premio</div>
        <div class="form-group two">
          <label>Bolsa total ($)</label>
          <input type="text" id="f-bolsa" placeholder="0" oninput="fmtInput(this);updPct()">
        </div>
        <div class="form-group full">
          <label>Distribución por puesto (%)</label>
          <div class="premios-grid" id="premios-grid">
            <div class="premio-input"><label>1°</label><input type="number" id="pr-1" min="0" max="100" step="0.1" value="60" oninput="updPct()"></div>
            <div class="premio-input"><label>2°</label><input type="number" id="pr-2" min="0" max="100" step="0.1" value="19" oninput="updPct()"></div>
            <div class="premio-input"><label>3°</label><input type="number" id="pr-3" min="0" max="100" step="0.1" value="12" oninput="updPct()"></div>
            <div class="premio-input"><label>4°</label><input type="number" id="pr-4" min="0" max="100" step="0.1" value="6" oninput="updPct()"></div>
            <div class="premio-input"><label>5°</label><input type="number" id="pr-5" min="0" max="100" step="0.1" value="3" oninput="updPct()"></div>
            <div class="premio-input"><label>6°</label><input type="number" id="pr-6" readonly class="pr-auto" tabindex="-1"><div class="premio-sublabel">auto</div></div>
          </div>
          <div class="total-premios" id="total-pct">Total: 100%</div>
        </div>
        <div class="form-group">
          <label>Ganancia mínima por puesto ($)</label>
          <input type="text" id="f-ganancia-minima" placeholder="0" oninput="fmtInput(this)">
        </div>
        <div class="form-group">
          <label>Cupo máximo</label>
          <input type="number" id="f-cupo" min="1" max="30" placeholder="12">
        </div>
        <div class="form-group full">
          <div class="bono-block">
            <div class="bono-block-title">🏆 Bono al ganador (1°)</div>
            <div class="premio-input" style="max-width:200px;">
              <label>Monto adicional ($)</label>
              <input type="number" id="bono-ganador" min="0" step="100" value="0" placeholder="0 = sin bono">
            </div>
          </div>
          <div class="bono-block">
            <div class="bono-block-title">🎁 Bono por posición (del 6° en adelante)</div>
            <div class="bono-pos-grid">
              <div class="premio-input">
                <label>Hasta el puesto N° (máx. 10)</label>
                <input type="number" id="f-bono-pos-hasta" min="6" max="10" step="1" placeholder="ej: 8">
              </div>
              <div class="premio-input">
                <label>Monto por puesto ($)</label>
                <input type="text" id="f-bono-pos-monto" placeholder="0" oninput="fmtInput(this)">
              </div>
            </div>
          </div>
        </div>
        <div class="section-lbl">Inscripciones</div>
        <div class="form-group">
          <label>Apertura inscripción</label>
          <input type="datetime-local" id="f-ap-insc">
        </div>
        <div class="form-group">
          <label>Cierre inscripción</label>
          <input type="datetime-local" id="f-ci-insc">
        </div>
        <div class="form-group">
          <label>Apertura ratificación</label>
          <input type="datetime-local" id="f-ap-rat">
        </div>
        <div class="form-group">
          <label>Cierre ratificación</label>
          <input type="datetime-local" id="f-ci-rat">
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn-primary" onclick="saveRecord()" id="btn-save">Guardar</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
let sb, CLUB_ID, currentUser;
async function initAuth(){const{createClient}=supabase;sb=createClient('https://unlhcuanfrtpatoipwve.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVubGhjdWFuZnJ0cGF0b2lwd3ZlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3MjQ0OTcsImV4cCI6MjA5MjMwMDQ5N30.rKb8BI7fBQcRdyyyxVfBOZbtCmGYKIMLUDLVmkn1SYM');const{data:{session}}=await sb.auth.getSession();if(!session){window.location.replace('login.html');return false;}const{data:usr}=await sb.from('usuarios').select('club_id,nombre_completo,rol').eq('email',session.user.email).single();if(usr.rol==='super_admin'){const urlClub=new URLSearchParams(window.location.search).get('club');CLUB_ID=urlClub||usr.club_id||null;}else{if(!usr.club_id){await sb.auth.signOut();window.location.replace('login.html');return false;}CLUB_ID=usr.club_id;}currentUser={...session.user,nombre_completo:usr.nombre_completo,rol:usr.rol};const uEl=document.getElementById('user-name');if(uEl)uEl.textContent=usr.nombre_completo||session.user.email;document.getElementById('auth-overlay').style.display='none';return true;}
function logout(){sb.auth.signOut().then(()=>window.location.replace('login.html'));}

const params = new URLSearchParams(location.search);
let reunionId = params.get('reunion_id');
let reunion=null, carreras=[], categorias=[], hipodromos=[], clubData=null;

function toast(msg, type='success') {
  const t=document.createElement('div'); t.className=`toast toast-${type}`; t.textContent=msg;
  document.getElementById('toast-container').appendChild(t); setTimeout(()=>t.remove(),3500);
}

function formatMonto(num) {
  return num.toString().replace(/\B(?=(\d{3})+(?!\d))/g, '.');
}
function parseMonto(str) {
  return parseFloat(str.replace(/\./g, '')) || 0;
}
function fmtInput(el) {
  const raw = el.value.replace(/\./g, '').replace(/\D/g, '');
  el.value = raw ? formatMonto(raw) : '';
}

function fmtDate(d) {
  if (!d) return '—';
  return new Date(d+'T12:00:00').toLocaleDateString('es-AR',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
}

function updPct() {
  const sum15 = [1,2,3,4,5].reduce((s,i)=>s+(parseFloat(document.getElementById(`pr-${i}`).value)||0),0);
  const auto6 = Math.max(0, Math.round((100 - sum15) * 10) / 10);
  document.getElementById('pr-6').value = auto6;
  const total = sum15 + auto6;
  const el = document.getElementById('total-pct');
  el.textContent = `Total: ${total.toFixed(1)}%`;
  el.className = 'total-premios ' + (Math.abs(total-100)<0.01 ? 'ok' : 'bad');
}

async function load() {
  if (!reunionId) {
    const { data: ultima } = await sb.from('reuniones')
      .select('id')
      .eq('club_id', CLUB_ID)
      .order('fecha', { ascending: false })
      .limit(1)
      .single();
    if (!ultima) {
      document.getElementById('reunion-info').innerHTML = '';
      document.getElementById('list-container').innerHTML = `
        <div class="empty-state">
          <div class="icon">📋</div>
          <h3>No hay reuniones creadas</h3>
          <p style="color:var(--muted);margin-top:8px;">Creá una desde el módulo de Reuniones.</p>
          <a href="reuniones.html" class="btn-primary" style="display:inline-block;margin-top:20px;text-decoration:none;padding:10px 22px;">Ir a Reuniones</a>
        </div>`;
      return;
    }
    reunionId = ultima.id;
    history.replaceState(null, '', `?reunion_id=${reunionId}`);
  }
  const [{ data: r, error: er }, { data: cars }, { data: cats }, { data: hips }, { data: club }] = await Promise.all([
    sb.from('reuniones').select('*, hipodromos(nombre,sigla,localidad)').eq('id', reunionId).single(),
    sb.from('carreras').select('*').eq('reunion_id', reunionId).order('numero_turno'),
    sb.from('categorias_carrera').select('id,nombre,codigo,simbolo,color_hex').eq('club_id', CLUB_ID).eq('activo', true).order('orden_display'),
    sb.from('hipodromos').select('id,nombre,sigla').eq('club_id', CLUB_ID),
    sb.from('clubs').select('logo_url, nombre').eq('id', CLUB_ID).single(),
  ]);
  if (er) { toast(er.message,'error'); return; }
  reunion = r; carreras = cars||[]; categorias = cats||[]; hipodromos = hips||[]; clubData = club||null;
  renderHeader();
  populateCategorias();
  renderCarreras();
}

function renderHeader() {
  if (!reunion) return;
  const hip = reunion.hipodromos;
  document.getElementById('topbar-title').textContent = `Carta de Llamados — Reunión ${reunion.numero||''}`;
  document.title = `Carta de Llamados — SGH`;
  document.getElementById('reunion-info').innerHTML = `
    <div class="info-item"><div class="info-label">Fecha</div><div class="info-val">${fmtDate(reunion.fecha)}</div></div>
    <div class="info-item"><div class="info-label">Hipódromo</div><div class="info-val">${hip?.nombre||'—'} ${hip?.sigla?`(${hip.sigla})`:''}</div></div>
    <div class="info-item"><div class="info-label">Localidad</div><div class="info-val">${hip?.localidad||'—'}</div></div>
    <div class="info-item"><div class="info-label">Tipo</div><div class="info-val">${reunion.tipo}</div></div>
    ${reunion.condicion_pista?`<div class="info-item"><div class="info-label">Pista</div><div class="info-val">${reunion.condicion_pista}</div></div>`:''}
    ${reunion.tiempo_clima?`<div class="info-item"><div class="info-label">Clima</div><div class="info-val">${reunion.tiempo_clima}</div></div>`:''}
    <div class="info-item"><div class="info-label">Estado</div><div class="info-val"><span class="badge badge-${reunion.estado}">${reunion.estado}</span></div></div>
  `;
}

function populateCategorias() {
  document.getElementById('f-categoria').innerHTML = '<option value="">— Seleccionar categoría —</option>' +
    categorias.map(c=>`<option value="${c.id}">${c.nombre}${c.codigo?` (${c.codigo})`:''}</option>`).join('');
}

function renderCarreras() {
  document.getElementById('carreras-count').textContent = `${carreras.length} turno${carreras.length!==1?'s':''}`;
  if (!carreras.length) {
    document.getElementById('list-container').innerHTML = `<div class="empty-state"><div class="icon">📋</div><h3>Sin turnos</h3><p>Esta reunión no tiene carreras cargadas aún. Agregá el primer turno con el botón +</p></div>`;
    return;
  }
  document.getElementById('list-container').innerHTML = `<div class="carrera-list">${carreras.map(c => {
    const cat = categorias.find(x=>x.id===c.categoria_id);
    const dist = c.distribucion_premios || {"1":60,"2":20,"3":10,"4":6,"5":4};
    const bolsa = c.bolsa_total || 0;

    // Cálculo financiero
    const bonoGan     = dist.bono_ganador        || 0;
    const bonoPosH    = dist.bono_posicion_hasta  || 0;
    const bonoPosD    = dist.bono_posicion_desde  || 6;
    const bonoPosMon  = dist.bono_posicion_monto  || 0;
    const cantPuestos = bonoPosH >= bonoPosD ? bonoPosH - bonoPosD + 1 : 0;
    const totalBonos  = bonoGan + (bonoPosMon * cantPuestos);
    const montoTotal  = bolsa + totalBonos;

    // Último puesto con premio por porcentaje (de la distribución)
    const EXCLUIR = ['bonos','bono_ganador','bono_posicion_desde','bono_posicion_hasta','bono_posicion_monto','ganancia_minima'];
    const puestosConPct = Object.entries(dist)
      .filter(([k,v]) => !EXCLUIR.includes(k) && Number(v) > 0)
      .map(([k]) => parseInt(k));
    const ultimoPuestoDist = puestosConPct.length ? Math.max(...puestosConPct) : 5;
    const ultimoPuesto     = bonoPosH > 0 ? bonoPosH : ultimoPuestoDist;

    // Desglose financiero
    let desgloseHtml = '';
    if (bolsa > 0 || totalBonos > 0) {
      const rowBolsa = bolsa > 0 ? `
        <div class="premio-row">
          <span class="premio-row-lbl">Bolsa de premios (1° al ${ultimoPuestoDist}°)</span>
          <span class="premio-row-val">$${formatMonto(bolsa)}</span>
        </div>` : '';
      const rowBonos = totalBonos > 0 ? `
        <div class="premio-row" style="margin-top:2px;">
          <span class="premio-row-lbl">Bonos</span>
        </div>
        ${bonoGan > 0 ? `<div class="premio-row premio-row-sub">
          <span class="premio-row-lbl">· Bono ganador</span>
          <span class="premio-row-val">$${formatMonto(bonoGan)}</span>
        </div>` : ''}
        ${bonoPosH > 0 && bonoPosMon > 0 ? `<div class="premio-row premio-row-sub">
          <span class="premio-row-lbl">· Bono ${bonoPosD}° al ${bonoPosH}°</span>
          <span class="premio-row-val">$${formatMonto(bonoPosMon)} por puesto</span>
        </div>` : ''}
        <div class="premio-row premio-row-subtotal">
          <span class="premio-row-lbl">Total bonos</span>
          <span class="premio-row-val">$${formatMonto(totalBonos)}</span>
        </div>` : '';
      desgloseHtml = `<div class="premio-desglose">
        ${rowBolsa}${rowBonos}
        <div class="premio-row-puestos">Premios del 1° al ${ultimoPuesto}° puesto</div>
        <div class="premio-row premio-total">
          <span class="premio-row-lbl">BOLSA TOTAL DE LA CARRERA</span>
          <span class="premio-row-val">$${formatMonto(montoTotal)}</span>
        </div>
      </div>`;
    }

    return `<div class="carrera-card">
      <div class="carrera-card-header">
        <div class="carrera-num">${c.numero_turno}</div>
        <div class="carrera-title">${c.nombre||`Carrera ${c.numero_turno}`}</div>
        <div class="carrera-chips">
          ${cat?`<span class="chip-big">${cat.nombre}</span>`:''}
          <span class="chip-big">${c.distancia_metros} mts</span>
          <span class="chip">${c.tipo_pista||'—'}</span>
          ${c.hora_estimada?`<span class="chip">🕐 ${c.hora_estimada}</span>`:''}
        </div>
        <div class="carrera-actions">
          <button class="btn-sm btn-edit" onclick='openModal(${JSON.stringify(c)})'>✏️</button>
          <button class="btn-sm btn-delete" onclick="deleteCarrera('${c.id}')">🗑️</button>
        </div>
      </div>
      <div class="carrera-body">
        ${c.condicion_handicap?`<div class="carrera-condicion">${c.condicion_handicap}</div>`:''}
        ${c.condicion_adicional?`<div class="carrera-condicion">${c.condicion_adicional}</div>`:''}
      </div>
      <div class="premios-list"></div>
      ${desgloseHtml}
    </div>`;
  }).join('')}</div>`;
  renderPrint();
}

function renderPrint() {
  if (!reunion || !carreras.length) return;
  const hip = reunion.hipodromos;
  const f = new Date(reunion.fecha + 'T12:00:00');
  const DIAS  = ['DOMINGO','LUNES','MARTES','MIÉRCOLES','JUEVES','VIERNES','SÁBADO'];
  const MESES = ['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'];
  const EXCLUIR = ['bonos','bono_ganador','bono_posicion_desde','bono_posicion_hasta','bono_posicion_monto','ganancia_minima'];
  const ORDINAL = ['1ª','2ª','3ª','4ª','5ª','6ª'];

  const logoHtml = clubData?.logo_url
    ? `<img src="${clubData.logo_url}" class="p-doc-logo" alt="${clubData.nombre||''}">`
    : `<div class="p-doc-logo-fallback">${clubData?.nombre||'SGH'}</div>`;

  const header = `<div class="p-doc-header">
    ${logoHtml}
    <div class="p-doc-title">
      <h1>Carta de Llamado</h1>
      <p>Reunión N° ${reunion.numero||'—'} &mdash; ${hip?.nombre||'—'}${hip?.sigla?` (${hip.sigla})`:''}</p>
      <p>${hip?.localidad||''}${reunion.condicion_pista?` &mdash; Pista: ${reunion.condicion_pista}`:''}</p>
    </div>
    <div class="p-doc-fecha">
      <div class="p-fecha-dow">${DIAS[f.getDay()]}</div>
      <div class="p-fecha-dia">${f.getDate()}</div>
      <div class="p-fecha-mes">${MESES[f.getMonth()]} ${f.getFullYear()}</div>
    </div>
  </div>`;

  const carrerasHtml = carreras.map(c => {
    const cat     = categorias.find(x => x.id === c.categoria_id);
    const dist    = c.distribucion_premios || {};
    const bolsa   = c.bolsa_total || 0;
    const bonoGan    = dist.bono_ganador       || 0;
    const bonoPosH   = dist.bono_posicion_hasta || 0;
    const bonoPosD   = dist.bono_posicion_desde || 6;
    const bonoPosMon = dist.bono_posicion_monto || 0;

    // Encabezado: "CARRERA N — CATEGORÍA (cód) — condición"
    const catLabel  = cat ? cat.nombre.toUpperCase() + (cat.codigo ? ` (${cat.codigo})` : '') : '';
    const condMain  = c.condicion_handicap || c.nombre || '';
    const headParts = [`CARRERA ${c.numero_turno}`, catLabel, condMain].filter(Boolean);
    const headText  = headParts.join(' &mdash; ');

    // Condición adicional (línea pequeña bajo encabezado)
    const condAdicional = c.condicion_adicional || '';

    // Línea de bolsa: BOLSA $X — 1ª $X — ... — BONO GANADOR $X — BONO N°-N° $X/puesto
    let bolsaLine = '';
    if (bolsa > 0) {
      const puestos = Object.entries(dist)
        .filter(([k,v]) => !EXCLUIR.includes(k) && Number(v) > 0)
        .sort(([a],[b]) => parseInt(a) - parseInt(b))
        .map(([pos,pct]) => `${ORDINAL[parseInt(pos)-1]||pos+'°'} $${formatMonto(Math.round(bolsa * pct / 100))}`);
      bolsaLine = `BOLSA: $${formatMonto(bolsa)}`;
      if (puestos.length)    bolsaLine += ' &mdash; ' + puestos.join(' &mdash; ');
      if (bonoGan > 0)       bolsaLine += ` &mdash; BONO GANADOR $${formatMonto(bonoGan)}`;
      if (bonoPosH && bonoPosMon) bolsaLine += ` &mdash; BONO ${bonoPosD}°-${bonoPosH}° $${formatMonto(bonoPosMon)}/puesto`;
    }

    return `<div class="p-carrera">
      <div class="p-carrera-head">
        <span class="p-head-text">${headText}</span>
        ${c.hora_estimada ? `<span class="p-head-hora">${c.hora_estimada} hs &nbsp;</span>` : ''}
        <span class="p-head-dist">${c.distancia_metros} m</span>
      </div>
      <div class="p-carrera-body">
        ${condAdicional ? `<div class="p-linea2">${condAdicional}</div>` : ''}
        ${bolsaLine     ? `<div class="p-linea3">${bolsaLine}</div>`     : ''}
      </div>
    </div>`;
  }).join('');

  document.getElementById('print-only').innerHTML = header + carrerasHtml;
}

function openModal(rec=null) {
  document.getElementById('modal-title').textContent = rec ? `Editar Carrera ${rec.numero_turno}` : 'Nueva Carrera';
  document.getElementById('f-id').value = rec?.id||'';
  document.getElementById('f-turno').value = rec?.numero_turno || (carreras.length+1);
  document.getElementById('f-nombre').value = rec?.nombre||'';
  document.getElementById('f-categoria').value = rec?.categoria_id||'';
  document.getElementById('f-distancia').value = rec?.distancia_metros||'';
  document.getElementById('f-tipo-pista').value = rec?.tipo_pista||'cesped';
  document.getElementById('f-hora').value = rec?.hora_estimada||'';
  document.getElementById('f-edad-min').value = rec?.edad_minima_anos||'';
  document.getElementById('f-edad-max').value = rec?.edad_maxima_anos||'';
  document.getElementById('f-cond-sexo').value = rec?.condicion_sexo||'ambos';
  document.getElementById('f-handicap').value = rec?.condicion_handicap||'';
  document.getElementById('f-cond-adicional').value = rec?.condicion_adicional||'';
  document.getElementById('f-bolsa').value = rec?.bolsa_total ? formatMonto(rec.bolsa_total) : '';
  document.getElementById('f-cupo').value = rec?.cupo_maximo||'';
  const dist = rec?.distribucion_premios || {"1":60,"2":19,"3":12,"4":6,"5":3};
  [1,2,3,4,5].forEach(i=>{ document.getElementById(`pr-${i}`).value = dist[String(i)]||0; });
  document.getElementById('f-ganancia-minima').value = dist.ganancia_minima ? formatMonto(dist.ganancia_minima) : '';
  document.getElementById('bono-ganador').value = dist.bono_ganador ? formatMonto(dist.bono_ganador) : '';
  document.getElementById('f-bono-pos-hasta').value = dist.bono_posicion_hasta || '';
  document.getElementById('f-bono-pos-monto').value = dist.bono_posicion_monto ? formatMonto(dist.bono_posicion_monto) : '';
  updPct();
  document.getElementById('f-ap-insc').value = rec?.apertura_inscripcion ? rec.apertura_inscripcion.slice(0,16) : '';
  document.getElementById('f-ci-insc').value = rec?.cierre_inscripcion ? rec.cierre_inscripcion.slice(0,16) : '';
  document.getElementById('f-ap-rat').value = rec?.apertura_ratificacion ? rec.apertura_ratificacion.slice(0,16) : '';
  document.getElementById('f-ci-rat').value = rec?.cierre_ratificacion ? rec.cierre_ratificacion.slice(0,16) : '';
  document.getElementById('modal').classList.add('open');
}

function closeModal() { document.getElementById('modal').classList.remove('open'); }

async function saveRecord() {
  const turno = parseInt(document.getElementById('f-turno').value);
  const dist = document.getElementById('f-distancia').value;
  if (!turno || !dist) { toast('Turno y distancia son requeridos','error'); return; }
  const id = document.getElementById('f-id').value;
  const btn = document.getElementById('btn-save');
  btn.disabled=true; btn.textContent='Guardando…';
  const distribucion = {};
  [1,2,3,4,5,6].forEach(i=>{ const v=parseFloat(document.getElementById(`pr-${i}`).value); if(v) distribucion[String(i)]=v; });
  const gananciaMinima = parseMonto(document.getElementById('f-ganancia-minima').value)||0;
  if (gananciaMinima) distribucion.ganancia_minima = gananciaMinima;
  const bonoGanador = parseMonto(document.getElementById('bono-ganador').value)||0;
  if (bonoGanador) distribucion.bono_ganador = bonoGanador;
  const bonoPosHasta = parseInt(document.getElementById('f-bono-pos-hasta').value)||0;
  const bonoPosMontoVal = parseMonto(document.getElementById('f-bono-pos-monto').value)||0;
  if (bonoPosHasta && bonoPosMontoVal) {
    distribucion.bono_posicion_desde = 6;
    distribucion.bono_posicion_hasta = bonoPosHasta;
    distribucion.bono_posicion_monto = bonoPosMontoVal;
  }
  const payload = {
    reunion_id: reunionId,
    numero_turno: turno,
    nombre: document.getElementById('f-nombre').value.trim() || null,
    categoria_id: document.getElementById('f-categoria').value || null,
    distancia_metros: parseInt(dist),
    tipo_pista: document.getElementById('f-tipo-pista').value,
    hora_estimada: document.getElementById('f-hora').value || null,
    edad_minima_anos: document.getElementById('f-edad-min').value ? parseInt(document.getElementById('f-edad-min').value) : null,
    edad_maxima_anos: document.getElementById('f-edad-max').value ? parseInt(document.getElementById('f-edad-max').value) : null,
    condicion_sexo: document.getElementById('f-cond-sexo').value,
    condicion_handicap: document.getElementById('f-handicap').value.trim() || null,
    condicion_adicional: document.getElementById('f-cond-adicional').value.trim() || null,
    bolsa_total: document.getElementById('f-bolsa').value ? parseMonto(document.getElementById('f-bolsa').value) : null,
    cupo_maximo: document.getElementById('f-cupo').value ? parseInt(document.getElementById('f-cupo').value) : null,
    distribucion_premios: distribucion,
    apertura_inscripcion: document.getElementById('f-ap-insc').value || null,
    cierre_inscripcion: document.getElementById('f-ci-insc').value || null,
    apertura_ratificacion: document.getElementById('f-ap-rat').value || null,
    cierre_ratificacion: document.getElementById('f-ci-rat').value || null,
    estado: 'abierta',
  };
  const { error } = id
    ? await sb.from('carreras').update(payload).eq('id',id)
    : await sb.from('carreras').insert(payload);
  btn.disabled=false; btn.textContent='Guardar';
  if (error) { toast(error.message,'error'); return; }
  toast(id ? 'Carrera actualizada' : 'Carrera creada');
  closeModal();
  const { data } = await sb.from('carreras').select('*').eq('reunion_id', reunionId).order('numero_turno');
  carreras = data || [];
  renderCarreras();
}

async function deleteCarrera(id) {
  if (!confirm('¿Eliminar este turno? Se perderán las inscripciones asociadas.')) return;
  const { error } = await sb.from('carreras').delete().eq('id',id);
  if (error) { toast(error.message,'error'); return; }
  toast('Carrera eliminada');
  carreras = carreras.filter(c=>c.id!==id);
  renderCarreras();
}

document.getElementById('modal').addEventListener('click', e=>{ if(e.target===e.currentTarget) closeModal(); });
(async()=>{if(await initAuth())load();})();
</script>
</body>
</html>
