<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="logo32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="logo180x180.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0e2318">
  <title>Caballerizas — SGH</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0e2318; --card: #1a3d26; --accent: #c9a84c;
      --text: #f5f0e8; --muted: #a0b8a0; --danger: #e05252;
      --success: #4caf82; --border: rgba(201,168,76,0.2); --input-bg: #0e2318;
    }
    body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }
    h1,h2,h3 { font-family: 'Playfair Display', serif; }
    .topbar { background: rgba(0,0,0,0.3); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; align-items: center; gap: 16px; }
    .btn-back { background: none; border: 1px solid var(--border); color: var(--muted); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 14px; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s; }
    .btn-back:hover { border-color: var(--accent); color: var(--accent); }
    .topbar h1 { font-size: 22px; color: var(--accent); flex: 1; }
    .content { max-width: 1200px; margin: 0 auto; padding: 28px 24px; }
    .toolbar { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; align-items: center; }
    .search-box { flex: 1; min-width: 240px; position: relative; }
    .search-box input { width: 100%; background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 10px 16px 10px 40px; border-radius: 10px; font-family: 'DM Sans', sans-serif; font-size: 14px; outline: none; transition: border 0.2s; }
    .search-box input:focus { border-color: var(--accent); }
    .search-box::before { content: '🔍'; position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 14px; }
    .filter-select { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 10px 16px; border-radius: 10px; font-family: 'DM Sans', sans-serif; font-size: 14px; cursor: pointer; outline: none; }
    .btn-primary { background: var(--accent); color: #1a1a0a; border: none; padding: 10px 20px; border-radius: 10px; font-family: 'DM Sans', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: opacity 0.2s; white-space: nowrap; }
    .btn-primary:hover { opacity: 0.9; }
    .stats-row { display: flex; gap: 16px; margin-bottom: 24px; flex-wrap: wrap; }
    .stat-chip { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 20px; text-align: center; min-width: 120px; }
    .stat-chip-val { font-size: 22px; font-weight: 700; color: var(--accent); }
    .stat-chip-lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; transition: border-color 0.2s; }
    .card:hover { border-color: rgba(201,168,76,0.4); }
    .card-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
    .card-name { font-family: 'Playfair Display', serif; font-size: 18px; color: var(--accent); margin-bottom: 3px; }
    .card-responsable { font-size: 13px; color: var(--muted); }
    .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; text-transform: uppercase; }
    .badge-activo { background: rgba(76,175,130,0.15); color: var(--success); border: 1px solid rgba(76,175,130,0.3); }
    .badge-inactivo { background: rgba(224,82,82,0.1); color: var(--danger); border: 1px solid rgba(224,82,82,0.3); }
    .spc-count { background: rgba(201,168,76,0.1); border: 1px solid rgba(201,168,76,0.25); border-radius: 10px; padding: 10px 14px; margin-bottom: 14px; display: flex; align-items: center; justify-content: space-between; }
    .spc-count-num { font-size: 22px; font-weight: 700; color: var(--accent); font-family: 'Playfair Display', serif; }
    .spc-count-label { font-size: 12px; color: var(--muted); }
    .spc-link { font-size: 12px; color: var(--accent); text-decoration: none; }
    .spc-link:hover { text-decoration: underline; }
    .card-detail { font-size: 13px; color: var(--muted); line-height: 1.7; margin-bottom: 14px; }
    .card-detail span { color: var(--text); }
    .card-actions { display: flex; gap: 8px; }
    .btn-sm { padding: 7px 14px; border-radius: 8px; font-size: 13px; font-weight: 500; cursor: pointer; font-family: 'DM Sans', sans-serif; border: none; transition: all 0.2s; }
    .btn-edit { background: rgba(201,168,76,0.15); color: var(--accent); border: 1px solid rgba(201,168,76,0.3); }
    .btn-edit:hover { background: rgba(201,168,76,0.25); }
    .btn-delete { background: rgba(224,82,82,0.1); color: var(--danger); border: 1px solid rgba(224,82,82,0.3); }
    .btn-delete:hover { background: rgba(224,82,82,0.2); }
    .btn-spcs { background: rgba(74,144,226,0.1); color: #74b0f7; border: 1px solid rgba(74,144,226,0.3); }
    .btn-spcs:hover { background: rgba(74,144,226,0.2); }
    .empty-state { text-align: center; padding: 60px 20px; }
    .empty-state .icon { font-size: 48px; margin-bottom: 16px; }
    .empty-state h3 { font-size: 18px; color: var(--muted); margin-bottom: 8px; }
    .loading-state { display: flex; align-items: center; justify-content: center; padding: 60px; gap: 12px; color: var(--muted); }
    .spinner { width: 24px; height: 24px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 16px; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--card); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 720px; max-height: 90vh; overflow-y: auto; }
    .modal-header { padding: 24px 24px 0; display: flex; align-items: center; justify-content: space-between; }
    .modal-header h2 { font-size: 20px; color: var(--accent); }
    .btn-close { background: none; border: none; color: var(--muted); font-size: 22px; cursor: pointer; line-height: 1; padding: 4px; }
    .modal-body { padding: 20px 24px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group.full { grid-column: 1 / -1; }
    label { font-size: 13px; font-weight: 500; color: var(--muted); }
    input, select, textarea { background: var(--input-bg); border: 1px solid var(--border); color: var(--text); padding: 10px 14px; border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 14px; outline: none; width: 100%; transition: border 0.2s; }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    textarea { resize: vertical; min-height: 80px; }
    select option { background: #1a3d26; }
    .modal-footer { padding: 0 24px 24px; display: flex; gap: 10px; justify-content: flex-end; }
    .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 10px 20px; border-radius: 10px; font-family: 'DM Sans', sans-serif; font-size: 14px; cursor: pointer; transition: all 0.2s; }
    .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
    #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
    .toast { padding: 12px 20px; border-radius: 10px; font-size: 14px; font-weight: 500; max-width: 320px; animation: slideIn 0.3s ease; }
    .toast-success { background: #1a4a30; border: 1px solid var(--success); color: var(--text); }
    .toast-error { background: #4a1a1a; border: 1px solid var(--danger); color: var(--text); }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    @media (max-width: 600px) { .form-grid { grid-template-columns: 1fr; } .form-group.full { grid-column: 1; } .resp-inputs { grid-template-columns: 1fr 1fr; } .resp-inputs .span2 { grid-column: span 2; } }
    #auth-overlay { position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center; }
    .btn-logout { background:none;border:1px solid var(--border);color:var(--muted);padding:6px 14px;border-radius:8px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;transition:all 0.2s;margin-left:auto; }
    .btn-logout:hover { border-color:var(--danger);color:var(--danger); }
    .user-name { font-size:13px;color:var(--muted); }
    /* ── Sección responsables ── */
    .resp-fieldset { border: 1px solid var(--border); border-radius: 10px; padding: 16px; grid-column: 1 / -1; }
    .resp-fieldset legend { font-family: 'Playfair Display', serif; color: var(--accent); font-size: 15px; padding: 0 8px; }
    .resp-row { padding: 10px 0; border-bottom: 1px solid var(--border); }
    .resp-row:last-of-type { border-bottom: none; }
    .resp-row-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .resp-row-label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .badge-prof { display: inline-flex; align-items: center; gap: 4px; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; background: rgba(76,175,130,0.15); color: var(--success); border: 1px solid rgba(76,175,130,0.3); }
    .btn-remove-resp { margin-left: auto; background: rgba(224,82,82,0.1); color: var(--danger); border: 1px solid rgba(224,82,82,0.3); border-radius: 6px; padding: 3px 10px; font-size: 12px; cursor: pointer; font-family: 'DM Sans', sans-serif; transition: background 0.2s; }
    .btn-remove-resp:hover { background: rgba(224,82,82,0.22); }
    .resp-inputs { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
    .resp-inputs input { font-size: 13px; padding: 8px 12px; }
    .resp-inputs .span2 { grid-column: span 2; }
    .btn-add-resp { margin-top: 12px; background: transparent; border: 1px dashed rgba(201,168,76,0.35); color: var(--muted); padding: 8px 16px; border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 13px; cursor: pointer; transition: all 0.2s; width: 100%; }
    .btn-add-resp:hover { border-color: var(--accent); color: var(--accent); }
  </style>
</head>
<body>
<div id="auth-overlay"><div class="spinner" style="width:32px;height:32px;border-width:3px;"></div></div>
<div id="toast-container"></div>

<div class="topbar">
  <a href="index.html" class="btn-back">← Volver</a>
  <h1>Caballerizas</h1>
  <span class="user-name" id="user-name"></span>
  <button class="btn-logout" onclick="logout()">Cerrar sesión</button>
</div>

<div class="content">
  <div class="stats-row">
    <div class="stat-chip"><div class="stat-chip-val" id="cnt-total">—</div><div class="stat-chip-lbl">Total</div></div>
    <div class="stat-chip"><div class="stat-chip-val" id="cnt-activas">—</div><div class="stat-chip-lbl">Activas</div></div>
    <div class="stat-chip"><div class="stat-chip-val" id="cnt-spcs">—</div><div class="stat-chip-lbl">SPC alojados</div></div>
  </div>

  <div class="toolbar">
    <div class="search-box">
      <input type="text" id="search" placeholder="Buscar por nombre o responsable…" oninput="filterRender()">
    </div>
    <select class="filter-select" id="filter-activo" onchange="filterRender()">
      <option value="">Todas</option>
      <option value="true">Activas</option>
      <option value="false">Inactivas</option>
    </select>
    <button class="btn-primary" onclick="openModal()">+ Nueva Caballeriza</button>
  </div>

  <div id="list-container"></div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-title">Nueva Caballeriza</h2>
      <button class="btn-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <form id="form" onsubmit="saveRecord(event)">
        <input type="hidden" id="f-id">
        <div class="form-grid">
          <div class="form-group full">
            <label>Nombre *</label>
            <input type="text" id="f-nombre" required placeholder="Nombre del stud o caballeriza">
          </div>
          <div class="form-group">
            <label>Teléfono</label>
            <input type="tel" id="f-telefono">
          </div>
          <div class="form-group">
            <label>Activo</label>
            <select id="f-activo">
              <option value="true">Sí</option>
              <option value="false">No</option>
            </select>
          </div>
          <div class="form-group full">
            <label>Domicilio</label>
            <input type="text" id="f-domicilio" placeholder="Dirección de la caballeriza">
          </div>
          <div class="form-group full">
            <label>Notas</label>
            <textarea id="f-notas" placeholder="Observaciones…"></textarea>
          </div>

          <!-- Responsables -->
          <fieldset class="resp-fieldset">
            <legend>Responsables</legend>

            <!-- Fila fija: propietario -->
            <div class="resp-row" id="row-propietario">
              <div class="resp-row-header">
                <span class="resp-row-label">Propietario *</span>
                <div id="rp-badge" class="badge-prof" style="display:none">✓ Entrenador con patente</div>
              </div>
              <div class="resp-inputs">
                <input id="rp-apellido" placeholder="Apellido *">
                <input id="rp-nombre"   placeholder="Nombre *">
                <input id="rp-dni"      placeholder="DNI *"
                       onblur="checkProfesional(this, document.getElementById('rp-badge'))">
                <input id="rp-fnac"     type="date" title="Fecha de nacimiento">
                <input id="rp-localidad" placeholder="Localidad" class="span2">
              </div>
            </div>

            <!-- Co-propietarios dinámicos -->
            <div id="coprop-list"></div>

            <button type="button" class="btn-add-resp" onclick="addCopropRow()">+ Agregar co-propietario</button>
          </fieldset>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary" onclick="closeModal()">Cancelar</button>
      <button class="btn-primary" onclick="document.getElementById('form').requestSubmit()" id="btn-save">Guardar</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
let sb, CLUB_ID, currentUser;
async function initAuth(){const{createClient}=supabase;sb=createClient('https://unlhcuanfrtpatoipwve.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVubGhjdWFuZnJ0cGF0b2lwd3ZlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY3MjQ0OTcsImV4cCI6MjA5MjMwMDQ5N30.rKb8BI7fBQcRdyyyxVfBOZbtCmGYKIMLUDLVmkn1SYM');const{data:{session}}=await sb.auth.getSession();if(!session){window.location.replace('login.html');return false;}const{data:usr}=await sb.from('usuarios').select('club_id,nombre_completo,rol').eq('email',session.user.email).single();if(usr.rol==='super_admin'){const urlClub=new URLSearchParams(window.location.search).get('club');CLUB_ID=urlClub||usr.club_id||null;}else{if(!usr.club_id){await sb.auth.signOut();window.location.replace('login.html');return false;}CLUB_ID=usr.club_id;}currentUser={...session.user,nombre_completo:usr.nombre_completo,rol:usr.rol};const uEl=document.getElementById('user-name');if(uEl)uEl.textContent=usr.nombre_completo||session.user.email;document.getElementById('auth-overlay').style.display='none';return true;}
function logout(){sb.auth.signOut().then(()=>window.location.replace('login.html'));}

let allData = [];
let spcCounts = {};

function toast(msg, type = 'success') {
  const t = document.createElement('div');
  t.className = `toast toast-${type}`;
  t.textContent = msg;
  document.getElementById('toast-container').appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

async function load() {
  document.getElementById('list-container').innerHTML = '<div class="loading-state"><div class="spinner"></div> Cargando caballerizas…</div>';
  const [{ data: cabs, error }, { data: spcs }] = await Promise.all([
    sb.from('caballerizas').select('*').eq('club_id', CLUB_ID).order('nombre'),
    sb.from('spcs').select('caballeriza_id').eq('club_id', CLUB_ID).eq('estado', 'activo'),
  ]);
  if (error) { toast(error.message, 'error'); document.getElementById('list-container').innerHTML = ''; return; }
  allData = cabs || [];
  spcCounts = {};
  (spcs || []).forEach(s => {
    if (s.caballeriza_id) spcCounts[s.caballeriza_id] = (spcCounts[s.caballeriza_id] || 0) + 1;
  });
  updateStats(spcs?.length || 0);
  filterRender();
}

function updateStats(totalSpcs) {
  document.getElementById('cnt-total').textContent = allData.length;
  document.getElementById('cnt-activas').textContent = allData.filter(r => r.activo).length;
  document.getElementById('cnt-spcs').textContent = totalSpcs;
}

function filterRender() {
  const q = document.getElementById('search').value.toLowerCase();
  const activo = document.getElementById('filter-activo').value;
  const data = allData.filter(r => {
    const matchQ = !q || r.nombre?.toLowerCase().includes(q) || r.responsable?.toLowerCase().includes(q);
    const matchActivo = activo === '' || String(r.activo) === activo;
    return matchQ && matchActivo;
  });
  renderList(data);
}

function renderList(data) {
  if (!data.length) {
    document.getElementById('list-container').innerHTML = `<div class="empty-state"><div class="icon">🏠</div><h3>Sin resultados</h3><p>No se encontraron caballerizas con los filtros aplicados.</p></div>`;
    return;
  }
  document.getElementById('list-container').innerHTML = `<div class="grid">${data.map(r => cardHTML(r)).join('')}</div>`;
}

function cardHTML(r) {
  const cnt = spcCounts[r.id] || 0;
  const badge = r.activo
    ? `<span class="badge badge-activo">Activa</span>`
    : `<span class="badge badge-inactivo">Inactiva</span>`;
  return `<div class="card">
    <div class="card-header">
      <div>
        <div class="card-name">${r.nombre}</div>
        ${r.responsable ? `<div class="card-responsable">Responsable: ${r.responsable}</div>` : ''}
      </div>
      ${badge}
    </div>
    <div class="spc-count">
      <div>
        <div class="spc-count-num">${cnt}</div>
        <div class="spc-count-label">SPC activos</div>
      </div>
      ${cnt > 0 ? `<a href="spcs.html?caballeriza=${r.id}" class="spc-link">Ver SPC →</a>` : ''}
    </div>
    <div class="card-detail">
      ${r.domicilio ? `<div>📍 <span>${r.domicilio}</span></div>` : ''}
      ${r.telefono ? `<div>📞 <span>${r.telefono}</span></div>` : ''}
      ${r.notas ? `<div>📝 <span>${r.notas}</span></div>` : ''}
    </div>
    <div class="card-actions">
      <button class="btn-sm btn-edit" onclick='openModal(${JSON.stringify(r)})'>✏️ Editar</button>
      <button class="btn-sm btn-delete" onclick="deleteRecord('${r.id}','${r.nombre.replace(/'/g,"\\'")}')">🗑️ Eliminar</button>
    </div>
  </div>`;
}

// ── Responsables helpers ──────────────────────────────────────────────────────

function clearPropietario() {
  ['rp-apellido','rp-nombre','rp-dni','rp-fnac','rp-localidad'].forEach(id => {
    document.getElementById(id).value = '';
  });
  document.getElementById('rp-badge').style.display = 'none';
}

function clearCopropietarios() {
  document.getElementById('coprop-list').innerHTML = '';
}

function addCopropRow(data = null) {
  const row = document.createElement('div');
  row.className = 'resp-row';

  const badge = document.createElement('div');
  badge.className = 'badge-prof';
  badge.style.display = 'none';
  badge.textContent = '✓ Entrenador con patente';

  const removeBtn = document.createElement('button');
  removeBtn.type = 'button';
  removeBtn.className = 'btn-remove-resp';
  removeBtn.textContent = '✕ Eliminar';
  removeBtn.onclick = () => row.remove();

  const header = document.createElement('div');
  header.className = 'resp-row-header';
  const lbl = document.createElement('span');
  lbl.className = 'resp-row-label';
  lbl.textContent = 'Co-propietario';
  header.append(lbl, badge, removeBtn);

  const grid = document.createElement('div');
  grid.className = 'resp-inputs';

  const mk = (placeholder, type = 'text', extraClass = '') => {
    const inp = document.createElement('input');
    inp.type = type;
    inp.placeholder = placeholder;
    if (extraClass) inp.className = extraClass;
    return inp;
  };

  const inpApellido  = mk('Apellido');
  const inpNombre    = mk('Nombre');
  const inpDni       = mk('DNI');
  const inpFnac      = mk('', 'date');
  inpFnac.title      = 'Fecha de nacimiento';
  const inpLocalidad = mk('Localidad', 'text', 'span2');

  inpDni.addEventListener('blur', () => checkProfesional(inpDni, badge));

  grid.append(inpApellido, inpNombre, inpDni, inpFnac, inpLocalidad);
  row.append(header, grid);

  if (data) {
    inpApellido.value  = data.apellido        || '';
    inpNombre.value    = data.nombre          || '';
    inpDni.value       = data.documento_nro   || '';
    inpFnac.value      = data.fecha_nacimiento || '';
    inpLocalidad.value = data.localidad       || '';
  }

  document.getElementById('coprop-list').appendChild(row);

  if (data?.documento_nro) checkProfesional(inpDni, badge);
}

async function checkProfesional(dniInput, badgeEl) {
  badgeEl.style.display = 'none';
  const dni = dniInput.value.trim();
  if (!dni) return;
  const { data } = await sb.from('profesionales')
    .select('id')
    .eq('documento_nro', dni)
    .eq('club_id', CLUB_ID)
    .maybeSingle();
  if (data) badgeEl.style.display = 'inline-flex';
}

function getResponsableData() {
  const rows = [{
    rol:              'propietario',
    apellido:         document.getElementById('rp-apellido').value.trim(),
    nombre:           document.getElementById('rp-nombre').value.trim(),
    documento_nro:    document.getElementById('rp-dni').value.trim(),
    fecha_nacimiento: document.getElementById('rp-fnac').value || null,
    localidad:        document.getElementById('rp-localidad').value.trim() || null,
  }];
  document.querySelectorAll('#coprop-list .resp-row').forEach(row => {
    const inp = row.querySelectorAll('.resp-inputs input');
    rows.push({
      rol:              'copropietario',
      apellido:         inp[0].value.trim(),
      nombre:           inp[1].value.trim(),
      documento_nro:    inp[2].value.trim(),
      fecha_nacimiento: inp[3].value || null,
      localidad:        inp[4].value.trim() || null,
    });
  });
  return rows;
}

function validateResponsables(rows) {
  const prop = rows[0];
  if (!prop.apellido || !prop.nombre || !prop.documento_nro) {
    return 'El propietario requiere apellido, nombre y DNI.';
  }
  for (let i = 1; i < rows.length; i++) {
    const r = rows[i];
    if (r.apellido && (!r.nombre || !r.documento_nro)) {
      return `Co-propietario ${i}: si ingresás apellido, completá también nombre y DNI.`;
    }
  }
  const dnis = rows.filter(r => r.documento_nro).map(r => r.documento_nro);
  if (new Set(dnis).size !== dnis.length) {
    return 'Hay DNI duplicados entre los responsables.';
  }
  return null;
}

function buildResponsableText(rows) {
  return rows
    .filter(r => r.apellido || r.nombre)
    .map(r => {
      const name = [r.apellido, r.nombre].filter(Boolean).join(' ');
      return `${name} (${r.rol})`;
    })
    .join(' + ');
}

async function resolveAndInsertResponsables(rows, cabId) {
  const toInsert = [];
  for (const r of rows) {
    if (!r.apellido && !r.nombre) continue;
    let profesional_id = null;
    if (r.documento_nro) {
      const { data } = await sb.from('profesionales')
        .select('id')
        .eq('documento_nro', r.documento_nro)
        .eq('club_id', CLUB_ID)
        .maybeSingle();
      profesional_id = data?.id ?? null;
    }
    toInsert.push({
      caballeriza_id:   cabId,
      profesional_id,
      apellido:         r.apellido        || null,
      nombre:           r.nombre          || null,
      documento_nro:    r.documento_nro   || null,
      fecha_nacimiento: r.fecha_nacimiento,
      localidad:        r.localidad,
      rol:              r.rol,
      activo:           true,
    });
  }
  if (toInsert.length) {
    const { error } = await sb.from('caballeriza_responsables').insert(toInsert);
    if (error) throw error;
  }
}

// ── Modal ─────────────────────────────────────────────────────────────────────

async function openModal(rec = null) {
  document.getElementById('modal-title').textContent = rec ? 'Editar Caballeriza' : 'Nueva Caballeriza';
  document.getElementById('f-id').value       = rec?.id        || '';
  document.getElementById('f-nombre').value   = rec?.nombre    || '';
  document.getElementById('f-telefono').value = rec?.telefono  || '';
  document.getElementById('f-domicilio').value = rec?.domicilio || '';
  document.getElementById('f-activo').value   = rec ? String(rec.activo) : 'true';
  document.getElementById('f-notas').value    = rec?.notas     || '';

  clearPropietario();
  clearCopropietarios();

  if (rec?.id) {
    const { data: respons } = await sb
      .from('caballeriza_responsables')
      .select('*')
      .eq('caballeriza_id', rec.id)
      .order('rol', { ascending: false })
      .order('id',  { ascending: true });

    if (respons?.length) {
      const prop = respons.find(r => r.rol === 'propietario');
      if (prop) {
        document.getElementById('rp-apellido').value  = prop.apellido        || '';
        document.getElementById('rp-nombre').value    = prop.nombre          || '';
        document.getElementById('rp-dni').value       = prop.documento_nro   || '';
        document.getElementById('rp-fnac').value      = prop.fecha_nacimiento || '';
        document.getElementById('rp-localidad').value = prop.localidad       || '';
        if (prop.documento_nro) {
          checkProfesional(
            document.getElementById('rp-dni'),
            document.getElementById('rp-badge')
          );
        }
      }
      respons.filter(r => r.rol === 'copropietario').forEach(cp => addCopropRow(cp));
    }
  }

  document.getElementById('modal').classList.add('open');
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  document.getElementById('form').reset();
  clearPropietario();
  clearCopropietarios();
}

async function saveRecord(e) {
  e.preventDefault();

  const rows = getResponsableData();
  const validErr = validateResponsables(rows);
  if (validErr) { toast(validErr, 'error'); return; }

  const btn = document.getElementById('btn-save');
  btn.disabled = true; btn.textContent = 'Guardando…';

  const id = document.getElementById('f-id').value;
  const cabPayload = {
    club_id:   CLUB_ID,
    nombre:    document.getElementById('f-nombre').value.trim(),
    telefono:  document.getElementById('f-telefono').value.trim() || null,
    domicilio: document.getElementById('f-domicilio').value.trim() || null,
    activo:    document.getElementById('f-activo').value === 'true',
    notas:     document.getElementById('f-notas').value.trim() || null,
  };

  let cabId = id;

  if (id) {
    const { error } = await sb.from('caballerizas').update(cabPayload).eq('id', id);
    if (error) { btn.disabled = false; btn.textContent = 'Guardar'; toast(error.message, 'error'); return; }
  } else {
    const { data, error } = await sb.from('caballerizas').insert(cabPayload).select('id').single();
    if (error) { btn.disabled = false; btn.textContent = 'Guardar'; toast(error.message, 'error'); return; }
    cabId = data.id;
  }

  if (id) {
    await sb.from('caballeriza_responsables').delete().eq('caballeriza_id', cabId);
  }

  try {
    await resolveAndInsertResponsables(rows, cabId);
  } catch (insertErr) {
    btn.disabled = false; btn.textContent = 'Guardar';
    toast(insertErr.message, 'error');
    return;
  }

  const responsableText = buildResponsableText(rows.filter(r => r.apellido || r.nombre)) || null;
  await sb.from('caballerizas').update({ responsable: responsableText }).eq('id', cabId);

  btn.disabled = false; btn.textContent = 'Guardar';
  toast(id ? 'Caballeriza actualizada' : 'Caballeriza creada');
  closeModal();
  load();
}

async function deleteRecord(id, nombre) {
  if (!confirm(`¿Eliminar "${nombre}"? Los SPC asociados perderán la referencia.`)) return;
  const { error } = await sb.from('caballerizas').delete().eq('id', id);
  if (error) { toast(error.message, 'error'); return; }
  toast('Caballeriza eliminada');
  load();
}

document.getElementById('modal').addEventListener('click', e => { if (e.target === e.currentTarget) closeModal(); });
(async()=>{if(await initAuth())load();})();
</script>
