<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co https://raw.githubusercontent.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="logo32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="logo180x180.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0e2318">
  <title>Inscripciones — SGH</title>
  <!--
  SQL REQUERIDO EN SUPABASE:
  ALTER TABLE inscripciones
    ADD COLUMN IF NOT EXISTS caballeriza_id UUID REFERENCES caballerizas(id),
    ADD COLUMN IF NOT EXISTS peon VARCHAR(200),
    ADD COLUMN IF NOT EXISTS capataz VARCHAR(200),
    ADD COLUMN IF NOT EXISTS sereno VARCHAR(200),
    ADD COLUMN IF NOT EXISTS certificado_correr BOOLEAN DEFAULT FALSE;
  -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0e2318; --card: #1a3d26; --accent: #c9a84c;
      --text: #f5f0e8; --muted: #a0b8a0; --danger: #e05252;
      --success: #4caf82; --border: rgba(201,168,76,0.2); --input-bg: #0e2318;
      --info: #74b0f7;
    }
    body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }
    h1,h2,h3 { font-family: 'Playfair Display', serif; }
    .topbar { background: rgba(0,0,0,0.3); border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .btn-back { background: none; border: 1px solid var(--border); color: var(--muted); padding: 7px 14px; border-radius: 8px; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 13px; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; transition: all 0.2s; }
    .btn-back:hover { border-color: var(--accent); color: var(--accent); }
    .topbar h1 { font-size: 18px; color: var(--accent); flex: 1; min-width: 180px; }
    .btn-primary { background: var(--accent); color: #1a1a0a; border: none; padding: 9px 18px; border-radius: 9px; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: opacity 0.2s; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 9px 18px; border-radius: 9px; font-family: 'DM Sans', sans-serif; font-size: 13px; cursor: pointer; transition: all 0.2s; }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
    .selector-bar { background: var(--card); border-bottom: 1px solid var(--border); padding: 14px 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .selector-bar label { font-size: 12px; color: var(--muted); }
    .selector-bar select { background: var(--input-bg); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 13px; outline: none; }
    .carrera-header { background: rgba(201,168,76,0.07); border-bottom: 1px solid var(--border); padding: 14px 24px; }
    .carrera-info { display: flex; gap: 20px; flex-wrap: wrap; font-size: 13px; align-items: center; }
    .carrera-num { font-family: 'Playfair Display', serif; font-size: 28px; color: var(--accent); font-weight: 700; }
    .carrera-condicion { font-size: 13px; color: var(--muted); margin-top: 4px; font-style: italic; }
    .carrera-condicion-extra { font-size: 12px; color: var(--muted); font-style: italic; margin-top: 2px; }
    .carrera-name { font-family: 'Playfair Display', serif; font-size: 17px; }
    .carrera-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
    .chip { font-size: 11px; background: rgba(201,168,76,0.1); border: 1px solid rgba(201,168,76,0.2); color: var(--muted); padding: 2px 9px; border-radius: 5px; }
    .stats-row { display: flex; gap: 12px; padding: 16px 24px; flex-wrap: wrap; border-bottom: 1px solid var(--border); }
    .stat-chip { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 18px; text-align: center; min-width: 100px; }
    .stat-chip-val { font-size: 20px; font-weight: 700; color: var(--accent); }
    .stat-chip-val.danger { color: var(--danger); }
    .stat-chip-val.success { color: var(--success); }
    .stat-chip-lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; }
    .content { padding: 16px; }
    .table-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }
    .table-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    thead th { background: rgba(0,0,0,0.2); padding: 11px 14px; text-align: left; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; }
    tbody tr { border-top: 1px solid var(--border); transition: background 0.15s; }
    tbody tr:hover { background: rgba(201,168,76,0.04); }
    tbody td { padding: 12px 14px; font-size: 13px; vertical-align: middle; }
    .spc-name { font-weight: 600; color: var(--accent); }
    .spc-sub { font-size: 11px; color: var(--muted); }
    .badge { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; text-transform: uppercase; }
    .badge-inscripto  { background: rgba(76,175,130,0.15);  color: var(--success); border: 1px solid rgba(76,175,130,0.3); }
    .badge-ratificado { background: rgba(201,168,76,0.15);  color: var(--accent);  border: 1px solid rgba(201,168,76,0.3); }
    .badge-forfait      { background: rgba(224,82,82,0.1);    color: var(--danger);  border: 1px solid rgba(224,82,82,0.3); }
    .badge-mal_inscrito { background: rgba(232,168,76,0.15); color: #e8a84c;        border: 1px solid rgba(232,168,76,0.3); }
    .badge-reabierta    { background: rgba(232,168,76,0.15); color: #e8a84c;        border: 1px solid rgba(232,168,76,0.3); }
    .badge-anulada      { background: rgba(160,160,160,0.15); color: var(--muted); border: 1px solid rgba(160,160,160,0.3); }
    .badge-confirmada   { background: rgba(76,175,130,0.15); color: var(--success); border: 1px solid rgba(76,175,130,0.3); }
    .sel-estado-car { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 4px 10px; border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 12px; cursor: pointer; outline: none; margin-left: 8px; }
    .actions-cell { display: flex; gap: 5px; }
    .btn-sm { padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 500; cursor: pointer; font-family: 'DM Sans', sans-serif; border: none; white-space: nowrap; }
    .btn-edit { background: rgba(201,168,76,0.15); color: var(--accent); border: 1px solid rgba(201,168,76,0.3); }
    .btn-delete { background: rgba(224,82,82,0.1); color: var(--danger); border: 1px solid rgba(224,82,82,0.3); }
    .empty-state { text-align: center; padding: 50px 20px; }
    .empty-state .icon { font-size: 44px; margin-bottom: 14px; }
    .empty-state h3 { font-size: 17px; color: var(--muted); }
    .loading-state { display: flex; align-items: center; justify-content: center; padding: 50px; gap: 12px; color: var(--muted); }
    .spinner { width: 22px; height: 22px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 1000; display: none; align-items: flex-start; justify-content: center; padding: 20px; overflow-y: auto; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--card); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 640px; margin: auto; }
    .modal-header { padding: 18px 22px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
    .modal-header h2 { font-size: 18px; color: var(--accent); }
    .btn-close { background: none; border: none; color: var(--muted); font-size: 22px; cursor: pointer; }
    .modal-body { padding: 18px 22px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group.full { grid-column: 1 / -1; }
    .section-lbl { grid-column: 1/-1; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; padding-top: 6px; border-top: 1px solid var(--border); }
    label { font-size: 12px; font-weight: 500; color: var(--muted); }
    input, select, textarea { background: var(--input-bg); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 13px; outline: none; width: 100%; transition: border 0.2s; }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    select option { background: #1a3d26; }
    .spc-search { position: relative; }
    .spc-dropdown { position: absolute; top: 100%; left: 0; right: 0; background: #1a3d26; border: 1px solid var(--border); border-radius: 8px; max-height: 220px; overflow-y: auto; z-index: 10; display: none; }
    .spc-option { padding: 9px 12px; cursor: pointer; font-size: 13px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .spc-option:last-child { border-bottom: none; }
    .spc-option:hover { background: rgba(201,168,76,0.1); color: var(--accent); }
    .checkbox-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; }
    .checkbox-row input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); }
    .checkbox-row label { font-size: 13px; color: var(--text); cursor: pointer; }
    .modal-footer { padding: 14px 22px; display: flex; gap: 10px; justify-content: flex-end; border-top: 1px solid var(--border); }
    .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 9px 18px; border-radius: 9px; font-family: 'DM Sans', sans-serif; font-size: 13px; cursor: pointer; }
    #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
    .toast { padding: 12px 20px; border-radius: 10px; font-size: 14px; font-weight: 500; max-width: 320px; animation: slideIn 0.3s ease; }
    .toast-success { background: #1a4a30; border: 1px solid var(--success); color: var(--text); }
    .toast-error { background: #4a1a1a; border: 1px solid var(--danger); color: var(--text); }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    /* PRINT — estilo Palermo */
    #print-only { display: none; }
    @media print {
      body > *:not(#print-only) { display: none !important; }
      #print-only { display: block !important; font-family: 'DM Sans', Arial, sans-serif; color: #000; background: #fff; }
      /* Header del documento */
      .pi-header { text-align: center; border-bottom: 2px solid #000; padding-bottom: 4px; margin-bottom: 8px; }
      .pi-title { font-family: 'Playfair Display', Georgia, serif; font-size: 14pt; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; }
      .pi-sub { font-size: 9pt; font-weight: 700; margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px; }
      /* Contenedor general: CSS columns (evita huecos verticales del flex-wrap) */
      /* column-width además de column-count: si el motor de impresión ignora el
         "landscape" del @page (iOS Safari siempre; Chrome/Brave según el diálogo),
         la página sale angosta y con column-count solo quedarían 5 columnas de
         ~38mm, donde los nombres de los caballos (white-space: nowrap) desbordan.
         Con column-width el ancho manda y reflowea a 3 columnas legibles. */
      .pi-cols { column-width: 52mm; column-count: 5; column-gap: 10pt; column-fill: balance; }
      /* Wrapper: block para que CSS columns lo trate como bloque atómico */
      .pi-wrapper { display: block; width: 100%; break-inside: avoid; -webkit-column-break-inside: avoid; page-break-inside: avoid; margin-bottom: 5pt; }
      /* Bloque de carrera: se ajusta al contenido más ancho (nombre de caballo más largo) */
      .pi-bloque { display: flex; flex-direction: column; width: -webkit-fit-content; width: fit-content; max-width: 100%; }
      /* Header del bloque: enmarcado y centrado */
      .pi-car-head { background: #e8e8e8; padding: 3px 7px; border: 1px solid #000; text-align: center; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .pi-titulo { font-size: 8pt; font-weight: 900; text-transform: uppercase; line-height: 1.2; }
      .pi-bolsa-inline { font-size: 9pt; font-weight: 900; }
      /* La condición es texto secundario: va 2pt menor que los caballos (8pt) */
      .pi-condiciones { font-size: 6pt; color: #222; margin-top: 1px; line-height: 1.25; }
      .pi-cesped-inline { font-weight: 900; letter-spacing: 0.5px; text-transform: uppercase; }
      .pi-especial { font-weight: 900; letter-spacing: 0.5px; text-transform: uppercase; }
      .pi-oficial { font-size: 6pt; font-weight: 900; letter-spacing: 0.4px; text-transform: uppercase; margin-top: 1px; }
      /* Bandas de estado */
      .pi-banda-reabierta { background: #000 !important; color: #fff !important; text-align: center; font-size: 7pt; font-weight: 900; padding: 1px 0; text-transform: uppercase; letter-spacing: 1px; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .pi-banda-anulada { background: #ddd; color: #333; text-align: center; font-size: 7pt; font-weight: 700; padding: 1px 0; text-transform: uppercase; letter-spacing: 1px; font-style: italic; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      /* Lista de inscriptos */
      /* Filas densas: el cuerpo del caballo sigue a 8pt, se ajusta solo el interlineado */
      .pi-row { display: flex; align-items: baseline; padding: 0 4px; border-bottom: 1px solid #eee; line-height: 1.25; }
      .pi-row:last-child { border-bottom: none; }
      .pi-spc-name { font-size: 8pt; font-weight: 700; text-transform: uppercase; flex: 1; min-width: 0; white-space: nowrap; }
      .pi-h-sfx { font-size: 7pt; font-weight: 400; }
      .pi-nocert { font-size: 8pt; font-weight: 900; margin-left: 3px; flex-shrink: 0; }
      /* Total del turno */
      .pi-car-foot { border-top: 1px solid #000; padding: 1px 4px; font-size: 8pt; font-weight: 900; text-align: center; }
      /* Matriz consolidada de orden de largada */
      .pi-matriz-wrap { margin-top: 10pt; margin-bottom: 4pt; break-inside: avoid; -webkit-column-break-inside: avoid; page-break-inside: avoid; }
      .pi-matriz-titulo { font-size: 7pt; font-weight: 900; text-align: center; margin-bottom: 3pt; text-transform: uppercase; letter-spacing: 1px; }
      .pi-matriz-tbl { border-collapse: collapse; font-size: 7pt; width: 100%; table-layout: fixed; }
      .pi-matriz-tbl th { border: 1px solid #000; padding: 2pt; text-align: center; font-weight: 900; background: #e8e8e8; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .pi-matriz-tbl td { border: 1px solid #000; padding: 2pt; text-align: center; }
      /* Footer del documento */
      /* Caja de sorteo: una sola linea, la minima altura posible. Estos PDFs
         entran justos en una pagina, asi que si hay que ganar espacio se
         achica esto antes que cualquier otra cosa del documento. */
      .pi-sorteo { margin-top: 6pt; padding: 2.5pt 4pt; border: 1px solid #000; break-inside: avoid; -webkit-column-break-inside: avoid; page-break-inside: avoid; }
      .pi-sorteo-h { font-size: 6pt; font-weight: 900; text-transform: uppercase; letter-spacing: 0.8pt; margin-bottom: 1pt; }
      .pi-sorteo-body { font-size: 6.5pt; line-height: 1.25; white-space: pre-wrap; font-variant-numeric: tabular-nums; }
      .pi-footer { margin-top: 8px; border-top: 2px solid #000; padding-top: 4px; font-size: 7pt; display: flex; justify-content: space-between; align-items: flex-end; }
      /* Las dos patas del footer apilan con block + margin, no con flex gap.
         El gap de flexbox recién existe en WebKit 14.1+ y el motor de impresión
         del móvil es el eslabón más viejo. Con block la caída es a texto apilado
         igual, sin depender de nada moderno. */
      .pi-footer-left, .pi-footer-right { display: block; }
      .pi-footer-right { text-align: right; }
      .pi-footer-left > span, .pi-footer-right > span { display: block; }
      .pi-footer-left > * + *, .pi-footer-right > * + * { margin-top: 2px; }
      .pi-footer-right > img { display: block; margin-left: auto; }
      .pi-footer-logo { max-height: 35px; max-width: 70px; object-fit: contain; }
      @page { size: A4 landscape; margin-top: 5mm; margin-bottom: 6mm; margin-left: 8mm; margin-right: 8mm; }
    }
    #auth-overlay { position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center; }
    .btn-logout { background:none;border:1px solid var(--border);color:var(--muted);padding:6px 14px;border-radius:8px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;transition:all 0.2s; }
    .btn-logout:hover { border-color:var(--danger);color:var(--danger); }
    .user-name { font-size:13px;color:var(--muted); }
    @media print { #auth-overlay, .btn-logout, .user-name { display:none !important; } }
  </style>
  <script src="premios-utils.js"></script>
  <script src="active-reunion.js"></script>
  <script src="edad-spc.js"></script>
</head>
<body>
<div id="auth-overlay"><div class="spinner" style="width:32px;height:32px;border-width:3px;"></div></div>
<div id="toast-container"></div>

<div class="topbar">
  <a href="index.html" class="btn-back">← Inicio</a>
  <h1 id="topbar-title">Inscripciones</h1>
  <span class="user-name" id="user-name"></span>
  <button class="btn-logout" onclick="logout()">Cerrar sesión</button>
  <button class="btn-outline" onclick="printInscriptos()">🖨️ Imprimir</button>
  <button class="btn-primary" id="btn-nueva" onclick="openModal()" style="display:none">+ Inscribir SPC</button>
</div>

<div class="selector-bar">
  <label>Reunión:</label>
  <select id="sel-reunion" onchange="onReunionChange()">
    <option value="">Cargando…</option>
  </select>
  <label>Turno:</label>
  <select id="sel-carrera" onchange="onCarreraChange()">
    <option value="">— Seleccionar reunión primero —</option>
  </select>
  <div id="sel-estado-car-wrap" style="display:none;margin-left:auto;align-items:center;gap:6px;">
    <label>Estado:</label>
    <div id="ch-estado-carrera"></div>
  </div>
</div>


<div class="content">
  <div class="table-actions">
    <span style="font-size:13px;color:var(--muted);" id="tabla-label">Seleccionar una reunión y turno para ver inscriptos</span>
    <span id="inscriptos-count" style="display:none;font-size:13px;color:#e8d5a3;font-weight:500;"></span>
  </div>
  <div id="list-container"></div>
</div>

<!-- MODAL INSCRIPCIÓN -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modal-title">Inscribir SPC</h2>
      <button class="btn-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="f-id">
      <div class="form-grid">
        <div class="form-group full">
          <label>Buscar SPC *</label>
          <div class="spc-search">
            <input type="text" id="spc-search-input" placeholder="Escribir nombre del SPC…" autocomplete="off" oninput="searchSpc()">
            <input type="hidden" id="f-spc-id">
            <div class="spc-dropdown" id="spc-dropdown"></div>
          </div>
        </div>
        <div class="form-group full" id="cert-info-row" style="display:none">
          <div style="background:rgba(201,168,76,0.07);border:1px solid var(--border);border-radius:8px;padding:8px 12px;font-size:12px;color:var(--muted);" id="cert-info-text"></div>
        </div>
        <div class="form-group full">
          <label>Caballeriza *</label>
          <select id="f-caballeriza"></select>
        </div>
        <div class="form-group full">
          <label>Entrenador</label>
          <select id="f-entrenador"></select>
        </div>
        <div class="section-lbl">Jockey</div>
        <div class="form-group">
          <label>Jockey titular *</label>
          <select id="f-jockey-titular" required></select>
        </div>
        <div class="form-group">
          <label>Jockey suplente</label>
          <select id="f-jockey-suplente"></select>
        </div>
        <div class="section-lbl">Personal de caballeriza</div>
        <div class="form-group">
          <label>Peón</label>
          <input type="text" id="f-peon" placeholder="Nombre del peón">
        </div>
        <div class="form-group">
          <label>Capataz</label>
          <input type="text" id="f-capataz" placeholder="Nombre del capataz">
        </div>
        <div class="form-group">
          <label>Sereno</label>
          <input type="text" id="f-sereno" placeholder="Nombre del sereno">
        </div>
        <div class="form-group" style="display:flex;flex-direction:column;justify-content:flex-end;">
          <div class="checkbox-row">
            <input type="checkbox" id="f-certificado" onchange="updateCertBadge()">
            <label for="f-certificado">Certificado de correr ✓</label>
          </div>
        </div>
        <div class="section-lbl">Programa</div>
        <div class="form-group full">
          <label>4 últimas performances</label>

function formatMonto(num) {
  if (num === null || num === undefined || isNaN(num)) return '$0,00';
  const n = parseFloat(num);
  const signo = n < 0 ? '-' : '';
  const [entero, dec] = Math.abs(n).toFixed(2).split('.');
  const enteroFmt = entero.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return signo + '$' + enteroFmt + ',' + dec;
}
function parseMonto(str) {
  if (str === null || str === undefined) return 0;
  const s = String(str).replace(/\$/g, '').replace(/\s/g, '').replace(/\./g, '').replace(',', '.');
  return parseFloat(s) || 0;
}

function toast(msg, type='success') {

      let label = `Turno ${c.numero_turno}`;

      label += ` — ${c.distancia_metros}m`;

        label += ` — ${cond}`;

      return `<option value="${c.id}">${label}</option>`;

function getSpc(id) { return spcs.find(s=>s.id===id); }
function getCab(id) { return caballerizas.find(c=>c.id===id); }
function getProf(id) { return profesionales.find(p=>p.id===id); }

async function guardarGatera(id, el) {
  const raw = (el.value || '').trim();
  let val = null;
  if (raw !== '') {
    val = parseInt(raw, 10);
    if (isNaN(val) || val < 1 || String(val) !== raw) {
      toast('Gatera inválida: entero ≥ 1', 'error');
      el.value = el.dataset.prev || '';
      return;
    }
  }
  const { error } = await sb.from('inscripciones').update({ numero_partidor: val }).eq('id', id);
  if (error) {
    if (error.code === '23505') toast(`Gatera ${val} ya usada en esta carrera`, 'error');
    else toast(error.message, 'error');
    el.value = el.dataset.prev || '';
    return;
  }
  el.dataset.prev = raw;
  const insc = inscripciones.find(x => x.id === id);
  if (insc) insc.numero_partidor = val;
  toast(val != null ? `Gatera ${val} guardada` : 'Gatera limpiada');
}

function renderInscripciones() {
  if (!inscripciones.length) {
    document.getElementById('list-container').innerHTML=`<div class="empty-state"><div class="icon">📋</div><h3>Sin inscriptos</h3><p>No hay SPC inscriptos en este turno.</p></div>`;
    const cEl=document.getElementById('inscriptos-count'); cEl.textContent='0 inscriptos'; cEl.style.display='';
    return;
  }
  const rows = inscripciones.map(i => {
    const spc = getSpc(i.spc_id);
    const cab = getCab(i.caballeriza_id);
    const jkey = getProf(i.jockey_titular_id);
    const jkeySup = getProf(i.jockey_suplente_id);
    const entr = getProf(i.entrenador_id);
    const certCell = i.certificado_correr
      ? `<span style="color:var(--success);font-weight:600;">Sí</span>`
      : `<span style="color:var(--danger);font-weight:600;">No</span>`;
    const gateraCell = (i.estado==='forfait'||i.estado==='mal_inscrito')
      ? `<span style="color:var(--muted)">—</span>`
      : `<input type="number" min="1" step="1" class="gatera-input" value="${i.numero_partidor??''}" data-prev="${i.numero_partidor??''}" onchange="guardarGatera('${i.id}', this)" style="width:60px;text-align:center" title="N° de gatera (sorteo)">`;
    return `<tr>
      <td><div class="spc-name">${spc?.nombre||i.spc_id}</div></td>
      <td>${gateraCell}</td>
      <td>${certCell}</td>
      <td>${cab?`${cab.nombre}${cab.hipodromo_patente?` (${cab.hipodromo_patente})`:''}`:'—'}</td>
      <td>${entr?`${entr.apellido}, ${entr.nombre}`:'-'}</td>
      <td>${jkey?`${jkey.apellido}, ${jkey.nombre}`:'-'}</td>
      <td>${jkeySup?`${jkeySup.apellido}, ${jkeySup.nombre}`:'—'}</td>
      <td>${(() => { const l=[]; if(i.peon) l.push(`Peón: ${i.peon}`); if(i.capataz) l.push(`Cap: ${i.capataz}`); if(i.sereno) l.push(`Sereno: ${i.sereno}`); return l.length?`<div style="font-size:12px;color:var(--muted);">${l.join('<br>')}</div>`:''; })()}</td>
      <td><span class="badge badge-${i.estado}">${i.estado?.replace('_',' ')||'—'}</span></td>
      <td class="actions-cell">
        <button class="btn-sm btn-edit" onclick='openModal(${JSON.stringify(i)})'>✏️</button>
        <button class="btn-sm btn-delete" onclick="deleteRecord('${i.id}')">🗑️</button>
      </td>
    </tr>`;
  }).join('');
  document.getElementById('list-container').innerHTML = `<div class="table-wrap"><table>
    <thead><tr><th>SPC</th><th>Gatera</th><th>Cert.</th><th>Caballeriza</th><th>Entrenador</th><th>Jockey</th><th>Jockey suplente</th><th>Personal</th><th>Estado</th><th>Acciones</th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
  const n=inscripciones.length; const cEl=document.getElementById('inscriptos-count'); cEl.textContent=`${n} inscripto${n!==1?'s':''}`; cEl.style.display='';
}

let spcSearchTimer;
let spcSearchResults = [];

// Edad reglamentaria (1° de julio). Es el buscador de alta, previo a elegir turno,
// asi que la referencia es la fecha actual. Ver edad-spc.js.
function calcSpcEdad(fecha) {
  return edadSPCTexto(fecha);
}

async function searchSpc() {
  clearTimeout(spcSearchTimer);
  const q = document.getElementById('spc-search-input').value.trim();
  const dd = document.getElementById('spc-dropdown');
  if (q.length < 2) {
    dd.style.display = 'none';
    if (!q) document.getElementById('f-spc-id').value = '';
    return;
  }
  dd.innerHTML = '<div class="spc-option" style="color:var(--muted);cursor:default;">Buscando…</div>';
  dd.style.display = 'block';
  spcSearchTimer = setTimeout(async () => {
    const { data, error } = await sb.from('spcs')
      .select('id, nombre, fecha_nacimiento, sexo, color, padrillo_nombre, madre_nombre, entrenador_id, caballeriza_id, certificado_correr')
      .eq('estado', 'activo')
      .ilike('nombre', `%${q}%`)
      .order('nombre')
      .limit(10);
    if (error || !data?.length) { dd.innerHTML='<div class="spc-option" style="color:var(--muted);cursor:default;">Sin resultados</div>'; return; }
    spcSearchResults = data;
    // Agregar al cache local para getSpc()
    data.forEach(s => { if (!spcs.find(x=>x.id===s.id)) spcs.push(s); });
    dd.innerHTML = data.map((s, idx) => {
      const partes = [s.nombre, s.sexo, calcSpcEdad(s.fecha_nacimiento), s.color].filter(Boolean);
      return `<div class="spc-option" onclick="selectSpcIdx(${idx})">
        <span>${partes.join(' — ')}</span>
        <span style="font-size:11px;color:${s.certificado_correr?'var(--success)':'var(--danger)'}">${s.certificado_correr?'✅':'❌'}</span>
      </div>`;
    }).join('');
    dd.style.display = 'block';
  }, 300);
}

function selectSpcIdx(idx) {
  const s = spcSearchResults[idx];
  if (!s) return;
  selectSpc(s.id, s.nombre, s.entrenador_id||'', '', s.caballeriza_id||'', !!s.certificado_correr);
}

function selectSpc(id, nombre, entrenadorId, jockeyId, caballerizaId, tieneCert) {
  document.getElementById('f-spc-id').value = id;
  document.getElementById('spc-search-input').value = nombre;
  document.getElementById('spc-dropdown').style.display='none';
  if (entrenadorId) document.getElementById('f-entrenador').value = entrenadorId;
  if (jockeyId) document.getElementById('f-jockey-titular').value = jockeyId;
  if (caballerizaId) document.getElementById('f-caballeriza').value = caballerizaId;
  document.getElementById('f-certificado').checked = tieneCert;
  const certInfo = document.getElementById('cert-info-row');
  const certText = document.getElementById('cert-info-text');
  certInfo.style.display = '';
  if (tieneCert) {
    certText.innerHTML = '✅ Este SPC <strong>tiene certificado de correr</strong> vigente en el Stud Book.';
    certText.style.color = 'var(--success)';
  } else {
    certText.innerHTML = '⚠️ Este SPC <strong>NO tiene certificado de correr</strong> registrado en el Stud Book.';
    certText.style.color = 'var(--danger)';
  }
}

function openModal(rec=null) {
  document.getElementById('modal-title').textContent = rec ? 'Editar Inscripción' : 'Inscribir SPC';

    document.getElementById('f-jockey-suplente').value = rec.jockey_suplente_id||'';
    document.getElementById('f-peon').value = rec.peon||'';
    document.getElementById('f-capataz').value = rec.capataz||'';
    document.getElementById('f-sereno').value = rec.sereno||'';

function closeModal() { document.getElementById('modal').classList.remove('open'); }

async function saveRecord() {
  const spcId = document.getElementById('f-spc-id').value;
  if (!spcId || !currentCarreraId) { toast('Seleccionar un SPC','error'); return; }
  const cabId = document.getElementById('f-caballeriza').value || null;
  if (!cabId && !confirm('Esta inscripción no tiene caballeriza asignada.\nSin caballeriza no se podrá ratificar ni derivar el propietario.\n¿Continuar igual?')) return;
  const btn=document.getElementById('btn-save');
  btn.disabled=true; btn.textContent='Guardando…';
  const id=document.getElementById('f-id').value;
  const payload = {
    carrera_id: currentCarreraId,
    spc_id: spcId,
    caballeriza_id: cabId,
    entrenador_id: document.getElementById('f-entrenador').value || null,
    jockey_titular_id: document.getElementById('f-jockey-titular').value || null,
    jockey_suplente_id: document.getElementById('f-jockey-suplente').value || null,
    peon: document.getElementById('f-peon').value.trim() || null,
    capataz: document.getElementById('f-capataz').value.trim() || null,
    sereno: document.getElementById('f-sereno').value.trim() || null,
    certificado_correr: document.getElementById('f-certificado').checked,
    // Se guarda en mayúsculas: el programa lo imprime tal cual, y "DEBUTA"
    // es un valor válido que tiene que salir uniforme con los códigos.
    performance: document.getElementById('f-performance').value.trim().toUpperCase() || null,
    estado: document.getElementById('f-estado').value,
    motivo_estado: document.getElementById('f-motivo-forfait').value.trim() || null,
    info_adicional: document.getElementById('f-info').value.trim() || null,
  };
  const { error } = id
    ? await sb.from('inscripciones').update(payload).eq('id',id)
    : await sb.from('inscripciones').insert(payload);
  btn.disabled=false; btn.textContent='Guardar';
  if (error) { toast(error.message,'error'); return; }
  toast(id ? 'Inscripción actualizada' : 'SPC inscripto');
  closeModal();
  await loadInscripciones();
}

async function deleteRecord(id) {
  if (!confirm('¿Eliminar esta inscripción?')) return;
  const { error } = await sb.from('inscripciones').delete().eq('id',id);
  if (error) { toast(error.message,'error'); return; }
  toast('Inscripción eliminada');
  await loadInscripciones();
}

async function printInscriptos() {
  const reunionId = document.getElementById('sel-reunion').value;
  if (!reunionId) { toast('Seleccionar una reunión para imprimir', 'error'); return; }

  const reunion = reuniones.find(r => r.id === reunionId);
  const f = reunion?.fecha ? new Date(reunion.fecha + 'T12:00:00') : new Date();
  const DIAS  = ['DOMINGO','LUNES','MARTES','MIÉRCOLES','JUEVES','VIERNES','SÁBADO'];
  const MESES = ['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'];
  const fechaStr = `${DIAS[f.getDay()]} ${f.getDate()} DE ${MESES[f.getMonth()]} DE ${f.getFullYear()}`;
  const hipRaw = (reunion?.hipodromos?.nombre || '').toUpperCase();
  const hipNombre = hipRaw.replace(/^HIP[ÓO]DROMO DE /i, '').trim() || 'SGH';

  const [{ data: carsData }, { data: clubData }, { data: reunionFullData }] = await Promise.all([
    sb.from('carreras')
      .select('id,numero_turno,nombre,bolsa_total,distribucion_premios,distancia_metros,tipo_pista,edad_minima_anos,edad_maxima_anos,condicion_sexo,condicion_handicap,estado,categoria_id,categorias_carrera(nombre,es_oficial,es_computable)')
      .eq('reunion_id', reunionId)
      .order('numero_turno'),
    sb.from('clubs').select('logo_url, localidad').eq('id', CLUB_ID).single(),
    sb.from('reuniones').select('hipodromos(cantidad_gateras)').eq('id', reunionId).single(),
  ]);

  const allCars = carsData || [];
  if (!allCars.length) { toast('No hay turnos en esta reunión', 'error'); return; }
  const cantidadGateras = reunionFullData?.hipodromos?.cantidad_gateras || 12;

  const { data: inscsData } = await sb.from('inscripciones')
    .select('carrera_id, spc_id, numero_partidor, certificado_correr, estado, spcs(nombre, sexo)')
    .in('carrera_id', allCars.map(c => c.id))
    .in('estado', ['inscripto', 'ratificado', 'mal_inscrito']);

  const inscs = inscsData || [];

  // Pre-ordenar inscriptos por nombre de SPC por carrera (reutilizado en bloques y matriz)
  const inscsByCarrera = new Map();
  allCars.forEach(car => {
    inscsByCarrera.set(car.id, inscs
      .filter(i => i.carrera_id === car.id)
      .sort((a, b) => (a.spcs?.nombre || '').localeCompare(b.spcs?.nombre || '')));
  });

  // Texto de sexo derivado de condicion_sexo, y regex para detectar si el texto libre
  // de condicion_handicap ya lo trae (evita duplicar "Todo caballo Todo caballo de...")
  const SEXO_TXT = { machos: 'Cab', hembras: 'Yeg', machos_castrados: 'Cas', ambos: 'Todo caballo' };
  // El texto libre suele abrir nombrando el sexo (puede no coincidir con condicion_sexo:
  // R8 T12 es 'ambos' pero dice "Yeguas..."). Si ya lo trae, no anteponer el prefijo derivado.
  const SEXO_EN_TEXTO_RE = /^(todos?\s+(los\s+)?caballos?|caballos?|yeguas?|castrados?|machos?|hembras?|potr[oa]s?|productos?)\b/i;

  function buildCond(car) {
    const sexoTxt = SEXO_TXT[car.condicion_sexo] || '';
    let hc = (car.condicion_handicap || '').trim().replace(/\s*\.\s*$/, '');

    // Condición especial: "Especial" se saca al frente como etiqueta, el resto queda como condición
    let especial = false;
    const mEsp = hc.match(/^especial(?:es)?\s*[:,-]?\s*/i);
    if (mEsp) { especial = true; hc = hc.slice(mEsp[0].length).trim(); }

    const parts = [];
    if (sexoTxt && !(hc && SEXO_EN_TEXTO_RE.test(hc))) parts.push(sexoTxt);
    // Edad estructurada: solo si el texto libre no la trae ya
    const emin = car.edad_minima_anos, emax = car.edad_maxima_anos;
    if (!/\d\s*(a\b|años?\b)/i.test(hc)) {
      if (emin && emax) parts.push(emin === emax ? `${emin} años` : `${emin} - ${emax} años`);
      else if (emin) parts.push(`${emin} años y más`);
    }
    if (hc) parts.push(hc); // texto completo: sin abreviar ni truncar

    const distancia = car.distancia_metros ? `${car.distancia_metros} mts` : '';
    let texto = parts.join(' ');
    if (distancia) texto += (texto ? ' ' : '') + distancia;
    return { texto, cond: parts.join(' '), distancia, especial };
  }

  // Recorte de la condición a 2 líneas. Va en JS y no con -webkit-line-clamp
  // porque line-clamp corta a mitad de palabra y depende de -webkit-box, que no
  // es confiable en el motor de impresión de los móviles. Acá el corte cae
  // siempre en límite de palabra, la elipsis va después de una palabra entera, y
  // la distancia se preserva sí o sí (es dato esencial y vive al final del texto).
  // Presupuesto: columna de ~141pt (A4 apaisada − márgenes, 5 columnas, gap 10pt,
  // menos el padding del header) con la condición a 6pt en DM Sans (~0.53em/caracter).
  const COND_CHARS_LINEA = 44;
  const COND_MAX_LINEAS  = 2;

  function lineasDeCond(texto, charsIniciales) {
    let lineas = 1, len = charsIniciales;
    for (const w of String(texto).split(/\s+/).filter(Boolean)) {
      const add = len === 0 ? w.length : w.length + 1;
      if (len + add > COND_CHARS_LINEA) { lineas++; len = w.length; } else { len += add; }
    }
    return lineas;
  }

  // charsIniciales: ancho ya consumido en la primera línea (la etiqueta ESPECIAL)
  function clampCond(cond, distancia, charsIniciales) {
    const palabras = String(cond).split(/\s+/).filter(Boolean);
    for (let n = palabras.length; n >= 0; n--) {
      const recorte = palabras.slice(0, n).join(' ');
      const texto = [recorte && recorte + (n < palabras.length ? '…' : ''), distancia]
        .filter(Boolean).join(' ');
      if (lineasDeCond(texto, charsIniciales) <= COND_MAX_LINEAS) return texto;
    }
    return distancia;
  }

  function formatBolsa(num) {
    if (!num) return '';
    const n = Math.round(parseFloat(num));
    return '$' + String(n).replace(/\B(?=(\d{3})+(?!\d))/g, '.') + '.-';
  }

  let totalCaballos = 0;

  const bloquesHtml = allCars.map(car => {
    const inscsCar = inscsByCarrera.get(car.id) || [];
    if (!inscsCar.length) return '';
    totalCaballos += inscsCar.length;

    const esMixta = car.condicion_sexo === 'ambos';
    const { total: bolsaNominal } = repartoDisplay(car.bolsa_total, car.distribucion_premios);
    const bolsaStr = formatBolsa(bolsaNominal);
    const { cond, distancia, especial } = buildCond(car);
    const condStr = clampCond(cond, distancia, especial ? 'ESPECIAL '.length : 0);
    const cat = car.categorias_carrera;
    const oficialLabel = cat
      ? (cat.es_oficial
          ? (cat.es_computable ? 'OFICIAL COMPUTABLE' : 'OFICIAL NO COMPUTABLE')
          : (cat.nombre || '').toUpperCase())
      : '';
    const esCesped = (car.tipo_pista || '').toLowerCase() === 'cesped';
    const turnoBand = car.nombre
      ? `TURNO ${car.numero_turno} — ${car.nombre.toUpperCase()}`
      : `TURNO ${car.numero_turno}`;
    const est = car.estado || '';
    const bandaHtml = est === 'reabierta'
      ? '<div class="pi-banda-reabierta">REABIERTA</div>'
      : est === 'anulada' ? '<div class="pi-banda-anulada">Anulada</div>' : '';

    const listaHtml = inscsCar.map(i => {
      const nombre = (i.spcs?.nombre || '—').toUpperCase();
      const esH = esMixta && (i.spcs?.sexo || '').toLowerCase() === 'hembra';
      const noCert = !i.certificado_correr;
      return `<div class="pi-row"><span class="pi-spc-name">${nombre}${esH ? '<span class="pi-h-sfx"> (H)</span>' : ''}</span>${noCert ? '<span class="pi-nocert">●</span>' : ''}</div>`;
    }).join('');

    const tituloHtml = bolsaStr
      ? `<div class="pi-titulo"><span class="pi-bolsa-inline">${bolsaStr}</span> · ${turnoBand}</div>`
      : `<div class="pi-titulo">${turnoBand}</div>`;
    const especialHtml = especial ? '<span class="pi-especial">ESPECIAL</span> ' : '';
    const condHtml = (condStr || esCesped || especial)
      ? `<div class="pi-condiciones">${especialHtml}${condStr || ''}${esCesped ? `${condStr ? ' · ' : ''}<span class="pi-cesped-inline">CESPED</span>` : ''}</div>`
      : '';
    const oficialHtml = oficialLabel ? `<div class="pi-oficial">${oficialLabel}</div>` : '';
    return `<div class="pi-wrapper">
      <div class="pi-bloque">
        <div class="pi-car-head">${tituloHtml}${condHtml}${oficialHtml}</div>
        ${bandaHtml}
        <div class="pi-lista">${listaHtml}</div>
        <div class="pi-car-foot">${inscsCar.length}</div>
      </div>
    </div>`;
  }).join('');

  // Matriz consolidada de orden de largada
  const hayPartidorEnReunion = inscs.some(i => i.numero_partidor != null && i.numero_partidor !== '');
  let matrizHtml = '';
  if (hayPartidorEnReunion) {
    const carsConInsc = allCars.filter(c => (inscsByCarrera.get(c.id) || []).length > 0);
    const maxInsc = Math.max(...carsConInsc.map(c => (inscsByCarrera.get(c.id) || []).length));
    const filas = Math.min(maxInsc, cantidadGateras);
    const theadCols = carsConInsc.map(c => `<th>T${c.numero_turno}</th>`).join('');
    const tbodyRows = [];
    for (let r = 0; r < filas; r++) {
      const celdas = carsConInsc.map(c => {
        const insc = (inscsByCarrera.get(c.id) || [])[r];
        return `<td>${insc?.numero_partidor != null ? insc.numero_partidor : ''}</td>`;
      }).join('');
      tbodyRows.push(`<tr><td>${r + 1}</td>${celdas}</tr>`);
    }
    matrizHtml = `<div class="pi-matriz-wrap">
      <div class="pi-matriz-titulo">ORDEN DE LARGADA</div>
      <table class="pi-matriz-tbl">
        <thead><tr><th>Nº</th>${theadCols}</tr></thead>
        <tbody>${tbodyRows.join('')}</tbody>
      </table>
    </div>`;
  }

  const logoHtml = clubData?.logo_url
    ? `<img src="${clubData.logo_url}" class="pi-footer-logo" alt="">` : '';

  // Sorteo y orden de partidores: texto libre de la reunion, se imprime tal
  // cual. Vacio -> no se dibuja la caja (nada de cajas huerfanas).
  const sorteoTxt = (reunion?.sorteo_partidores || '').trim();
  const sorteoHtml = sorteoTxt
    ? `<div class="pi-sorteo">
      <div class="pi-sorteo-h">Sorteo y orden de partidores</div>
      <div class="pi-sorteo-body">${sorteoTxt.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>
    </div>` : '';

  document.getElementById('print-only').innerHTML = `
    <div class="pi-header">
      <div class="pi-title">INSCRIPTOS</div>
      <div class="pi-sub">HIPÓDROMO DE ${hipNombre} — REUNIÓN N° ${reunion?.numero_publico ?? reunion?.numero ?? '—'} DEL DÍA ${fechaStr}</div>
    </div>
    <div class="pi-cols">${bloquesHtml}</div>
    ${matrizHtml}
    ${sorteoHtml}
    <div class="pi-footer">
      <div class="pi-footer-left">
        <span><strong>H</strong> = Hembra (en carrera mixta)</span>
        <span><strong>●</strong> = Falta certificado para correr</span>
        <span style="font-weight:900;margin-top:2px;">TOTAL DE CABALLOS: ${totalCaballos}</span>
      </div>
      <div class="pi-footer-right">
        ${logoHtml}
        <span>${fechaStr}</span>
      </div>
    </div>`;

  window.print();
}
