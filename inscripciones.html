<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="32x32" href="logo32x32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="logo180x180.png">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0e2318">
  <title>Inscripciones — SGH</title>
  <!--
  SQL REQUERIDO EN SUPABASE:
  ALTER TABLE inscripciones
    ADD COLUMN IF NOT EXISTS caballeriza_id UUID REFERENCES caballerizas(id),
    ADD COLUMN IF NOT EXISTS peon VARCHAR(200),
    ADD COLUMN IF NOT EXISTS capataz VARCHAR(200),
    ADD COLUMN IF NOT EXISTS sereno VARCHAR(200),
    ADD COLUMN IF NOT EXISTS certificado_correr BOOLEAN DEFAULT FALSE;
  -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0e2318; --card: #1a3d26; --accent: #c9a84c;
      --text: #f5f0e8; --muted: #a0b8a0; --danger: #e05252;
      --success: #4caf82; --border: rgba(201,168,76,0.2); --input-bg: #0e2318;
      --info: #74b0f7;
    }
    body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; }
    h1,h2,h3 { font-family: 'Playfair Display', serif; }
    .topbar { background: rgba(0,0,0,0.3); border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .btn-back { background: none; border: 1px solid var(--border); color: var(--muted); padding: 7px 14px; border-radius: 8px; cursor: pointer; font-family: 'DM Sans', sans-serif; font-size: 13px; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; transition: all 0.2s; }
    .btn-back:hover { border-color: var(--accent); color: var(--accent); }
    .topbar h1 { font-size: 18px; color: var(--accent); flex: 1; min-width: 180px; }
    .btn-primary { background: var(--accent); color: #1a1a0a; border: none; padding: 9px 18px; border-radius: 9px; font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: opacity 0.2s; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 9px 18px; border-radius: 9px; font-family: 'DM Sans', sans-serif; font-size: 13px; cursor: pointer; transition: all 0.2s; }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent); }
    .selector-bar { background: var(--card); border-bottom: 1px solid var(--border); padding: 14px 24px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    .selector-bar label { font-size: 12px; color: var(--muted); }
    .selector-bar select { background: var(--input-bg); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 13px; outline: none; }
    .carrera-header { background: rgba(201,168,76,0.07); border-bottom: 1px solid var(--border); padding: 14px 24px; }
    .carrera-info { display: flex; gap: 20px; flex-wrap: wrap; font-size: 13px; align-items: center; }
    .carrera-num { font-family: 'Playfair Display', serif; font-size: 28px; color: var(--accent); font-weight: 700; }
    .carrera-condicion { font-size: 13px; color: var(--muted); margin-top: 4px; font-style: italic; }
    .carrera-condicion-extra { font-size: 12px; color: var(--muted); font-style: italic; margin-top: 2px; }
    .carrera-name { font-family: 'Playfair Display', serif; font-size: 17px; }
    .carrera-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
    .chip { font-size: 11px; background: rgba(201,168,76,0.1); border: 1px solid rgba(201,168,76,0.2); color: var(--muted); padding: 2px 9px; border-radius: 5px; }
    .stats-row { display: flex; gap: 12px; padding: 16px 24px; flex-wrap: wrap; border-bottom: 1px solid var(--border); }
    .stat-chip { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 10px 18px; text-align: center; min-width: 100px; }
    .stat-chip-val { font-size: 20px; font-weight: 700; color: var(--accent); }
    .stat-chip-val.danger { color: var(--danger); }
    .stat-chip-val.success { color: var(--success); }
    .stat-chip-lbl { font-size: 11px; color: var(--muted); text-transform: uppercase; }
    .content { max-width: 1200px; margin: 0 auto; padding: 24px; }
    .table-actions { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }
    .table-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; }
    thead th { background: rgba(0,0,0,0.2); padding: 11px 14px; text-align: left; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; white-space: nowrap; }
    tbody tr { border-top: 1px solid var(--border); transition: background 0.15s; }
    tbody tr:hover { background: rgba(201,168,76,0.04); }
    tbody td { padding: 12px 14px; font-size: 13px; vertical-align: middle; }
    .spc-name { font-weight: 600; color: var(--accent); }
    .spc-sub { font-size: 11px; color: var(--muted); }
    .badge { display: inline-block; padding: 2px 9px; border-radius: 20px; font-size: 11px; font-weight: 600; text-transform: uppercase; }
    .badge-inscripto  { background: rgba(76,175,130,0.15);  color: var(--success); border: 1px solid rgba(76,175,130,0.3); }
    .badge-ratificado { background: rgba(201,168,76,0.15);  color: var(--accent);  border: 1px solid rgba(201,168,76,0.3); }
    .badge-forfait      { background: rgba(224,82,82,0.1);    color: var(--danger);  border: 1px solid rgba(224,82,82,0.3); }
    .badge-mal_inscrito { background: rgba(232,168,76,0.15); color: #e8a84c;        border: 1px solid rgba(232,168,76,0.3); }
    .badge-reabierta    { background: rgba(232,168,76,0.15); color: #e8a84c;        border: 1px solid rgba(232,168,76,0.3); }
    .badge-anulada      { background: rgba(160,160,160,0.15); color: var(--muted); border: 1px solid rgba(160,160,160,0.3); }
    .sel-estado-car { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 4px 10px; border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 12px; cursor: pointer; outline: none; margin-left: 8px; }
    .actions-cell { display: flex; gap: 5px; }
    .btn-sm { padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: 500; cursor: pointer; font-family: 'DM Sans', sans-serif; border: none; white-space: nowrap; }
    .btn-edit { background: rgba(201,168,76,0.15); color: var(--accent); border: 1px solid rgba(201,168,76,0.3); }
    .btn-delete { background: rgba(224,82,82,0.1); color: var(--danger); border: 1px solid rgba(224,82,82,0.3); }
    .empty-state { text-align: center; padding: 50px 20px; }
    .empty-state .icon { font-size: 44px; margin-bottom: 14px; }
    .empty-state h3 { font-size: 17px; color: var(--muted); }
    .loading-state { display: flex; align-items: center; justify-content: center; padding: 50px; gap: 12px; color: var(--muted); }
    .spinner { width: 22px; height: 22px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 1000; display: none; align-items: flex-start; justify-content: center; padding: 20px; overflow-y: auto; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--card); border: 1px solid var(--border); border-radius: 16px; width: 100%; max-width: 640px; margin: auto; }
    .modal-header { padding: 18px 22px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
    .modal-header h2 { font-size: 18px; color: var(--accent); }
    .btn-close { background: none; border: none; color: var(--muted); font-size: 22px; cursor: pointer; }
    .modal-body { padding: 18px 22px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group.full { grid-column: 1 / -1; }
    .section-lbl { grid-column: 1/-1; font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; padding-top: 6px; border-top: 1px solid var(--border); }
    label { font-size: 12px; font-weight: 500; color: var(--muted); }
    input, select, textarea { background: var(--input-bg); border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 8px; font-family: 'DM Sans', sans-serif; font-size: 13px; outline: none; width: 100%; transition: border 0.2s; }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    select option { background: #1a3d26; }
    .spc-search { position: relative; }
    .spc-dropdown { position: absolute; top: 100%; left: 0; right: 0; background: #1a3d26; border: 1px solid var(--border); border-radius: 8px; max-height: 220px; overflow-y: auto; z-index: 10; display: none; }
    .spc-option { padding: 9px 12px; cursor: pointer; font-size: 13px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .spc-option:last-child { border-bottom: none; }
    .spc-option:hover { background: rgba(201,168,76,0.1); color: var(--accent); }
    .checkbox-row { display: flex; align-items: center; gap: 8px; padding: 8px 0; }
    .checkbox-row input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--accent); }
    .checkbox-row label { font-size: 13px; color: var(--text); cursor: pointer; }
    .modal-footer { padding: 14px 22px; display: flex; gap: 10px; justify-content: flex-end; border-top: 1px solid var(--border); }
    .btn-secondary { background: transparent; border: 1px solid var(--border); color: var(--muted); padding: 9px 18px; border-radius: 9px; font-family: 'DM Sans', sans-serif; font-size: 13px; cursor: pointer; }
    #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 8px; }
    .toast { padding: 12px 20px; border-radius: 10px; font-size: 14px; font-weight: 500; max-width: 320px; animation: slideIn 0.3s ease; }
    .toast-success { background: #1a4a30; border: 1px solid var(--success); color: var(--text); }
    .toast-error { background: #4a1a1a; border: 1px solid var(--danger); color: var(--text); }
    @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    /* PRINT — documento separado generado por printInscriptos() */
    #print-only { display: none; }
    @media print {
      body > *:not(#print-only) { display: none !important; }
      #print-only {
        display: block !important;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 9px; color: #000;
      }
      /* Encabezado del documento */
      .pi-header { text-align: center; border-bottom: 2px solid #000; padding-bottom: 5px; margin-bottom: 8px; }
      .pi-title  { font-size: 16px; font-weight: 900; letter-spacing: 3px; text-transform: uppercase; }
      .pi-sub    { font-size: 9px; font-weight: 700; margin-top: 2px; text-transform: uppercase; letter-spacing: 0.5px; }
      /* Grilla: 3 carreras por fila */
      .pi-cols   { display: flex; flex-wrap: wrap; gap: 5px; }
      .pi-bloque { flex: 0 1 calc(33.33% - 4px); border: 1px solid #000; page-break-inside: avoid; display: flex; flex-direction: column; font-size: 8px; }
      /* Sub-columnas dentro de cada carrera */
      .pi-bloque-body { display: flex; flex: 1; }
      .pi-sub-col { flex: 1; overflow: hidden; }
      .pi-sub-col + .pi-sub-col { border-left: 1px solid #aaa; }
      /* Encabezado de carrera */
      .pi-car-head { background: #e8e8e8; padding: 3px 5px; border-bottom: 1px solid #000; }
      .pi-bolsa  { font-size: 12px; font-weight: 900; line-height: 1.1; }
      .pi-nombre { font-size: 8.5px; font-weight: 700; text-transform: uppercase; }
      .pi-cond   { font-size: 7.5px; color: #333; }
      .pi-sub-head { background: #d0d0d0; padding: 2px 4px; border-bottom: 1px solid #999; font-size: 7px; font-weight: 700; text-transform: uppercase; text-align: center; letter-spacing: 0.3px; }
      /* Tabla de caballos */
      .pi-table { width: 100%; border-collapse: collapse; }
      .pi-table tr { border-bottom: 1px solid #eee; }
      .pi-table tr:last-child { border-bottom: none; }
      .pi-td-num  { width: 14px; padding: 1px 2px; color: #555; text-align: center; font-size: 7px; }
      .pi-td-name { padding: 1px 3px; font-weight: 700; text-transform: uppercase; font-size: 7.5px; }
      .pi-td-peso { width: 20px; padding: 1px 2px; text-align: right; font-size: 7px; }
      .pi-td-gate { width: 16px; padding: 1px 2px; text-align: center; font-weight: 900; font-size: 8px; }
      .pi-cert    { font-weight: 900; }
      .pi-hembra  { font-weight: 900; }
      /* Pie de carrera */
      .pi-car-foot { border-top: 1px solid #000; padding: 2px 5px; font-size: 7.5px; font-weight: 700; text-align: right; background: #f5f5f5; }
      /* Pie del documento */
      .pi-footer { margin-top: 8px; border-top: 2px solid #000; padding-top: 5px; font-size: 8px; display: flex; justify-content: space-between; align-items: flex-end; }
      .pi-footer-left { display: flex; flex-direction: column; gap: 2px; }
      .pi-footer-right { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 2px; }
      .pi-footer-logo { max-height: 40px; max-width: 80px; object-fit: contain; }
      @page { size: A4 landscape; margin: 7mm; }
    }
    #auth-overlay { position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center; }
    .btn-logout { background:none;border:1px solid var(--border);color:var(--muted);padding:6px 14px;border-radius:8px;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:13px;transition:all 0.2s; }
    .btn-logout:hover { border-color:var(--danger);color:var(--danger); }
    .user-name { font-size:13px;color:var(--muted); }
    @media print { #auth-overlay, .btn-logout, .user-name { display:none !important; } }
  </style>
</head>

<script>

function formatMonto(num) {
  if (num === null || num === undefined || isNaN(num)) return '$0,00';
  const n = parseFloat(num);
  const signo = n < 0 ? '-' : '';
  const [entero, dec] = Math.abs(n).toFixed(2).split('.');
  const enteroFmt = entero.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return signo + '$' + enteroFmt + ',' + dec;
}
function parseMonto(str) {
  if (str === null || str === undefined) return 0;
  const s = String(str).replace(/\$/g, '').replace(/\s/g, '').replace(/\./g, '').replace(',', '.');
  return parseFloat(s) || 0;
}

function toast(msg, type='success') {
  const t=document.createElement('div'); t.className=`toast toast-${type}`; t.textContent=msg;
  document.getElementById('toast-container').appendChild(t); setTimeout(()=>t.remove(),3500);
}

async function loadAll() {
  const [{ data: reuns }, { data: jocksData }, { data: entrData }, { data: sprcs }, { data: cabs }] = await Promise.all([
    sb.from('reuniones').select('id,numero,fecha,estado,hipodromos(nombre)').eq('club_id', CLUB_ID).order('fecha', {ascending:false}),
    sb.from('profesionales').select('id,nombre,apellido,tipo').eq('club_id', CLUB_ID).eq('tipo', 'jockey').eq('activo', true).order('apellido'),
    sb.from('profesionales').select('id,nombre,apellido,tipo').eq('tipo', 'entrenador').eq('activo', true).order('apellido'),
    sb.from('spcs').select('id,nombre,caballeriza_id,entrenador_id,sexo,estado').eq('estado', 'activo').order('nombre'),
    sb.from('caballerizas').select('id,nombre,responsable,hipodromo_patente').eq('club_id', CLUB_ID).eq('activo', true).order('nombre'),
  ]);
  reuniones = reuns||[];
  profesionales = [...(jocksData||[]), ...(entrData||[])];
  spcs = sprcs||[];
  caballerizas = cabs||[];

  const selR = document.getElementById('sel-reunion');
  selR.innerHTML = '<option value="">— Seleccionar —</option>' +
    reuniones.map(r=>`<option value="${r.id}">Reunión ${r.numero||''} — ${new Date(r.fecha+'T12:00:00').toLocaleDateString('es-AR')} — ${r.hipodromos?.nombre||''}</option>`).join('');

  const jockeys = profesionales.filter(p=>p.tipo==='jockey'||p.tipo==='ambos');
  const entrenadores = profesionales.filter(p=>p.tipo==='entrenador'||p.tipo==='ambos');
  const jOpts = '<option value="">— Sin jockey —</option>' + jockeys.map(p=>`<option value="${p.id}">${p.apellido}, ${p.nombre}</option>`).join('');
  const eOpts = '<option value="">— Sin entrenador —</option>' + entrenadores.map(p=>`<option value="${p.id}">${p.apellido}, ${p.nombre}</option>`).join('');
  const cabOpts = '<option value="">— Sin caballeriza —</option>' + caballerizas.map(c=>`<option value="${c.id}">${c.nombre}${c.responsable?` (${c.responsable})`:''}</option>`).join('');
  document.getElementById('f-jockey-titular').innerHTML = jOpts;
  document.getElementById('f-jockey-suplente').innerHTML = jOpts;
  document.getElementById('f-entrenador').innerHTML = eOpts;
  document.getElementById('f-caballeriza').innerHTML = cabOpts;

  if (currentCarreraId) {
    const { data: car } = await sb.from('carreras').select('*,reuniones(id)').eq('id', currentCarreraId).single();
    if (car?.reuniones) {
      selR.value = car.reuniones.id;
      await onReunionChange();
      document.getElementById('sel-carrera').value = currentCarreraId;
      await onCarreraChange();
    }
  } else {
    // Prioridad: última publicada → última programada → última borrador → ninguna
    const { data: pub } = await sb.from('reuniones')
      .select('id, fecha')
      .eq('club_id', CLUB_ID)
      .eq('estado', 'publicada')
      .order('fecha', { ascending: true })
      .limit(1);

    let reunionASeleccionar = null;
    if (pub?.length) {
      reunionASeleccionar = pub[0].id;
    } else {
      const fallback = reuniones.find(r => r.estado === 'programada')
                    || reuniones.find(r => r.estado === 'borrador');
      if (fallback) reunionASeleccionar = fallback.id;
    }

    if (reunionASeleccionar) {
      selR.value = reunionASeleccionar;
      await onReunionChange();
      const firstCarrera = document.getElementById('sel-carrera').options[1];
      if (firstCarrera) {
        document.getElementById('sel-carrera').value = firstCarrera.value;
        currentCarreraId = firstCarrera.value;
        await onCarreraChange();
      }
    }
  }
}

async function onReunionChange() {
  const rid = document.getElementById('sel-reunion').value;
  const selC = document.getElementById('sel-carrera');
  if (!rid) { selC.innerHTML='<option value="">— Seleccionar reunión primero —</option>'; return; }
  const { data: cars } = await sb.from('carreras').select('id,numero_turno,nombre,distancia_metros,condicion_handicap').eq('reunion_id', rid).order('numero_turno');
  carreras = cars||[];
  selC.innerHTML = '<option value="">— Seleccionar turno —</option>' +
    carreras.map(c => {
      let label = `Turno ${c.numero_turno}`;
      if (c.nombre) label += ` — ${c.nombre}`;
      label += ` — ${c.distancia_metros}m`;
      if (c.condicion_handicap) {
        const cond = c.condicion_handicap.length > 70 ? c.condicion_handicap.slice(0, 70) + '…' : c.condicion_handicap;
        label += ` — ${cond}`;
      }
      return `<option value="${c.id}">${label}</option>`;
    }).join('');
  document.getElementById('sel-estado-car-wrap').style.display='none';
  document.getElementById('tabla-label').style.display='';
  document.getElementById('inscriptos-count').style.display='none';
  document.getElementById('btn-nueva').style.display='none';
  document.getElementById('list-container').innerHTML='';
}

async function onCarreraChange() {
  const cid = document.getElementById('sel-carrera').value;
  currentCarreraId = cid || null;
  if (!cid) {
    document.getElementById('sel-estado-car-wrap').style.display='none';
    document.getElementById('tabla-label').style.display='';
    document.getElementById('inscriptos-count').style.display='none';
    document.getElementById('btn-nueva').style.display='none';
    document.getElementById('list-container').innerHTML='';
    return;
  }
  currentCarrera = carreras.find(c=>c.id===cid) || null;
  if (!currentCarrera) {
    const { data } = await sb.from('carreras').select('*').eq('id', cid).single();
    currentCarrera = data;
  }
  renderCarreraHeader();
  await loadInscripciones();
}

async function onEstadoCarreraChange() {
  const nuevoEstado = document.getElementById('sel-estado-carrera').value || null;
  const { error } = await sb.from('carreras').update({ estado: nuevoEstado }).eq('id', currentCarreraId);
  if (error) { toast(error.message, 'error'); return; }
  currentCarrera.estado = nuevoEstado;
  renderCarreraHeader();
  toast('Estado actualizado');
}

function renderCarreraHeader() {
  if (!currentCarrera) return;
  document.getElementById('btn-nueva').style.display='';
  document.getElementById('tabla-label').style.display='none';
  const est = currentCarrera.estado;
  const puedeEditar = ['secretario_carreras','super_admin'].includes(currentUser?.rol);
  const badge = (est === 'reabierta' || est === 'anulada')
    ? `<span class="badge badge-${est}" style="margin-right:6px;">${est.toUpperCase()}</span>` : '';
  const sel = puedeEditar
    ? `<select class="sel-estado-car" id="sel-estado-carrera" onchange="onEstadoCarreraChange()">
         <option value="">Normal</option>
         <option value="reabierta"${est==='reabierta'?' selected':''}>Reabierta</option>
         <option value="anulada"${est==='anulada'?' selected':''}>Anulada</option>
       </select>` : '';
  document.getElementById('ch-estado-carrera').innerHTML = badge + sel;
  document.getElementById('sel-estado-car-wrap').style.display='flex';
}

async function loadInscripciones() {
  if (!currentCarreraId) return;
  document.getElementById('list-container').innerHTML='<div class="loading-state"><div class="spinner"></div> Cargando inscriptos…</div>';
  const { data, error } = await sb.from('inscripciones').select('*').eq('carrera_id', currentCarreraId).order('created_at');
  if (error) { toast(error.message,'error'); return; }
  inscripciones = data||[];
  renderInscripciones();
}


function getSpc(id) { return spcs.find(s=>s.id===id); }
function getCab(id) { return caballerizas.find(c=>c.id===id); }
function getProf(id) { return profesionales.find(p=>p.id===id); }

function renderInscripciones() {
  if (!inscripciones.length) {
    document.getElementById('list-container').innerHTML=`<div class="empty-state"><div class="icon">📋</div><h3>Sin inscriptos</h3><p>No hay SPC inscriptos en este turno.</p></div>`;
    const cEl=document.getElementById('inscriptos-count'); cEl.textContent='0 inscriptos'; cEl.style.display='';
    return;
  }
  const rows = inscripciones.map(i => {
    const spc = getSpc(i.spc_id);
    const cab = getCab(i.caballeriza_id);
    const jkey = getProf(i.jockey_titular_id);
    const jkeySup = getProf(i.jockey_suplente_id);
    const entr = getProf(i.entrenador_id);
    const certCell = i.certificado_correr
      ? `<span style="color:var(--success);font-weight:600;">Sí</span>`
      : `<span style="color:var(--danger);font-weight:600;">No</span>`;
    return `<tr>
      <td><div class="spc-name">${spc?.nombre||i.spc_id}</div></td>
      <td>${certCell}</td>
      <td>${cab?`${cab.nombre}${cab.hipodromo_patente?` (${cab.hipodromo_patente})`:''}`:'—'}</td>
      <td>${entr?`${entr.apellido}, ${entr.nombre}`:'-'}</td>
      <td>${jkey?`${jkey.apellido}, ${jkey.nombre}`:'-'}</td>
      <td>${jkeySup?`${jkeySup.apellido}, ${jkeySup.nombre}`:'—'}</td>
      <td>${(() => { const l=[]; if(i.peon) l.push(`Peón: ${i.peon}`); if(i.capataz) l.push(`Cap: ${i.capataz}`); if(i.sereno) l.push(`Sereno: ${i.sereno}`); return l.length?`<div style="font-size:12px;color:var(--muted);">${l.join('<br>')}</div>`:''; })()}</td>
      <td><span class="badge badge-${i.estado}">${i.estado?.replace('_',' ')||'—'}</span></td>
      <td class="actions-cell">
        <button class="btn-sm btn-edit" onclick='openModal(${JSON.stringify(i)})'>✏️</button>
        <button class="btn-sm btn-delete" onclick="deleteRecord('${i.id}')">🗑️</button>
      </td>
    </tr>`;
  }).join('');
  document.getElementById('list-container').innerHTML = `<div class="table-wrap"><table>
    <thead><tr><th>SPC</th><th>Cert.</th><th>Caballeriza</th><th>Entrenador</th><th>Jockey</th><th>Jockey suplente</th><th>Personal</th><th>Estado</th><th>Acciones</th></tr></thead>
    <tbody>${rows}</tbody>
  </table></div>`;
  const n=inscripciones.length; const cEl=document.getElementById('inscriptos-count'); cEl.textContent=`${n} inscripto${n!==1?'s':''}`; cEl.style.display='';
}

let spcSearchTimer;
let spcSearchResults = [];

function calcSpcEdad(fecha) {
  if (!fecha) return '';
  const anos = Math.floor((new Date() - new Date(fecha + 'T12:00:00')) / (365.25 * 24 * 3600 * 1000));
  return `${anos} año${anos !== 1 ? 's' : ''}`;
}

async function searchSpc() {
  clearTimeout(spcSearchTimer);
  const q = document.getElementById('spc-search-input').value.trim();
  const dd = document.getElementById('spc-dropdown');
  if (q.length < 2) {
    dd.style.display = 'none';
    if (!q) document.getElementById('f-spc-id').value = '';
    return;
  }
  dd.innerHTML = '<div class="spc-option" style="color:var(--muted);cursor:default;">Buscando…</div>';
  dd.style.display = 'block';
  spcSearchTimer = setTimeout(async () => {
    const { data, error } = await sb.from('spcs')
      .select('id, nombre, fecha_nacimiento, sexo, color, padrillo_nombre, madre_nombre, entrenador_id, caballeriza_id')
      .eq('estado', 'activo')
      .ilike('nombre', `%${q}%`)
      .order('nombre')
      .limit(10);
    if (error || !data?.length) { dd.innerHTML='<div class="spc-option" style="color:var(--muted);cursor:default;">Sin resultados</div>'; return; }
    spcSearchResults = data;
    // Agregar al cache local para getSpc()
    data.forEach(s => { if (!spcs.find(x=>x.id===s.id)) spcs.push(s); });
    dd.innerHTML = data.map((s, idx) => {
      const partes = [s.nombre, s.sexo, calcSpcEdad(s.fecha_nacimiento), s.color].filter(Boolean);
      return `<div class="spc-option" onclick="selectSpcIdx(${idx})">
        <span>${partes.join(' — ')}</span>
        <span style="font-size:11px;color:${s.certificado_correr?'var(--success)':'var(--danger)'}">${s.certificado_correr?'✅':'❌'}</span>
      </div>`;
    }).join('');
    dd.style.display = 'block';
  }, 300);
}

function selectSpcIdx(idx) {
  const s = spcSearchResults[idx];
  if (!s) return;
  selectSpc(s.id, s.nombre, s.entrenador_id||'', '', s.caballeriza_id||'', false);
}

function selectSpc(id, nombre, entrenadorId, jockeyId, caballerizaId, tieneCert) {
  document.getElementById('f-spc-id').value = id;
  document.getElementById('spc-search-input').value = nombre;
  document.getElementById('spc-dropdown').style.display='none';
  if (entrenadorId) document.getElementById('f-entrenador').value = entrenadorId;
  if (jockeyId) document.getElementById('f-jockey-titular').value = jockeyId;
  if (caballerizaId) document.getElementById('f-caballeriza').value = caballerizaId;
  document.getElementById('f-certificado').checked = tieneCert;
  const certInfo = document.getElementById('cert-info-row');
  const certText = document.getElementById('cert-info-text');
  certInfo.style.display = '';
  if (tieneCert) {
    certText.innerHTML = '✅ Este SPC <strong>tiene certificado de correr</strong> vigente en el Stud Book.';
    certText.style.color = 'var(--success)';
  } else {
    certText.innerHTML = '⚠️ Este SPC <strong>NO tiene certificado de correr</strong> registrado en el Stud Book.';
    certText.style.color = 'var(--danger)';
  }
}

function updateCertBadge() {}

document.getElementById('f-estado').addEventListener('change', () => {
  const estado = document.getElementById('f-estado').value;
  document.getElementById('forfait-motivo-group').style.display = estado === 'forfait' ? '' : 'none';

function openModal(rec=null) {
  document.getElementById('modal-title').textContent = rec ? 'Editar Inscripción' : 'Inscribir SPC';
  document.getElementById('f-id').value = rec?.id||'';
  if (rec) {
    const spc = getSpc(rec.spc_id);
    document.getElementById('spc-search-input').value = spc?.nombre||'';
    document.getElementById('f-spc-id').value = rec.spc_id||'';
    document.getElementById('f-caballeriza').value = rec.caballeriza_id||'';
    document.getElementById('f-entrenador').value = rec.entrenador_id||'';
    document.getElementById('f-jockey-titular').value = rec.jockey_titular_id||'';
    document.getElementById('f-jockey-suplente').value = rec.jockey_suplente_id||'';
    document.getElementById('f-peon').value = rec.peon||'';
    document.getElementById('f-capataz').value = rec.capataz||'';
    document.getElementById('f-sereno').value = rec.sereno||'';
    document.getElementById('f-certificado').checked = !!rec.certificado_correr;
    document.getElementById('f-estado').value = rec.estado||'inscripto';
    document.getElementById('f-motivo-forfait').value = rec.motivo_forfait||'';
    document.getElementById('f-info').value = rec.info_adicional||'';
    document.getElementById('forfait-motivo-group').style.display = rec.estado === 'forfait' ? '' : 'none';
    document.getElementById('cert-info-row').style.display = 'none';
  } else {
    document.getElementById('spc-search-input').value='';
    document.getElementById('f-spc-id').value='';
    document.getElementById('f-caballeriza').value='';
    document.getElementById('f-entrenador').value='';
    document.getElementById('f-jockey-titular').value='';
    document.getElementById('f-jockey-suplente').value='';
    document.getElementById('f-peon').value='';
    document.getElementById('f-capataz').value='';
    document.getElementById('f-sereno').value='';
    document.getElementById('f-certificado').checked=false;
    document.getElementById('f-estado').value='inscripto';
    document.getElementById('f-motivo-forfait').value='';
    document.getElementById('f-info').value='';
    document.getElementById('forfait-motivo-group').style.display='none';
    document.getElementById('cert-info-row').style.display='none';
  }
  document.getElementById('modal').classList.add('open');
}

function closeModal() { document.getElementById('modal').classList.remove('open'); }

async function saveRecord() {
  const spcId = document.getElementById('f-spc-id').value;
  if (!spcId || !currentCarreraId) { toast('Seleccionar un SPC','error'); return; }
  const btn=document.getElementById('btn-save');
  btn.disabled=true; btn.textContent='Guardando…';
  const id=document.getElementById('f-id').value;
  const payload = {
    carrera_id: currentCarreraId,
    spc_id: spcId,
    caballeriza_id: document.getElementById('f-caballeriza').value || null,
    entrenador_id: document.getElementById('f-entrenador').value || null,
    jockey_titular_id: document.getElementById('f-jockey-titular').value || null,
    jockey_suplente_id: document.getElementById('f-jockey-suplente').value || null,
    peon: document.getElementById('f-peon').value.trim() || null,
    capataz: document.getElementById('f-capataz').value.trim() || null,
    sereno: document.getElementById('f-sereno').value.trim() || null,
    certificado_correr: document.getElementById('f-certificado').checked,
    estado: document.getElementById('f-estado').value,
    motivo_forfait: document.getElementById('f-motivo-forfait').value.trim() || null,
    info_adicional: document.getElementById('f-info').value.trim() || null,
  };
  const { error } = id
    ? await sb.from('inscripciones').update(payload).eq('id',id)
    : await sb.from('inscripciones').insert(payload);
  btn.disabled=false; btn.textContent='Guardar';
  if (error) { toast(error.message,'error'); return; }
  toast(id ? 'Inscripción actualizada' : 'SPC inscripto');
  closeModal();
  await loadInscripciones();
}

async function deleteRecord(id) {
  if (!confirm('¿Eliminar esta inscripción?')) return;
  const { error } = await sb.from('inscripciones').delete().eq('id',id);
  if (error) { toast(error.message,'error'); return; }
  toast('Inscripción eliminada');
  await loadInscripciones();
}

async function printInscriptos() {
  const reunionId = document.getElementById('sel-reunion').value;
  if (!reunionId) { toast('Seleccionar una reunión para imprimir', 'error'); return; }
  if (!carreras.length) { toast('No hay turnos en esta reunión', 'error'); return; }

  const reunion = reuniones.find(r => r.id === reunionId);
  const f = reunion?.fecha ? new Date(reunion.fecha + 'T12:00:00') : new Date();
  const DIAS  = ['DOMINGO','LUNES','MARTES','MIÉRCOLES','JUEVES','VIERNES','SÁBADO'];
  const MESES = ['ENERO','FEBRERO','MARZO','ABRIL','MAYO','JUNIO','JULIO','AGOSTO','SEPTIEMBRE','OCTUBRE','NOVIEMBRE','DICIEMBRE'];
  const fechaStr = `${DIAS[f.getDay()]} ${f.getDate()} DE ${MESES[f.getMonth()]} DE ${f.getFullYear()}`;

  // Nombre del hipódromo sin duplicar "Hipódromo de"
  const hipRaw    = (reunion?.hipodromos?.nombre || '').toUpperCase();
  const hipNombre = hipRaw.replace(/^HIP[ÓO]DROMO DE /i, '').trim() || 'SGH';

  // Cargar todas las inscripciones de la reunión + datos del club
  const [{ data: allInsc }, { data: clubData }] = await Promise.all([
    sb.from('inscripciones').select('*').in('carrera_id', carreras.map(c => c.id)).order('numero_partidor'),
    sb.from('clubs').select('logo_url, localidad').eq('id', CLUB_ID).single(),
  ]);

  const inscs = allInsc || [];
  let totalCaballos = 0;

  const bloquesHtml = carreras.map(car => {
    const inscsCar = inscs.filter(i => i.carrera_id === car.id && i.estado !== 'forfait');
    if (!inscsCar.length) return '';          // omitir carreras sin inscriptos

    totalCaballos += inscsCar.length;

    const porPartidor = [...inscsCar].sort((a,b) => (a.numero_partidor||99) - (b.numero_partidor||99));
    const porAlfabeto = [...inscsCar].sort((a,b) =>
      (getSpc(a.spc_id)?.nombre||'').localeCompare(getSpc(b.spc_id)?.nombre||''));

    const bolsaStr = car.bolsa_total ? `$${formatMonto(car.bolsa_total)}.-` : '';
    const condParts = [
      car.condicion_sexo,
      car.distancia_metros ? `${car.distancia_metros}m` : '',
      car.condicion_handicap,
    ].filter(Boolean);

    const filaPartidor = porPartidor.map(i => {
      const spc    = getSpc(i.spc_id);
      const nombre = (spc?.nombre || '—').toUpperCase().substring(0, 24);
      const esH    = ['hembra','yegua','h'].includes((spc?.sexo||'').toLowerCase());
      const noCert = !i.certificado_correr;
      const peso   = i.peso_final || i.peso_declarado || '';
      return `<tr>
        <td class="pi-td-num">${i.numero_partidor||''}</td>
        <td class="pi-td-name">${nombre}${noCert ? ' <span class="pi-cert">●</span>' : ''}${esH ? ' <span class="pi-hembra">H</span>' : ''}</td>
        <td class="pi-td-peso">${peso}</td>
      </tr>`;
    }).join('');

    const filaAlfa = porAlfabeto.map((i, idx) => {
      const spc    = getSpc(i.spc_id);
      const nombre = (spc?.nombre || '—').toUpperCase().substring(0, 24);
      const esH    = ['hembra','yegua','h'].includes((spc?.sexo||'').toLowerCase());
      const noCert = !i.certificado_correr;
      return `<tr>
        <td class="pi-td-num">${idx+1}</td>
        <td class="pi-td-name">${nombre}${noCert ? ' <span class="pi-cert">●</span>' : ''}${esH ? ' <span class="pi-hembra">H</span>' : ''}</td>
        <td class="pi-td-gate">${i.numero_partidor||''}</td>
      </tr>`;
    }).join('');

    return `<div class="pi-bloque">
      <div class="pi-car-head">
        ${bolsaStr ? `<div class="pi-bolsa">${bolsaStr}</div>` : ''}
        <div class="pi-nombre">TURNO ${car.numero_turno}${car.nombre ? ` — ${car.nombre.toUpperCase()}` : ''}</div>
        ${condParts.length ? `<div class="pi-cond">${condParts.join(' — ')}</div>` : ''}
      </div>
      <div class="pi-bloque-body">
        <div class="pi-sub-col">
          <div class="pi-sub-head">ORDEN PARTIDOR</div>
          <table class="pi-table">${filaPartidor}</table>
        </div>
        <div class="pi-sub-col">
          <div class="pi-sub-head">ALFABÉTICO — GATERA</div>
          <table class="pi-table">${filaAlfa}</table>
        </div>
      </div>
      <div class="pi-car-foot">Total: ${inscsCar.length} caballos</div>
    </div>`;
  }).join('');

  const logoHtml = clubData?.logo_url
    ? `<img src="${clubData.logo_url}" class="pi-footer-logo" alt="">`
    : '';

  document.getElementById('print-only').innerHTML = `
    <div class="pi-header">
      <div class="pi-title">INSCRIPTOS</div>
      <div class="pi-sub">HIPÓDROMO DE ${hipNombre} — REUNIÓN N° ${reunion?.numero||'—'} DEL DÍA ${fechaStr}</div>
    </div>
    <div class="pi-cols">${bloquesHtml}</div>
    <div class="pi-footer">
      <div class="pi-footer-left">
        <span><strong>H</strong> → Hembra</span>
        <span><strong>●</strong> = Sin certificado de correr</span>
        <span style="font-weight:700;margin-top:3px;">TOTAL DE CABALLOS: ${totalCaballos}</span>
      </div>
      <div class="pi-footer-right">
        ${logoHtml}
        <span>${clubData?.localidad || ''} — ${fechaStr}</span>
      </div>
    </div>`;

  window.print();
}

document.addEventListener('click', e => {
  if (!e.target.closest('.spc-search')) document.getElementById('spc-dropdown').style.display='none';
});
document.getElementById('modal').addEventListener('click', e=>{if(e.target===e.currentTarget) closeModal();});
document.querySelectorAll('input.monto').forEach(inp => {
  inp.addEventListener('blur', e => {
    const v = parseMonto(e.target.value);
    e.target.value = v === 0 ? '' : formatMonto(v);
  });
});
(async()=>{if(await initAuth())loadAll();})();
</script>
</body>
</html>
